<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo</title>
<meta name="description" content="Read the market intelligence your phone gathered, verify what holds up, and publish it as a report.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!--
  Echo — the web mirror of the Echo Android app.

  WHAT THIS IS
  A single static page. There is no server and no database. Your data lives in
  YOUR Google Drive, written there by the phone app, and this page reads it back.

  WHAT IT DELIBERATELY DOES NOT DO
  It never fetches news. Fetching costs money and only the phone does it. This
  page reads what the phone already gathered, lets you verify stories, and turns
  the verified ones into a report.

  THE SAFETY RULE — TWO FILES, ONE WRITER EACH
    echo-data.json          the phone writes it, this page only READS it
    echo-web-actions.json   this page writes it, the phone only READS it
  Because no field is written by both sides, neither can overwrite the other and
  no version is ever silently lost. This page can never destroy a news fetch the
  phone made while you were here.

  ON SECRETS
  Nothing secret is in this file. The OAuth *client ID* below is public by design —
  every web OAuth app ships one, and it is useless without a matching authorised
  origin. There is no client secret (the browser token flow does not use one), no
  API key, and no Gemini key: this page makes no AI calls at all. Your Google
  access token lives only in your own browser.
-->

<style>
/* ============================================================
   THE BRAND FACE, SHIPPED RATHER THAN ASSUMED
   ------------------------------------------------------------
   This sheet used to name 'Arial Nova' and hope the reader had it installed. Measured on this
   machine and on the deployed page, it never did: naming the family rendered at exactly the
   generic fallback width, so the whole app was drawing in Segoe UI while claiming otherwise.
   The phone has never had this problem because it bundles the font, which is why the two
   screens never quite matched.

   Both family names carry all three weights, mapping to three files. The CSS asks for
   'Arial Nova Light' in some places and 'Arial Nova' in others, at weights from 300 to 700;
   declaring every weight under both names means nothing is ever synthesised, and the browser
   still downloads each file once because it dedupes by URL.

   font-display:swap, so text stays readable while 140KB arrives. The worker caches all three,
   so it arrives once.
   ============================================================ */
@font-face{font-family:'Arial Nova Light';src:url("ArialNova-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Arial Nova Light';src:url("ArialNova.woff2") format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:'Arial Nova Light';src:url("ArialNova-Bold.woff2") format("woff2");font-weight:700 900;font-style:normal;font-display:swap}
@font-face{font-family:'Arial Nova';src:url("ArialNova-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Arial Nova';src:url("ArialNova.woff2") format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:'Arial Nova';src:url("ArialNova-Bold.woff2") format("woff2");font-weight:700 900;font-style:normal;font-display:swap}

/* ============================================================
   ECHO
   The phone app's language on the web: one accent that only ever
   means "interactive", layered near-black surfaces, sentence case,
   and a large iOS-style title over a segmented control.
   ============================================================ */

:root{
  --paper:#F5F5F7;      /* page */
  --surface:#FFFFFF;    /* cards, sheets */
  --surface-2:#F7F7F9;  /* inset panels, quiet chips */
  --track:#EAEAEF;      /* segmented-control track */
  /* The segmented controls, taken from the phone so the two products match exactly:
     AnalyticsPane uses #E9E9EE / #232329 for the track and White / #3D3D47 for the thumb.
     A dedicated pair because --track is redeclared further down and cannot be trusted. */
  --seg-track:#E9E9EE; --seg-thumb:#FFFFFF;
  /* Storage breakdown: nine categorical hues, one per section, in the SAME slot order the phone
     uses (News, Saved, Published, Reports, Competitors, Countries and norms, News ledger, Metrics,
     Metal prices) so a section is the same colour on both. Validated, not eyeballed. */
  --st1:#2A78D6; --st2:#EB6834; --st3:#1BAF7A; --st4:#EDA100; --st5:#E87BA4;
  --st6:#008300; --st7:#4A3AA7; --st8:#E34948; --st9:#1198AD;
  --track-on:#FFFFFF;   /* selected segment */
  --ink:#1D1D1F;
  --ink-2:#3F4048;
  --ink-3:#5D5E66;
  --line:#E3E3E6;
  --line-2:#EFEFF1;     /* hairline INSIDE a card, softer than the card's own edge */
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --accent:#1F57F5;     /* Signal Blue — the single accent, matched to the phone */
  --accent-soft:rgba(31,87,245,.13);
  /* The accent as TEXT. Identical to --accent in light, so nothing there moves. In dark
     --accent is 3.2:1 on a card and 3.4:1 on the page, and every accent label here was
     quietly sitting under the 4.5:1 gate. Measured, not eyeballed. Fills keep the brand
     blue; text gets a legible one at the same hue, 224 degrees, lifted until it cleared. */
  --accent-ink:#1F57F5;
  /* The selected rail row. On a white ground the accent on its own soft tint is 4.63:1 and
     reads as the one selected thing, so light keeps it. On a dark ground the same pairing is
     blue text on a blue row at 4.38:1, under the gate and hard to pick out, so dark takes the
     ink instead: 14.15:1, and the accent still marks the row through the left border and the
     tint behind it. */
  --nav-on:var(--accent-ink);
  /* The three news-source colours, matched to the phone's StatusGreen / StatusAmber / StatusBlue.
     They colour the DOT and nothing else: the pill itself stays a neutral surface in both themes,
     so the status reads as one calm object with a coloured marker rather than a tinted badge.

     Green and amber have always matched. Hybrid did not: it was #60A5FA, taken from an early phone
     pill that has since been replaced, while every live surface on the phone used #2BAFF2. Both
     read as "blue", which is exactly why it went unnoticed — keep these three in step with the
     Status* values in AluDashboard.kt, which is the one place they are defined on that side. */
  /* The Smart segment's shimmer. Two values rather than one alpha on a shared colour: the sheen
     has to lift OFF a white pill on the light theme and off a near-black one in the dark, and a
     single value reads as dirt on one of them. */
  --sheen:rgba(154,166,240,.50);
  --spark:rgba(124,58,237,.70);
  --free:#34C759;       /* the free feed */
  --paid:#E5A33B;       /* anything that spends */
  --hybrid:#2BAFF2;     /* free RSS plus a paid competitor pass */
  --danger:#F0616D;
  --sh-2:0 2px 6px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.09);
  --r-card:18px;       /* Sightline's radius — the softer corner is most of its calm */
  --r-box:10px;
  --r-pill:999px;
  /* TWO FACES FROM ONE FAMILY, SPLIT BY ROLE, NOT BY SIZE.
     --fs is Arial Nova Light: body, captions, every secondary row. It is the default on <body>
     and the reason the page reads as calm as it does.
     --fs-title is Arial Nova: headings, card titles, key labels, and every large figure. Light
     is lovely in a paragraph and goes soft the moment it has to hold the top of a hierarchy,
     which is exactly what a card title does. */
  --fs:'Arial Nova Light','Arial Nova','Segoe UI Light','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --fs-title:'Arial Nova','Arial Nova Light','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --apph:100dvh;
  /* The page never declared one, so every browser-drawn surface — scrollbars, form
     controls, the built-in PDF viewer — rendered in the browser's default scheme rather
     than the app's. Declaring it is the only supported lever over those. */
  color-scheme:light;
  /* The Echo mark as a mask, so anything can wear its shape. Same path as MARK. */
  --echo-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path fill='%23000' d='M112 110 H912 V336 H112 Z M112 398 H338 A226 226 0 0 1 112 624 Z M400 398 H912 V624 H626 A226 226 0 0 1 400 398 Z M112 686 A226 226 0 0 1 338 912 H112 Z M400 912 A226 226 0 0 1 626 686 H912 V912 Z'/></svg>");
  /* The brand ramp for the WEB's sidebar sweep, listed as TWO identical periods.
     Two periods is what makes the loop seamless: see .dhead .mark.

     It is not the phone's ramp, deliberately. The phone plays this once, fast, as a landing
     flourish, where a hard blue is the point. Here it runs forever in the corner of your eye,
     where the same blue reads as a flashing light. So the blue is lighter, holds less of the
     cycle, and returns through a soft violet rather than cutting straight back to lilac. */
  --brand-ramp:
    #F5D7FF 0%,  #FBC79B 11%, #FF9AA6 22%, #9AA6F0 32%, #CDB9F7 41%,
    #F5D7FF 50%, #FBC79B 61%, #FF9AA6 72%, #9AA6F0 82%, #CDB9F7 91%,
    #F5D7FF 100%;
  --bento-gap:14px;
  /* The hero panel. It used to stay dark in both themes because the four pastels were picked
     against a near-black card and vanish on a white one. The answer is a second ramp rather
     than a frozen panel: same four hues, deeper and more opaque, so the sweep still reads
     when the ground is light. */
  --hero-bg:#FBFBFD;
  --hero-ink:var(--ink);
  --hero-ink-3:var(--ink-3);
  --hero-sweep:
    radial-gradient(105% 85% at 92% 6%,   rgba(74,98,255,.30), transparent 62%),
    radial-gradient(95% 75% at 74% 40%,   rgba(255,92,104,.22), transparent 64%),
    radial-gradient(85% 65% at 95% 74%,   rgba(244,160,74,.26), transparent 62%),
    radial-gradient(75% 60% at 62% 96%,   rgba(186,132,255,.24), transparent 64%);
  /* The widget set's status ramp, from the widget mockups. Deliberately NOT the accent:
     --accent means "interactive", and a widget is not. These four mean what they say. */
  /* ONE PALETTE. THE FILLS DO NOT CHANGE BETWEEN THEMES.
     A dot, a bar, a sparkline or a calendar cell can be the same bright colour on either
     ground — nothing is read THROUGH them. Text cannot: bright amber on white fails contrast.
     So the fill is fixed and only the ink adapts. Matching hue alone was not enough; --info at
     43% lightness in dark and 31% in light is a light blue and a deep teal.
     These are the same four the Analytics cards hard-code, so the strip and the cards are now
     literally one palette. */
  --good-rgb:16,185,129;  --warn-rgb:245,158,11;
  --crit-rgb:239,68,68;   --info-rgb:6,182,212;
  --good:rgb(var(--good-rgb)); --warn:rgb(var(--warn-rgb));
  --crit:rgb(var(--crit-rgb)); --info:rgb(var(--info-rgb));
  --good-wash:rgba(var(--good-rgb),.14); --warn-wash:rgba(var(--warn-rgb),.14);
  --crit-wash:rgba(var(--crit-rgb),.14); --info-wash:rgba(var(--info-rgb),.14);
  /* The same colours, darkened, ONLY where they carry text on a light ground. */
  --good-ink:#0C8D62; --warn-ink:#96610A; --crit-ink:#C11F1F; --info-ink:#04849A;
  /* The Coverage calendar: ONE amber at four alphas, not two hand-picked ramps. On white the
     low steps land pale, on black they land dark, and the top step is the same pixel colour in
     both — which is what makes it read as one design instead of two. */
  --cal-rgb:245,176,27;
  --cal-0:var(--track);
  --cal-1:rgba(var(--cal-rgb),.26); --cal-2:rgba(var(--cal-rgb),.50);
  --cal-3:rgba(var(--cal-rgb),.75); --cal-4:rgb(var(--cal-rgb));
  --track:rgba(60,60,67,.12);
  --widget-shadow:0 1px 2px rgba(20,20,28,.06), 0 12px 28px -8px rgba(20,20,28,.20);
  /* One easing curve for the whole interface, and the three durations that use it. */
  --ease:cubic-bezier(.2,.7,.3,1);
  --t-hover:200ms;
  --t-sheet:280ms;
  --t-reveal:420ms;
  /* Activity-heatmap ramp, light. Five steps, matching the phone's Heatmap(). */
  --heat-0:#EBEDF0; --heat-1:#9BE9A8; --heat-2:#40C463; --heat-3:#30A14E; --heat-4:#216E39;
}
/* THE DARK PALETTE, AND THE ONE RULE ABOUT IT.
   Dark has to be declared twice -- once for viewers whose system is dark and who have chosen
   nothing, once for viewers who picked dark explicitly -- because a media query and an attribute
   selector cannot be merged into one rule. THE TWO LISTS MUST STAY IDENTICAL, token for token.

   They were not, and it showed: --line-2 and --sh-1 were only in the explicit block. On a first
   visit with a dark system and no saved choice, every card fell back to the LIGHT border
   (#EFEFF1) and drew a thick white outline. Toggling to light and back set data-theme="dark",
   the second block took over, and the outline vanished -- which made it look like a rendering
   glitch rather than a missing token.

   So: never add a token to one of these blocks without adding it to the other. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  /* Storage hues, dark steps. This is the THIRD theme state and it is easy to miss: the OS is
     dark but no data-theme attribute is set, so a token defined only on :root and
     :root[data-theme="dark"] falls back to its LIGHT value here -- which is exactly what happened
     the first time these were added. All three states or none. */
  --st1:#3987E5; --st2:#D95926; --st3:#199E70; --st4:#C98500; --st5:#D55181;
  --st6:#008300; --st7:#9085E9; --st8:#E66767; --st9:#1596A8;


    --sheen:rgba(245,215,255,.20); --spark:rgba(245,215,255,.85);    --paper:#0E0E0E; --surface:#161618; --surface-2:#1F1F22;
    --track:#232329; --track-on:#43434E;
    --seg-track:#232329; --seg-thumb:#3D3D47;
    --ink:#F5F5F7; --ink-2:#C9CAD3; --ink-3:#9A9CAB;
    --line:#2A2A2F;
    --line-2:#242427;
    --accent-soft:rgba(31,87,245,.20);
    --accent-ink:#5982F8;
    --nav-on:var(--ink);
    color-scheme:dark;
    --hero-bg:#1A1A1F;
    --hero-ink:#F5F5F7;
    --hero-ink-3:#9A9CAB;
    --hero-sweep:
    radial-gradient(105% 85% at 92% 6%,   rgba(80,103,255,.55), transparent 62%),
    radial-gradient(95% 75% at 74% 40%,   rgba(255,123,129,.42), transparent 64%),
    radial-gradient(85% 65% at 95% 74%,   rgba(251,199,155,.40), transparent 62%),
    radial-gradient(75% 60% at 62% 96%,   rgba(245,215,255,.34), transparent 64%);
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
    --heat-0:#20222A; --heat-1:#0E4429; --heat-2:#006D32; --heat-3:#26A641; --heat-4:#39D353;
    /* The fills are inherited unchanged — that is the point. Only the ink differs,
       because on this ground the bright colour is already legible as text. */
    --good-ink:rgb(var(--good-rgb)); --warn-ink:rgb(var(--warn-rgb));
    --crit-ink:rgb(var(--crit-rgb)); --info-ink:rgb(var(--info-rgb));
    --track:rgba(235,235,245,.14);
    --widget-shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -10px rgba(0,0,0,.7);
  }
}
/* An explicit choice wins over the system, in both directions. Same list as above. */
:root[data-theme="dark"]{
  /* The same nine hues re-stepped for the dark surface -- not a mechanical lightening of the
     light row; each was chosen against #0E0E0E and re-validated there. */
  --st1:#3987E5; --st2:#D95926; --st3:#199E70; --st4:#C98500; --st5:#D55181;
  --st6:#008300; --st7:#9085E9; --st8:#E66767; --st9:#1596A8;
  --sheen:rgba(245,215,255,.20); --spark:rgba(245,215,255,.85);
  --paper:#0E0E0E; --surface:#161618; --surface-2:#1F1F22;
  --track:#232329; --track-on:#43434E;
  --seg-track:#232329; --seg-thumb:#3D3D47;
  --ink:#F5F5F7; --ink-2:#C9CAD3; --ink-3:#9A9CAB;
  --line:#2A2A2F;
  --line-2:#242427;
  --accent-soft:rgba(31,87,245,.20);
  --accent-ink:#5982F8;
  --nav-on:var(--ink);
  color-scheme:dark;
  --hero-bg:#1A1A1F;
  --hero-ink:#F5F5F7;
  --hero-ink-3:#9A9CAB;
  --hero-sweep:
  radial-gradient(105% 85% at 92% 6%,   rgba(80,103,255,.55), transparent 62%),
  radial-gradient(95% 75% at 74% 40%,   rgba(255,123,129,.42), transparent 64%),
  radial-gradient(85% 65% at 95% 74%,   rgba(251,199,155,.40), transparent 62%),
  radial-gradient(75% 60% at 62% 96%,   rgba(245,215,255,.34), transparent 64%);
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
  --heat-0:#20222A; --heat-1:#0E4429; --heat-2:#006D32; --heat-3:#26A641; --heat-4:#39D353;
  /* The fills are inherited unchanged — that is the point. Only the ink differs,
     because on this ground the bright colour is already legible as text. */
  --good-ink:rgb(var(--good-rgb)); --warn-ink:rgb(var(--warn-rgb));
  --crit-ink:rgb(var(--crit-rgb)); --info-ink:rgb(var(--info-rgb));
  --track:rgba(235,235,245,.14);
  --widget-shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -10px rgba(0,0,0,.7);
}

*{box-sizing:border-box;min-width:0}
/* An app shell, not a scrolling document: the header and tabs hold still and only
   the list moves. dvh tracks the browser chrome as it retracts; --apph is written
   from visualViewport because on a first launch dvh resolves against a viewport
   that has not settled yet, which leaves the bottom of the app below the fold. */
html,body{height:100%}
html,body{height:100dvh}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--fs);font-size:15px;line-height:1.55;font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  /* Kills the double-tap zoom on a mis-tapped control, and the 300ms delay
     browsers otherwise hold every tap for while they wait for a second one. */
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
/* The `hidden` ATTRIBUTE must win over any display we set here. The browser's own
   rule is `[hidden]{display:none}` at the lowest specificity, so an ID selector like
   `#ask{display:grid}` silently beats it — which left the full-screen dialog scrim
   permanently over the page, eating every click on the app underneath. */
[hidden]{display:none !important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:4px solid transparent;background-clip:content-box}

/* ---------- shell ---------- */
/* position:relative so the Smart wash can be absolute INSIDE it. That containment is what keeps
   the colour off the sidebar: the drawer is a SIBLING of #shell, not a child. overflow:hidden was
   already here and now also clips the wash. */
#shell{height:var(--apph);display:flex;flex-direction:column;overflow:hidden;position:relative}
/* The gap to the left of the first card and the gap to the right of the last one must match.
   A scrollbar takes its width out of the content box, so a symmetric 20px padding renders as
   20 on the left and 20 + scrollbar on the right — 12px wider here, and a different number on
   every platform. --sbw is measured once at runtime and taken back off the right, so the two
   gaps match whatever the scrollbar happens to be, including zero where it overlays. */
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 20px}
#scroll > .wrap{padding-right:max(0px, calc(20px - var(--sbw, 0px)))}
/* The dashboard is the one view that WANTS the whole screen. Article lists keep the 880px
   measure because long headlines are read left-to-right and a 1600px line is punishing; a bento
   grid is scanned, not read, so starving it of width just makes the tiles small and the page
   look empty. #shell gets the wide class so the header and the grid stay aligned. */
/* No cap. 1680px left 590px of dead space on a 2560px monitor, all of it on the right
   because of the margin-left:0 below — the wider the screen, the more it wasted. The feed
   is an auto-fit card grid, so extra width becomes extra columns rather than longer lines,
   and the screens where measure DOES matter cap themselves: Ask at 900px, the report
   preview inside its own pane, the settings sheet at its own width. */
#shell.wide .wrap{max-width:none}
#top{flex:0 0 auto;padding-top:max(14px,env(safe-area-inset-top))}
/* overflow-x:hidden is NOT redundant beside overflow-y:auto. Setting one axis to auto makes
   the other compute to auto as well, so anything a few pixels too wide gave the content
   area its own horizontal scrollbar along the bottom — and scrolling it revealed empty
   space, because the overflow was slack rather than content.

   Wide things scroll inside their OWN container instead: the widget strip already does,
   and anything else that needs to must do the same. The page itself never scrolls
   sideways, which is the rule this app already states for its own layouts. */
/* Lifted above the Smart wash (z-index 0) so every word and control sits in FRONT of the colour
   rather than under it. */
#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  scrollbar-gutter:stable;padding-bottom:40px;position:relative;z-index:1}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.mark{width:26px;height:26px;flex:0 0 26px;color:var(--ink)}
.bar .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--ink-3)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- title row ---------- */
.titlerow{display:flex;align-items:flex-start;gap:14px;padding:8px 0 2px}
.titlerow .tt{flex:1}
h1{font-size:34px;line-height:1.1;letter-spacing:-.5px;font-weight:700;margin:0}
.sub{color:var(--ink-3);font-size:15px;margin:4px 0 0}

/* Source chip — squarish, neutral, colour only in the dot. Mirrors the phone. */
/* Uses --track, the segmented-control colour, not --surface-2: in light mode surface-2 sits two
   steps from the page and the chip reads as no chip at all. */
/* A neutral pill with one coloured dot. The surface sits a step above the page with a
   hairline rather than a heavier grey fill, which is what made it read as drab; only the
   dot says which mode is running, exactly as the label beside it does in words. */
.srcchip{display:inline-flex;align-items:center;gap:7px;--sc:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r-box);padding:6px 11px;margin-top:6px;font-size:13px;flex:0 0 auto}
.srcchip.m-rss{--sc:var(--free)}
.srcchip.m-grounded{--sc:var(--paid)}
.srcchip.m-hybrid{--sc:var(--hybrid)}
.srcchip .dot{background:var(--sc)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.srcchip .cv{color:var(--ink-3);font-size:12px}
/* Both chips travel together: side by side with room to wrap, rather than two separate
   children of .titlerow that would stack into two full rows on a narrow screen. */
.chiprow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;flex:0 0 auto}
/* The briefing chip is the same object as the source chip with an alarm where the dot goes.
   Neutral, because there is no state to colour here: it is a time, not a condition. */
.srcchip .alarm{display:flex;flex:0 0 auto;color:var(--ink-3)}
.srcchip .alarm svg{display:block}

/* ---------- drawer ---------- */
/* Slides over the page rather than pushing it, so the article you were reading does
   not reflow while you navigate. The scrim is a sibling, never a parent, so closing
   it can never leave an invisible layer over the app. */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;
  transition:opacity var(--t-hover) var(--ease);
  /* pointer-events, not just opacity. A transparent element still absorbs clicks, so
     while the scrim fades out it would block the app for the length of the animation —
     and if the tidy-up timer were ever missed, forever. This makes that impossible. */
  pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;z-index:50;width:min(310px,84vw);
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(-100%);transition:transform var(--t-sheet) var(--ease);
  padding:max(18px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom))}
#drawer.on{transform:translateX(0)}

/* ---------- wide screens: the rail stays put ---------- */
/* Sightline's shape. Above 1000px the drawer stops being a drawer: it is simply there, the
   hamburger disappears, and the main column is pushed across to sit beside it. Nothing about the
   markup changes — the same element is a permanent rail on a desktop and an overlay on a phone. */
@media (min-width:1000px){
  #drawer{
    width:290px;
    transform:none;                 /* never slid away */
    transition:none;
    background:var(--surface);
  }
  #shell{margin-left:290px}
  #gate{margin-left:290px}
  #btnMenu{display:none}
  #scrim{display:none !important}
  /* The reading column stops widening past a comfortable measure; the rest becomes margin.
     A 1600px-wide line of body text is unreadable however much room there is. */
  .wrap{max-width:820px;margin-left:0}
  #shell.wide .wrap{max-width:none;margin-left:0}
}
/* The rail is the navigation on a wide screen, so the drawer's own close button is noise there. */
@media (min-width:1000px){ #btnClose{display:none} }

/* ---------- sync status in the rail ---------- */
.syncrow{display:flex;align-items:center;gap:10px;padding:12px 18px 4px;font-size:12.5px;color:var(--ink-3)}
.syncdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--ink-3)}
.syncdot.ok{background:var(--free)}
.syncdot.behind{background:var(--paid)}
@media (prefers-reduced-motion:reduce){
  /* All of it, not just the drawer: a viewer who asked for less motion meant the whole page. */
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;
    animation-iteration-count:1 !important;scroll-behavior:auto !important}
  #drawer,#scrim{transition:none}
}
.dhead{display:flex;align-items:center;gap:11px;padding:0 18px 18px}
/* The mark wears the brand gradient and sweeps it. The div carries the gradient; the mask
   carries the shape, because a path filled with currentColor cannot hold a gradient. */
.dhead .mark{
  width:24px;height:24px;flex:0 0 24px;
  background:linear-gradient(to top right,var(--brand-ramp));
  /* 200% + a two-period ramp is the whole seamless trick. See the keyframes. */
  background-size:200% 200%;
  -webkit-mask:var(--echo-mask) center/contain no-repeat;
  mask:var(--echo-mask) center/contain no-repeat;
}
/* THE ANIMATION IS GATED ON BEING SIGNED IN, and lives on <body> rather than on #shell:
   the drawer is a SIBLING of #shell, not a child, so a descendant selector on #shell could
   never reach it. start() adds .in, signOut() removes it, so the sweep cannot run on the
   sign-in screen and costs nothing there. */
/* 9s, down from 14s. Slow enough to stay ambient rather than becoming a thing that moves
   in the corner of your eye while you read, fast enough that the sweep is legible as one. */
body.in .dhead .mark{ animation:railsweep 9s linear infinite }

/* Bottom-left to top-right by EXACTLY one period.
   At background-size:200% the image is twice the box, so sliding from one edge to the other
   moves it by one box width — and the image holds two identical periods, so one box width IS
   one period. The last frame is pixel-identical to the first and the loop has no seam. */
@keyframes railsweep{
  from{background-position:0% 100%}
  to{background-position:100% 0%}
}
/* Left to right, and the percentages run BACKWARDS to get it. At background-size:200% the image
   is twice the box, so the paint offset is (B - 2B) * P/100 = -B * P/100: raising P slides the
   image LEFT, which reads as colour travelling right-to-left. Falling P is what moves the colours
   the way you read. One period per cycle, and the ramp holds two, so the last frame is identical
   to the first. */
@keyframes askflow{
  from{background-position:100% 50%}
  to{background-position:0% 50%}
}
.dhead .nm{font-family:var(--fs-title);font-size:16px;font-weight:600;letter-spacing:-.2px;flex:1}
.dsec{font-family:var(--fs-title);font-size:12px;font-weight:600;color:var(--ink-3);
  padding:16px 18px 7px}
.drow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 18px;font-size:14.5px;color:var(--ink-2);border-left:2.5px solid transparent}
.drow:hover{background:var(--surface-2);color:var(--ink)}
.drow.on{color:var(--nav-on);font-weight:600;border-left-color:var(--accent);
  background:var(--accent-soft)}
/* The row's icon. currentColor + opacity, so state is carried by the row and the icon cannot
   drift from it -- and so a theme change needs no second palette. */
.dico{flex:0 0 auto;width:18px;height:18px;opacity:.6;transition:opacity .15s ease}
.dico svg{display:block;width:18px;height:18px}
.drow:hover .dico{opacity:.85}
.drow.on .dico{opacity:1}
@media (prefers-reduced-motion: reduce){ .dico{transition:none} }
.drow .dn{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:400}
.drow.on .dn{color:var(--nav-on);opacity:.8}
/* Reads as a label, not a count: it sits where a number would and must not be mistaken for
   one. A hairline and nothing else — no fill, and Arial Nova Light at 300 like the rest of
   the rail. A filled accent badge shouted louder than the navigation it sits in. */
.dpill{margin-left:auto;flex:0 0 auto;font-family:var(--fs);font-weight:300;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);background:none;
  border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 7px;line-height:1.6}
.drow.on .dpill{color:var(--nav-on);border-color:currentColor;opacity:.7}
/* Read-only settings rows: the phone owns these values, so they are stated, not offered. */
.srow{display:flex;align-items:baseline;gap:12px;padding:8px 18px;font-size:13.5px}
.srow .sk{color:var(--ink-3);flex:1}
.srow .sv{color:var(--ink);text-align:right;font-weight:500}
.srow .sv.dim{color:var(--ink-3);font-weight:400}

.dsep{height:1px;background:var(--line);margin:14px 18px 0}
/* The rail is a column: nav scrolls, footer is pinned. */
#drawer{display:flex;flex-direction:column}
#drawerNav{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Last backup, pinned in the rail just above the Settings divider. It never scrolls and
   never moves between pages, which is the whole point: how stale everything you are reading
   is should not be something you go looking for. */
#drawerSync{flex:0 0 auto;padding:0 10px 9px}
.syncpill{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font:inherit;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);
  padding:8px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;
  transition:border-color var(--t-hover) var(--ease),box-shadow var(--t-hover) var(--ease),
    transform var(--t-hover) var(--ease)}

/* ---- the storage breakdown, drawn the way the phone's Settings > Storage draws it ----
   Nine distinct hues, one per section. This used to be the accent at four falling opacities into a
   neutral, indexed `(i % 6) + 1` -- which WRAPPED across nine sections, so three pairs shared a
   colour and the four blues blurred into one band. Matches StorageUsageBlock. */
/* Beats .askbox's 380px, which is defined later in the sheet at the same specificity.

.askbox.stbox{max-width:460px}

  background:var(--track)}
/* flex-grow, not width% -- the 2px gaps are taken out first and the remainder shared by byte
   count, so the segments cannot overflow the bar the way summed percentages would. */
.stbar span{display:block;height:100%;min-width:1px;flex-basis:0}
.stlist{margin-top:10px}

.s1{background:var(--st1)} .s2{background:var(--st2)} .s3{background:var(--st3)}
.s4{background:var(--st4)} .s5{background:var(--st5)} .s6{background:var(--st6)}
.s7{background:var(--st7)} .s8{background:var(--st8)} .s9{background:var(--st9)}
.r6{background:var(--ink-3);opacity:.32}
.stnote{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);
  font-size:12.5px;line-height:1.6;color:var(--ink-3)}
#drawerFoot{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px;margin-top:8px}
.profrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
  border:0;cursor:pointer;padding:9px 8px;border-radius:10px;color:var(--ink-2);font:inherit}
.profrow:hover{background:var(--surface-2);color:var(--ink)}
.avatar{position:relative;width:26px;height:26px;flex:0 0 26px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.profname{flex:1;font-size:14px;font-weight:500}
.profchev{color:var(--ink-3);font-size:17px;line-height:1}
/* Settings panel */
#settingsPanel{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;justify-content:center}
.spane{background:var(--surface);width:min(520px,100%);max-height:82vh;display:flex;

.shead{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.stitle{flex:1;font-size:16px;font-weight:600;letter-spacing:-.2px}
.sbody{overflow-y:auto;padding:6px 0 22px}
@media (min-width:1000px){
  #settingsPanel{align-items:center}
  .spane{border-radius:18px;border-bottom:1px solid var(--line);max-height:78vh}
}

/* ---------- section label ---------- */
.lbl{font-family:var(--fs-title);font-size:13px;font-weight:600;color:var(--ink-3);margin:22px 0 10px}

/* ---------- cards ---------- */
.list{padding-top:12px}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat{font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--accent-ink)}

  padding-left:12px;border-left:2px solid var(--accent)}

/* ---------- buttons ---------- */

  padding:11px 20px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

.btn.sm{padding:8px 15px;font-size:13px}
/* Google sign-in. Google's brand rules require the G mark to sit on white, so on our
   accent pill it gets its own white disc rather than being dropped straight on the blue. */
.btn.google{display:inline-flex;align-items:center;gap:11px;padding:5px 22px 5px 5px}
.btn.google .glogo{
  width:30px;height:30px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center
}

/* Verify control — a real checkbox, so it is keyboard reachable and reads correctly
   to a screen reader instead of being a div that happens to look checkable. */
.vf{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);
  cursor:pointer;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--line)}
.vf input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.vf.on{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft);font-weight:600}

  background:var(--surface-2);color:var(--ink-3)}

/* ---------- info box ---------- */
