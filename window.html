/* ---- News volume: one narrow column per week, channels as separated blocks. ---- */
function anVolume(host, a) {
  var weeks = arr(a.weekLabels), rows = arr(a.volPerWeek), cats = arr(a.volCategories);
  if (!weeks.length) { anNote(host, "No news in this window."); return; }
  var max = 1;
  rows.forEach(function (r) {
    max = Math.max(max, arr(r).reduce(function (x, y) { return x + y; }, 0));
  });
  var chart = el("div", "stack");
  weeks.forEach(function (wk, wi) {
    var col = el("div", "stackcol");
    var bar = el("div", "stackbar");
    var vals = arr(rows[wi]);
    var total = vals.reduce(function (x, y) { return x + y; }, 0);
    bar.style.height = Math.max(2, (total / max) * 100) + "%";
    vals.forEach(function (v, ci) {
      if (!v) return;
      var seg = el("div", "stackseg");
      seg.style.flexGrow = String(v);
      seg.style.background = AN_SEGMENTS[ci % AN_SEGMENTS.length];
      seg.title = (cats[ci] || "") + ": " + v;
      bar.appendChild(seg);
    });
    col.appendChild(bar);
    col.appendChild(el("div", "stackx", wk));
    chart.appendChild(col);
  });
  host.appendChild(chart);
  anKey(host, cats.map(function (c, ci) {
    return [c, AN_SEGMENTS[ci % AN_SEGMENTS.length]];
  }));
}

/* ---- News overview: three headline figures, then what you did with what arrived. ---- */
function anOverview(host, cv, inFeed) {
  var surfaced = cv.surfaced || 0;
  var pubPct = surfaced ? Math.round(((cv.published || 0) / surfaced) * 100) : 0;
  var head = el("div", "trio");
  [[String(surfaced), "news received", null],
   [String(inFeed), "in feed", null],
   [pubPct + "%", "published", "var(--accent)"]].forEach(function (c) {
    var col = el("div", "triocol");
    var v = el("div", "triov", c[0]);
    if (c[2]) v.style.color = c[2];
    col.appendChild(v);
    col.appendChild(el("div", "triok", c[1]));
    head.appendChild(col);
  });
  host.appendChild(head);
  if (!surfaced) { anNote(host, "No news in this window."); return; }
  [["Liked", cv.liked, "#10B981"], ["Disliked", cv.disliked, "#EF4444"],
   ["Saved", cv.saved, "#F59E0B"], ["Verified", cv.verified, "#06B6D4"],
   ["Published", cv.published, "#1F57F5"]].forEach(function (r) {
    var n = r[1] || 0, pct = Math.round((n / surfaced) * 100);
    anBar(host, r[0], n + " · " + pct + "%", pct, r[2]);
  });
}

/* ---- Conversion flow: the phone's Sankey.

   Three node columns joined by ribbons whose thickness is the count. Every column sums to the
   same total, so all three fill the same height and the wall of ribbons between them is the
   story: how the stories that arrived ended up where they ended up.

   THE BUG THIS REPLACES: each node kept ONE cursor for stacking ribbons. That is fine for the
   outer columns, which only send or only receive, but the middle column does both. Its
   incoming ribbons filled the cursor to the bottom of the node, so its outgoing ribbons then
   started BELOW the node and sprayed off into the gap. Hence: in and out cursors, separately.

   Ribbons are also placed in the order the nodes are stacked at BOTH ends, which is what keeps
   them roughly parallel instead of crossing over each other. ---- */
function anFlow(host, s) {
  if (!s || !s.received) { anNote(host, "No news in this window."); return; }
  var W = 640, H = 220, NODE = 13, PAD = 3, total = s.received || 1;

  var A = [["In feed", s.inFeed || 0, "#1F57F5"], ["Not in feed", s.notInFeed || 0, AN_GREY]];
  var B = [["Saved", s.saved || 0, "#F59E0B"], ["Not saved", s.notSaved || 0, "#3B82F6"]];
  var out = arr(s.outcomeTotals);
  var C = [["Published", out[0] || 0, "#10B981"], ["Verified", out[1] || 0, "#06B6D4"],
           ["Deleted", out[2] || 0, "#EF4444"], ["Still open", out[3] || 0, AN_GREY]];

  /* Height available once the gaps between a column's nodes are taken out. Working it out per
     column keeps all three the same total height even though they hold different node counts. */
  function stack(list, x) {
    var live = list.filter(function (n) { return n[1] > 0; });
    var usable = H - PAD * Math.max(0, live.length - 1);
    var y = 0, nodes = [];
    list.forEach(function (n) {
      if (!n[1]) { nodes.push(null); return; }
      var h = (n[1] / total) * usable;
      nodes.push({ name: n[0], v: n[1], c: n[2], x: x, y: y, h: h, inCur: y, outCur: y });
      y += h + PAD;
    });
    return nodes;
  }
  var col1 = stack(A, 0), col2 = stack(B, (W - NODE) / 2), col3 = stack(C, W - NODE);

  var svg = svgNode("svg", { "class": "sankey", viewBox: "0 0 " + W + " " + H,
                             preserveAspectRatio: "none" });

  function ribbon(from, to, v, colour) {
    if (!from || !to || !v) return;
    var live = from.h * (v / from.v);            // share of the source node this flow is
    var hIn = to.h * (v / to.v);                 // share of the target node it becomes
    var y0 = from.outCur, y1 = to.inCur;
    from.outCur += live; to.inCur += hIn;
    var x0 = from.x + NODE, x1 = to.x, m = (x0 + x1) / 2;
    var d = "M" + x0 + " " + y0 +
            " C" + m + " " + y0 + " " + m + " " + y1 + " " + x1 + " " + y1 +
            " L" + x1 + " " + (y1 + hIn) +
            " C" + m + " " + (y1 + hIn) + " " + m + " " + (y0 + live) + " " + x0 + " " + (y0 + live) + " Z";
    var p = svgNode("path", { d: d, "class": "skrib" });
    p.style.fill = colour;
    var t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = from.name + " to " + to.name + ": " + v;
    p.appendChild(t);
    svg.appendChild(p);
  }

  /* Source-major order at both ends: for each source node in stacking order, send to each
     target in stacking order. That is what keeps the ribbons from tangling. */
  var ab = arr(s.aToB);
  ribbon(col1[0], col2[0], ab[0] || 0, col1[0] && col1[0].c);
  ribbon(col1[0], col2[1], ab[1] || 0, col1[0] && col1[0].c);
  ribbon(col1[1], col2[0], ab[2] || 0, col1[1] && col1[1].c);
  ribbon(col1[1], col2[1], ab[3] || 0, col1[1] && col1[1].c);

  var savedTo = arr(s.savedTo), notSavedTo = arr(s.notSavedTo);
  var k;
  for (k = 0; k < 4; k++) ribbon(col2[0], col3[k], savedTo[k] || 0, col3[k] && col3[k].c);
  for (k = 0; k < 4; k++) ribbon(col2[1], col3[k], notSavedTo[k] || 0, col3[k] && col3[k].c);

  /* Nodes last, so they sit over the ribbons rather than under them. */
  [col1, col2, col3].forEach(function (col) {
    col.forEach(function (n) {
      if (!n) return;
      var r = svgNode("rect", { x: n.x, y: n.y, width: NODE, height: Math.max(2, n.h), rx: 3 });
      r.style.fill = n.c;
      var t = document.createElementNS("http://www.w3.org/2000/svg", "title");
      t.textContent = n.name + ": " + n.v;
      r.appendChild(t);
      svg.appendChild(r);
    });
  });
  host.appendChild(svg);

  /* Labels live in HTML under the chart, not inside the bars. Bars this thin cannot hold text,
     and text scaled by preserveAspectRatio="none" comes out stretched. */
  var legend = el("div", "sklegend");
  [A, B, C].forEach(function (colDef, ci) {
    var group = el("div", "skgroup");
    group.appendChild(el("div", "rck", ["Received", "Kept", "Outcome"][ci]));
    colDef.forEach(function (n) {
      if (!n[1]) return;
      var row = el("div", "skrow");
      var d = el("span", "lgd");
      d.style.background = n[2];
      row.appendChild(d);
      row.appendChild(el("span", "skn", n[0]));
      row.appendChild(el("span", "skv", String(n[1])));
      group.appendChild(row);
    });
    legend.appendChild(group);
  });
  host.appendChild(legend);
}

/* Squarified treemap.

   Area is the reading here, and a rectangle's area is far easier to compare than an arc's
   sweep, which is the known weakness of a pie. "Squarified" means the algorithm keeps adding
   to the current row while doing so improves the worst aspect ratio in it, so cells come out
   near-square instead of as slivers you cannot label.

   Shneiderman and Wattenberg's method, as published. Sorted descending on the way in. */
function squarify(values, x, y, w, h) {
  var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
  var scaled = values.map(function (v) { return (v * w * h) / total; });
  var out = [], i = 0;

  function worst(row, len) {
    var sum = row.reduce(function (a, b) { return a + b; }, 0);
    if (!sum || !len) return Infinity;
    var mx = Math.max.apply(null, row), mn = Math.min.apply(null, row);
    return Math.max((len * len * mx) / (sum * sum), (sum * sum) / (len * len * mn));
  }

  while (i < scaled.length) {
    var len = Math.min(w, h);
    var row = [scaled[i]], next = i + 1;
    while (next < scaled.length &&
           worst(row.concat([scaled[next]]), len) <= worst(row, len)) {
      row.push(scaled[next]); next++;
    }
    var sum = row.reduce(function (a, b) { return a + b; }, 0);
    if (w >= h) {
      var cw = sum / h, cy = y;
      row.forEach(function (v, k) {
        var ch = v / cw;
        out[i + k] = { x: x, y: cy, w: cw, h: ch };
        cy += ch;
      });
      x += cw; w -= cw;
    } else {
      var ch2 = sum / w, cx = x;
      row.forEach(function (v, k) {
        var cw2 = v / ch2;
        out[i + k] = { x: cx, y: y, w: cw2, h: ch2 };
        cx += cw2;
      });
      y += ch2; h -= ch2;
    }
    i = next;
  }
  return out;
}

/* ---- Share of voice, as a treemap. Each rival is an area, so the comparison is direct. ---- */
function anSov(host, sov) {
  if (!sov.length) { anNote(host, "No competitor-matched news yet."); return; }
  var top = sov.slice(0, 10);
  var total = sov.reduce(function (t, r) { return t + r.c; }, 0) || 1;
  var rects = squarify(top.map(function (r) { return r.c; }), 0, 0, 100, 100);

  var map = el("div", "tmap");
  top.forEach(function (r, i) {
    var rc = rects[i];
    if (!rc) return;
    var pct = Math.round((r.c / total) * 100);
    var cell = el("div", "tcell");
    cell.style.left = rc.x + "%";
    cell.style.top = rc.y + "%";
    cell.style.width = rc.w + "%";
    cell.style.height = rc.h + "%";
    cell.style.background = AN_PALETTE[i % AN_PALETTE.length];
    cell.title = r.n + ": " + r.c + " (" + pct + "%)";
    /* Only label a cell big enough to hold the label. A clipped name is worse than the tooltip
       the cell already carries. */
    if (rc.w > 17 && rc.h > 16) {
      cell.appendChild(el("span", "tn", shortName(r.n)));
      cell.appendChild(el("span", "tv", pct + "%"));
    }
    map.appendChild(cell);
  });
  host.appendChild(map);
  anKey(host, top.map(function (r, i) {
    return [shortName(r.n), AN_PALETTE[i % AN_PALETTE.length],
            Math.round((r.c / total) * 100) + "%"];
  }));
}

/* ---- Momentum: a sparkline per competitor, coloured by share-of-voice rank. ---- */
function anMomentum(host, list, colourFor) {
  if (!list.length) { anNote(host, "Not enough competitor-matched news yet."); return; }
  list.slice(0, 6).forEach(function (m) {
    anTrendRow(host, shortName(m.n), m.w, m.d, colourFor(m.n));
  });
}

/* ---- Narrative ownership: per topic, the leader named, then the full split. ---- */
function anNarrative(host, list, colourFor) {
  if (!list.length) { anNote(host, "Not enough news yet."); return; }
  var seen = [], seenNames = {};
  list.slice(0, 7).forEach(function (row) {
    var segs = arr(row.seg);
    var total = segs.reduce(function (t, x) { return t + x.c; }, 0) || 1;
    var leader = segs.reduce(function (a, b) { return (!a || b.c > a.c) ? b : a; }, null);
    var block = el("div", "narblk");
    var head = el("div", "narhead");
    head.appendChild(el("span", "narn", row.cat));
    if (leader) {
      head.appendChild(el("span", "narlead",
        shortName(leader.n) + " " + Math.floor((leader.c * 100) / total) + "%"));
    }
    block.appendChild(head);
    var bar = el("div", "narbar");
    segs.forEach(function (sg) {
      var b = el("div", "narseg");
      b.style.flexGrow = String(sg.c);
      b.style.background = colourFor(sg.n);
      b.title = sg.n + ": " + sg.c;
      bar.appendChild(b);
      if (!seenNames[sg.n]) { seenNames[sg.n] = 1; seen.push(sg.n); }
    });
    block.appendChild(bar);
    host.appendChild(block);
  });
  anKey(host, seen.map(function (n) { return [shortName(n), colourFor(n)]; }));
}

/* ---- Activity heatmap: competitor × category, on the five-step green scale. ---- */
function anHeat(host, a) {
  var rows = arr(a.heatRows), cols = arr(a.heatCols), grid = arr(a.heat);
  if (!rows.length || !cols.length) { anNote(host, "Not enough competitor-matched news yet."); return; }
  var max = 1;
  grid.forEach(function (r) { arr(r).forEach(function (v) { max = Math.max(max, v); }); });
  var scale = AN_HEAT;
  var level = function (v) { return v <= 0 ? 0 : Math.min(4, Math.ceil((v / max) * 4)); };

  var wrap = el("div", "heatwrap");
  var tbl = el("div", "heat");
  tbl.style.gridTemplateColumns = "minmax(78px,1fr) repeat(" + cols.length + ", minmax(30px,1fr))";
  tbl.appendChild(el("div"));
  cols.forEach(function (c) {
    var h = el("div", "heathc", shortLabel(c));
    h.title = c;
    tbl.appendChild(h);
  });
  rows.forEach(function (rn, ri) {
    var lab = el("div", "heathr", shortName(rn));
    lab.title = rn;
    tbl.appendChild(lab);
    cols.forEach(function (cn, ci) {
      var v = (arr(grid[ri])[ci]) || 0;
      var cell = el("div", "heatc");
      cell.style.background = scale[level(v)];
      cell.title = rn + " · " + cn + ": " + v;
      tbl.appendChild(cell);
    });
  });
  wrap.appendChild(tbl);
  host.appendChild(wrap);

  var lg = el("div", "heatlg");
  lg.appendChild(el("span", null, "Less"));
  scale.forEach(function (c) {
    var s = el("span", "heatsw");
    s.style.background = c;
    lg.appendChild(s);
  });
  lg.appendChild(el("span", null, "More"));
  host.appendChild(lg);
}

/* ---- Source diversity: the count first, then who. ---- */
function anSources(host, a) {
  var src = arr(a.sources);
  var head = el("div", "anbig");
  head.appendChild(el("span", "anbign", String(a.distinctSources || 0)));
  head.appendChild(el("span", "anbigl", "distinct sources"));
  host.appendChild(head);
  if (!src.length) { anNote(host, "No sources yet."); return; }
  var max = src.reduce(function (t, r) { return Math.max(t, r.c); }, 1);
  src.slice(0, 8).forEach(function (r) {
    anBar(host, r.n, String(r.c), Math.round((r.c / max) * 100), "var(--accent)");
  });
}

/* ---- Industry trends: the theme mix, then what is rising and what is cooling. ---- */
function anTrends(host, a) {
  var g = arr(a.trendGroups);
  if (!g.length) { anNote(host, "No tracked industry trends mentioned yet."); return; }
  var total = g.reduce(function (t, r) { return t + r.c; }, 0) || 1;
  host.appendChild(el("div", "rck", "By category"));
  var bar = el("div", "trendbar");
  g.forEach(function (r, i) {
    var b = el("div", "narseg");
    b.style.flexGrow = String(r.c);
    b.style.background = AN_SEGMENTS[i % AN_SEGMENTS.length];
    b.title = r.n + ": " + r.c;
    bar.appendChild(b);
  });
  host.appendChild(bar);
  anKey(host, g.map(function (r, i) {
    return [r.n, AN_SEGMENTS[i % AN_SEGMENTS.length],
            r.c + " · " + Math.round((r.c / total) * 100) + "%"];
  }));

  var kw = arr(a.keywords);
  var rising = kw.filter(function (k) { return k.d > 0; })
                 .sort(function (x, y) { return y.d - x.d; }).slice(0, 4);
  var cooling = kw.filter(function (k) { return k.d < 0; })
                  .sort(function (x, y) { return x.d - y.d; }).slice(0, 4);
  [["Heating up", rising, "#10B981"], ["Cooling down", cooling, "#EF4444"]].forEach(function (side) {
    if (!side[1].length) return;
    var h = el("div", "rck", side[0]);
    h.style.color = side[2];
    h.style.marginTop = "16px";
    host.appendChild(h);
    side[1].forEach(function (k) { anTrendRow(host, k.n, k.w, k.d, side[2]); });
  });
}

/* The phone stores the circular date as ISO. It shows it in words, so this does too — the
   same date written two ways across two screens reads as two different dates. */
function circularDate(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if (!m) return iso || "—";
  var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return Number(m[3]) + " " + months[Number(m[2]) - 1] + " " + m[1];
}

/* ---- NALCO metal prices. The phone's Metal tab, at a glance. ---- */
function anMetal(host, np) {
  var latest = np[0];
  var rows = el("div");
  [["Ingot · IE07", latest.ingot], ["Billet · CH10 · 178–254 mm", latest.billet]].forEach(function (r) {
    var row = el("div", "bxrow");
    row.appendChild(el("span", "n", r[0]));
    row.appendChild(el("span", "v", r[1] ? "₹" + Number(r[1]).toLocaleString("en-IN") + "/MT" : "—"));
    rows.appendChild(row);
  });
  host.appendChild(rows);
  /* Movement against the previous circular is the useful part — a price alone is just a number. */
  if (np.length > 1) {
    var prev = np[1], d = (Number(latest.ingot) || 0) - (Number(prev.ingot) || 0);
    if (d) {
      var mv = el("div", "anfoot",
        "Ingot " + (d > 0 ? "up ₹" : "down ₹") + Math.abs(d).toLocaleString("en-IN") +
        "/MT since " + circularDate(prev.effective));
      mv.style.color = d > 0 ? "#EF4444" : "#10B981";
      host.appendChild(mv);
    }
  }
  host.appendChild(el("div", "anfoot", "Effective " + circularDate(latest.effective)));
}

/* ============================================================
   DASHBOARD
   ------------------------------------------------------------
   Two zones. A horizontal strip of the phone's home-screen widgets for a glance, then the
   Analytics bento underneath for the detail. The strip answers "is there anything to look at?",
   the bento answers "what is it?".
   ============================================================ */
/* ============================================================
   BENTO PACKING
   ------------------------------------------------------------
   Cards go into whichever column is currently shortest, measured as we place them. The first
   few land in empty columns, so reading order still runs left to right across the top; after
   that the wall fills itself and every gap is --bento-gap, sideways and downwards alike.

   Relayout happens only when the column COUNT changes. Repacking on every resize frame would
   reshuffle cards under the reader's cursor while they drag the window, which is worse than a
   column that is briefly a few pixels wide.
   ============================================================ */
function bentoColumns(width) { return width >= 1180 ? 3 : (width >= 720 ? 2 : 1); }

function layoutBento(host, force) {
  if (!host || !host._cards) return;
  var n = bentoColumns(host.clientWidth);
  if (!force && host._cols === n) return;
  host._cols = n;
  host.innerHTML = "";
  var cols = [], i;
  for (i = 0; i < n; i++) { var c = el("div", "bcol"); host.appendChild(c); cols.push(c); }
  host._cards.forEach(function (card) {
    var best = cols[0];
    for (var k = 1; k < n; k++) if (cols[k].offsetHeight < best.offsetHeight) best = cols[k];
    best.appendChild(card);
  });
}

/* One listener for the life of the page, re-reading the current bento each time. Rebinding it
   per render would leak a listener per navigation. */
window.addEventListener("resize", function () {
  layoutBento(document.querySelector(".bento"), false);
});

/* ============================================================
   THE GLANCE STRIP
   ------------------------------------------------------------
   The phone's eight home-screen widgets, built to the widget mockups' own spec rather than
   restyled into web cards. Same 155dp square, same three-part anatomy (label row, hero,
   footer), same status ramp. A widget that reads one way on the launcher must read the same
   way here, or they stop being the same product.

   Every figure comes from `data.widgets`, the snapshot the phone computes for the launcher, so
   a number here and the same number on the home screen cannot disagree.
   ============================================================ */
function wTop(label, stamp) {
  var top = el("div", "w-top");
  var m = el("span", "w-mark");
  m.innerHTML = MARK;
  top.appendChild(m);
  top.appendChild(el("span", "w-label", label));
  if (stamp) top.appendChild(el("span", "w-stamp", stamp));
  return top;
}
function wHero(value, unitHtml, colour, small) {
  var hero = el("div", "w-hero");
  var n = el("span", "w-num" + (small ? " sm" : ""), String(value));
  if (colour) n.style.color = colour;
  hero.appendChild(n);
  if (unitHtml) {
    var u = el("span", "w-unit");
    u.innerHTML = unitHtml;   // only ever our own literals, never data
    hero.appendChild(u);
  }
  return hero;
}
function wPill(kind, text) {
  var p = el("span", "wpill " + kind);
  p.appendChild(el("span", "d"));
  p.appendChild(el("span", null, text));
  return p;
}
function wFoot(ruled) { return el("div", "w-foot" + (ruled ? " ruled" : "")); }

/* A widget-sized sparkline. The widget is a fixed square, so this one can keep its aspect
   ratio and needs none of the non-scaling treatment the dashboard's stretched rows do. */
function wSpark(series, colour, wash) {
  var svg = svgNode("svg", { "class": "wspark", viewBox: "0 0 100 34" });
  if (series.length < 2) return svg;
  var mx = Math.max.apply(null, series) || 1, pts = [];
  series.forEach(function (v, i) {
    pts.push([2 + (i / (series.length - 1)) * 94, 30 - (v / mx) * 24]);
  });
  var line = pts.map(function (p, i) {
    return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1);
  }).join(" ");
  var area = svgNode("path", { d: line + " L96 34 L2 34 Z" });
  area.style.fill = wash;
  svg.appendChild(area);
  var stroke = svgNode("path", { d: line, fill: "none", "stroke-width": "2",
                                 "stroke-linecap": "round", "stroke-linejoin": "round" });
  stroke.style.stroke = colour;
  svg.appendChild(stroke);
  return svg;
}

function renderWidgetStrip(w) {
  var strip = el("div", "wstrip");
  var add = function (node) { strip.appendChild(node); };
  var names = function (list) {
    return arr(list).slice(0, 2).map(function (r) { return r.n; }).join(", ");
  };

  /* 1. Ready to publish. The only widget that nags: verified stories go stale quietly. */
  (function () {
    var g = el("div", "widget");
    var ready = w.readyCount || 0;
    g.appendChild(wTop("Ready to publish", ready ? (w.readyOldestDays || 0) + "d" : null));
    g.appendChild(wHero(ready, "verified,<br>unsent", ready ? null : "var(--ink-3)"));
    g.appendChild(el("p", "w-sub", ready
      ? "Oldest has waited " + (w.readyOldestDays || 0) + " days."
      : "Nothing waiting on you."));

/* ============================================================
   ASK — Layer 0
   ------------------------------------------------------------
   A chatbot with no model in it.

   Everything below is retrieval and templates over the snapshot the phone
   already sent. That is deliberate, and it is what makes this tab free: no
   API key, no server, no network call, nothing to meter. It also makes one
   guarantee no hosted model can make — it cannot state a fact that is not
   already in your data, because it never writes a sentence about a story it
   did not retrieve. When nothing scores above the floor it says so rather
   than reaching.

   Three moving parts:
     chIndex()    BM25-lite over title / advisory / summary / category
     chRoute()    which of five question shapes this is
     chAnswer()   returns a plain model; chRenderTurn() draws it

   Note on relevance: BM25 needs no blocklist. A word that appears in most of
   the feed ("aluminium", "window") earns a near-zero IDF on its own, so it
   stops discriminating without anyone maintaining a list of it. That is the
   opposite of the RSS query path, which has to be told what to ignore.
   ============================================================ */

/* Rebuilt only when the phone's snapshot changes, so typing is never O(corpus). */
var CH_IX = null;
var CH_LOG = [];      // [{q, kind, lead, stats, items, why, note}] — newest first
var CH_DRAFT = "";    // survives the render() that answering triggers

/* English function words only. Domain words are handled by IDF, not by a list. */
var CH_STOP = (function () {
  var o = {}, w = ("the a an and or but if of to in on for with without from by at as is are was were " +
    "be been being it its this that these those there here what which who whom how why when where " +
    "do does did done have has had having will would shall should can could may might must not no " +
    "about into over under after before than then them they their our your my me i you we us he she " +
    "his her him any all some more most much many few new news get got give any tell show me please " +
    "any anything something latest recent recently give").split(" ");
  for (var i = 0; i < w.length; i++) o[w[i]] = 1;
  return o;
})();

/* Words that pick the ROUTE rather than name a subject. "how many stories do I have" is a
   question about the whole app, not a search for the word "story" — so these must not count
   as content when deciding whether the question named anything to look for. */
var CH_ROUTE_WORDS = (function () {
  var o = {}, w = ("status summary overview count total number many much stand story article " +
    "item items feed everything hold").split(" ");
  for (var i = 0; i < w.length; i++) o[chStem(w[i])] = 1;
  return o;
})();

/* Crude but symmetric: applied to the query and the corpus alike, so it can only ever
   fold two forms of the same word together, never invent a match. */
function chStem(w) {
  if (w.length > 5 && /ies$/.test(w)) return w.slice(0, -3) + "y";
  if (w.length > 5 && /(sses|shes|ches|xes)$/.test(w)) return w.slice(0, -2);
  if (w.length > 5 && /ings?$/.test(w)) return w.replace(/ings?$/, "");
  if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
  return w;
}
function chTokens(s) {
  var raw = String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9À-ɏ]+/g, " ").split(" ");
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var w = raw[i];
    if (w.length > 2 && !CH_STOP[w]) out.push(chStem(w));
  }
  return out;
}

/* The phone's brand fold, ported verbatim from CompetitorRegistry.fold in GeminiService.kt.
   Schueco / Schüco / Schuco all reach the feed and all must collapse to one company, or a
   question about one spelling misses the stories filed under the other two. */
function chFold(s) {
  return String(s == null ? "" : s).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/ue/g, "u").replace(/oe/g, "o").replace(/ae/g, "a");
}
/* GENERIC_FIRST_WORDS, also from the phone: a competitor called "Window Magic" must not
   contribute the token "window", which would match essentially the whole feed. */
var CH_GENERIC = (function () {
  var o = {}, w = ("window windows aluminium aluminum glass glazing door doors india indian building " +
    "buildings system systems group steel metal profile profiles facade green smart solar energy").split(" ");
  for (var i = 0; i < w.length; i++) o[w[i]] = 1;
  return o;
})();
/* First word of the name, plus any parenthesised parent brand — not the full name.
   "Schueco India pvt Ltd" never appears verbatim in an article; "Schueco" does. */
function chBrandTerms(name) {
  var terms = [];
  var paren = /\(([^)]*)\)/.exec(String(name || ""));
  var primary = String(name || "").split("(")[0].trim();
  var words = primary.split(/\s+/).filter(function (x) { return x; });
  var first = words[0] || "";
  var base = (first.length >= 4 && !CH_GENERIC[first.toLowerCase()]) ? first
           : (words.length >= 2 ? words.slice(0, 2).join(" ") : primary);
  if (base.length >= 4) terms.push(base);
  if (paren && paren[1] && paren[1].trim().length >= 4) terms.push(paren[1].trim());
  return terms;
}

/* ---------- dates ----------
   `date` is the PUBLICATION date: formatDisplayDate() writes it as "August 27, 2026", and the
   phone works hard to keep it off fetch-time (the old "date = today" bug). SavedNews also carries
   a `timestamp`, but that is when YOU saved the story — reading it first would re-date every
   saved article to the day you filed it, so it is only a fallback. "Recent" stays honestly
   unknown rather than becoming today. */
function chMs(a) {
  var s = String((a && a.date) || "").trim();
  var dmy = /^(\d{1,2})-(\d{1,2})-(\d{4})/.exec(s);
  if (dmy) return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]).getTime();
  var t = s ? Date.parse(s) : NaN;
  if (!isNaN(t)) return t;
  return (a && a.timestamp > 1e12) ? a.timestamp : 0;
}
function chWhen(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}
function chPl(n, one, many) { return n + " " + (n === 1 ? one : many); }
function chList(a) {
  if (!a.length) return "";
  if (a.length === 1) return a[0];
  return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}

/* What the question is ABOUT, for quoting back. "how many articles mention thermal break"
   should read as "thermal break" in the answer, not as the whole sentence. Display only —
   retrieval always sees the full query. */
function chSubject(q) {
  var s = String(q || "").trim().replace(/\?+$/, "");
  s = s.replace(/^(how many|how much|count of|number of|total)\s+/i, "")
       .replace(/^(stories|story|articles|article|items|item|news)\s+/i, "")
       .replace(/^(about|on|mentioning|mention|regarding|for|with)\s+/i, "")
       .trim();
  return s || String(q || "").trim();
}

/* ---------- corpus ----------
   Every state the phone ships, deduped by title. `newsArticles` is the raw stored truth and
   is included for recall: a story can have left the live feed and still be the best answer. */
function chCorpus() {
  var d = S.data || {};
  var liked = new Set(arr(d.likedTitles).map(key));
  var disliked = new Set(arr(d.dislikedTitles).map(key));
  var pub = publishedSet();
  var ver = verifiedSet();
  var byKey = {}, out = [];

  function add(a, bucket) {
    if (!a || !a.title) return;
    var k = key(a.title);
    var rec = byKey[k];
    if (rec) { if (rec.buckets.indexOf(bucket) < 0) rec.buckets.push(bucket); return; }
    rec = {
      k: k, raw: a,
      title: a.title,
      summary: a.summary || "",
      advisory: a.pmAdvisory || "",
      category: a.category || "",
      source: a.source || "",
      company: a.company || "",
      region: a.region || "",
      ms: chMs(a),
      buckets: [bucket],
      liked: liked.has(k), disliked: disliked.has(k),
      published: pub.has(k), verified: ver.has(k)
    };
    byKey[k] = rec; out.push(rec);
  }

  arr(d.alerts).forEach(function (a) { add(a, "alerts"); });
  arr(d.savedNews).forEach(function (a) { add(a, "saved"); });
  published().forEach(function (a) { add(a, "published"); });
  arr(d.intel).forEach(function (a) { add(a, "intel"); });
  arr(d.newsArticles).forEach(function (a) { add(a, "stored"); });
  editions().forEach(function (e) { arr(e.articles).forEach(function (a) { add(a, "published"); }); });
  return out;
}

/* ---------- index ---------- */
function chIndex() {
  var stamp = String((S.data && S.data.updatedAtMillis) || 0);
  if (CH_IX && CH_IX.stamp === stamp) return CH_IX;

  var docs = chCorpus(), df = {}, vocab = {}, i, j;
  /* Field weights: a term in the headline says more about the story than the same term
     buried in a summary, and pmAdvisory is the analyst's own words about why it matters. */
  var FIELDS = [["title", 3], ["advisory", 2], ["category", 2], ["summary", 1], ["source", 1], ["company", 2], ["region", 1]];

  for (i = 0; i < docs.length; i++) {
    var tf = {}, len = 0;
    for (j = 0; j < FIELDS.length; j++) {
      var toks = chTokens(docs[i][FIELDS[j][0]]), wgt = FIELDS[j][1];
      for (var t = 0; t < toks.length; t++) { tf[toks[t]] = (tf[toks[t]] || 0) + wgt; len += wgt; }
    }
    docs[i].tf = tf; docs[i].len = len || 1;
    for (var term in tf) { df[term] = (df[term] || 0) + 1; vocab[term] = 1; }
  }

  var N = docs.length || 1, avg = 0;
  for (i = 0; i < docs.length; i++) avg += docs[i].len;
  avg = (avg / N) || 1;

  var idf = {};
  for (var w in df) idf[w] = Math.log(1 + (N - df[w] + 0.5) / (df[w] + 0.5));

  /* Entities come from what you onboarded, so the bot's vocabulary of companies and
     markets is exactly the phone's — it can never name a competitor you do not track. */
  var d = S.data || {};
  var comps = arr(d.competitors).filter(function (c) { return c && c.name; }).map(function (c) {
    return { name: c.name, terms: chBrandTerms(c.name).map(chFold), row: c };
  });
  var lands = arr(d.countries).filter(function (c) { return c && c.name; }).map(function (c) {
    return { name: c.name, terms: [chFold(c.name)], row: c };
  });
  var norms = arr(d.normCodes).filter(function (n) { return n && n.name; }).map(function (n) {
    return { name: n.name, terms: [chFold(n.name)], row: n };
  });

  CH_IX = { stamp: stamp, docs: docs, idf: idf, N: N, avg: avg, vocab: vocab,
            comps: comps, lands: lands, norms: norms };
  return CH_IX;
}

/* ---------- retrieval ---------- */
function chSearch(q, filter) {
  var ix = chIndex(), qt = chTokens(q), i, j;
  if (!qt.length) return [];
  var k1 = 1.2, b = 0.6, hits = [];
  var phrase = key(q).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  var now = Date.now();

  for (i = 0; i < ix.docs.length; i++) {
    var doc = ix.docs[i];
    if (filter && !filter(doc)) continue;
    var s = 0;
    for (j = 0; j < qt.length; j++) {
      var f = doc.tf[qt[j]];
      if (!f) continue;
      s += (ix.idf[qt[j]] || 0) * (f * (k1 + 1)) / (f + k1 * (1 - b + b * doc.len / ix.avg));
    }
    if (s <= 0) continue;
    /* A headline containing the question as typed is worth more than the sum of its words. */
    if (phrase.length > 6 && key(doc.title).indexOf(phrase) >= 0) s *= 1.6;
    /* Mild recency, so "latest" behaves without being a special case. */
    if (doc.ms) {
      var days = (now - doc.ms) / 86400000;
      s *= days < 7 ? 1.25 : days < 30 ? 1.12 : days < 120 ? 1 : 0.92;
    }
    /* Your own verdicts are ranking signals. Disliked is pushed down, never hidden —
       hiding it would make the bot disagree with the Disliked tab sitting next to it. */
    if (doc.disliked) s *= 0.45;
    if (doc.liked) s *= 1.15;
    if (doc.published) s *= 1.05;
    hits.push({ doc: doc, score: s });
  }
  hits.sort(function (x, y) { return y.score - x.score; });
  return hits;
}

/* The floor. Below this the honest answer is "I don't have that", and saying so is the
   single most important behaviour in the tab. */
function chAbove(hits) {
  if (!hits.length) return [];
  var top = hits[0].score;
  return hits.filter(function (h) { return h.score >= Math.max(0.9, top * 0.28); });
}

/* Words in the corpus that share a stem prefix with something the user typed — turns a
   dead end into a next move instead of a shrug. */
function chNear(q) {
  var ix = chIndex(), qt = chTokens(q), out = [], seen = {};
  for (var i = 0; i < qt.length; i++) {
    var p = qt[i].slice(0, 4);
    if (p.length < 4) continue;
    for (var v in ix.vocab) {
      if (v !== qt[i] && v.indexOf(p) === 0 && !seen[v]) { seen[v] = 1; out.push(v); }
      if (out.length >= 6) return out;
    }
  }
  return out;
}

/* ---------- entities ---------- */
function chEntities(q) {
  var ix = chIndex(), hay = chFold(q);
  var pick = function (list) {
    return list.filter(function (e) {
      return e.terms.some(function (t) { return t.length >= 4 && hay.indexOf(t) >= 0; });
    });
  };
  return { comps: pick(ix.comps), lands: pick(ix.lands), norms: pick(ix.norms) };
}

/* ---------- router ----------
   Rules, not a model. Five shapes cover what anyone actually asks this app, and a rule you
   can read is a rule you can fix when it misfires. */
function chRoute(q) {
  var t = " " + key(q).replace(/[^a-z0-9₹ ]+/g, " ") + " ";
  if (/\b(help|what can you do|what do you do|how does this work|who are you|what are you)\b/.test(t)) return "help";
  if (/(₹|\brupee|\bspend|\bspent|\bcost|\bcosts|\bbudget|\bcap\b|\btoken|\bbilling|\bbill\b|\bcheap|\bexpensive)/.test(t)) return "metric";
  if (/\b(trend|trends|trending|heating|cooling|momentum|share of voice|sov|top mover|mover|rising|falling|hot|quiet)\b/.test(t)) return "trend";
  if (/\b(how many|how much|count|total|number of|status|summary|overview|where do i stand)\b/.test(t)) return "count";
  return "find";
}

/* ============================================================
   ANSWERS — each returns a model, never DOM. render() draws it.
   ============================================================ */
function chAnswer(q) {
  var d = S.data || {}, ix = chIndex();
  var kind = chRoute(q);
  var ents = chEntities(q);

  if (kind === "help") return chAnsHelp(q, ix);
  if (kind === "metric") return chAnsMetric(q, d, ix);
  if (kind === "trend") return chAnsTrend(q, d);

  /* A count question that NAMES something is a count over retrieval; one that names nothing —
     "what is the status", "how many stories do I have" — is the global figure. */
  var named = ents.comps.length || ents.lands.length || ents.norms.length;
  var body = chTokens(q).filter(function (t) { return !CH_ROUTE_WORDS[t]; });
  if (kind === "count" && !named && !body.length) return chAnsMetric(q, d, ix);

  return chAnsFind(q, d, ix, ents, kind === "count");
}

function chAnsHelp(q, ix) {
  return {
    q: q, kind: "help",
    lead: "I answer from what your phone has already fetched — nothing else. I can find stories " +
          "by company, market, theme or wording; count what you hold; report your spend and " +
          "tokens; and tell you what is heating up or cooling down.",
    stats: [
      ["Stories I can read", String(ix.docs.length), "across alerts, saved, published and stored"],
      ["Companies tracked", String(ix.comps.length), "as onboarded on the phone"],
      ["Markets tracked", String(ix.lands.length), ""]
    ],
    items: [],
    why: "",
    note: "I have no model and no key behind me. If a story is not in your data I will say so " +
          "rather than write one — and I never reach outside the app."
  };
}

function chAnsMetric(q, d, ix) {
  var st = d.settings || {}, w = d.widgets || {};
  var t = key(q);
  var stats = [], lead;

  var spendToday = Number(st.spendToday) || 0, spendMonth = Number(st.spendMonth) || 0;
  var cap = Number(st.dailyCostCap) || 0;

  if (/(₹|rupee|spend|spent|cost|budget|cap|bill|token|cheap|expensive)/.test(t)) {
    stats = [
      ["Today", "≈ ₹" + spendToday.toFixed(2),
       (st.searchesToday || 0) + " searches · " + chPl(st.callsToday || 0, "call", "calls")],
      ["This month", "≈ ₹" + spendMonth.toFixed(2),
       (st.searchesMonth || 0) + " searches · " + (Number(st.tokensMonth) || 0).toLocaleString("en-IN") + " tokens"],
      ["Daily cap", "₹" + Math.round(cap), "the phone stops here"]
    ];
    lead = "You have spent about <b>₹" + spendMonth.toFixed(2) + "</b> this month, and <b>₹" +
           spendToday.toFixed(2) + "</b> today" +
           (cap ? " against a ₹" + Math.round(cap) + " daily cap" : "") + ". " +
           (st.newsSource === "rss"
              ? "Your phone is on the free RSS feed, so most of this month is history rather than new spend."
              : "Your phone is on " + (st.newsSource === "hybrid" ? "hybrid" : "grounded") + " fetching.");
    return { q: q, kind: "metric", lead: lead, stats: stats, items: [], why: "",
             note: "Estimate only. It assumes every search is billed, so the real bill is usually a " +
                   "little lower. Same figures as Analytics on the phone; I do not recompute them." };
  }

  /* A bare "how many / status" question: what you hold, not what it cost. */
  stats = [
    ["Stories held", String(ix.docs.length), "everything the phone has sent"],
    ["In alerts", String(alerts().length), (w.alertsUnverified || 0) + " unverified"],
    ["Published", String(published().length), chPl(editions().length, "edition", "editions")],
    ["Ready to publish", String(w.readyCount || 0),
     w.readyOldestDays ? "oldest waiting " + w.readyOldestDays + "d" : "verified, not yet in a report"]
  ];
  lead = "You are holding <b>" + chPl(ix.docs.length, "story", "stories") + "</b> in total: " +
         chPl(alerts().length, "story", "stories") + " in alerts, " + published().length +
         " published, and " + chPl(arr(d.savedNews).length, "saved story", "saved stories") + ".";
  return { q: q, kind: "metric", lead: lead, stats: stats, items: [], why: "", note: "" };
}

function chAnsTrend(q, d) {
  var an = d.analytics || null, w = d.widgets || {};
  var a = an && an[AN_WIN];
  if (!a) {
    return { q: q, kind: "trend",
      lead: "Your phone has not sent its analytics yet.",
      stats: [], items: [], why: "",
      note: "Open Settings, then Storage, on the phone and press Back up. These figures are " +
            "computed there, and I wait for them rather than working them out a second way." };
  }
  var kw = arr(a.keywords);
  var rising = kw.filter(function (k) { return k.d > 0; }).sort(function (x, y) { return y.d - x.d; }).slice(0, 3);
  var cooling = kw.filter(function (k) { return k.d < 0; }).sort(function (x, y) { return x.d - y.d; }).slice(0, 3);
  var sov = arr(a.sov), lead = [];

  if (rising.length) lead.push("Heating up: <b>" + chList(rising.map(function (k) { return esc(k.n); })) + "</b>.");
  if (cooling.length) lead.push("Cooling down: <b>" + chList(cooling.map(function (k) { return esc(k.n); })) + "</b>.");
  if (w.moverName) {
    lead.push("Your top mover is <b>" + esc(w.moverName) + "</b>, " +
      (w.moverDelta > 0 ? "+" : "") + (w.moverDelta || 0) + " stories at " +
      (w.moverSharePct || 0) + "% share of voice.");
  } else if (sov.length) {
    lead.push("<b>" + esc(sov[0].n) + "</b> leads share of voice with " + chPl(sov[0].c, "story", "stories") + ".");
  }
  if (!lead.length) lead.push("Nothing has moved enough to call a trend over " + anPhrase(AN_WIN) + ".");

  var stats = [];
  arr(a.trendGroups).slice(0, 4).forEach(function (r) {
    stats.push([r.n, String(r.c), "stories"]);
  });

  /* Show the stories behind the claim, so a trend is never just a number. */
  var seed = rising.concat(cooling).map(function (k) { return k.n; }).join(" ") + " " + (w.moverName || "");
  var items = chAbove(chSearch(seed)).slice(0, 4).map(function (h) { return h.doc; });

  return { q: q, kind: "trend", lead: lead.join(" "), stats: stats, items: items,
           why: items.length ? "The stories behind those movements." : "",
           note: "Computed on the phone over " + anPhrase(AN_WIN) + " — switch the window on the Dashboard." };
}

function chAnsFind(q, d, ix, ents, wantCount) {
  var filter = null, scopeBits = [];

  /* An onboarded name is an exact fact about the story, not a fuzzy one — so when the question
     names a company or a market, that becomes a hard filter and retrieval only ranks within it. */
  if (ents.comps.length) {
    var terms = [];
    ents.comps.forEach(function (c) { terms = terms.concat(c.terms); });
    scopeBits.push(chList(ents.comps.map(function (c) { return esc(c.name); })));
    filter = function (doc) {
      var hay = chFold(doc.title + " " + doc.summary + " " + doc.advisory + " " + doc.company);
      return terms.some(function (t) { return hay.indexOf(t) >= 0; });
    };
  }
  if (ents.lands.length) {
    var lt = ents.lands.map(function (c) { return chFold(c.name); });
    var prev = filter;
    scopeBits.push(chList(ents.lands.map(function (c) { return esc(c.name); })));
    filter = function (doc) {
      if (prev && !prev(doc)) return false;
      var hay = chFold(doc.title + " " + doc.summary + " " + doc.advisory + " " + doc.region);
      return lt.some(function (t) { return hay.indexOf(t) >= 0; });
    };
  }

  var hits = chAbove(chSearch(q, filter));

  /* Naming a tracked company with no other useful words is still a valid question:
     fall back to everything that mentions it, newest first. */
  if (!hits.length && filter) {
    hits = ix.docs.filter(filter).sort(function (a, b) { return b.ms - a.ms; })
      .map(function (doc) { return { doc: doc, score: 1 }; });
  }

  if (!hits.length) {
    var near = chNear(q);
    var norm = ents.norms[0];
    if (norm) {
      return { q: q, kind: "norm",
        lead: "<b>" + esc(norm.name) + "</b> is one of your onboarded norms" +
              (norm.row.type ? " (" + esc(norm.row.type) + ")" : "") + ", applying to " +
              esc(norm.row.countryName || "all markets") + " · " + esc(norm.row.competitorName || "all competitors") +
              ". No story in your data mentions it yet.",
        stats: [], items: [], why: "",
        note: norm.row.linkUrl ? "The reference link is on the Data tab." : "" };
    }
    return { q: q, kind: "none",
      lead: "I do not have anything on that in your data.",
      stats: [], items: [], why: "",
      note: "I read only what your phone has fetched — " + chPl(ix.docs.length, "story", "stories") +
            ", plus your competitors, markets and norms. I will not answer from outside the app." +
            (near.length ? " Words I do have that look close: " + near.slice(0, 5).join(", ") + "." : "") };
  }

  var docs = hits.map(function (h) { return h.doc; });
  var top = docs[0];
  var inAlerts = docs.filter(function (x) { return x.buckets.indexOf("alerts") >= 0; }).length;
  var pubbed = docs.filter(function (x) { return x.published; }).length;
  var dis = docs.filter(function (x) { return x.disliked; }).length;

  /* Most common category, for a sentence that says something about the shape of the answer. */
  var cats = {}, best = "", bestN = 0;
  docs.forEach(function (x) {
    if (!x.category) return;
    cats[x.category] = (cats[x.category] || 0) + 1;
    if (cats[x.category] > bestN) { bestN = cats[x.category]; best = x.category; }
  });

  var scope = scopeBits.length ? "<b>" + chList(scopeBits) + "</b>" : "“" + esc(chSubject(q)) + "”";
  var lead;
  if (wantCount) {
    lead = "I have <b>" + chPl(docs.length, "story", "stories") + "</b> on " + scope + " — " +
           inAlerts + " in alerts, " + pubbed + " published.";
  } else {
    lead = chPl(docs.length, "story", "stories") + " in your data " +
           (docs.length === 1 ? "matches " : "match ") + scope + ".";
  }
  if (top.ms) {
    lead += " The most relevant is from " + esc(top.source || "an unnamed source") + ", " + chWhen(top.ms) + ".";
  } else if (top.source) {
    lead += " The most relevant is from " + esc(top.source) + ".";
  }
  if (bestN > 1 && docs.length > 2) lead += " " + bestN + " of them are filed under " + esc(best) + ".";

  var stats = [];
  if (docs.length > 2) {
    var newest = docs.slice().sort(function (a, b) { return b.ms - a.ms; })[0];
    stats = [
      ["Matches", String(docs.length), scopeBits.length ? "within your scope" : "above the relevance floor"],
      ["Newest", newest.ms ? chWhen(newest.ms) : "undated", newest.source || ""],
      ["Published already", String(pubbed), pubbed ? "in a report" : "none yet"]
    ];
  }

  var why = "Ranked by wording, then recency, then your own likes." +
            (dis ? " " + chPl(dis, "story", "stories") + " you disliked pushed down, not hidden." : "");

  return { q: q, kind: "find", lead: lead, stats: stats,
           items: docs.slice(0, 6), why: why, note: "" };
}

/* ============================================================
   ASK — view
   ------------------------------------------------------------
   A chat room: composer docked at the bottom, turns growing down into it, each
   side in its own container. Your message is a bubble; the reply is a card that
   can hold a sentence, figures and the stories behind them without any of it
   escaping the container it belongs to.
   ============================================================ */
var ICON_SEND = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

/* Openers are derived from YOUR data, so a card can never open on something the app does not
   hold. The label says which KIND of question it is, which is how you learn what can be asked. */
function chSuggestions() {
  var d = S.data || {}, w = d.widgets || {}, ix = chIndex(), out = [];
  var who = w.moverName || (ix.comps[0] && ix.comps[0].name);
  if (who) out.push(["Competitor", "What is happening with " + who + "?"]);
  out.push(["Spend", "How much have I spent this month?"]);
  if (w.risingTrend) out.push(["Trend", "Why is " + w.risingTrend + " heating up?"]);
  else out.push(["Trend", "What is trending?"]);
  if (ix.lands.length) out.push(["Market", "Any news from " + ix.lands[0].name + "?"]);
  else out.push(["About", "What can you do?"]);
  return out.slice(0, 4);
}

/* The signed-in address is the only name this page has. No name, no fake one. */
function chHello() {
  var n = String(S.email || "").split("@")[0].replace(/[._-]+/g, " ").trim();
  if (!n) return "Hello";
  return "Hello, " + n.charAt(0).toUpperCase() + n.slice(1);
}

function chAsk(q) {
  q = String(q || "").trim();
  if (!q) return;
  CH_DRAFT = "";
  CH_LOG.push(chAnswer(q));   // oldest first: the conversation grows DOWN into the composer
  render();
  var s = $("#scroll"); if (s) s.scrollTop = s.scrollHeight;
  var box = $("#chIn"); if (box) box.focus();
}

function chRenderTurn(m) {
  var turn = el("div", "chturn");

  var row = el("div", "chmerow");
  row.appendChild(el("div", "chme", m.q));
  turn.appendChild(row);

  var bot = el("div", "chbot");
  var who = el("div", "chwho");
  var mk = el("span", "m"); mk.innerHTML = MARK;   // the same mark as the rail and the phone
  who.appendChild(mk);
  who.appendChild(el("span", null, "Echo"));
  bot.appendChild(who);

  var lead = el("p", "chlead");
  lead.innerHTML = m.lead;      // assembled here from escaped parts, never from raw data
  bot.appendChild(lead);

  if (m.stats && m.stats.length) {
    var stats = el("div", "chstat");
    m.stats.forEach(function (s) {
      var c = el("div", "chsc");
      c.appendChild(el("div", "chsk", s[0]));
      c.appendChild(el("div", "chsv", s[1]));
      if (s[2]) c.appendChild(el("div", "chss", s[2]));
      stats.appendChild(c);
    });
    bot.appendChild(stats);
  }

  /* The same card the rest of the app draws, one surface down. An answer and a story
     should never look like two different products, and every claim above is a link
     away from the thing it was read from. */
  if (m.items && m.items.length) {
    var src = el("div", "chsrc");
    m.items.forEach(function (doc) { src.appendChild(articleCard(doc.raw, {})); });
    bot.appendChild(src);
  }

  if (m.why) bot.appendChild(el("div", "chwhy", m.why));
  if (m.note) bot.appendChild(el("div", "chnote", m.note));

  turn.appendChild(bot);
  return turn;
}

function renderAsk(app) {
  var ix = chIndex(), d = S.data || {};
  var pane = el("div", "chpane");
  var flow = el("div", "chflow" + (CH_LOG.length ? "" : " start"));

  if (!CH_LOG.length) {
    var hi = el("div", "chhi", chHello());
    hi.appendChild(el("span", null, "What do you want to know?"));
    flow.appendChild(hi);

    var intro = el("p", "chintro");
    intro.innerHTML =
      "Ask about a competitor, a market, a theme, what you have spent, or what is moving. " +
      "I read only what your phone has fetched — <b>" + chPl(ix.docs.length, "story", "stories") +
      "</b>, plus your <b>" + chPl(ix.comps.length, "competitor", "competitors") + "</b> and <b>" +
      chPl(ix.lands.length, "market", "markets") + "</b>. There is no model behind me and no key in " +
      "this page, so asking costs nothing — and I cannot tell you anything that is not already here.";
    flow.appendChild(intro);

    var grid = el("div", "chsug");
    chSuggestions().forEach(function (s) {
      var b = el("button", "chsg");
      b.appendChild(el("span", "k", s[0]));
      b.appendChild(el("span", "t", s[1]));
      b.onclick = function () { chAsk(s[1]); };
      grid.appendChild(b);
    });
    flow.appendChild(grid);
  } else {
    CH_LOG.forEach(function (m) { flow.appendChild(chRenderTurn(m)); });
  }
  pane.appendChild(flow);

  /* ---- the dock ---- */
  var dock = el("div", "chdock");

  var ctx = el("div", "chctx");
  ctx.appendChild(document.createTextNode("Reading "));
  ctx.appendChild(el("b", null, chPl(ix.docs.length, "story", "stories")));
  var srcMode = d.newsSource || "";
  if (srcMode) {
    ctx.appendChild(document.createTextNode(" · phone is on "));
    ctx.appendChild(el("b", null, srcMode === "rss" ? "free RSS" : srcMode));
  }
  if (CH_LOG.length) {
    ctx.appendChild(document.createTextNode(" · "));
    var clr = el("button", null, "Clear");
    clr.onclick = function () { CH_LOG = []; render(); };
    ctx.appendChild(clr);
  }
  dock.appendChild(ctx);

  var box = el("div", "chbox");
  var input = el("input", "chin");
  input.id = "chIn";
  input.type = "text";
  input.placeholder = "Ask about your news, competitors, markets or spend";
  input.autocomplete = "off";
  input.setAttribute("enterkeyhint", "send");
  input.value = CH_DRAFT;

  var go = el("button", "chgo");
  go.innerHTML = ICON_SEND;
  go.title = "Ask"; go.setAttribute("aria-label", "Ask");
  var sync = function () { go.classList.toggle("on", !!input.value.trim()); };
  input.oninput = function () { CH_DRAFT = input.value; sync(); };
  input.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); chAsk(input.value); } };
  go.onclick = function () { chAsk(input.value); };
  sync();

  box.appendChild(input);
  box.appendChild(go);
  dock.appendChild(box);
  pane.appendChild(dock);
  app.appendChild(pane);

  /* Land on the newest turn. After layout, or scrollHeight is still the old one. On a phone
     the keyboard is not opened for you — that would cover the conversation you just asked for. */
  if (railIsPermanent()) input.focus();
  if (CH_LOG.length) {
    requestAnimationFrame(function () {
      var s = $("#scroll");
      if (s && S.tab === "ask") s.scrollTop = s.scrollHeight;
    });
  }
}

function render() {
  renderDrawerNav(); renderSyncRow(); renderDrawerSettings(); renderTitle();
  $("#shell").classList.toggle("wide", S.tab === "dashboard");
  /* Turns the scroll column into a flex column so the composer can dock at the
     bottom of the viewport instead of trailing the last message. */
  $("#shell").classList.toggle("chat", S.tab === "ask");
  var app = $("#app"); app.innerHTML = "";
  var d = S.data, i;

  if (S.loading) {
    for (i = 0; i < 4; i++) app.appendChild(el("div", "skel"));
    refreshReportBar(); return;
  }
  if (!d) { app.appendChild(emptyState("Nothing loaded yet.")); refreshReportBar(); return; }

  if (S.tab === "dashboard") {
    renderDashboard(app, d);
  }
  else if (S.tab === "ask") {
    renderAsk(app);
  }
  else if (S.tab === "alerts") {
    var list = alerts();
    if (!list.length) app.appendChild(emptyState("No alerts. Everything here has been published, or your phone has not backed up yet."));
    else list.forEach(function (a) { app.appendChild(articleCard(a, { verifiable: true })); });
  }
  else if (S.tab === "saved") {
    var sv = arr(d.savedNews);
    if (!sv.length) app.appendChild(emptyState("Nothing saved."));
    else sv.forEach(function (a) { app.appendChild(articleCard(a, {})); });
  }
  else if (S.tab === "published") {
    var pb = published();
    if (!pb.length) app.appendChild(emptyState("Nothing published yet. Verify some alerts, then generate a report."));
    else pb.forEach(function (a) { app.appendChild(articleCard(a, { publishedPill: true })); });
  }
  else if (S.tab === "reports") {
    var eds = editions();
    if (!eds.length) app.appendChild(emptyState("No reports yet."));
    else eds.forEach(function (e) {
      var c = el("div", "card");
      var top = el("div", "crow");
      top.appendChild(el("span", "cat", e.weekLabel || "Report"));
      top.appendChild(el("span", "meta", e.dateLabel || ""));
      c.appendChild(top);
      c.appendChild(el("p", "ttl", e.title || "Market report"));
      c.appendChild(el("p", "sum", arr(e.articles).length + " article(s) · " +
        (e.competitorsCount || 0) + " competitor(s) · " + (e.countriesCount || 0) + " market(s)"));
      var acts = el("div", "acts");
      var w = el("button", "btn sm ghost", "Word");
      w.onclick = function () { downloadWord(e.title || "Market report", e.dateLabel || "", arr(e.articles)); };
      var p = el("button", "btn sm", "PDF");
      p.onclick = function () { printReport(e.title || "Market report", e.dateLabel || "", arr(e.articles)); };
      acts.appendChild(w); acts.appendChild(p);
      c.appendChild(acts);
      app.appendChild(c);
    });
  }
  else if (S.tab === "liked" || S.tab === "disliked") {
    var titles = arr(S.tab === "liked" ? d.likedTitles : d.dislikedTitles).map(key);
    var pool = arr(d.newsArticles).concat(arr(d.alerts), arr(d.publishedNews), arr(d.savedNews));
    var seen = new Set(), out = [];
    titles.forEach(function (t) {
      if (seen.has(t)) return;
      seen.add(t);
      var hit = pool.filter(function (a) { return key(a.title) === t; })[0];
      out.push(hit || { title: t, category: "", summary: "", source: "" });
    });
    if (!out.length) app.appendChild(emptyState(S.tab === "liked" ? "Nothing liked yet." : "Nothing disliked yet."));
    else out.forEach(function (a) { app.appendChild(articleCard(a, {})); });
  }
  else if (S.tab === "restorepoints") {
    var rps = arr(d.restorePoints).slice().sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
    if (!rps.length) app.appendChild(emptyState("No restore points."));
    rps.forEach(function (rp) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", rp.name));
      card.appendChild(el("p", "sum", rp.timestamp ? new Date(rp.timestamp).toLocaleString("en-GB") : ""));
      app.appendChild(card);
    });
    if (rps.length) {
      var note = el("div", "info");
      note.appendChild(el("div", "i", "i"));
      var nc = el("div");
      nc.appendChild(el("b", null, "Listed, not stored here"));
      nc.appendChild(document.createTextNode(
        "Each snapshot holds a full copy of every table. Sending those would turn one backup into " +
        "several copies of the whole database, so only the name and date travel. Restoring one is " +
        "done on the phone."));
      note.appendChild(nc);
      app.appendChild(note);
    }
  }
  else if (S.tab === "database") {
    var comps = arr(d.competitors), prods = arr(d.competitorProducts);
    app.appendChild(el("div", "lbl", "Competitors"));
    if (!comps.length) app.appendChild(emptyState("No competitors onboarded."));
    comps.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", c.name));
      if (c.websiteUrl) card.appendChild(linkRow(c.websiteUrl, c.websiteUrl.replace(/^https?:\/\//, "") + " ↗"));
      if (c.keyProduct) card.appendChild(kv("Key product", c.keyProduct));
      if (c.markets) card.appendChild(kv("Markets", c.markets));
      var mine = prods.filter(function (p) { return key(p.competitorName) === key(c.name); });
      if (mine.length) card.appendChild(kv("Products", mine.map(function (p) { return p.name; }).join(", ")));
      if (c.insights) card.appendChild(el("p", "sum", c.insights));
      app.appendChild(card);
    });

    app.appendChild(el("div", "lbl", "Markets"));
    var nations = arr(d.countries);
    if (!nations.length) app.appendChild(emptyState("No markets onboarded."));
    nations.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", c.name));
      if (c.constructionGdp) card.appendChild(kv("Construction GDP", c.constructionGdp));
      if (c.cagr) card.appendChild(kv("CAGR", c.cagr));
      app.appendChild(card);
    });

    app.appendChild(el("div", "lbl", "Norms and codes"));
    var norms = arr(d.normCodes);
    if (!norms.length) app.appendChild(emptyState("No norms or codes onboarded."));
    norms.forEach(function (n) {
      var card = el("div", "card");
      var top = el("div", "crow");
      top.appendChild(el("span", "cat", n.type || "Norm"));
      top.appendChild(el("span", "meta", n.timeValue || ""));
      card.appendChild(top);
      card.appendChild(el("p", "ttl", n.name));
      card.appendChild(kv("Applies to", (n.countryName || "All") + " · " + (n.competitorName || "All")));
      if (n.linkUrl) card.appendChild(linkRow(n.linkUrl, "Open ↗"));
      app.appendChild(card);
    });
  }

  /* The explanatory note lives at the foot of Alerts only — it explains this tab. */
  if (S.tab === "alerts" && alerts().length) {
    var box = el("div", "info");
    box.appendChild(el("div", "i", "i"));
    var c2 = el("div");
    c2.appendChild(el("b", null, "What happens when you publish"));
    c2.appendChild(document.createTextNode(
      "Verified stories become a report and move to Published, exactly as on the phone. " +
      "This page writes only its own file in your Drive, so it can never overwrite news your phone fetched."));
    box.appendChild(c2);
    app.appendChild(box);
  }
  refreshReportBar();
}

function refreshReportBar() {
  var n = verifiedArticles().length;
  $("#vcount").textContent = String(n);
  $("#repbar").classList.toggle("on", n > 0 && S.tab === "alerts");
}
function toggleVerify(title) {
  var k = key(title);
  var cur = S.actions.verifiedTitles.map(key);
  var i = cur.indexOf(k);
  if (i >= 0) S.actions.verifiedTitles.splice(i, 1); else S.actions.verifiedTitles.push(k);
  save(); render();
  /* Already saved locally, so a failed upload is not data loss — say so rather than
     throwing an unhandled rejection into the console. */
  pushActions().catch(function (e) {
    setStatus("Verified here, but not saved to Drive yet: " + e.message, true);
  });
}

/* ============================================================
   REPORTS
   ============================================================ */
function reportHtml(title, dateLabel, articles) {
  return "<h1>" + esc(title) + "</h1><p class='r-sub'>" + esc(dateLabel) + " · " +
    articles.length + " article(s)</p>" +
    articles.map(function (a) {
      return "<div class='r-art'>" +
        "<div class='r-meta'>" + esc(a.category || "News") +
          (a.date ? " · " + esc(a.date) : "") +
          (a.source ? " · " + esc(a.source) : "") + "</div>" +
        "<h2>" + esc(a.title) + "</h2>" +
        (a.summary ? "<p class='r-sum'>" + esc(a.summary) + "</p>" : "") +
        (a.pmAdvisory ? "<p class='r-adv'>" + esc(a.pmAdvisory) + "</p>" : "") +
      "</div>";
    }).join("");
}
/* PDF via the browser's own print dialogue ("Save as PDF"). No library, no CDN, and
   the output matches what you see rather than a re-implementation of it. */
function printReport(title, dateLabel, articles) {
  $("#report").innerHTML = reportHtml(title, dateLabel, articles);
  var prev = document.title;
  document.title = title + " — " + dateLabel;
  window.print();
  setTimeout(function () { document.title = prev; }, 500);
}
/* Word: an HTML document served with Word's MIME type. Word and Google Docs both
   open it as a normal editable document, and it needs no zip library. */
function downloadWord(title, dateLabel, articles) {
  var doc =
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' +
    'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}' +
    'h1{font-size:18pt;margin:0 0 4pt}.r-sub{color:#555;font-size:9pt;margin:0 0 18pt}' +
    'h2{font-size:12pt;margin:0 0 4pt}.r-meta{font-size:8.5pt;color:#666;margin:0 0 4pt}' +
    '.r-sum{font-size:10pt;line-height:1.5;margin:0}' +
    '.r-adv{font-size:9.5pt;line-height:1.5;margin:5pt 0 0;padding-left:8pt;border-left:2pt solid #1F57F5;color:#333}' +
    '.r-art{margin:0 0 14pt;padding:0 0 10pt;border-bottom:1pt solid #ddd}' +
    '</style></head><body>' + reportHtml(title, dateLabel, articles) + '</body></html>';
  var blob = new Blob(["﻿", doc], { type: "application/msword" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = String(title).replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") + "-" +
    String(dateLabel).replace(/\s+/g, "-") + ".doc";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* Publishing. Verified stories become an edition, move to Published, and leave
   Alerts. Everything here is ADDITIVE — we append to our own file and never touch
   the phone's, so nothing the phone holds can be lost. */
async function publishVerified(kind) {
  var list = verifiedArticles();
  if (!list.length) return;
  var ok = await askConfirm({
    title: "Publish " + list.length + " article(s)?",
    body: "They move out of Alerts and into Published, and become a report you can download again later. Your phone picks this up on its next sync.",
    ok: "Publish"
  });
  if (!ok) return;

  var now = Date.now();
  var dateLabel = new Date(now).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  var title = "Window Market Report";
  if (kind === "pdf") printReport(title, dateLabel, list); else downloadWord(title, dateLabel, list);

  var jan1 = new Date(new Date(now).getFullYear(), 0, 1).getTime();
  var wk = Math.ceil((((now - jan1) / 86400000) + 1) / 7);
  S.actions.reportEditions.push({
    id: now, title: title, dateLabel: dateLabel, weekLabel: "Week " + wk, createdAtMillis: now,
    articles: list,
    verifiedTitles: list.map(function (a) { return key(a.title); }),
    competitorsCount: arr(S.data && S.data.competitors).length,
    countriesCount: arr(S.data && S.data.countries).length
  });
  list.forEach(function (a) {
    S.actions.publishedNews.push(a);
    S.actions.publishedTitles.push(key(a.title));
  });
  var gone = new Set(list.map(function (a) { return key(a.title); }));
  S.actions.verifiedTitles = S.actions.verifiedTitles.filter(function (t) { return !gone.has(key(t)); });
  save(); render();
  setStatus("Saving to Drive…");
  try {
    await pushActions(true);
    setStatus("");
    toast(list.length + " article(s) published");
  } catch (e) {
    setStatus("Published here, but saving to Drive failed: " + e.message, true);
  }
}

/* ============================================================
   LOAD
   ============================================================ */
async function loadEverything() {
  S.loading = true; render();
  setStatus("Loading from Drive…");
  var data = null;
  try { data = await readJson(DATA_FILE); }
  finally { S.loading = false; }

  if (!data) {
    S.data = { alerts: [] };
    setStatus("Nothing in Drive yet. On your phone open Settings, then Storage, and press Back up.", true);
    render(); return;
  }
  S.data = data;

  /* Merge whatever this browser previously wrote, so a fresh device sees it too. */
  var remote = await readJson(ACTIONS_FILE).catch(function () { return null; });
  if (remote) {
    var merge = function (a, b, byKey) {
      var out = arr(a).slice(), seen = new Set(out.map(byKey));
      arr(b).forEach(function (x) {
        var k = byKey(x);
        if (!seen.has(k)) { seen.add(k); out.push(x); }
      });
      return out;
    };
    S.actions.verifiedTitles  = merge(S.actions.verifiedTitles,  remote.verifiedTitles,  key);
    S.actions.publishedTitles = merge(S.actions.publishedTitles, remote.publishedTitles, key);
    S.actions.publishedNews   = merge(S.actions.publishedNews,   remote.publishedNews,
      function (a) { return key(a && a.title); });
    S.actions.reportEditions  = merge(S.actions.reportEditions,  remote.reportEditions,
      function (e) { return e && e.id; });
    save();
  }
  setStatus(data.updatedAtMillis
    ? "Your phone last backed up " + new Date(data.updatedAtMillis).toLocaleString("en-GB") + "."
    : "");
  render();
}

async function start() {
  $("#gate").style.display = "none";
  $("#shell").hidden = false;
  applyTheme();
  if (!S.email) { S.email = await accountEmail(); save(); }
  try { await loadEverything(); }
  catch (e) { S.loading = false; setStatus(e.message, true); render(); }
}

/* ============================================================
   SETTINGS
   ============================================================ */
async function openSettings() {
  var out = await askShell(function (box, done) {
    box.appendChild(el("h2", "askttl", "Settings"));
    box.appendChild(el("p", "askbody", "Signed in as " + (S.email || "this account") + "."));
    box.appendChild(el("p", "askbody",
      "This page never fetches news — only your phone does. It reads your Drive backup and " +
      "writes back only what you verify or publish here."));
    box.appendChild(el("p", "askbody",
      "Signing out forgets the connection in this browser only. Nothing in your Drive is deleted, " +
      "and signing back in will not ask again."));
    var row = el("div", "askrow");
    var close = el("button", "btn sm ghost", "Close");
    close.onclick = function () { done(false); };
    var so = el("button", "btn sm", "Sign out");
    so.onclick = function () { done(true); };
    row.appendChild(close); row.appendChild(so);
    box.appendChild(row);
  });
  if (out) signOut();
}

function openSettingsPanel() {
  renderDrawerSettings();
  renderSyncRow();
  $("#settingsPanel").hidden = false;
  $("#btnSettingsClose").focus();
}
function closeSettingsPanel() { $("#settingsPanel").hidden = true; }

/* ============================================================
   WIRING
   ============================================================ */
/* Phone height is not one number: on a first launch the browser still reports the
   chrome it is about to retract, so the app lays out taller than the screen and the
   report bar ends up below the fold. visualViewport is the value that settles. */
function sizeShell() {
  var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty("--apph", h + "px");
}
window.addEventListener("resize", sizeShell);
if (window.visualViewport) window.visualViewport.addEventListener("resize", sizeShell);
sizeShell();

$("#gateMark").innerHTML = MARK;
$("#btnMenu").innerHTML = ICON_MENU;
$("#btnClose").innerHTML = ICON_X;
$("#drawerMark").innerHTML = MARK;
$("#btnMenu").onclick = openDrawer;
$("#btnClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
// Escape closes the drawer, matching the ask dialog.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (!$("#settingsPanel").hidden) { e.preventDefault(); closeSettingsPanel(); return; }
  if (drawerOpen()) { e.preventDefault(); closeDrawer(); }
});

$("#signin").onclick = async function () {
  setGateStatus("Opening Google sign-in…");
  try { await signIn(); setGateStatus(""); await start(); }
  catch (e) { setGateStatus(e.message, true); }
};
document.querySelectorAll(".themebtn").forEach(function (b) { b.onclick = toggleTheme; });
$("#btnProfile").onclick  = openSettingsPanel;   // the one way in, from the rail
$("#btnSettingsClose").onclick = closeSettingsPanel;
$("#settingsPanel").onclick = function (e) {
  // Backdrop only: a click that started inside the pane must not dismiss it.
  if (e.target === this) closeSettingsPanel();
};
$("#genPdf").onclick  = function () { publishVerified("pdf"); };
$("#genWord").onclick = function () { publishVerified("word"); };
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

/* Offline + update. A new version is downloaded quietly and applied only when the
   user taps — never swapped under someone mid-read. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", function () {
          if (w.state === "installed" && navigator.serviceWorker.controller) $("#upd").classList.add("on");
        });
      });
      $("#updGo").onclick = function () {
        if (reg.waiting) reg.waiting.postMessage("applyUpdate");
        location.reload();
      };
    }).catch(function () {});
  });
}

load();
applyTheme();
if (tokenAlive()) start();
else if (S.email) setGateStatus("Signed in before as " + S.email + ". Press the button to continue — it should not ask again.");
</script>
