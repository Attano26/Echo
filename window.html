}
/* One bar row: name, proportional track, value. Shared by four cards. */
function anBar(host, name, value, pct, colour) {
  var row = el("div", "barrow");
  row.appendChild(el("div", "bn", name));
  var track = el("div", "bartrack");
  var fill = el("div", "barfill");
  fill.style.width = Math.max(2, pct) + "%";
  if (colour) fill.style.background = colour;
  track.appendChild(fill);
  row.appendChild(track);
  row.appendChild(el("div", "bv", value));
  host.appendChild(row);
  return row;
}
function anNote(host, text) { host.appendChild(el("div", "anempty", text)); }

/* ---- API cost. The phone's top card: Today / This month / Daily cap. ---- */
function anCost(host, st) {
  var cols = [
    ["Today", "≈ ₹" + (Number(st.spendToday) || 0).toFixed(2),
     (st.searchesToday || 0) + " searches · " + (st.callsToday || 0) +
       (st.callsToday === 1 ? " call" : " calls"),
     (Number(st.tokensToday) || 0).toLocaleString("en-IN") + " tokens", null],
    ["This month", "≈ ₹" + (Number(st.spendMonth) || 0).toFixed(2),
     (st.searchesMonth || 0) + " searches",
     (Number(st.tokensMonth) || 0).toLocaleString("en-IN") + " tokens", null],
    ["Daily cap", "₹" + Math.round(Number(st.dailyCostCap) || 0), "in-app stop", "", "var(--accent)"]
  ];
  var row = el("div", "costrow");
  cols.forEach(function (c) {
    var col = el("div", "costcol");
    col.appendChild(el("div", "costk", c[0]));
    var v = el("div", "costv", c[1]);
    if (c[4]) v.style.color = c[4];
    col.appendChild(v);
    if (c[2]) col.appendChild(el("div", "costc", c[2]));
    if (c[3]) col.appendChild(el("div", "costc", c[3]));
    row.appendChild(col);
  });
  host.appendChild(row);
  host.appendChild(el("div", "anfoot",
    "Estimate only — it assumes every search is billed, so the real bill is usually a little lower."));
}

/* ---- News volume: stacked bars, one column per week, one colour per channel. ---- */
function anVolume(host, a) {
  var weeks = arr(a.weekLabels), rows = arr(a.volPerWeek), cats = arr(a.volCategories);
  if (!weeks.length) { anNote(host, "No news in this window."); return; }
  var max = 1;
  rows.forEach(function (r) {
    max = Math.max(max, arr(r).reduce(function (x, y) { return x + y; }, 0));
  });
  var chart = el("div", "stack");
  weeks.forEach(function (wk, wi) {
    var col = el("div", "stackcol");
    var bar = el("div", "stackbar");
    var vals = arr(rows[wi]);
    var total = vals.reduce(function (x, y) { return x + y; }, 0);
    bar.style.height = Math.max(2, (total / max) * 100) + "%";
    vals.forEach(function (v, ci) {
      if (!v) return;
      var seg = el("div", "stackseg");
      seg.style.height = (v / total) * 100 + "%";
      seg.style.background = AN_SEGMENTS[ci % AN_SEGMENTS.length];
      seg.title = (cats[ci] || "") + ": " + v;
      bar.appendChild(seg);
    });
    col.appendChild(bar);
    col.appendChild(el("div", "stackx", wk));
    chart.appendChild(col);
  });
  host.appendChild(chart);
  var lg = el("div", "anlegend");
  cats.forEach(function (c, ci) {
    var it = el("span", "lgi");
    var d = el("span", "lgd");
    d.style.background = AN_SEGMENTS[ci % AN_SEGMENTS.length];
    it.appendChild(d);
    it.appendChild(el("span", null, c));
    lg.appendChild(it);
  });
  host.appendChild(lg);
}

/* ---- News overview: of what arrived in the window, what you did with it. ---- */
function anOverview(host, cv, inFeed) {
  var surfaced = cv.surfaced || 0;
  var head = el("div", "anbig");
  head.appendChild(el("span", "anbign", String(surfaced)));
  head.appendChild(el("span", "anbigl", "received · " + inFeed + " in the feed now"));
  host.appendChild(head);
  if (!surfaced) { anNote(host, "No news in this window."); return; }
  [["Liked", cv.liked, "#10B981"], ["Disliked", cv.disliked, "#EF4444"],
   ["Saved", cv.saved, "#F59E0B"], ["Verified", cv.verified, "#06B6D4"],
   ["Published", cv.published, "#1F57F5"]].forEach(function (r) {
    var n = r[1] || 0, pct = Math.round((n / surfaced) * 100);
    anBar(host, r[0], n + " · " + pct + "%", pct, r[2]);
  });
}

/* ---- Conversion flow: in feed / not → saved / not → outcome.
   Three columns of bands; a band's height is its count, so the columns balance by eye. ---- */
function anFlow(host, s) {
  if (!s || !s.received) { anNote(host, "No news in this window."); return; }
  var ab = arr(s.aToB), out = arr(s.outcomeTotals);
  var stages = [
    ["Received", [["in feed", s.inFeed || 0, "#1F57F5"],
                  ["not in feed", s.notInFeed || 0, "#8E8E93"]]],
    ["Kept", [["saved", s.saved || 0, "#F59E0B"],
              ["not saved", s.notSaved || 0, "#8E8E93"]]],
    ["Outcome", [["published", out[0] || 0, "#1F57F5"],
                 ["verified", out[1] || 0, "#06B6D4"],
                 ["deleted", out[2] || 0, "#EF4444"],
                 ["open", out[3] || 0, "#8E8E93"]]]
  ];
  var flow = el("div", "flow");
  stages.forEach(function (st) {
    var col = el("div", "flowcol");
    col.appendChild(el("div", "flowk", st[0]));
    st[1].forEach(function (b) {
      if (!b[1]) return;
      var band = el("div", "flowband");
      band.style.flexGrow = String(b[1]);
      band.style.background = b[2];
      band.title = b[0] + ": " + b[1];
      band.appendChild(el("span", "flowlab", b[0] + " " + b[1]));
      col.appendChild(band);
    });
    flow.appendChild(col);
  });
  host.appendChild(flow);
  host.appendChild(el("div", "anfoot", (s.received || 0) + " stories routed"));
}

/* ---- Share of voice, by competitor. ---- */
function anSov(host, sov) {
  if (!sov.length) { anNote(host, "No competitor-matched news yet."); return; }
  var total = sov.reduce(function (t, r) { return t + r.c; }, 0) || 1;
  sov.slice(0, 8).forEach(function (r, i) {
    var pct = Math.round((r.c / total) * 100);
    anBar(host, r.n, r.c + " · " + pct + "%", pct, AN_PALETTE[i % AN_PALETTE.length]);
  });
}

/* ---- Momentum: a sparkline per competitor with its delta. ---- */
function anMomentum(host, list) {
  if (!list.length) { anNote(host, "Not enough competitor-matched news yet."); return; }
  list.slice(0, 6).forEach(function (m, i) {
    var row = el("div", "momrow");
    row.appendChild(el("div", "momn", m.n));
    var w = arr(m.w);
    var svg = svgNode("svg", { "class": "momspark", viewBox: "0 0 100 26", preserveAspectRatio: "none" });
    if (w.length > 1) {
      var mx = Math.max.apply(null, w) || 1, d = "";
      w.forEach(function (v, k) {
        d += (k ? " L" : "M") + ((k / (w.length - 1)) * 100).toFixed(1) +
             " " + (24 - (v / mx) * 21).toFixed(1);
      });
      var path = svgNode("path", { d: d });
      path.style.stroke = AN_PALETTE[i % AN_PALETTE.length];
      svg.appendChild(path);
    }
    row.appendChild(svg);
    var dv = m.d || 0;
    var dl = el("div", "momd", (dv > 0 ? "+" : "") + dv);
    dl.style.color = dv > 0 ? "#10B981" : (dv < 0 ? "#EF4444" : "var(--ink-3)");
    row.appendChild(dl);
    host.appendChild(row);
  });
}

/* ---- Narrative ownership: per topic, whose coverage it is. ---- */
function anNarrative(host, list, sovNames) {
  if (!list.length) { anNote(host, "Not enough news yet."); return; }
  /* Colour a competitor by its share-of-voice rank, so a rival looks the same on every card —
     the phone does exactly this, and a name that changed colour card to card would read as a
     different company. */
  function colourFor(name) {
    var i = sovNames.indexOf(name);
    return i < 0 ? "#8E8E93" : AN_PALETTE[i % AN_PALETTE.length];
  }
  list.slice(0, 7).forEach(function (row) {
    var segs = arr(row.seg);
    var total = segs.reduce(function (t, x) { return t + x.c; }, 0) || 1;
    var r = el("div", "narrow");
    r.appendChild(el("div", "narn", row.cat));
    var bar = el("div", "narbar");
    segs.forEach(function (sg) {
      var b = el("div", "narseg");
      b.style.width = (sg.c / total) * 100 + "%";
      b.style.background = colourFor(sg.n);
      b.title = sg.n + ": " + sg.c;
      bar.appendChild(b);
    });
    r.appendChild(bar);
    r.appendChild(el("div", "bv", String(total)));
    host.appendChild(r);
  });
}

/* ---- Activity heatmap: competitor × category. ---- */
function anHeat(host, a) {
  var rows = arr(a.heatRows), cols = arr(a.heatCols), grid = arr(a.heat);
  if (!rows.length || !cols.length) { anNote(host, "Not enough competitor-matched news yet."); return; }
  var max = 1;
  grid.forEach(function (r) { arr(r).forEach(function (v) { max = Math.max(max, v); }); });
  var wrap = el("div", "heatwrap");
  var tbl = el("div", "heat");
  tbl.style.gridTemplateColumns = "minmax(84px,1.3fr) repeat(" + cols.length + ", minmax(26px,1fr))";
  tbl.appendChild(el("div"));
  cols.forEach(function (c) {
    var h = el("div", "heathc", c.length > 10 ? c.slice(0, 9) + "…" : c);
    h.title = c;
    tbl.appendChild(h);
  });
  rows.forEach(function (rn, ri) {
    var lab = el("div", "heathr", rn);
    lab.title = rn;
    tbl.appendChild(lab);
    cols.forEach(function (cn, ci) {
      var v = (arr(grid[ri])[ci]) || 0;
      var cell = el("div", "heatc");
      if (v > 0) {
        // Opacity carries volume. One hue, so the eye reads density instead of decoding a scale.
        cell.style.background = "var(--accent)";
        cell.style.opacity = String(0.18 + 0.82 * (v / max));
      }
      cell.title = rn + " · " + cn + ": " + v;
      tbl.appendChild(cell);
    });
  });
  wrap.appendChild(tbl);
  host.appendChild(wrap);
}

/* ---- Source diversity: where the intel comes from. ---- */
function anSources(host, a) {
  var src = arr(a.sources);
  if (!src.length) { anNote(host, "No sources yet."); return; }
  var max = src.reduce(function (t, r) { return Math.max(t, r.c); }, 1);
  src.slice(0, 8).forEach(function (r, i) {
    anBar(host, r.n, String(r.c), Math.round((r.c / max) * 100), AN_PALETTE[i % AN_PALETTE.length]);
  });
  host.appendChild(el("div", "anfoot",
    (a.distinctSources || 0) + " distinct outlets in this window"));
}

/* ---- Industry trends: the tracked-theme mix, then what is rising and cooling. ---- */
function anTrends(host, a) {
  var g = arr(a.trendGroups);
  if (!g.length) { anNote(host, "No tracked industry trends mentioned yet."); return; }
  var total = g.reduce(function (t, r) { return t + r.c; }, 0) || 1;
  var bar = el("div", "trendbar");
  g.forEach(function (r, i) {
    var b = el("div", "narseg");
    b.style.width = (r.c / total) * 100 + "%";
    b.style.background = AN_SEGMENTS[i % AN_SEGMENTS.length];
    b.title = r.n + ": " + r.c;
    bar.appendChild(b);
  });
  host.appendChild(bar);
  var lg = el("div", "anlegend");
  g.forEach(function (r, i) {
    var it = el("span", "lgi");
    var d = el("span", "lgd");
    d.style.background = AN_SEGMENTS[i % AN_SEGMENTS.length];
    it.appendChild(d);
    it.appendChild(el("span", null, r.n + " " + r.c));
    lg.appendChild(it);
  });
  host.appendChild(lg);

  var kw = arr(a.keywords);
  var rising = kw.filter(function (k) { return k.d > 0; })
                 .sort(function (x, y) { return y.d - x.d; }).slice(0, 5);
  var cooling = kw.filter(function (k) { return k.d < 0; })
                  .sort(function (x, y) { return x.d - y.d; }).slice(0, 5);
  if (!rising.length && !cooling.length) return;
  var grid = el("div", "rcgrid");
  [["Heating up", rising, "#10B981"], ["Cooling down", cooling, "#EF4444"]].forEach(function (side) {
    var col = el("div");
    col.appendChild(el("div", "rck", side[0]));
    if (!side[1].length) col.appendChild(el("div", "anempty", "Nothing yet."));
    side[1].forEach(function (k) {
      var row = el("div", "rcrow");
      row.appendChild(el("span", "n", k.n));
      var d = el("span", "d", (k.d > 0 ? "+" : "") + k.d);
      d.style.color = side[2];
      row.appendChild(d);
      col.appendChild(row);
    });
    grid.appendChild(col);
  });
  host.appendChild(grid);
}

/* ---- NALCO metal prices. The phone's Metal tab, at a glance. ---- */
function anMetal(host, np) {
  var latest = np[0];
  var rows = el("div");
  [["Ingot · IE07", latest.ingot], ["Billet · CH10 · 178–254 mm", latest.billet]].forEach(function (r) {
    var row = el("div", "bxrow");
    row.appendChild(el("span", "n", r[0]));
    row.appendChild(el("span", "v", r[1] ? "₹" + Number(r[1]).toLocaleString("en-IN") + "/MT" : "—"));
    rows.appendChild(row);
  });
  host.appendChild(rows);
  /* Movement against the previous circular is the useful part — a price alone is just a number. */
  if (np.length > 1) {
    var prev = np[1], d = (Number(latest.ingot) || 0) - (Number(prev.ingot) || 0);
    if (d) {
      var mv = el("div", "anfoot",
        "Ingot " + (d > 0 ? "up ₹" : "down ₹") + Math.abs(d).toLocaleString("en-IN") +
        "/MT since " + (prev.effective || "the last circular"));
      mv.style.color = d > 0 ? "#EF4444" : "#10B981";
      host.appendChild(mv);
    }
  }
  host.appendChild(el("div", "anfoot", "Effective " + (latest.effective || "—")));
}

/* ============================================================
   DASHBOARD
   ------------------------------------------------------------
   Two zones. A horizontal strip of the phone's home-screen widgets for a glance, then the
   Analytics bento underneath for the detail. The strip answers "is there anything to look at?",
   the bento answers "what is it?".
   ============================================================ */
function wtile(key, value, caption, small) {
  var t = el("div", "wtile");
  t.appendChild(el("div", "wk", key));
  t.appendChild(el("div", "wv" + (small ? " sm" : ""), String(value)));
  if (caption) t.appendChild(el("div", "wc", caption));
  return t;
}
function rupee(v) { return "₹" + (Number(v) || 0).toFixed(2); }

function renderDashboard(app, d) {
  var wrap = el("div", "dash");
  var w = d.widgets || {};
  var an = d.analytics || null;

  /* ---------- the glance strip: the eight home-screen widgets ---------- */
  if (Object.keys(w).length) {
    var strip = el("div", "wstrip");
    var ready = w.readyCount || 0;
    var trendTop = arr(w.trendTop);
    var names = function (list) {
      return arr(list).slice(0, 2).map(function (r) { return r.n; }).join(", ");
    };
    strip.appendChild(wtile("Ready to publish", ready,
      ready ? (w.readyOldestDays ? "Oldest waiting " + w.readyOldestDays + "d"
                                 : "Verified, not yet in a report")
            : "Nothing waiting"));
    strip.appendChild(wtile("Coverage", w.monthTotal || 0,
      (w.monthLabel || "This month") + " · stories"));
    strip.appendChild(wtile("Monthly spend", rupee(w.monthRupees), w.sourceMode || ""));
    strip.appendChild(wtile("Industry trends", trendTop.length ? trendTop[0].n : "—",
      (w.trendTotal || 0) + " stories · " + (w.trendWindowDays || 30) + "d", true));
    strip.appendChild(wtile("Heating up", w.risingTrend || "—",
      names(w.risingRunners) ? "then " + names(w.risingRunners) : "", true));
    strip.appendChild(wtile("Cooling down", w.coolingTrend || "—",
      names(w.coolingRunners) ? "then " + names(w.coolingRunners) : "", true));
    strip.appendChild(wtile("Top mover", w.moverName || "—",
      (w.moverDelta > 0 ? "+" : "") + (w.moverDelta || 0) + " · " + (w.moverSharePct || 0) + "% share", true));
    strip.appendChild(wtile("Unverified", w.alertsUnverified || 0,
      "of " + (w.alertsTotal || 0) + " in Alerts"));
    wrap.appendChild(strip);
  }

  /* If the phone has not shipped its analytics yet, say so plainly rather than compute a
     lookalike here — a lookalike is exactly how the two screens would start disagreeing. */
  if (!an || !an[AN_WIN]) {
    wrap.appendChild(el("div", "dempty",
      "Your phone has not sent its analytics yet. Open Settings → Storage on the phone and press " +
      "Back up — these figures are computed there, so this page waits for them rather than " +
      "working them out a second way."));
    app.appendChild(wrap);
    return;
  }

  var a = an[AN_WIN];
  var cv = a.conversion || {};
  var sov = arr(a.sov);
  var sovNames = sov.map(function (r) { return r.n; });

  /* ---------- section header with the phone's 1M / 3M / 6M selector ---------- */
  var head = el("div", "anhead");
  var left = el("div");
  left.appendChild(el("h2", null, "Analytics"));
  left.appendChild(el("div", "sub", (a.totalCount || 0) + " stories · " + anPhrase(AN_WIN)));
  head.appendChild(left);
  var seg = el("div", "anseg");
  ["1M", "3M", "6M"].forEach(function (k) {
    if (!an[k]) return;
    var b = el("button", AN_WIN === k ? "on" : null, k);
    b.onclick = function () { AN_WIN = k; render(); };
    seg.appendChild(b);
  });
  head.appendChild(seg);
  wrap.appendChild(head);

  if (!a.totalCount) {
    wrap.appendChild(el("div", "dempty",
      "No news in this window. Try a longer range, or refresh on the phone."));
    app.appendChild(wrap);
    return;
  }

  var g = el("div", "bento");
  var c;

  /* API cost, and the metal prices beside it — the two "what is this costing / what is it
     worth" figures, together at the top where the phone puts cost. */
  c = anCard("w2", "API cost (estimate)", "What this app is spending on your key");
  anCost(c.body, d.settings || {});
  g.appendChild(c);

  var np = arr(d.nalcoPrices);
  if (np.length) {
    c = anCard("w2", "Metal · NALCO circular", "Ingot and billet, ex-works");
    anMetal(c.body, np);
    g.appendChild(c);
  }

  /* The phone's two headline stat cards. */
  function statCard(k, v, caption, colour) {
    var s = el("div", "anstat w2");
    s.appendChild(el("div", "k", k));
    s.appendChild(el("div", "v", v || "—"));
    var rule = el("div", "rule");
    rule.style.background = colour;
    s.appendChild(rule);
    s.appendChild(el("div", "c", caption));
    return s;
  }
  g.appendChild(statCard("Top mover", a.topMover,
    "Biggest " + anDelta(AN_WIN) + " gain in share of voice", AN_PALETTE[0]));
  g.appendChild(statCard("Emerging topic", a.emergingTopic,
    "Channel rising fastest this " + anPeriod(AN_WIN), AN_PALETTE[2]));

  c = anCard("w4", "News volume", "Stories by channel over time");
  anVolume(c.body, a);
  g.appendChild(c);

  c = anCard("w2", "News overview", "Of news received in " + AN_WIN + ", what you did with it");
  anOverview(c.body, cv, arr(d.alerts).length);
  g.appendChild(c);

  c = anCard("w2", "Conversion flow", "In feed / not → saved / not → outcome");
  anFlow(c.body, a.sankey);
  g.appendChild(c);

  c = anCard("w2", "Share of voice", "By competitor · " + anPhrase(AN_WIN));
  anSov(c.body, sov);
  g.appendChild(c);

  c = anCard("w2", "Momentum", anUnit(AN_WIN) + " coverage trend by competitor");
  anMomentum(c.body, arr(a.momentum));
  g.appendChild(c);

  c = anCard("w2", "Narrative ownership", "Who owns each topic's coverage");
  anNarrative(c.body, arr(a.narrative), sovNames);
  g.appendChild(c);

  c = anCard("w2", "Source diversity", "Where your intel comes from");
  anSources(c.body, a);
  g.appendChild(c);

  c = anCard("w2", "Activity heatmap", "Competitor × category");
  anHeat(c.body, a);
  g.appendChild(c);

  c = anCard("w2", "Industry trends", "Which tracked fenestration trends are heating up");
  anTrends(c.body, a);
  g.appendChild(c);

  wrap.appendChild(g);
  if (w.nextBriefing) wrap.appendChild(el("p", "dsub", "Next briefing " + w.nextBriefing));
  app.appendChild(wrap);
}

function render() {
  renderDrawerNav(); renderSyncRow(); renderDrawerSettings(); renderTitle();
  $("#shell").classList.toggle("wide", S.tab === "dashboard");
  var app = $("#app"); app.innerHTML = "";
  var d = S.data, i;

  if (S.loading) {
    for (i = 0; i < 4; i++) app.appendChild(el("div", "skel"));
    refreshReportBar(); return;
  }
  if (!d) { app.appendChild(emptyState("Nothing loaded yet.")); refreshReportBar(); return; }

  if (S.tab === "dashboard") {
    renderDashboard(app, d);
  }
  else if (S.tab === "alerts") {
    var list = alerts();
    if (!list.length) app.appendChild(emptyState("No alerts. Everything here has been published, or your phone has not backed up yet."));
    else list.forEach(function (a) { app.appendChild(articleCard(a, { verifiable: true })); });
  }
  else if (S.tab === "saved") {
    var sv = arr(d.savedNews);
    if (!sv.length) app.appendChild(emptyState("Nothing saved."));
    else sv.forEach(function (a) { app.appendChild(articleCard(a, {})); });
  }
  else if (S.tab === "published") {
    var pb = published();
    if (!pb.length) app.appendChild(emptyState("Nothing published yet. Verify some alerts, then generate a report."));
    else pb.forEach(function (a) { app.appendChild(articleCard(a, { publishedPill: true })); });
  }
  else if (S.tab === "reports") {
    var eds = editions();
    if (!eds.length) app.appendChild(emptyState("No reports yet."));
    else eds.forEach(function (e) {
      var c = el("div", "card");
      var top = el("div", "crow");
      top.appendChild(el("span", "cat", e.weekLabel || "Report"));
      top.appendChild(el("span", "meta", e.dateLabel || ""));
      c.appendChild(top);
      c.appendChild(el("p", "ttl", e.title || "Market report"));
      c.appendChild(el("p", "sum", arr(e.articles).length + " article(s) · " +
        (e.competitorsCount || 0) + " competitor(s) · " + (e.countriesCount || 0) + " market(s)"));
      var acts = el("div", "acts");
      var w = el("button", "btn sm ghost", "Word");
      w.onclick = function () { downloadWord(e.title || "Market report", e.dateLabel || "", arr(e.articles)); };
      var p = el("button", "btn sm", "PDF");
      p.onclick = function () { printReport(e.title || "Market report", e.dateLabel || "", arr(e.articles)); };
      acts.appendChild(w); acts.appendChild(p);
      c.appendChild(acts);
      app.appendChild(c);
    });
  }
  else if (S.tab === "liked" || S.tab === "disliked") {
    var titles = arr(S.tab === "liked" ? d.likedTitles : d.dislikedTitles).map(key);
    var pool = arr(d.newsArticles).concat(arr(d.alerts), arr(d.publishedNews), arr(d.savedNews));
    var seen = new Set(), out = [];
    titles.forEach(function (t) {
      if (seen.has(t)) return;
      seen.add(t);
      var hit = pool.filter(function (a) { return key(a.title) === t; })[0];
      out.push(hit || { title: t, category: "", summary: "", source: "" });
    });
    if (!out.length) app.appendChild(emptyState(S.tab === "liked" ? "Nothing liked yet." : "Nothing disliked yet."));
    else out.forEach(function (a) { app.appendChild(articleCard(a, {})); });
  }
  else if (S.tab === "restorepoints") {
    var rps = arr(d.restorePoints).slice().sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
    if (!rps.length) app.appendChild(emptyState("No restore points."));
    rps.forEach(function (rp) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", rp.name));
      card.appendChild(el("p", "sum", rp.timestamp ? new Date(rp.timestamp).toLocaleString("en-GB") : ""));
      app.appendChild(card);
    });
    if (rps.length) {
      var note = el("div", "info");
      note.appendChild(el("div", "i", "i"));
      var nc = el("div");
      nc.appendChild(el("b", null, "Listed, not stored here"));
      nc.appendChild(document.createTextNode(
        "Each snapshot holds a full copy of every table. Sending those would turn one backup into " +
        "several copies of the whole database, so only the name and date travel. Restoring one is " +
        "done on the phone."));
      note.appendChild(nc);
      app.appendChild(note);
    }
  }
  else if (S.tab === "database") {
    var comps = arr(d.competitors), prods = arr(d.competitorProducts);
    app.appendChild(el("div", "lbl", "Competitors"));
    if (!comps.length) app.appendChild(emptyState("No competitors onboarded."));
    comps.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", c.name));
      if (c.websiteUrl) card.appendChild(linkRow(c.websiteUrl, c.websiteUrl.replace(/^https?:\/\//, "") + " ↗"));
      if (c.keyProduct) card.appendChild(kv("Key product", c.keyProduct));
      if (c.markets) card.appendChild(kv("Markets", c.markets));
      var mine = prods.filter(function (p) { return key(p.competitorName) === key(c.name); });
      if (mine.length) card.appendChild(kv("Products", mine.map(function (p) { return p.name; }).join(", ")));
      if (c.insights) card.appendChild(el("p", "sum", c.insights));
      app.appendChild(card);
    });

    app.appendChild(el("div", "lbl", "Markets"));
    var nations = arr(d.countries);
    if (!nations.length) app.appendChild(emptyState("No markets onboarded."));
    nations.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", c.name));
      if (c.constructionGdp) card.appendChild(kv("Construction GDP", c.constructionGdp));
      if (c.cagr) card.appendChild(kv("CAGR", c.cagr));
      app.appendChild(card);
    });

    app.appendChild(el("div", "lbl", "Norms and codes"));
    var norms = arr(d.normCodes);
    if (!norms.length) app.appendChild(emptyState("No norms or codes onboarded."));
    norms.forEach(function (n) {
      var card = el("div", "card");
      var top = el("div", "crow");
      top.appendChild(el("span", "cat", n.type || "Norm"));
      top.appendChild(el("span", "meta", n.timeValue || ""));
      card.appendChild(top);
      card.appendChild(el("p", "ttl", n.name));
      card.appendChild(kv("Applies to", (n.countryName || "All") + " · " + (n.competitorName || "All")));
      if (n.linkUrl) card.appendChild(linkRow(n.linkUrl, "Open ↗"));
      app.appendChild(card);
    });
  }

  /* The explanatory note lives at the foot of Alerts only — it explains this tab. */
  if (S.tab === "alerts" && alerts().length) {
    var box = el("div", "info");
    box.appendChild(el("div", "i", "i"));
    var c2 = el("div");
    c2.appendChild(el("b", null, "What happens when you publish"));
    c2.appendChild(document.createTextNode(
      "Verified stories become a report and move to Published, exactly as on the phone. " +
      "This page writes only its own file in your Drive, so it can never overwrite news your phone fetched."));
    box.appendChild(c2);
    app.appendChild(box);
  }
  refreshReportBar();
}

function refreshReportBar() {
  var n = verifiedArticles().length;
  $("#vcount").textContent = String(n);
  $("#repbar").classList.toggle("on", n > 0 && S.tab === "alerts");
}
function toggleVerify(title) {
  var k = key(title);
  var cur = S.actions.verifiedTitles.map(key);
  var i = cur.indexOf(k);
  if (i >= 0) S.actions.verifiedTitles.splice(i, 1); else S.actions.verifiedTitles.push(k);
  save(); render();
  /* Already saved locally, so a failed upload is not data loss — say so rather than
     throwing an unhandled rejection into the console. */
  pushActions().catch(function (e) {
    setStatus("Verified here, but not saved to Drive yet: " + e.message, true);
  });
}

/* ============================================================
   REPORTS
   ============================================================ */
function reportHtml(title, dateLabel, articles) {
  return "<h1>" + esc(title) + "</h1><p class='r-sub'>" + esc(dateLabel) + " · " +
    articles.length + " article(s)</p>" +
    articles.map(function (a) {
      return "<div class='r-art'>" +
        "<div class='r-meta'>" + esc(a.category || "News") +
          (a.date ? " · " + esc(a.date) : "") +
          (a.source ? " · " + esc(a.source) : "") + "</div>" +
        "<h2>" + esc(a.title) + "</h2>" +
        (a.summary ? "<p class='r-sum'>" + esc(a.summary) + "</p>" : "") +
        (a.pmAdvisory ? "<p class='r-adv'>" + esc(a.pmAdvisory) + "</p>" : "") +
      "</div>";
    }).join("");
}
/* PDF via the browser's own print dialogue ("Save as PDF"). No library, no CDN, and
   the output matches what you see rather than a re-implementation of it. */
function printReport(title, dateLabel, articles) {
  $("#report").innerHTML = reportHtml(title, dateLabel, articles);
  var prev = document.title;
  document.title = title + " — " + dateLabel;
  window.print();
  setTimeout(function () { document.title = prev; }, 500);
}
/* Word: an HTML document served with Word's MIME type. Word and Google Docs both
   open it as a normal editable document, and it needs no zip library. */
function downloadWord(title, dateLabel, articles) {
  var doc =
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' +
    'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}' +
    'h1{font-size:18pt;margin:0 0 4pt}.r-sub{color:#555;font-size:9pt;margin:0 0 18pt}' +
    'h2{font-size:12pt;margin:0 0 4pt}.r-meta{font-size:8.5pt;color:#666;margin:0 0 4pt}' +
    '.r-sum{font-size:10pt;line-height:1.5;margin:0}' +
    '.r-adv{font-size:9.5pt;line-height:1.5;margin:5pt 0 0;padding-left:8pt;border-left:2pt solid #1F57F5;color:#333}' +
    '.r-art{margin:0 0 14pt;padding:0 0 10pt;border-bottom:1pt solid #ddd}' +
    '</style></head><body>' + reportHtml(title, dateLabel, articles) + '</body></html>';
  var blob = new Blob(["﻿", doc], { type: "application/msword" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = String(title).replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") + "-" +
    String(dateLabel).replace(/\s+/g, "-") + ".doc";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* Publishing. Verified stories become an edition, move to Published, and leave
   Alerts. Everything here is ADDITIVE — we append to our own file and never touch
   the phone's, so nothing the phone holds can be lost. */
async function publishVerified(kind) {
  var list = verifiedArticles();
  if (!list.length) return;
  var ok = await askConfirm({
    title: "Publish " + list.length + " article(s)?",
    body: "They move out of Alerts and into Published, and become a report you can download again later. Your phone picks this up on its next sync.",
    ok: "Publish"
  });
  if (!ok) return;

  var now = Date.now();
  var dateLabel = new Date(now).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  var title = "Window Market Report";
  if (kind === "pdf") printReport(title, dateLabel, list); else downloadWord(title, dateLabel, list);

  var jan1 = new Date(new Date(now).getFullYear(), 0, 1).getTime();
  var wk = Math.ceil((((now - jan1) / 86400000) + 1) / 7);
  S.actions.reportEditions.push({
    id: now, title: title, dateLabel: dateLabel, weekLabel: "Week " + wk, createdAtMillis: now,
    articles: list,
    verifiedTitles: list.map(function (a) { return key(a.title); }),
    competitorsCount: arr(S.data && S.data.competitors).length,
    countriesCount: arr(S.data && S.data.countries).length
  });
  list.forEach(function (a) {
    S.actions.publishedNews.push(a);
    S.actions.publishedTitles.push(key(a.title));
  });
  var gone = new Set(list.map(function (a) { return key(a.title); }));
  S.actions.verifiedTitles = S.actions.verifiedTitles.filter(function (t) { return !gone.has(key(t)); });
  save(); render();
  setStatus("Saving to Drive…");
  try {
    await pushActions(true);
    setStatus("");
    toast(list.length + " article(s) published");
  } catch (e) {
    setStatus("Published here, but saving to Drive failed: " + e.message, true);
  }
}

/* ============================================================
   LOAD
   ============================================================ */
async function loadEverything() {
  S.loading = true; render();
  setStatus("Loading from Drive…");
  var data = null;
  try { data = await readJson(DATA_FILE); }
  finally { S.loading = false; }

  if (!data) {
    S.data = { alerts: [] };
    setStatus("Nothing in Drive yet. On your phone open Settings → Storage and press Back up.", true);
    render(); return;
  }
  S.data = data;

  /* Merge whatever this browser previously wrote, so a fresh device sees it too. */
  var remote = await readJson(ACTIONS_FILE).catch(function () { return null; });
  if (remote) {
    var merge = function (a, b, byKey) {
      var out = arr(a).slice(), seen = new Set(out.map(byKey));
      arr(b).forEach(function (x) {
        var k = byKey(x);
        if (!seen.has(k)) { seen.add(k); out.push(x); }
      });
      return out;
    };
    S.actions.verifiedTitles  = merge(S.actions.verifiedTitles,  remote.verifiedTitles,  key);
    S.actions.publishedTitles = merge(S.actions.publishedTitles, remote.publishedTitles, key);
    S.actions.publishedNews   = merge(S.actions.publishedNews,   remote.publishedNews,
      function (a) { return key(a && a.title); });
    S.actions.reportEditions  = merge(S.actions.reportEditions,  remote.reportEditions,
      function (e) { return e && e.id; });
    save();
  }
  setStatus(data.updatedAtMillis
    ? "Your phone last backed up " + new Date(data.updatedAtMillis).toLocaleString("en-GB") + "."
    : "");
  render();
}

async function start() {
  $("#gate").style.display = "none";
  $("#shell").hidden = false;
  applyTheme();
  if (!S.email) { S.email = await accountEmail(); save(); }
  try { await loadEverything(); }
  catch (e) { S.loading = false; setStatus(e.message, true); render(); }
}

/* ============================================================
   SETTINGS
   ============================================================ */
async function openSettings() {
  var out = await askShell(function (box, done) {
    box.appendChild(el("h2", "askttl", "Settings"));
    box.appendChild(el("p", "askbody", "Signed in as " + (S.email || "this account") + "."));
    box.appendChild(el("p", "askbody",
      "This page never fetches news — only your phone does. It reads your Drive backup and " +
      "writes back only what you verify or publish here."));
    box.appendChild(el("p", "askbody",
      "Signing out forgets the connection in this browser only. Nothing in your Drive is deleted, " +
      "and signing back in will not ask again."));
    var row = el("div", "askrow");
    var close = el("button", "btn sm ghost", "Close");
    close.onclick = function () { done(false); };
    var so = el("button", "btn sm", "Sign out");
    so.onclick = function () { done(true); };
    row.appendChild(close); row.appendChild(so);
    box.appendChild(row);
  });
  if (out) signOut();
}

function openSettingsPanel() {
  renderDrawerSettings();
  renderSyncRow();
  $("#settingsPanel").hidden = false;
  $("#btnSettingsClose").focus();
}
function closeSettingsPanel() { $("#settingsPanel").hidden = true; }

/* ============================================================
   WIRING
   ============================================================ */
/* Phone height is not one number: on a first launch the browser still reports the
   chrome it is about to retract, so the app lays out taller than the screen and the
   report bar ends up below the fold. visualViewport is the value that settles. */
function sizeShell() {
  var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty("--apph", h + "px");
}
window.addEventListener("resize", sizeShell);
if (window.visualViewport) window.visualViewport.addEventListener("resize", sizeShell);
sizeShell();

$("#gateMark").innerHTML = MARK;
$("#btnMenu").innerHTML = ICON_MENU;
$("#btnClose").innerHTML = ICON_X;
$("#drawerMark").innerHTML = MARK;
$("#btnMenu").onclick = openDrawer;
$("#btnClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
// Escape closes the drawer, matching the ask dialog.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (!$("#settingsPanel").hidden) { e.preventDefault(); closeSettingsPanel(); return; }
  if (drawerOpen()) { e.preventDefault(); closeDrawer(); }
});

$("#signin").onclick = async function () {
  setGateStatus("Opening Google sign-in…");
  try { await signIn(); setGateStatus(""); await start(); }
  catch (e) { setGateStatus(e.message, true); }
};
document.querySelectorAll(".themebtn").forEach(function (b) { b.onclick = toggleTheme; });
$("#btnProfile").onclick  = openSettingsPanel;   // the one way in, from the rail
$("#btnSettingsClose").onclick = closeSettingsPanel;
$("#settingsPanel").onclick = function (e) {
  // Backdrop only: a click that started inside the pane must not dismiss it.
  if (e.target === this) closeSettingsPanel();
};
$("#genPdf").onclick  = function () { publishVerified("pdf"); };
$("#genWord").onclick = function () { publishVerified("word"); };
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

/* Offline + update. A new version is downloaded quietly and applied only when the
   user taps — never swapped under someone mid-read. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", function () {
          if (w.state === "installed" && navigator.serviceWorker.controller) $("#upd").classList.add("on");
        });
      });
      $("#updGo").onclick = function () {
        if (reg.waiting) reg.waiting.postMessage("applyUpdate");
        location.reload();
      };
    }).catch(function () {});
  });
}

load();
applyTheme();
if (tokenAlive()) start();
else if (S.email) setGateStatus("Signed in before as " + S.email + ". Press the button to continue — it should not ask again.");
</script>
