<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================
   The client ID is PUBLIC by design. Google identifies the app by it and then
   checks the request came from an authorised origin, so publishing it grants
   nobody anything. There is no client secret in the browser token flow, and this
   page holds no API key of any kind. */
var CLIENT_ID    = "653924371691-687hjiimvicq77nbk4l6osqoaio3nl4b.apps.googleusercontent.com";
var SCOPE        = "https://www.googleapis.com/auth/drive.file";
var DATA_FILE    = "echo-data.json";
var ACTIONS_FILE = "echo-web-actions.json";
var K = "echo.web.v1";

/* ============================================================
   TINY HELPERS
   ============================================================ */
var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, x) {
  var n = document.createElement(t);
  if (c) n.className = c;
  if (x != null) n.textContent = x;
  return n;
};
var arr = function (v) { return Array.isArray(v) ? v : []; };
var key = function (s) { return String(s || "").trim().toLowerCase(); };
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
  });
};

function toast(msg) {
  var t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("on"); }, 2200);
}
function setStatus(msg, isErr) {
  var e = $("#status"); e.textContent = msg || ""; e.className = "status" + (isErr ? " err" : "");
}
function setGateStatus(msg, isErr) {
  var e = $("#gateStatus"); e.textContent = msg || ""; e.className = "status" + (isErr ? " err" : "");
}

/* The Echo mark, inline so it takes currentColor and needs no network.
   Same 1024 grid as favicon.svg and EchoLogo() in the Android app, so the
   web, the launcher icon and the phone's top bar can never drift apart. */
var MARK = '<svg viewBox="0 0 1024 1024" width="100%" height="100%" role="img" aria-label="Echo">' +
  '<path fill="currentColor" d="M112 110 H912 V336 H112 Z' +
  ' M112 398 H338 A226 226 0 0 1 112 624 Z' +
  ' M400 398 H912 V624 H626 A226 226 0 0 1 400 398 Z' +
  ' M112 686 A226 226 0 0 1 338 912 H112 Z' +
  ' M400 912 A226 226 0 0 1 626 686 H912 V912 Z"/></svg>';
var ICON_SUN = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>';
var ICON_MOON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';
/* A real cog, not a circle with spokes — spokes sit right next to the sun/moon
   toggle and read as a second sun. */
var ICON_MENU = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
var ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* ============================================================
   STORE
   ============================================================
   `data` is the phone's snapshot, read-only to us. `actions` is the ONLY thing
   this page ever writes, and it only ever grows. */
var S = {
  token: "", tokenExp: 0, email: "", name: "", theme: "",
  data: null,
  actions: {
    schema: 1, updatedAtMillis: 0,
    verifiedTitles: [], publishedTitles: [], publishedNews: [], reportEditions: []
  },
  // Dashboard is the landing page: the glance strip answers "anything to look at?" before
  // the feed asks you to read anything.
  tab: "dashboard", loading: false
};

function save() {
  try {
    localStorage.setItem(K, JSON.stringify({
      token: S.token, tokenExp: S.tokenExp, email: S.email, name: S.name,
      theme: S.theme, actions: S.actions, tab: S.tab
    }));
  } catch (e) { /* private mode: still works, it just forgets on reload */ }
}
function load() {
  try {
    var o = JSON.parse(localStorage.getItem(K) || "{}");
    if (o.token && o.tokenExp > Date.now()) { S.token = o.token; S.tokenExp = o.tokenExp; }
    if (o.email) S.email = o.email;
    if (o.name) S.name = o.name;
    if (o.theme) S.theme = o.theme;
    if (o.actions) S.actions = Object.assign(S.actions, o.actions);
    if (o.tab) S.tab = o.tab;
  } catch (e) {}
}

/* ---------- derived views ---------- */
/* Verified on EITHER side counts as verified.
   The phone ships what it has verified in the data file; this page keeps its own verifications
   in the actions file, and the two are unioned for display. publishedSet has always done this;
   verifiedSet did not, so a story you verified on the phone read "Not verified" here. That was
   survivable when the state was a checkbox at the end of a row. With the state fixed in the
   corner of every card it is the first thing you see, and it was wrong.
   This is a READ of the phone's file. The one-writer rule is untouched: this page still only
   ever writes echo-web-actions.json. */
function verifiedSet() {
  var s = new Set(S.actions.verifiedTitles.map(key));
  arr(S.data && S.data.verifiedTitles).forEach(function (t) { s.add(key(t)); });
  return s;
}
/* Verified BY THE PHONE, which this page can read but must never rewrite. Undoing one here
   would only add it to the web's own list, leaving it verified twice and un-undoable, so the
   card shows it as settled rather than offering an action that cannot work. */
function verifiedOnPhone(title) {
  return arr(S.data && S.data.verifiedTitles).map(key).indexOf(key(title)) >= 0;
}
function publishedSet() {
  var s = new Set(S.actions.publishedTitles.map(key));
  arr(S.data && S.data.publishedTitles).forEach(function (t) { s.add(key(t)); });
  return s;
}
/* Alerts = what the phone shows, minus anything published on either side.
   Publishing HIDES a story from Alerts; it never deletes it. */
function alerts() {
  var pub = publishedSet();
  return arr(S.data && S.data.alerts).filter(function (a) { return !pub.has(key(a.title)); });
}
function published() {
  var seen = new Set(), out = [];
  arr(S.actions.publishedNews).concat(arr(S.data && S.data.publishedNews)).forEach(function (a) {
    var k = key(a && a.title);
    if (a && a.title && !seen.has(k)) { seen.add(k); out.push(a); }
  });
  return out;
}
function editions() {
  var seen = new Set(), out = [];
  arr(S.actions.reportEditions).concat(arr(S.data && S.data.reportEditions)).forEach(function (e) {
    if (e && !seen.has(e.id)) { seen.add(e.id); out.push(e); }
  });
  return out.sort(function (a, b) { return (b.createdAtMillis || 0) - (a.createdAtMillis || 0); });
}
/* Which feed the phone is set to.
   It lives in `settings`, NOT at the top level. renderTitle read S.data.newsSource, which the
   phone has never written, so the source pill silently hid itself on every real payload: the
   value was only ever `settings.newsSource`, which is why Settings showed "Hybrid" while the
   pill beside the title showed nothing. Reads settings first and keeps the top-level read as a
   fallback, so a payload that promotes the field later still works and no phone rebuild or
   fresh backup is needed to fix the backups already in Drive. */
function newsSourceOf(d) {
  d = d || S.data || {};
  return (d.settings && d.settings.newsSource) || d.newsSource || "";
}
function verifiedArticles() {
  var v = verifiedSet();
  return alerts().filter(function (a) { return v.has(key(a.title)); });
}

/* ============================================================
   THEME
   ============================================================
   Three states: "" follows the system, "light"/"dark" override it. The attribute
   on <html> is what the CSS blocks key on. */
function systemDark() { return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function isDark() { return S.theme ? S.theme === "dark" : systemDark(); }
function applyTheme() {
  var r = document.documentElement;
  if (S.theme) r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme");
  // Every theme button, not just the one in the shell — the gate has one too.
  var lbl = isDark() ? "Switch to light" : "Switch to dark";
  document.querySelectorAll(".themebtn").forEach(function (b) {
    b.innerHTML = isDark() ? ICON_SUN : ICON_MOON;
    b.title = lbl;
  });
}
function toggleTheme() { S.theme = isDark() ? "light" : "dark"; save(); applyTheme(); }

/* ============================================================
   GOOGLE SIGN-IN
   ============================================================
   We ask for a SCOPE, not an identity — "may I touch this one file?", not
   "who are you?". Google hands back a short-lived access token.

   prompt:"" is what makes it feel instant. It shows the consent screen the FIRST
   time and returns silently every time after, because Google remembers the grant.
   prompt:"consent" would re-ask forever, which reads as a login wall on every
   visit. Never use it here. */
var tokenClient = null;

function loadGIS() {
  return new Promise(function (res, rej) {
    if (window.google && google.accounts && google.accounts.oauth2) return res(true);
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = function () { res(true); };
    s.onerror = function () {
      rej(new Error("Could not reach Google sign-in. Check your connection, or an extension may be blocking it."));
    };
    document.head.appendChild(s);
  });
}

/* Google checks the page's ORIGIN against the list registered for this client. A page
   opened straight off disk (file://) has origin "null", so there is nothing to check
   and Google rejects it with a bare "Required parameter is missing: response_type".
   That error names the wrong cause, so catch the condition and say what to actually do. */
function originUsable() {
  return location.protocol === "https:" ||
    (location.protocol === "http:" && /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
}

function signIn() {
  if (!originUsable()) {
    return Promise.reject(new Error(
      "Google sign-in needs this page served over https (or from localhost). Opened as a file it has " +
      "no web address for Google to check, so sign-in is refused. Publish it and open it from there."));
  }
  return loadGIS().then(function () {
    return new Promise(function (res, rej) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        hint: S.email || undefined,
        callback: function (r) {
          if (r && r.access_token) {
            S.token = r.access_token;
            S.tokenExp = Date.now() + ((r.expires_in || 3600) * 1000);
            save(); res(S.token);
          } else rej(new Error("Google did not return access."));
        },
        error_callback: function (e) {
          var t = (e && e.type) || "";
          if (t === "popup_closed") return rej(new Error("Sign-in was closed before it finished."));
          if (t === "popup_failed_to_open") return rej(new Error("The sign-in window was blocked. Allow pop-ups for this site and try again."));
          rej(new Error("Google refused the sign-in."));
        }
      });
      tokenClient.requestAccessToken({ prompt: "" });
    });
  });
}

/* Sign out is LOCAL ONLY — we forget the token, we do not revoke it. Revoking would
   delete the grant, so the next sign-in would show the consent screen again. Nothing
   in the user's Drive is touched. */
function signOut() {
  S.token = ""; S.tokenExp = 0; S.data = null;
  save();
  $("#shell").hidden = true;
  document.body.classList.remove("in");
  $("#gate").style.display = "";
  setGateStatus("Signed out here. Nothing was deleted from Drive.");
}
function tokenAlive() { return S.token && S.tokenExp > Date.now() + 30000; }
function ensureToken() { return tokenAlive() ? Promise.resolve(S.token) : signIn(); }

/* ============================================================
   DRIVE
   ============================================================ */
var FILES  = "https://www.googleapis.com/drive/v3/files";
var UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";

async function dFetch(url, opts) {
  var t = await ensureToken();
  var o = Object.assign({}, opts || {});
  o.headers = Object.assign({}, o.headers || {}, { Authorization: "Bearer " + t });
  var r = await fetch(url, o);
  if (r.status === 401) {          // token died mid-flight — renew once, silently
    S.token = ""; S.tokenExp = 0;
    o.headers.Authorization = "Bearer " + (await ensureToken());
    r = await fetch(url, o);
  }
  return r;
}
async function findFile(name) {
  var q = encodeURIComponent("name = '" + name + "' and trashed = false");
  var r = await dFetch(FILES + "?q=" + q + "&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10");
  if (!r.ok) throw new Error("Drive list failed (" + r.status + ").");
  var j = await r.json();
  return (j.files && j.files[0]) || null;
}
/* Falls back to the pre-rename filename.

   The product was called "Elemental" until 2026-08-27. The PHONE renames its Drive file to the
   echo-* name on its next backup, not the moment this page updates — so for the window between
   this page going live and that push happening, the only file in Drive still carries the old name.
   Without the fallback the page would find nothing and correctly report an empty backup, while the
   real data sat beside it under a name nobody was asking for.

   Read-only: this never RENAMES anything. The phone owns that file and does the rename itself, so
   two writers can never race over it. Once the phone has pushed once, the fallback stops matching
   and can be deleted. */
var LEGACY_NAME = { "echo-data.json": "elemental-data.json",
                    "echo-web-actions.json": "elemental-web-actions.json" };

async function readJson(name) {
  var f = await findFile(name);
  if (!f && LEGACY_NAME[name]) f = await findFile(LEGACY_NAME[name]);
  if (!f) return null;
  var r = await dFetch(FILES + "/" + f.id + "?alt=media");
  if (!r.ok) throw new Error("Could not read " + name + " (" + r.status + ").");
  return r.json();
}
/* Create-then-write, deliberately not multipart: simpler, and the same shape the
   phone uses, so both sides behave identically. */
async function writeJson(name, obj) {
  var f = await findFile(name);
  /* Adopt the pre-rename file rather than creating a second one beside it.

     This page OWNS the actions file, so renaming it here is safe — there is no other writer to
     race with. Skipping this would be the one way the rename could actually lose data: writeJson
     would create an empty echo-web-actions.json, the phone's migration would then see the new name
     already present and leave the old file alone, and everything the user had verified on the web
     would be stranded in a file neither side reads. */
  if (!f && LEGACY_NAME[name]) {
    var old = await findFile(LEGACY_NAME[name]);
    if (old) {
      var mv = await dFetch(FILES + "/" + old.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({ name: name })
      });
      if (mv.ok) f = old;
    }
  }
  if (!f) {
    var c = await dFetch(FILES + "?fields=id", {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ name: name })
    });
    if (!c.ok) throw new Error("Could not create " + name + " (" + c.status + ").");
    f = await c.json();
  }
  var r = await dFetch(UPLOAD + "/" + f.id + "?uploadType=media&fields=id", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj)
  });
  if (!r.ok) throw new Error("Could not save " + name + " (" + r.status + ").");
  return true;
}
/* Who is signed in, from the same drive.file permission — no extra scope asked.
   about?fields=user already carries displayName next to emailAddress, so greeting somebody by
   the name they chose for themselves costs nothing: no profile scope, no second consent screen,
   and nothing new in the README's one-permission promise. */
async function accountIdentity() {
  try {
    var r = await dFetch(
      "https://www.googleapis.com/drive/v3/about?fields=user(displayName,emailAddress)");
    if (!r.ok) return null;
    var j = await r.json();
    if (!j.user) return null;
    return { name: j.user.displayName || "", email: j.user.emailAddress || "" };
  } catch (e) { return null; }
}

var pushTimer = null;
/* Debounced: ticking several checkboxes should not mean several uploads. */
function pushActions(immediate) {
  clearTimeout(pushTimer);
  return new Promise(function (res, rej) {
    pushTimer = setTimeout(async function () {
      try {
        S.actions.updatedAtMillis = Date.now();
        await writeJson(ACTIONS_FILE, S.actions);
        res(true);
      } catch (e) { rej(e); }
    }, immediate ? 0 : 1200);
  });
}

/* ============================================================
   ASK — replaces confirm() and prompt()
   ============================================================
   The native ones print the origin across the top, so a prompt here read
   "attano26.github.io says". A page cannot change that line and should not be able
   to: a site dressing its dialog as the browser's own is the attack the rule
   prevents. The only way to control the wording is not to use them. */
function askShell(build) {
  return new Promise(function (resolve) {
    var a = $("#ask");
    a.hidden = false; a.innerHTML = "";
    var box = el("div", "askbox");
    a.appendChild(box);
    var done = function (v) {
      a.hidden = true; a.innerHTML = "";
      document.removeEventListener("keydown", a._key); a._key = null;
      resolve(v);
    };
    build(box, done);
    a.onclick = function (e) { if (e.target === a) done(null); };
    a._key = function (e) { if (e.key === "Escape") { e.preventDefault(); done(null); } };
    document.addEventListener("keydown", a._key);
  });
}
function askConfirm(opts) {
  return askShell(function (box, done) {
    box.appendChild(el("h2", "askttl", opts.title));
    if (opts.body) box.appendChild(el("p", "askbody", opts.body));
    var row = el("div", "askrow");
    var no = el("button", "btn sm ghost", opts.cancel || "Cancel");
    no.onclick = function () { done(false); };
    var yes = el("button", "btn sm", opts.ok || "Continue");

/* Above 1000px the rail is permanent, so open/close are no-ops there. Guarding here rather than
   at each call site means a stray tap can never leave an invisible scrim over a desktop layout. */
function railIsPermanent() { return window.matchMedia("(min-width:1000px)").matches; }
function openDrawer() {
  if (railIsPermanent()) return;
  $("#scrim").hidden = false;
  // Next frame, so the browser has a non-hidden starting state to transition FROM.
  requestAnimationFrame(function () {
    $("#scrim").classList.add("on");
    $("#drawer").classList.add("on");
  });
  $("#btnMenu").setAttribute("aria-expanded", "true");
  $("#btnClose").focus();
}
function closeDrawer() {
  if (railIsPermanent()) return;
  $("#scrim").classList.remove("on");
  $("#drawer").classList.remove("on");
  $("#btnMenu").setAttribute("aria-expanded", "false");
  // Hide only after the fade, or the scrim would vanish instantly and the drawer
  // would appear to slide out over nothing.
  setTimeout(function () { if (!$("#drawer").classList.contains("on")) $("#scrim").hidden = true; }, 240);
}
function drawerOpen() { return $("#drawer").classList.contains("on"); }

/* Describe the RECURRENCE, not a single next firing — "9:00 AM on weekdays" tells you what
   the rule is, where a lone timestamp reads as broken once it has passed. Mirrors the phone. */
function alertScheduleText(g) {
  var s = S.data && S.data.alertSchedule;
  if (!s || !s.enabled) return g.alertInterval || "Off";
  var h = s.hour == null ? 9 : s.hour, m = s.minute == null ? 0 : s.minute;
  var ampm = h < 12 ? "AM" : "PM";
  var h12 = (h % 12) === 0 ? 12 : (h % 12);
  var time = h12 + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
  // Calendar.DAY_OF_WEEK: 1 = Sunday … 7 = Saturday.
  var names = ["", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var days = arr(s.days).slice().sort(function (a, b) { return a - b; });
  var when;
  if (days.length === 7) when = "every day";
  else if (days.length === 5 && days.join() === "2,3,4,5,6") when = "Mon–Fri";
  else if (days.length === 2 && days.join() === "1,7") when = "weekends";
  else if (!days.length) when = "no days set";
  else when = days.map(function (d) { return names[d] || d; }).join(", ");
  return time + " · " + when;
}

/* ---- what is actually in the backup ----
   The phone measures the bytes it is about to upload; this measures the bytes it received,
   which is the same file read from the other end. The two can differ by a handful of bytes
   from JSON formatting, so this is honest about being a measurement of THIS file rather than
   a second guess at the phone's. Sections are the phone's, in the phone's order. */
var CH_ENC = window.TextEncoder ? new TextEncoder() : null;
function jsonBytes(v) {
  if (v == null) return 0;
  var t = typeof v === "string" ? v : JSON.stringify(v);
  return CH_ENC ? CH_ENC.encode(t).length : t.length;
}
function fmtBytes(b) {
  return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB"
       : b >= 1024 ? Math.round(b / 1024) + " KB"
       : b + " B";
}
function storageSlices() {
  var d = S.data || {};
  var seen = String(d.seenStoryTitles || "");
  /* One line per story ever seen, so the line count IS the item count. */
  var ledger = seen.split("\n").filter(function (l) { return l.trim(); }).length;
  return [
    ["News", arr(d.newsArticles).length, jsonBytes(arr(d.newsArticles))],
    ["Saved", arr(d.savedNews).length, jsonBytes(arr(d.savedNews))],
    ["Published", published().length, jsonBytes(arr(d.publishedNews))],
    ["Reports", editions().length, jsonBytes(arr(d.reportEditions))],
    ["Competitors", arr(d.competitors).length,
      jsonBytes(arr(d.competitors)) + jsonBytes(arr(d.competitorProducts))],
    ["Countries and norms", arr(d.countries).length + arr(d.normCodes).length,
      jsonBytes(arr(d.countries)) + jsonBytes(arr(d.normCodes))],
    ["News ledger", ledger,
      jsonBytes(seen) + jsonBytes(String(d.seenStoryDates || "")) +
      jsonBytes(String(d.deletedStoryRecords || ""))],
    ["Metrics", 3, jsonBytes(d.analytics || {}) + jsonBytes(d.widgets || {})],
    ["Metal prices", arr(d.nalcoPrices).length, jsonBytes(arr(d.nalcoPrices))]
  ].filter(function (r) { return r[2] > 2; });   // an empty table is "[]" and earns no segment
}

    }

          { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" })

  /* No pmAdvisory here. Matching on text the card does not show produces a result you
     cannot explain by looking at it. */
  return [a.title, a.summary, a.source, a.category]
    .filter(Boolean).join(" ").toLowerCase();
}

/* The wall: search, filters, then the cards that survive both. */
function newsWall(app, list, opts) {
  opts = opts || {};
  var st = wallState();
  var d = S.data || {};

  /* Filter vocabularies come from what is actually in this list, not from the whole database.
     A chip that filters to nothing is a dead control, and offering ten of them is worse than
     offering the four that can do something. */
  var chanSet = {}, compSet = {}, landSet = {};
  var compNames = arr(d.competitors).map(function (c) { return c && c.name; }).filter(Boolean);
  var landNames = arr(d.countries).map(function (c) { return c && c.name; }).filter(Boolean);
  list.forEach(function (a) {
    if (a.category) chanSet[a.category] = 1;
    var hay = articleHaystack(a);
    compNames.forEach(function (n) { if (hay.indexOf(n.toLowerCase()) >= 0) compSet[n] = 1; });
    landNames.forEach(function (n) { if (hay.indexOf(n.toLowerCase()) >= 0) landSet[n] = 1; });
  });
  var chans = Object.keys(chanSet).sort();
  var comps = Object.keys(compSet).sort();
  var lands = Object.keys(landSet).sort();

  var q = st.q.trim().toLowerCase();
  var byChips = list.filter(function (a) {
    var hay = articleHaystack(a);
    if (st.chan.length && st.chan.indexOf(a.category) < 0) return false;
    if (st.comp.length && !st.comp.some(function (n) { return hay.indexOf(n.toLowerCase()) >= 0; })) return false;
    if (st.land.length && !st.land.some(function (n) { return hay.indexOf(n.toLowerCase()) >= 0; })) return false;
    return true;
  });
  var shown = q
    ? byChips.filter(function (a) { return articleHaystack(a).indexOf(q) >= 0; })
    : byChips;

  var active = st.comp.length + st.land.length + st.chan.length;

  var box = el("div", "nsearch");

  var field = el("div", "nfield");
  var mag = el("span");
  mag.innerHTML = ICON_SEARCH;
  field.appendChild(mag.firstChild);

  var input = el("input");
  input.type = "search";
  input.value = st.q;
  input.placeholder = opts.placeholder || "Search these stories";
  input.setAttribute("aria-label", "Search stories");
  /* Filter as you type, without re-rendering the whole page on every keystroke: only the wall
     is rebuilt, and the field keeps focus and caret because it is never replaced. */
  input.oninput = function () { st.q = input.value; repaintWall(); };
  field.appendChild(input);

  if (st.q) {
    var clear = el("button", "nfbtn");
    clear.innerHTML = ICON_X;
    clear.title = "Clear search";
    clear.setAttribute("aria-label", "Clear search");
    clear.onclick = function () { st.q = ""; render(); };
    field.appendChild(clear);
  }

  var fbtn = el("button", "nfbtn" + (st.open ? " on" : ""));
  fbtn.innerHTML = ICON_SLIDERS;
  fbtn.title = st.open ? "Hide filters" : "Show filters";
  fbtn.setAttribute("aria-expanded", st.open ? "true" : "false");
  if (active) fbtn.appendChild(el("span", "badge", String(active)));
  fbtn.onclick = function () { st.open = !st.open; render(); };
  field.appendChild(fbtn);
  box.appendChild(field);

  if (st.open) {
    var panel = el("div", "nfilters");
    [["By channel", chans, st.chan],
     ["By competitor", comps, st.comp],
     ["By market", lands, st.land]
    ].forEach(function (grp) {
      if (!grp[1].length) return;
      var g = el("div", "nfgroup");
      g.appendChild(el("h4", null, grp[0]));
      var chips = el("div", "nchips");
      var all = el("button", "nchip" + (grp[2].length ? "" : " on"), "All");
      all.onclick = function () { grp[2].length = 0; render(); };
      chips.appendChild(all);
      grp[1].forEach(function (name) {
        var c = el("button", "nchip" + (grp[2].indexOf(name) >= 0 ? " on" : ""), name);
        c.onclick = function () { toggleIn(grp[2], name); render(); };
        chips.appendChild(c);
      });
      g.appendChild(chips);
      panel.appendChild(g);
    });
    if (panel.children.length) box.appendChild(panel);
  }

  if (q || active) {
    box.appendChild(el("div", "ncount",
      shown.length + " of " + list.length + (list.length === 1 ? " story" : " stories")));
  }
  app.appendChild(box);

  var wall = el("div", "wall");
  wall.id = "wall";
  /* Everything the CHIPS allow, before the query narrows it. repaintWall re-filters this by
     query alone, which is why typing can never resurrect a card a chip has excluded. */
  wall._pool = byChips;
  wall._opts = opts;
  app.appendChild(wall);
  fillWall(wall, shown, opts);
  if (!shown.length) app.appendChild(wallEmpty(q || active, opts));
}

function wallEmpty(filtering, opts) {
  return emptyState(filtering
    ? "Nothing matches that. Try a shorter search, or clear a filter."
    : (opts.empty || "Nothing here yet."));
}
function fillWall(wall, items, opts) {
  wall.innerHTML = "";
  items.forEach(function (a) { wall.appendChild(articleCard(a, opts)); });
}

/* Rebuild only the cards and the count, so typing never costs the field its focus or caret.
   Re-filters from the pooled data with the same predicate the full render uses. */
function repaintWall() {
  var wall = document.getElementById("wall");
  if (!wall || !wall._pool) { render(); return; }
  var st = wallState();
  var q = st.q.trim().toLowerCase();
  var shown = q
    ? wall._pool.filter(function (a) { return articleHaystack(a).indexOf(q) >= 0; })
    : wall._pool.slice();
  fillWall(wall, shown, wall._opts);
  var count = document.querySelector(".ncount");
  if (count) {
    count.textContent = shown.length + " of " + wall._pool.length +
      (wall._pool.length === 1 ? " story" : " stories");
  }
}

function emptyState(msg) { return el("div", "empty", msg); }
function kv(k, v) {
  var r = el("div", "kv");
  r.appendChild(el("span", "k", k));
  r.appendChild(el("span", "v", v));
  return r;
}
function linkRow(href, text) {
  var acts = el("div", "acts");
  var a = el("a", "link", text);
  a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
  acts.appendChild(a);
  return acts;
}

/* ============================================================
   ANALYTICS — the phone's Settings → Analytics, card for card
   ------------------------------------------------------------
   Every figure comes from `data.analytics`, which is computeAnalytics() serialised on the phone
   for all three windows. The phone calculates; this file draws. Re-deriving share-of-voice or the
   conversion cross-tab in JavaScript would be a second implementation of the same maths, and two
   implementations drift until the phone and the web disagree in front of someone who trusts both.

   Card order, titles, subtitles and colours follow AnalyticsPane.kt.
   ============================================================ */

/* The phone's analytics palette, verbatim. AnodizedGreen is an old name for the one accent
   (Signal Blue), so palette[0] is blue on both screens. `AN_SEGMENTS` is the ten-colour set the
   channel stack needs; `AN_GREY` is what "Other" and "Market-wide" get — they are not a rival. */
var AN_PALETTE = ["#1F57F5", "#06B6D4", "#F59E0B", "#EF4444", "#8B5CF6", "#10B981"];
var AN_SEGMENTS = ["#1F57F5", "#06B6D4", "#F59E0B", "#EF4444", "#8B5CF6",
                   "#10B981", "#EC4899", "#3B82F6", "#84CC16", "#F97316"];
var AN_GREY = "#9A9CAB";
/* The heatmap's own five-step ramp lives in the theme tokens (--heat-0..4), not here, so a
   theme switch recolours it without re-rendering the card. */
var AN_HEAT = ["var(--heat-0)", "var(--heat-1)", "var(--heat-2)", "var(--heat-3)", "var(--heat-4)"];
var AN_WIN = "1M";

/* Window-aware copy, so every subtitle tracks the active filter exactly as on the phone. */
function anPhrase(w) { return w === "1M" ? "last month" : (w === "3M" ? "last 3 months" : "last 6 months"); }
function anUnit(w) { return w === "1M" ? "Weekly" : "Monthly"; }
function anPeriod(w) { return w === "1M" ? "week" : "month"; }
function anDelta(w) { return w === "1M" ? "week-over-week" : "month-over-month"; }
/* The phone trims a competitor to what fits: drop the bracketed parent, drop anything after a
   comma, cap at 14 characters. Same rule here so the same rival reads the same on both. */
function shortName(n) {
  return String(n || "").split("(")[0].split(",")[0].trim().slice(0, 14);
}
function shortLabel(c) { return String(c || "").replace(/&/g, "").trim().slice(0, 4); }
function anCard(title, sub) {
  var c = el("div", "ancard");
  c.appendChild(el("div", "anttl", title));
  if (sub) c.appendChild(el("div", "ansub", sub));
  var b = el("div", "anbody");
  c.appendChild(b);
  c.body = b;
  return c;
}
function svgNode(name, attrs) {
  var e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
  return e;
}
function anNote(host, text) { host.appendChild(el("div", "anempty", text)); }

/* One bar row: name, proportional track, trailing value. The phone's BarRow. */
function anBar(host, name, trailing, pct, colour) {
  var row = el("div", "barrow");
  row.appendChild(el("div", "bn", name));
  var track = el("div", "bartrack");
  var fill = el("div", "barfill");
  fill.style.width = Math.max(2, pct) + "%";
  if (colour) fill.style.background = colour;
  track.appendChild(fill);
  row.appendChild(track);
  row.appendChild(el("div", "bv", trailing));
  host.appendChild(row);
}

/* The phone's ColorKey: a two-column legend of dot + label. */
function anKey(host, entries) {
  var k = el("div", "ankey");
  entries.forEach(function (e) {
    var it = el("div", "keyi");
    var d = el("span", "lgd");
    d.style.background = e[1];
    it.appendChild(d);
    it.appendChild(el("span", "keyn", e[0]));
    if (e[2]) it.appendChild(el("span", "keyv", e[2]));
    k.appendChild(it);
  });
  host.appendChild(k);
}

/* A monotone-ish curve through the points, so a sparkline reads as a trend rather than a
   zig-zag. The phone draws these smoothed; straight segments looked visibly different. */
function sparkPath(vals, w, h, pad) {
  var n = vals.length;
  if (n < 2) return "";
  var mx = Math.max.apply(null, vals) || 1;
  var pts = vals.map(function (v, i) {
    return [(i / (n - 1)) * w, h - pad - (v / mx) * (h - pad * 2)];
  });
  var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (var i = 0; i < n - 1; i++) {
    var p0 = pts[i], p1 = pts[i + 1], cx = (p0[0] + p1[0]) / 2;
    d += " C" + cx.toFixed(1) + " " + p0[1].toFixed(1) +
         " " + cx.toFixed(1) + " " + p1[1].toFixed(1) +
         " " + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
  }
  return { d: d, end: pts[n - 1] };
}

/* Each sparkline needs its own gradient, and an SVG gradient is addressed by id, so they have
   to be unique across the page. A counter is enough and never collides. */
var SPARK_SEQ = 0;

/* Name · sparkline · signed delta. Shared by Momentum and the rising/cooling lists.
   The line carries the shape; the wash under it carries the weight, which is what stops a
   one-pixel stroke reading as a stray mark on a large card. It fades out before the axis so it
   reads as shading rather than as a second, filled chart. */
function anTrendRow(host, name, vals, delta, colour) {
  var row = el("div", "momrow");
  row.appendChild(el("div", "momn", name));
  var svg = svgNode("svg", { "class": "momspark", viewBox: "0 0 100 28", preserveAspectRatio: "none" });
  var p = sparkPath(arr(vals), 100, 28, 4);
  if (p) {
    var gid = "spk" + (++SPARK_SEQ);
    var defs = svgNode("defs");
    var grad = svgNode("linearGradient", { id: gid, x1: "0", y1: "0", x2: "0", y2: "1" });
    var s0 = svgNode("stop", { offset: "0", "stop-opacity": "0.30" });
    var s1 = svgNode("stop", { offset: "1", "stop-opacity": "0" });
    s0.style.stopColor = colour; s1.style.stopColor = colour;
    grad.appendChild(s0); grad.appendChild(s1);
    defs.appendChild(grad);
    svg.appendChild(defs);

    // Same curve, closed down to the axis and back.
    var area = svgNode("path", { d: p.d + " L100 28 L0 28 Z", "class": "sparkfill" });
    area.style.fill = "url(#" + gid + ")";
    svg.appendChild(area);

    var path = svgNode("path", { d: p.d, "vector-effect": "non-scaling-stroke" });
    path.style.stroke = colour;
    svg.appendChild(path);

    // A zero-length stroke with a round cap: a disc of exactly stroke-width across, in screen
    // pixels, so it stays round however far the curve is stretched.
    var ex = p.end[0].toFixed(2), ey = p.end[1].toFixed(2);
    var dot = svgNode("path", { d: "M" + ex + " " + ey + "L" + ex + " " + ey,
                                "class": "sparkdot", "vector-effect": "non-scaling-stroke" });
    dot.style.stroke = colour;
    svg.appendChild(dot);
  }
  row.appendChild(svg);
  var d = delta || 0;
  var lab = el("div", "momd", d > 0 ? "▲ +" + d : (d < 0 ? "▼ " + d : "—"));
  lab.style.color = d > 0 ? "#10B981" : (d < 0 ? "#EF4444" : "var(--ink-3)");
  row.appendChild(lab);
  host.appendChild(row);
}

/* ---- API cost. The phone's top card: Today / This month / Daily cap. ---- */
function anCost(host, st) {
  var cols = [
    ["Today", "≈ ₹" + (Number(st.spendToday) || 0).toFixed(2),
     (st.searchesToday || 0) + " searches · " + (st.callsToday || 0) +
       (st.callsToday === 1 ? " call" : " calls"),
     (Number(st.tokensToday) || 0).toLocaleString("en-IN") + " tokens", null],
    ["This month", "≈ ₹" + (Number(st.spendMonth) || 0).toFixed(2),
     (st.searchesMonth || 0) + " searches",
     (Number(st.tokensMonth) || 0).toLocaleString("en-IN") + " tokens", null],
    ["Daily cap", "₹" + Math.round(Number(st.dailyCostCap) || 0), "in-app stop", "", "var(--accent)"]
  ];
  var row = el("div", "costrow");
  cols.forEach(function (c) {
    var col = el("div", "costcol");
    col.appendChild(el("div", "costk", c[0]));
    var v = el("div", "costv", c[1]);
    if (c[4]) v.style.color = c[4];
    col.appendChild(v);
    if (c[2]) col.appendChild(el("div", "costc", c[2]));
    if (c[3]) col.appendChild(el("div", "costc", c[3]));
    row.appendChild(col);
  });
  host.appendChild(row);
  host.appendChild(el("div", "anfoot",
    "Estimate only. It assumes every search is billed, so the real bill is usually a little lower."));
}

/* ---- News volume: one narrow column per week, channels as separated blocks. ---- */
function anVolume(host, a) {
  var weeks = arr(a.weekLabels), rows = arr(a.volPerWeek), cats = arr(a.volCategories);
  if (!weeks.length) { anNote(host, "No news in this window."); return; }
  var max = 1;
  rows.forEach(function (r) {
    max = Math.max(max, arr(r).reduce(function (x, y) { return x + y; }, 0));
  });
  var chart = el("div", "stack");
  weeks.forEach(function (wk, wi) {
    var col = el("div", "stackcol");
    var bar = el("div", "stackbar");
    var vals = arr(rows[wi]);
    var total = vals.reduce(function (x, y) { return x + y; }, 0);
    bar.style.height = Math.max(2, (total / max) * 100) + "%";
    vals.forEach(function (v, ci) {
      if (!v) return;
      var seg = el("div", "stackseg");
      seg.style.flexGrow = String(v);
      seg.style.background = AN_SEGMENTS[ci % AN_SEGMENTS.length];
      seg.title = (cats[ci] || "") + ": " + v;
      bar.appendChild(seg);
    });
    col.appendChild(bar);
    col.appendChild(el("div", "stackx", wk));
    chart.appendChild(col);
  });
  host.appendChild(chart);
  anKey(host, cats.map(function (c, ci) {
    return [c, AN_SEGMENTS[ci % AN_SEGMENTS.length]];
  }));
}

/* ---- News overview: three headline figures, then what you did with what arrived. ---- */
function anOverview(host, cv, inFeed) {
  var surfaced = cv.surfaced || 0;
  var pubPct = surfaced ? Math.round(((cv.published || 0) / surfaced) * 100) : 0;
  var head = el("div", "trio");
  [[String(surfaced), "news fetched", null],
   [String(inFeed), "in feed", null],
   [pubPct + "%", "published", "var(--accent)"]].forEach(function (c) {
    var col = el("div", "triocol");
    var v = el("div", "triov", c[0]);
    if (c[2]) v.style.color = c[2];
    col.appendChild(v);
    col.appendChild(el("div", "triok", c[1]));
    head.appendChild(col);
  });
  host.appendChild(head);
  if (!surfaced) { anNote(host, "No news in this window."); return; }
  [["Liked", cv.liked, "#10B981"], ["Disliked", cv.disliked, "#EF4444"],
   ["Saved", cv.saved, "#F59E0B"], ["Verified", cv.verified, "#06B6D4"],
   ["Published", cv.published, "#1F57F5"]].forEach(function (r) {
    var n = r[1] || 0, pct = Math.round((n / surfaced) * 100);
    anBar(host, r[0], n + " · " + pct + "%", pct, r[2]);
  });
}

/* ---- Conversion flow: the phone's Sankey.

   Three node columns joined by ribbons whose thickness is the count. Every column sums to the
   same total, so all three fill the same height and the wall of ribbons between them is the
   story: how the stories that arrived ended up where they ended up.

   THE BUG THIS REPLACES: each node kept ONE cursor for stacking ribbons. That is fine for the
   outer columns, which only send or only receive, but the middle column does both. Its
   incoming ribbons filled the cursor to the bottom of the node, so its outgoing ribbons then
   started BELOW the node and sprayed off into the gap. Hence: in and out cursors, separately.

   Ribbons are also placed in the order the nodes are stacked at BOTH ends, which is what keeps
   them roughly parallel instead of crossing over each other. ---- */
function anFlow(host, s) {
  if (!s || !s.received) { anNote(host, "No news in this window."); return; }
  var W = 640, H = 220, NODE = 13, PAD = 3, total = s.received || 1;

  var A = [["In feed", s.inFeed || 0, "#1F57F5"], ["Not in feed", s.notInFeed || 0, AN_GREY]];
  var B = [["Saved", s.saved || 0, "#F59E0B"], ["Not saved", s.notSaved || 0, "#3B82F6"]];
  var out = arr(s.outcomeTotals);
  var C = [["Published", out[0] || 0, "#10B981"], ["Verified", out[1] || 0, "#06B6D4"],
           ["Deleted", out[2] || 0, "#EF4444"], ["Still open", out[3] || 0, AN_GREY]];

  /* Height available once the gaps between a column's nodes are taken out. Working it out per
     column keeps all three the same total height even though they hold different node counts. */
  function stack(list, x) {
    var live = list.filter(function (n) { return n[1] > 0; });
    var usable = H - PAD * Math.max(0, live.length - 1);
    var y = 0, nodes = [];
    list.forEach(function (n) {
      if (!n[1]) { nodes.push(null); return; }
      var h = (n[1] / total) * usable;
      nodes.push({ name: n[0], v: n[1], c: n[2], x: x, y: y, h: h, inCur: y, outCur: y });
      y += h + PAD;
    });
    return nodes;
  }
  var col1 = stack(A, 0), col2 = stack(B, (W - NODE) / 2), col3 = stack(C, W - NODE);

  var svg = svgNode("svg", { "class": "sankey", viewBox: "0 0 " + W + " " + H,
                             preserveAspectRatio: "none" });

  function ribbon(from, to, v, colour) {
    if (!from || !to || !v) return;
    var live = from.h * (v / from.v);            // share of the source node this flow is
    var hIn = to.h * (v / to.v);                 // share of the target node it becomes
    var y0 = from.outCur, y1 = to.inCur;
    from.outCur += live; to.inCur += hIn;
    var x0 = from.x + NODE, x1 = to.x, m = (x0 + x1) / 2;
    var d = "M" + x0 + " " + y0 +
            " C" + m + " " + y0 + " " + m + " " + y1 + " " + x1 + " " + y1 +
            " L" + x1 + " " + (y1 + hIn) +
            " C" + m + " " + (y1 + hIn) + " " + m + " " + (y0 + live) + " " + x0 + " " + (y0 + live) + " Z";
    var p = svgNode("path", { d: d, "class": "skrib" });
    p.style.fill = colour;
    var t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = from.name + " to " + to.name + ": " + v;
    p.appendChild(t);
    svg.appendChild(p);
  }

  /* Source-major order at both ends: for each source node in stacking order, send to each
     target in stacking order. That is what keeps the ribbons from tangling. */
  var ab = arr(s.aToB);
  ribbon(col1[0], col2[0], ab[0] || 0, col1[0] && col1[0].c);
  ribbon(col1[0], col2[1], ab[1] || 0, col1[0] && col1[0].c);
  ribbon(col1[1], col2[0], ab[2] || 0, col1[1] && col1[1].c);
  ribbon(col1[1], col2[1], ab[3] || 0, col1[1] && col1[1].c);

  var savedTo = arr(s.savedTo), notSavedTo = arr(s.notSavedTo);
  var k;
  for (k = 0; k < 4; k++) ribbon(col2[0], col3[k], savedTo[k] || 0, col3[k] && col3[k].c);
  for (k = 0; k < 4; k++) ribbon(col2[1], col3[k], notSavedTo[k] || 0, col3[k] && col3[k].c);

  /* Nodes last, so they sit over the ribbons rather than under them. */
  [col1, col2, col3].forEach(function (col) {
    col.forEach(function (n) {
      if (!n) return;
      var r = svgNode("rect", { x: n.x, y: n.y, width: NODE, height: Math.max(2, n.h), rx: 3 });
      r.style.fill = n.c;
      var t = document.createElementNS("http://www.w3.org/2000/svg", "title");
      t.textContent = n.name + ": " + n.v;
      r.appendChild(t);
      svg.appendChild(r);
    });
  });
  host.appendChild(svg);

  /* Labels live in HTML under the chart, not inside the bars. Bars this thin cannot hold text,
     and text scaled by preserveAspectRatio="none" comes out stretched. */
  var legend = el("div", "sklegend");
  [A, B, C].forEach(function (colDef, ci) {
    var group = el("div", "skgroup");
    group.appendChild(el("div", "rck", ["Received", "Kept", "Outcome"][ci]));
    colDef.forEach(function (n) {
      if (!n[1]) return;
      var row = el("div", "skrow");
      var d = el("span", "lgd");
      d.style.background = n[2];
      row.appendChild(d);
      row.appendChild(el("span", "skn", n[0]));
      row.appendChild(el("span", "skv", String(n[1])));
      group.appendChild(row);
    });
    legend.appendChild(group);
  });
  host.appendChild(legend);
}

/* Squarified treemap.

   Area is the reading here, and a rectangle's area is far easier to compare than an arc's
   sweep, which is the known weakness of a pie. "Squarified" means the algorithm keeps adding
   to the current row while doing so improves the worst aspect ratio in it, so cells come out
   near-square instead of as slivers you cannot label.

   Shneiderman and Wattenberg's method, as published. Sorted descending on the way in. */
function squarify(values, x, y, w, h) {
  var total = values.reduce(function (a, b) { return a + b; }, 0) || 1;
  var scaled = values.map(function (v) { return (v * w * h) / total; });
  var out = [], i = 0;

  function worst(row, len) {
    var sum = row.reduce(function (a, b) { return a + b; }, 0);
    if (!sum || !len) return Infinity;
    var mx = Math.max.apply(null, row), mn = Math.min.apply(null, row);
    return Math.max((len * len * mx) / (sum * sum), (sum * sum) / (len * len * mn));
  }

  while (i < scaled.length) {
    var len = Math.min(w, h);
    var row = [scaled[i]], next = i + 1;
    while (next < scaled.length &&
           worst(row.concat([scaled[next]]), len) <= worst(row, len)) {
      row.push(scaled[next]); next++;
    }
    var sum = row.reduce(function (a, b) { return a + b; }, 0);
    if (w >= h) {
      var cw = sum / h, cy = y;
      row.forEach(function (v, k) {
        var ch = v / cw;
        out[i + k] = { x: x, y: cy, w: cw, h: ch };
        cy += ch;
      });
      x += cw; w -= cw;
    } else {
      var ch2 = sum / w, cx = x;
      row.forEach(function (v, k) {
        var cw2 = v / ch2;
        out[i + k] = { x: cx, y: y, w: cw2, h: ch2 };
        cx += cw2;
      });
      y += ch2; h -= ch2;
    }
    i = next;
  }
  return out;
}

/* ---- Share of voice, as a treemap. Each rival is an area, so the comparison is direct. ---- */
function anSov(host, sov) {
  if (!sov.length) { anNote(host, "No competitor-matched news yet."); return; }
  var top = sov.slice(0, 10);
  var total = sov.reduce(function (t, r) { return t + r.c; }, 0) || 1;
  var rects = squarify(top.map(function (r) { return r.c; }), 0, 0, 100, 100);

  var map = el("div", "tmap");
  top.forEach(function (r, i) {
    var rc = rects[i];
    if (!rc) return;
    var pct = Math.round((r.c / total) * 100);
    var cell = el("div", "tcell");
    cell.style.left = rc.x + "%";
    cell.style.top = rc.y + "%";
    cell.style.width = rc.w + "%";
    cell.style.height = rc.h + "%";
    cell.style.background = AN_PALETTE[i % AN_PALETTE.length];
    cell.title = r.n + ": " + r.c + " (" + pct + "%)";
    /* Only label a cell big enough to hold the label. A clipped name is worse than the tooltip
       the cell already carries. */
    if (rc.w > 17 && rc.h > 16) {
      cell.appendChild(el("span", "tn", shortName(r.n)));
      cell.appendChild(el("span", "tv", pct + "%"));
    }
    map.appendChild(cell);
  });
  host.appendChild(map);
  anKey(host, top.map(function (r, i) {
    return [shortName(r.n), AN_PALETTE[i % AN_PALETTE.length],
            Math.round((r.c / total) * 100) + "%"];
  }));
}

/* ---- Momentum: a sparkline per competitor, coloured by share-of-voice rank. ---- */
function anMomentum(host, list, colourFor) {
  if (!list.length) { anNote(host, "Not enough competitor-matched news yet."); return; }
  list.slice(0, 6).forEach(function (m) {
    anTrendRow(host, shortName(m.n), m.w, m.d, colourFor(m.n));
  });
}

/* ---- Narrative ownership: per topic, the leader named, then the full split. ---- */
function anNarrative(host, list, colourFor) {
  if (!list.length) { anNote(host, "Not enough news yet."); return; }
  var seen = [], seenNames = {};
  list.slice(0, 7).forEach(function (row) {
    var segs = arr(row.seg);
    var total = segs.reduce(function (t, x) { return t + x.c; }, 0) || 1;
    var leader = segs.reduce(function (a, b) { return (!a || b.c > a.c) ? b : a; }, null);
    var block = el("div", "narblk");
    var head = el("div", "narhead");
    head.appendChild(el("span", "narn", row.cat));
    if (leader) {
      head.appendChild(el("span", "narlead",
        shortName(leader.n) + " " + Math.floor((leader.c * 100) / total) + "%"));
    }
    block.appendChild(head);
    var bar = el("div", "narbar");
    segs.forEach(function (sg) {
      var b = el("div", "narseg");
      b.style.flexGrow = String(sg.c);
      b.style.background = colourFor(sg.n);
      b.title = sg.n + ": " + sg.c;
      bar.appendChild(b);
      if (!seenNames[sg.n]) { seenNames[sg.n] = 1; seen.push(sg.n); }
    });
    block.appendChild(bar);
    host.appendChild(block);
  });
  anKey(host, seen.map(function (n) { return [shortName(n), colourFor(n)]; }));
}

/* ---- Activity heatmap: competitor × category, on the five-step green scale. ---- */
function anHeat(host, a) {
  var rows = arr(a.heatRows), cols = arr(a.heatCols), grid = arr(a.heat);
  if (!rows.length || !cols.length) { anNote(host, "Not enough competitor-matched news yet."); return; }
  var max = 1;
  grid.forEach(function (r) { arr(r).forEach(function (v) { max = Math.max(max, v); }); });
  var scale = AN_HEAT;
  var level = function (v) { return v <= 0 ? 0 : Math.min(4, Math.ceil((v / max) * 4)); };

  var wrap = el("div", "heatwrap");
  var tbl = el("div", "heat");
  tbl.style.gridTemplateColumns = "minmax(78px,1fr) repeat(" + cols.length + ", minmax(30px,1fr))";
  tbl.appendChild(el("div"));
  cols.forEach(function (c) {
    var h = el("div", "heathc", shortLabel(c));
    h.title = c;
    tbl.appendChild(h);
  });
  rows.forEach(function (rn, ri) {
    var lab = el("div", "heathr", shortName(rn));
    lab.title = rn;
    tbl.appendChild(lab);
    cols.forEach(function (cn, ci) {
      var v = (arr(grid[ri])[ci]) || 0;
      var cell = el("div", "heatc");
      cell.style.background = scale[level(v)];
      cell.title = rn + " · " + cn + ": " + v;
      tbl.appendChild(cell);
    });
  });
  wrap.appendChild(tbl);
  host.appendChild(wrap);

  var lg = el("div", "heatlg");
  lg.appendChild(el("span", null, "Less"));
  scale.forEach(function (c) {
    var s = el("span", "heatsw");
    s.style.background = c;
    lg.appendChild(s);
  });
  lg.appendChild(el("span", null, "More"));
  host.appendChild(lg);
}

/* ---- Source diversity: the count first, then who. ---- */
function anSources(host, a) {
  var src = arr(a.sources);
  var head = el("div", "anbig");
  head.appendChild(el("span", "anbign", String(a.distinctSources || 0)));
  head.appendChild(el("span", "anbigl", "distinct sources"));
  host.appendChild(head);
  if (!src.length) { anNote(host, "No sources yet."); return; }
  var max = src.reduce(function (t, r) { return Math.max(t, r.c); }, 1);
  src.slice(0, 8).forEach(function (r) {
    anBar(host, r.n, String(r.c), Math.round((r.c / max) * 100), "var(--accent)");
  });
}

/* ---- Industry trends: the theme mix, then what is rising and what is cooling. ---- */
function anTrends(host, a) {
  var g = arr(a.trendGroups);
  if (!g.length) { anNote(host, "No tracked industry trends mentioned yet."); return; }
  var total = g.reduce(function (t, r) { return t + r.c; }, 0) || 1;
  host.appendChild(el("div", "rck", "By category"));
  var bar = el("div", "trendbar");
  g.forEach(function (r, i) {
    var b = el("div", "narseg");
    b.style.flexGrow = String(r.c);
    b.style.background = AN_SEGMENTS[i % AN_SEGMENTS.length];
    b.title = r.n + ": " + r.c;
    bar.appendChild(b);
  });
  host.appendChild(bar);
  anKey(host, g.map(function (r, i) {
    return [r.n, AN_SEGMENTS[i % AN_SEGMENTS.length],
            r.c + " · " + Math.round((r.c / total) * 100) + "%"];
  }));

  var kw = arr(a.keywords);
  var rising = kw.filter(function (k) { return k.d > 0; })
                 .sort(function (x, y) { return y.d - x.d; }).slice(0, 4);
  var cooling = kw.filter(function (k) { return k.d < 0; })
                  .sort(function (x, y) { return x.d - y.d; }).slice(0, 4);
  [["Heating up", rising, "#10B981"], ["Cooling down", cooling, "#EF4444"]].forEach(function (side) {
    if (!side[1].length) return;
    var h = el("div", "rck", side[0]);
    h.style.color = side[2];
    h.style.marginTop = "16px";
    host.appendChild(h);
    side[1].forEach(function (k) { anTrendRow(host, k.n, k.w, k.d, side[2]); });
  });
}

/* The phone stores the circular date as ISO. It shows it in words, so this does too — the
   same date written two ways across two screens reads as two different dates. */
function circularDate(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if (!m) return iso || "—";
  var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return Number(m[3]) + " " + months[Number(m[2]) - 1] + " " + m[1];
}

/* ---- NALCO metal prices. The phone's Metal tab, at a glance. ---- */
function anMetal(host, np) {
  var latest = np[0];
  var rows = el("div");
  [["Ingot · IE07", latest.ingot], ["Billet · CH10 · 178–254 mm", latest.billet]].forEach(function (r) {
    var row = el("div", "bxrow");
    row.appendChild(el("span", "n", r[0]));
    row.appendChild(el("span", "v", r[1] ? "₹" + Number(r[1]).toLocaleString("en-IN") + "/MT" : "—"));
    rows.appendChild(row);
  });
  host.appendChild(rows);
  /* Movement against the previous circular is the useful part — a price alone is just a number. */
  if (np.length > 1) {
    var prev = np[1], d = (Number(latest.ingot) || 0) - (Number(prev.ingot) || 0);
    if (d) {
      var mv = el("div", "anfoot",
        "Ingot " + (d > 0 ? "up ₹" : "down ₹") + Math.abs(d).toLocaleString("en-IN") +
        "/MT since " + circularDate(prev.effective));
      mv.style.color = d > 0 ? "#EF4444" : "#10B981";
      host.appendChild(mv);
    }
  }
  host.appendChild(el("div", "anfoot", "Effective " + circularDate(latest.effective)));
}

/* ============================================================
   DASHBOARD
   ------------------------------------------------------------
   Two zones. A horizontal strip of the phone's home-screen widgets for a glance, then the
   Analytics bento underneath for the detail. The strip answers "is there anything to look at?",
   the bento answers "what is it?".
   ============================================================ */
/* ============================================================
   BENTO PACKING
   ------------------------------------------------------------
   Cards go into whichever column is currently shortest, measured as we place them. The first
   few land in empty columns, so reading order still runs left to right across the top; after
   that the wall fills itself and every gap is --bento-gap, sideways and downwards alike.

   Relayout happens only when the column COUNT changes. Repacking on every resize frame would
   reshuffle cards under the reader's cursor while they drag the window, which is worse than a
   column that is briefly a few pixels wide.
   ============================================================ */
function bentoColumns(width) { return width >= 1180 ? 3 : (width >= 720 ? 2 : 1); }

function layoutBento(host, force) {
  if (!host || !host._cards) return;
  var n = bentoColumns(host.clientWidth);
  if (!force && host._cols === n) return;
  host._cols = n;
  host.innerHTML = "";
  var cols = [], i;
  for (i = 0; i < n; i++) { var c = el("div", "bcol"); host.appendChild(c); cols.push(c); }
  host._cards.forEach(function (card) {
    var best = cols[0];
    for (var k = 1; k < n; k++) if (cols[k].offsetHeight < best.offsetHeight) best = cols[k];
    best.appendChild(card);
  });
}

/* One listener for the life of the page, re-reading the current bento each time. Rebinding it
   per render would leak a listener per navigation. */
window.addEventListener("resize", function () {
  layoutBento(document.querySelector(".bento"), false);
});

/* ============================================================
   THE GLANCE STRIP
   ------------------------------------------------------------
   The phone's eight home-screen widgets, built to the widget mockups' own spec rather than
   restyled into web cards. Same 155dp square, same three-part anatomy (label row, hero,
   footer), same status ramp. A widget that reads one way on the launcher must read the same
   way here, or they stop being the same product.

   Every figure comes from `data.widgets`, the snapshot the phone computes for the launcher, so
   a number here and the same number on the home screen cannot disagree.
   ============================================================ */
/* "AUG", the way the phone's own widget stamps it: monthAbbrev uppercased. Backups written
   before monthAbbrev existed fall back to the first three letters of the full name, so the
   stamp is never the whole word on a 240px tile. */
function monthStamp(w) {
  var a = String((w && (w.monthAbbrev || w.monthLabel)) || "").trim();
  return a ? a.slice(0, 3).toUpperCase() : null;
}
function wTop(label, stamp) {
  var top = el("div", "w-top");
  var m = el("span", "w-mark");
  m.innerHTML = MARK;
  top.appendChild(m);
  top.appendChild(el("span", "w-label", label));
  if (stamp) top.appendChild(el("span", "w-stamp", stamp));
  return top;
}
/* Wrap whatever the headline is in the fixed two-line band, so a figure and a word occupy
   the same vertical space and everything below them lines up across the strip. */
function wHead(node) {
  var band = el("div", "w-head");
  band.appendChild(node);
  return band;
}
function wSay(text) { return el("p", "w-say", text); }

function wHero(value, unitHtml, colour, small) {
  var hero = el("div", "w-hero");
  var n = el("span", "w-num" + (small ? " sm" : ""), String(value));
  if (colour) n.style.color = colour;
  hero.appendChild(n);
  if (unitHtml) {
    var u = el("span", "w-unit");
    u.innerHTML = unitHtml;   // only ever our own literals, never data
    hero.appendChild(u);
  }
  return hero;
}
function wPill(kind, text) {
  var p = el("span", "wpill " + kind);
  p.appendChild(el("span", "d"));
  p.appendChild(el("span", null, text));
  return p;
}
function wFoot() { return el("div", "w-foot"); }

/* A widget-sized sparkline. The widget is a fixed square, so this one can keep its aspect
   ratio and needs none of the non-scaling treatment the dashboard's stretched rows do. */
var WSPARK_SEQ = 0;

/* The top-mover chart.
   Two gradients, not one. The VERTICAL gradient fills under the line and fades to nothing
   before the bottom, which is what stops a filled area reading as a solid block. The
   HORIZONTAL one is a mask on both the fill and the line, so the whole chart dissolves into
   the card at the left and right edges instead of ending in two hard stops. */
function wSpark(series, colour) {
  var svg = svgNode("svg", { "class": "wspark", viewBox: "0 0 100 34",
                             preserveAspectRatio: "none" });
  if (series.length < 2) return svg;
  var mx = Math.max.apply(null, series) || 1, pts = [];
  // Lifted: the peak sits near the top of the box and the trough well clear of the bottom.
  series.forEach(function (v, i) {
    pts.push([(i / (series.length - 1)) * 100, 24 - (v / mx) * 21]);
  });
  // Smooth, not a polyline. Control points on the vertical midline between each pair keeps the
  // curve from overshooting the way a Catmull-Rom spline does on a spiky series.
  var line = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (var i = 0; i < pts.length - 1; i++) {
    var a = pts[i], b = pts[i + 1], cx = (a[0] + b[0]) / 2;
    line += " C" + cx.toFixed(1) + " " + a[1].toFixed(1) +
            " " + cx.toFixed(1) + " " + b[1].toFixed(1) +
            " " + b[0].toFixed(1) + " " + b[1].toFixed(1);
  }
  var id = ++WSPARK_SEQ;
  var defs = svgNode("defs");

  var grad = svgNode("linearGradient", { id: "wsg" + id, x1: "0", y1: "0", x2: "0", y2: "1" });
  [["0", ".42"], [".55", ".14"], ["1", "0"]].forEach(function (st) {
    var stop = svgNode("stop", { offset: st[0], "stop-opacity": st[1] });
    stop.style.stopColor = colour;
    grad.appendChild(stop);
  });
  defs.appendChild(grad);

  // objectBoundingBox units, so the mask tracks the box at any width.
  var mgrad = svgNode("linearGradient", { id: "wsm" + id, x1: "0", y1: "0", x2: "1", y2: "0" });
  [["0", "0"], [".14", "1"], [".86", "1"], ["1", "0"]].forEach(function (st) {
    var stop = svgNode("stop", { offset: st[0], "stop-color": "#fff", "stop-opacity": st[1] });
    mgrad.appendChild(stop);
  });
  defs.appendChild(mgrad);
  var mask = svgNode("mask", { id: "wsk" + id, maskUnits: "userSpaceOnUse",
                               x: "0", y: "0", width: "100", height: "34" });
  mask.appendChild(svgNode("rect", { x: "0", y: "0", width: "100", height: "34",
                                     fill: "url(#wsm" + id + ")" }));
  defs.appendChild(mask);
  svg.appendChild(defs);

  var g = svgNode("g", { mask: "url(#wsk" + id + ")" });
  var area = svgNode("path", { d: line + " L100 34 L0 34 Z",
                               fill: "url(#wsg" + id + ")" });
  g.appendChild(area);
  var stroke = svgNode("path", { d: line, fill: "none", "stroke-width": "2",
                                 "stroke-linecap": "round", "stroke-linejoin": "round",
                                 "vector-effect": "non-scaling-stroke" });
  stroke.style.stroke = colour;
  g.appendChild(stroke);
  svg.appendChild(g);
  return svg;
}

/* A day's step on the ramp.
   The month's own QUARTILES, not a share of the busiest day: one bulk fetch (45 stories against
   a normal 0-6) would otherwise flatten every other day to the dimmest tint. Straight from the
   phone's heat(); `breaks` is monthBreaks, which the phone computes and ships. */
function calStep(count, breaks) {
  if (count <= 0) return 0;
  if (!breaks || breaks.length < 3) return 4;
  if (count <= breaks[0]) return 1;
  if (count <= breaks[1]) return 2;
  if (count <= breaks[2]) return 3;
  return 4;
}

/* The month as a heat calendar, matching the phone's Coverage widget cell for cell. */
function calendarWidget(w) {
  var g = el("div", "widget");
  var abbrev = (w.monthAbbrev || w.monthLabel || "").toUpperCase();
  g.appendChild(wTop("Coverage", abbrev ? abbrev + " · " + (w.monthTotal || 0) : null));

  var grid = arr(w.monthGrid), dows = arr(w.monthWeekdays), breaks = arr(w.monthBreaks);
  if (grid.length < 42 || dows.length < 7) {
    var band = el("div", "w-head");
    band.appendChild(el("p", "w-topic", "No calendar yet"));
    g.appendChild(band);
    g.appendChild(wSay("The phone has not filed a day-by-day breakdown this month."));
    g.appendChild(wFoot());
    return g;
  }

  var cal = el("div", "calgrid");
  var head = el("div", "calrow");
  dows.forEach(function (d) { head.appendChild(el("div", "caldow", d)); });
  cal.appendChild(head);

  /* Which day-of-month each cell is: the grid is padded at the front by however many blanks
     the month's first weekday needs, so counting real cells gives the date. */
  var day = 0;
  for (var week = 0; week < 6; week++) {
    var row = el("div", "calrow");
    for (var i = 0; i < 7; i++) {
      var c = el("div", "calcell");
      var n = grid[week * 7 + i];
      if (typeof n === "number" && n >= 0) {
        day++;
        var dot = el("span", "caldot");
        dot.style.background = "var(--cal-" + calStep(n, breaks) + ")";
        dot.title = (w.monthLabel || "") + " " + day + ": " +
                    n + (n === 1 ? " story" : " stories");
        c.appendChild(dot);
      }
      row.appendChild(c);
    }
    cal.appendChild(row);
  }
  g.appendChild(cal);

  var key = el("div", "calkey");
  key.appendChild(el("span", null, "Less"));
  for (var k = 0; k < 5; k++) {
    var sw = el("i");
    sw.style.background = "var(--cal-" + k + ")";
    key.appendChild(sw);
  }
  key.appendChild(el("span", null, "More"));
  g.appendChild(key);
  return g;
}

function renderWidgetStrip(w) {
  var strip = el("div", "wstrip");
  var add = function (node) { strip.appendChild(node); };
  var names = function (list) {
    return arr(list).slice(0, 2).map(function (r) { return r.n; }).join(", ");
  };

  /* 1. Ready to publish. The only widget that nags: verified stories go stale quietly. */
  (function () {
    var g = el("div", "widget");
    /* This page's own list, like the Unverified tile: verified AND still in Alerts. The report
       bar at the bottom of Alerts counts exactly this, and a tile that disagreed with the bar
       two clicks away is worse than one that lags the phone by a backup. */
    var ready = verifiedArticles().length;
    /* readyOldestDays is -1 when the stored dates cannot give an age. That is a sentinel, not
       a duration, and the phone's own widget guards on >= 1 before printing it. Do the same
       here rather than rendering "waited -1 days", which is what an unguarded read produces. */
    var oldest = w.readyOldestDays;
    var haveAge = typeof oldest === "number" && oldest >= 1;
    g.appendChild(wTop("Ready to publish", (ready && haveAge) ? oldest + "d" : null));
    g.appendChild(wHead(wHero(ready, "verified,<br>unsent", ready ? null : "var(--ink-3)")));
    g.appendChild(wSay(!ready
      ? "Nothing is waiting on you."
      : haveAge
        ? "Oldest has waited " + oldest + (oldest === 1 ? " day" : " days") + " for a report."
        : "Enough for an edition whenever you want one."));
    var f = wFoot();
    var ticks = el("div", "wticks");
    // Twelve slots: filled for what is waiting, faint for the headroom left in an edition.
    for (var i = 0; i < 12; i++) ticks.appendChild(el("i", i < ready ? null : "spent"));
    f.appendChild(ticks);
    g.appendChild(f);
    add(g);
  })();

  /* 2. Coverage. A month of days, each day as tall as it was busy. */
  (function () {
    var g = el("div", "widget");
    var grid = arr(w.monthGrid), mx = w.monthMax || 1;
    /* No month in the stamp: the figure underneath already says "articles dated August", and
       naming the same month twice in one 155dp square is the tile arguing with itself. */
    g.appendChild(wTop("Coverage"));
    g.appendChild(wHead(wHero(w.monthTotal || 0, "articles<br>dated " + (w.monthLabel || "this month"))));
    /* monthGrid is a 42-cell CALENDAR: -1 outside the month, and days 1..N sitting at an
       offset that depends on the weekday the month starts on. Taking the last 16 CELLS gave
       trailing padding, not recent days.

       So: keep only real days, then drop the ones that have not happened yet. The backup's own
       timestamp is what "today" means for this data — using the browser's clock would silently
       disagree whenever the backup is a day or more old. */
    var realDays = grid.filter(function (c) { return c >= 0; });
    var asOf = new Date((S.data && S.data.updatedAtMillis) || Date.now());
    var elapsed = realDays.slice(0, Math.max(1, asOf.getDate()));
    /* Time runs left to right: the oldest of the sixteen days is the first bar, today is the
       last one. */
    var recent = elapsed.slice(-16);
    var live = recent.filter(function (c) { return c > 0; }).length;
    g.appendChild(wSay(recent.length
      ? live + " of the last " + recent.length + " days carried news."
      : "No daily breakdown recorded yet."));
    var f = wFoot();
    if (recent.length) {
      var ticks = el("div", "wticks cov");
      // recent[last] is today, so the day number counts UP as the bars go right.
      var firstDay = asOf.getDate() - recent.length + 1;
      recent.forEach(function (c, i) {
        var t = el("i", c > 0 ? null : "spent");
        t.title = (w.monthLabel || "") + " " + (firstDay + i) + ": " +
                  c + (c === 1 ? " story" : " stories");
        ticks.appendChild(t);
      });
      f.appendChild(ticks);
    }
    g.appendChild(f);
    add(g);
  })();

  /* 3. The same month as a calendar. The bars above answer "how recently"; this answers
     "how it was spread". */
  add(calendarWidget(w));

  /* 4. Spend. Free RSS is a green state; anything that bills is amber. */
  (function () {
    var g = el("div", "widget");
    var mode = String(w.sourceMode || "");
    var free = /free/i.test(mode);
    g.appendChild(wTop("Spend", monthStamp(w)));
    // Full size, like every other hero on the strip. It was the small variant so a string like
    // 1234.56 would fit; with the phone's rounding rule that string cannot occur.
    //
    // No unit beside the figure. The stamp above already names the month, and saying it twice
    // on a 240px tile cost the number the room it was widened to have.
    g.appendChild(wHead(wHero(rupee(w.monthRupees), null, free ? "var(--good-ink)" : null)));
    g.appendChild(wSay(free
      ? "The free feed costs nothing to run."
      : "Grounded search is billed for every query."));
    var f = wFoot();
    f.appendChild(wPill(free ? "good" : "warn", mode || "unknown"));
    g.appendChild(f);
    add(g);
  })();

  /* 4. Industry trends. The mix, not just the leader. */
  (function () {
    var g = el("div", "widget");
    var top = arr(w.trendTop);
    g.appendChild(wTop("Industry trends", (w.trendWindowDays || 30) + "d"));
    g.appendChild(wHead(el("p", "w-topic", top.length ? top[0].n : "Nothing yet")));
    g.appendChild(wSay(top.length
      ? top[0].c + " of the " + (w.trendTotal || 0) + " stories in this window are on this theme."
      : "No tracked theme has been mentioned in this window."));
    var f = wFoot();
    if (top.length) {
      var split = el("div", "wsplit");
      var cols = ["var(--accent)", "var(--info)", "var(--warn)"];
      top.slice(0, 3).forEach(function (r, i) {

      });

        var rest = el("span");
        rest.style.flex = String(w.trendOthers);
        rest.style.background = "var(--track)";

      }
      f.appendChild(split);
      /* The runners-up, not the leader: the headline above already names the leader, and a
         legend that repeats it spends the only two slots there are on something you have
         just read. Colours match the segments in the bar. */
      var lg = el("div", "wlegend");
      top.slice(1, 3).forEach(function (r, i) {
        var it = el("span");
        var d = el("i");
        d.style.background = cols[i + 1];

        lg.appendChild(it);
      });

    }
    g.appendChild(f);
    add(g);
  })();

  /* 5 and 6. Heating up and cooling down: the same measure, two directions. */
  [["Heating up", w.risingTrend, w.risingRunners, "good", "rising"],
   ["Cooling down", w.coolingTrend, w.coolingRunners, "crit", "cooling"]
  ].forEach(function (side) {

    g.appendChild(wTop(side[0], (w.trendWindowDays || 30) + "d"));
    g.appendChild(wHead(el("p", "w-topic", side[1] || "Nothing yet")));
    var runners = names(side[2]);
    g.appendChild(wSay(runners
      ? "Then " + runners + "."
      : "Nothing else is moving in this direction."));
    var f = wFoot();
    f.appendChild(wPill(side[3], side[4]));
    g.appendChild(f);
    add(g);

  /* 7. Top mover. Share of voice, with the weeks behind it running the full width. */
  (function () {
    var g = el("div", "widget");
    var d = w.moverDelta || 0;

       saying "7d" here was simply a different claim from the one the number answers. */
    g.appendChild(wTop("Top mover", "3M"));
    g.appendChild(wHead(el("p", "w-topic", w.moverName || "No mover")));
    // Two lines is the whole budget here. The long form ran to three and the third was
    // clamped away, so the sentence ended mid-thought.
    g.appendChild(wSay((up ? "Up " : "Down ") + Math.abs(d) + " pts on its own average. " +
                       (w.moverSharePct || 0) + "% of coverage."));
    var f = wFoot();
