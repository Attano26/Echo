  "only the headings and bullets your shape asks for — '## ' for a heading, '- ' for a bullet,",
  "'**bold**' for the few phrases that carry the point. Keep the whole answer under 200 words.",
  "",
  "Name a story when it is doing the work of your claim. Do not list stories back for their own",
  "sake and never close with a roll-call of everything you read — the reader can open the sources",
  "themselves.",
  "",
  "WHO YOU ARE. You are Echo: a market-intelligence desk that reads one beat — the aluminium",
  "window and facade industry — and reads it obsessively. Dry, precise, quietly amused. Confident",
  "about the beat and cheerfully unembarrassed about its edges. You have opinions about window",
  "profiles and no opinions about anything else.",
  "",
  "This is character, not licence. It NEVER buys you a fact. Every figure and every claim still",
  "comes from the inventory you were given; a charming sentence with an invented number in it is",
  "the worst thing you can produce. When the data does not support an answer, say so plainly —",
  "with a straight face, not an apology, and not a hedge dressed up as one.",
  "",
  "OFF THE BEAT. Answer the subject the reader actually raised BEFORE steering back — one line",
  "engaging with it, then the turn. Saying nothing about it and continuing the previous topic is",
  "the one thing that makes this feel like a machine. If asked for a poem, a forecast, trivia, or",
  "anything outside this industry,",
  "decline in ONE line with some wit, then spend the rest on something real you can do — named",
  "from the inventory, so the reader has an obvious next move. Do not lecture about being an AI,",
  "do not apologise twice, and never pretend the question was interesting when it was not.",
  "",
  "GREETINGS. A hello is the one moment the reader is deciding whether this is worth using. Answer",
  "in a sentence or two: what you are holding, in their numbers, and one question worth asking.",
  "",
  "FOLLOW-UPS. Also return two or three questions the reader would plausibly ask next. Each must be",
  "answerable from the INVENTORY you were given: name a company, market or theme that actually",
  "appears there. Write them as the reader would type them, under about nine words. If the data",
  "cannot support a good next question, return none rather than filler."
].join("\n");

/* ---------- answer shapes ----------
   ONE SHAPE FOR EVERY QUESTION WAS THE PROBLEM. A single contract produced the same skeleton
   whatever was asked, so a comparison came back as a summary with two names in it and a spend
   question arrived wearing headings it did not need. Each entry below says what a good answer to
   THAT kind of question looks like, and says nothing else.

   They all end the same way: if the data is thin, say it is thin. A shape is a form to fill
   honestly, never a quota of bullets to reach. */
var CH_SHAPES = {
  competitor: [
    "SHAPE. One competitor.",
    "Open with what has actually changed for them, in a sentence. Then '## What they have been",
    "doing' with two or three bullets, and '## Why it matters' with one or two on the read-across",
    "to Schüco. If the record is a single story, say so and give that story."
  ],
  compare: [
    "SHAPE. A comparison.",
    "Open with the difference that matters most, in a sentence. Then one '## ' heading per company",
    "or market being compared, two bullets each, on the SAME dimensions in the same order so the",
    "two can be read against one another. Say plainly if the data is much thicker on one side."
  ],
  summary: [
    "SHAPE. A summary or digest.",
    "Open with the single most important thing in the period, in a sentence. Then group the rest",
    "under two to four '## ' theme headings you choose from what is actually there — not a fixed",
    "list — with one-line bullets. Stop there; do not append a conclusion."
  ],
  trend: [
    "SHAPE. Movement.",
    "Open with what is rising and what is fading, in a sentence. Then '## Picking up' and",
    "'## Going quiet' with one-line bullets, each naming its evidence. Only include a heading you",
    "can actually fill."
  ],
  metric: [
    "SHAPE. A figure.",
    "Answer with the number in the first six words. Two or three sentences of plain prose after it,",
    "on what drove it and what it means. NO headings and NO bullets — this is one fact, not a",
    "report."
  ],
  explain: [
    "SHAPE. An explanation.",
    "Open with what the thing is, in a sentence the reader could repeat to someone else. Then",
    "'## Why it matters here' and '## What your data says', two bullets each. If your material",
    "mentions the concept without defining it, say exactly that."
  ],
  timeline: [
    "SHAPE. A sequence.",
    "Open with the arc in a sentence. Then bullets in date order, oldest first, each starting with",
    "the date and running to one line. No headings."
  ],
  count: [
    "SHAPE. A count.",
    "Give the number in the first five words. One or two sentences on how it breaks down. No",
    "headings, no bullets."
  ],
  find: [
    "SHAPE. A direct question.",
    "Answer it in the first sentence. Two or three more sentences of substance from the stories that",
    "carry the point, naming them. No headings and no bullets unless there are genuinely three or",
    "more parallel items, in which case bullets are right."
  ],
  none: [
    "SHAPE. Nothing matched.",
    "Say so in one sentence, without apology or padding. Then, in one more, name the nearest thing",
    "the inventory DOES hold, so the reader can see where the edge of their data is. Do not",
    "speculate about the subject itself."
  ]
};

/* Which shape this question wants. Rules rather than a classifier call: free, readable, and
   fixable when it misfires. Order matters — the most specific tests run first. */
function chShape(q, kind, ents) {
  var t = " " + key(q).replace(/[^a-z0-9 ]+/g, " ") + " ";
  if (kind === "metric") return "metric";
  if (kind === "trend") return "trend";
  if (/\b(compare|comparison|versus|vs|against|difference between|better than|side by side)\b/.test(t)
      || (ents && ents.comps && ents.comps.length > 1)) return "compare";
  if (/\b(timeline|chronolog\w*|over time|history|when did|sequence|so far)\b/.test(t)) return "timeline";
  if (/\b(summar\w*|recap|digest|overview|brief|briefing|breakdown|break down|what happened|catch me up|deep dive)\b/.test(t)) return "summary";
  if (kind === "count") return "count";
  /* COMPETITOR OUTRANKS EXPLAIN. “What is happening with Reynaers” opens with “what is” and
     was being read as a request for a definition, so it answered with an explanation of a
     company the reader already tracks. Naming exactly one tracked competitor is the stronger
     signal. The added guard keeps the same phrasing out of explain when no competitor is
     named either, so “what is happening in India” falls through to find rather than explain. */
  if (ents && ents.comps && ents.comps.length === 1) return "competitor";
  if (/\b(explain|what is|what are|what does|meaning of|definition|why does|how does)\b/.test(t)
      && !/\b(what|whats) (is|are)? ?(happening|going on|new|up)\b/.test(t)) return "explain";
  return "find";
}

/* The retrieved answer, rendered for the model. The composed reply goes in too: its figures are
   computed from the data and are correct, so handing them over stops the model recounting and
   arriving at a different number from the cards directly beneath it. */
/* How many INVENTORY lines to send. A title line is roughly 25 tokens, so 600 of them is about
   15k — comfortably inside a flash-lite context and inside the free tier's per-minute token
   budget, while covering a corpus several times the size of a normal one. Beyond that the list is
   trimmed to the newest and the model is TOLD it was trimmed, because a model that thinks it has
   seen everything will answer "you have nothing on X" about a story that was simply cut. */
var CH_INVENTORY_MAX = 600;
var CH_DETAIL_MAX = 14;

function chPrompt(m) {
  var ix = chIndex();

  /* A GREETING DOES NOT NEED THE CORPUS.
     Every turn used to ship the whole inventory, so "hey" cost the same ~10,000 input tokens as a
     real analytical question — measured on a live reply, and paid for on the reader's own key.
     A non-data turn needs the persona, a few counts to be concrete with, and the plain answer the
     app already composed. That is a few hundred characters instead of nineteen thousand.
     The counts are still real; nothing here invites the model to invent. */
  if (m.compact) {
    var lines = ["QUESTION", m.q, "",
      "This is a question about the reader's own collections. The figures below are AUTHORITATIVE:",
      "they were counted from the lists themselves. State them as they are. Do NOT recount, do NOT",
      "estimate, and do NOT mention any figure that is not listed here.", ""];
    (m.stats || []).forEach(function (r) {
      lines.push("- " + r[0] + ": " + r[1] + (r[2] ? " (" + r[2] + ")" : ""));
    });
    lines.push("", "THE APP ALREADY COMPOSED THIS PLAIN ANSWER. Keep its figures, give it your voice:",
      String(m.composed || m.lead || "").replace(/<[^>]+>/g, ""));
    return lines.join("\n");
  }

  /* Every prompt shape gets the reader's first name, so the model can be personal without being
     told twice. Name only -- never the email. */
  var meP = chMe();
  var whoLine = meP ? "YOU ARE TALKING TO: " + meP.first : "";

  if (m.social === "me") {
    return [
      "THE READER SAID", m.q, "",
      whoLine,
      "They have just named THEMSELVES. Confirm warmly that you know who they are, in one line,",
      "then offer something worth asking. Do not look them up in the data and do not invent any",
      "detail about them -- you know their name because they are signed in, and nothing else.",
      "",
      "WHAT THEY HOLD",
      "- Stories: " + chIndex().docs.length,
      "- Competitors: " + arr(chIndex().comps).length
    ].filter(function (x) { return x !== ""; }).join("\n");
  }

  if (m.social === "offtopic") {
    var ixo = chIndex(), do0 = S.data || {}, wo = do0.widgets || {};
    var hot2 = String(wo.risingTrend || "").trim();
    return [
      "THE READER SAID", m.q, "",
      whoLine,
      "THE SUBJECT THEY RAISED: " + (m.subject || m.q),
      "Nothing in their data mentions it.",
      "",
      "ANSWER THE SUBJECT FIRST. Open by engaging with it directly, in ONE short sentence, from",
      "your own general knowledge — what it is, or a remark a person would actually make about it.",
      "Do not ignore it and do not answer about the previous topic. THEN steer back to this beat in",
      "a second sentence, and give them something worth asking.",
      "",
      "IF THE SUBJECT IS ACTUALLY PART OF THE ALUMINIUM WINDOW / FACADE INDUSTRY (a maker, a system,",
      "a standard), do NOT treat it as small talk: say plainly that nothing in their data mentions",
      "it yet, and suggest what they could ask about instead.",
      "",
      "YOUR GENERAL KNOWLEDGE IS FOR THAT OPENING LINE ONLY. Never use it for a claim about their",
      "market, their competitors, or any figure. Those come from the data below and nowhere else.",
      "",
      "WHAT THE READER HOLDS",
      "- Stories: " + ixo.docs.length,
      "- Competitors: " + arr(ixo.comps).length,
      "- Markets: " + arr(ixo.lands).length,
      hot2 ? "- Trend rising fastest: " + hot2 : ""
    ].filter(function (x) { return x !== ""; }).join("\n");
  }

  if (m.social) {
    var d0 = S.data || {}, w0 = d0.widgets || {};
    var hot0 = String(w0.risingTrend || "").trim();
    return [
      "QUESTION", m.q, "",
      whoLine,
      m.social === "offbeat"
        ? "THIS IS NOT A DATA QUESTION. It is outside this app's subject entirely."
        : "THIS IS NOT A DATA QUESTION. It is a greeting or an acknowledgement.",
      "Do NOT list stories. Do NOT state any figure that is not below. Answer briefly, in your own",
      "voice, and point the reader at something they could actually ask.",
      "",
      "WHAT THE READER HOLDS",
      "- Stories: " + ix.docs.length,
      "- Competitors: " + arr(ix.comps).length,
      "- Markets: " + arr(ix.lands).length,
      hot0 ? "- Trend rising fastest: " + hot0 : "",
      "",
      "THE APP ALREADY COMPOSED THIS PLAIN ANSWER. Keep its facts, give it your voice:",
      /* Tags stripped: the composed line carries <b> for the screen, and sending markup into the
         prompt invites the model to echo it back into prose that is then escaped as text. */
      String(m.composed || m.lead || "").replace(/<[^>]+>/g, "")
    ].filter(function (x) { return x !== ""; }).join("\n");
  }

  var out = ["QUESTION", m.q, ""];
  if (whoLine) { out.push(whoLine, ""); }

  if (m.stats && m.stats.length) {
    out.push("FIGURES ALREADY COMPUTED FROM THE READER'S DATA");
    m.stats.forEach(function (r) { out.push("- " + r[0] + ": " + r[1] + (r[2] ? " (" + r[2] + ")" : "")); });
    out.push("");
  }

  /* THE WHOLE CORPUS, newest first. This is what stops the model reaching outside the data: it can
     see the shape of everything the reader holds, so "you have nothing on that" becomes a checkable
     statement rather than a guess, and a summary can be drawn across the lot rather than across the
     six cards retrieval happened to surface. */
  var all = ix.docs.slice().sort(function (a, b) { return (b.ms || 0) - (a.ms || 0); });
  var shown = all.slice(0, CH_INVENTORY_MAX);
  out.push("INVENTORY — every story the reader holds (" + all.length + " in total" +
           (all.length > shown.length ? ", newest " + shown.length + " listed" : "") + ")");
  shown.forEach(function (doc, i) {
    out.push((i + 1) + ". " + doc.title +
      " [" + [doc.source, doc.category, chAgo(doc.ms)].filter(Boolean).join(" · ") + "]");
  });
  if (all.length > shown.length) {
    out.push("(" + (all.length - shown.length) + " older stories not listed. Do not claim the reader " +
             "lacks something purely because it is absent here — say the older ones were not shown.)");
  }
  out.push("");

  if (m.items && m.items.length) {
    var detail = (m.context && m.context.length ? m.context : m.items).slice(0, CH_DETAIL_MAX);
    out.push("DETAIL — the stories that best match this question, most relevant first");
    detail.forEach(function (doc, i) {
      out.push((i + 1) + ". " + doc.title);
      var meta = [doc.source, doc.category, doc.region, chAgo(doc.ms)].filter(Boolean).join(" · ");
      if (meta) out.push("   " + meta);
      if (doc.summary) out.push("   " + String(doc.summary).slice(0, 600));
    });
    out.push("");
  } else {
    out.push("DETAIL — nothing in the inventory matched this question closely.");
    out.push("");
  }

  /* The composed answer rides along for its FIGURES, which are computed from the data and are
     right. It is deliberately NOT offered as a draft to rewrite: handing the model a finished
     sentence is what made every reply inherit its running order — matches, then newest, then
     published — no matter what had been asked. */
  out.push("COUNTS ALREADY COMPUTED (use these numbers if you need a number; do not recount them,");
  out.push("and do not follow this sentence's running order — it is a note, not a draft)");
  out.push(String(m.composed || m.lead).replace(/<[^>]+>/g, ""));
  out.push("");
  out.push((CH_SHAPES[m.shape] || CH_SHAPES.find).join("\n"));
  return out.join("\n");
}

function chCallModel(m, done) {
  var key = chKey();
  if (!key) return done(null, "no key");
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { ctrl && ctrl.abort(); }, 25000);
  fetch(CH_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: CH_RULES + CH_VOICE }] },
      contents: [{ role: "user", parts: [{ text: chPrompt(m) }] }],
      /* A schema rather than a delimiter the model has to remember. The answer keeps its markdown;
         the follow-ups arrive as real strings instead of a line to be parsed back out of prose. */
      generationConfig: {
        temperature: 0.45, maxOutputTokens: 900,
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            answer: { type: "STRING" },
            followUps: { type: "ARRAY", items: { type: "STRING" } }
          },
          required: ["answer"]
        }
      }
    }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      return { ok: r.ok, status: r.status, j: j };
    });
  }).then(function (res) {
    clearTimeout(timer);
    if (!res.ok) {
      var e = res.j && res.j.error;
      return done(null, res.status === 429 ? "the free quota is spent for now"
                      : (res.status === 400 || res.status === 403) ? "the key was rejected"
                      : (e && e.message) || ("HTTP " + res.status));
    }
    var cand = res.j && res.j.candidates && res.j.candidates[0];
    /* NEVER parts[0]. This is a thinking model: the first part can be a thought carrying no text
       at all, and reading it alone is how you get an empty answer out of a perfectly good reply. */
    var parts = (cand && cand.content && cand.content.parts) || [];
    var text = parts.map(function (x) { return x && x.text ? x.text : ""; }).join("").trim();
    if (!text) return done(null, cand && cand.finishReason ? "it stopped: " + cand.finishReason : "an empty reply");

    /* The parse is defended even with a schema in force: a reply truncated at the token ceiling is
       still JSON-shaped enough to look right and not complete enough to parse, and the honest
       fallback is to show what came back rather than to lose it. */
    var payload = null;
    try { payload = JSON.parse(text); } catch (e) { payload = null; }
    if (!payload || typeof payload.answer !== "string" || !payload.answer.trim()) {
      payload = { answer: text, followUps: [] };
    }
    var ups = (payload.followUps || []).map(function (x) { return String(x || "").trim(); })
      .filter(function (x) { return x.length > 3 && x.length <= 90; })
      .slice(0, 3);

    var u = res.j.usageMetadata || {};
    done({ text: payload.answer, followUps: ups,
           inTok: u.promptTokenCount || 0, outTok: u.candidatesTokenCount || 0,
           totalTok: u.totalTokenCount || 0, thoughtTok: u.thoughtsTokenCount || 0 }, null);
  }).catch(function (err) {
    clearTimeout(timer);
    done(null, (err && err.name === "AbortError") ? "it timed out" : String((err && err.message) || err));
  });
}

/* Model output is UNTRUSTED TEXT and is escaped before anything else happens to it. Only then is
   the small markdown vocabulary the model was asked for turned back into tags — headings, bullets,
   numbered items and bold. Escaping first is what makes that safe: by the time these regexes run
   there is no live markup left in the string for them to re-enable, so a story title containing
   <script> arrives as text and stays text. */
function chProse(t) {
  var raw = String(t || "").replace(/\r/g, "").trim();
  if (!raw) return "";
  /* A HEADING THE MODEL PUT MID-LINE STILL GETS TO BE A HEADING.
     The heading rule below is anchored to the start of a line, so when the model wrote
     "...architect support. ## What they have been doing" as one line, it fell through to the
     paragraph branch and "##" was shown to the reader as literal text. Break before a heading
     marker that follows other text. Only "#" is treated this way: a stray "-" mid-sentence is a
     hyphen far more often than it is a bullet, so bullets stay anchored. */
  raw = raw.replace(/([^\n])[ \t]+(#{1,6}[ \t]+)/g, "$1\n$2");
  var lines = esc(raw).split(/\n/);
  var html = [], list = null;

  var closeList = function () { if (list) { html.push("</" + list + ">"); list = null; } };
  var openList = function (tag) { if (list !== tag) { closeList(); html.push("<" + tag + ' class="chlist">'); list = tag; } };
  var inline = function (x) { return x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); };

  lines.forEach(function (ln) {
    var line = ln.trim();
    if (!line) { closeList(); return; }
    var h = /^#{1,6}\s+(.*)$/.exec(line);
    if (h) { closeList(); html.push("<h4 class=\"chh\">" + inline(h[1]) + "</h4>"); return; }
    var b = /^[-*\u2022]\s+(.*)$/.exec(line);
    if (b) { openList("ul"); html.push("<li>" + inline(b[1]) + "</li>"); return; }
    var o = /^\d+[.)]\s+(.*)$/.exec(line);
    if (o) { openList("ol"); html.push("<li>" + inline(o[1]) + "</li>"); return; }
    closeList();
    html.push("<p>" + inline(line) + "</p>");
  });
  closeList();
  return html.join("");
}

/* ============================================================
   ASK — view
   ------------------------------------------------------------
   A chat room: composer docked at the bottom, turns growing down into it, each
   side in its own container. Your message is a bubble; the reply is a card that
   can hold a sentence, figures and the stories behind them without any of it
   escaping the container it belongs to.
   ============================================================ */
var ICON_SEND = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

/* Openers are derived from YOUR data, so a card can never open on something the app does not
   hold. The label says which KIND of question it is, which is how you learn what can be asked. */
function chSuggestions() {
  var d = S.data || {}, w = d.widgets || {}, ix = chIndex(), out = [];
  var who = w.moverName || (ix.comps[0] && ix.comps[0].name);
  if (who) out.push(["Competitor", "What is happening with " + who + "?"]);
  out.push(["Spend", "How much have I spent this month?"]);
  if (w.risingTrend) out.push(["Trend", "Why is " + w.risingTrend + " heating up?"]);
  else out.push(["Trend", "What is trending?"]);
  if (ix.lands.length) out.push(["Market", "Any news from " + ix.lands[0].name + "?"]);
  else out.push(["About", "What can you do?"]);
  return out.slice(0, 4);
}

/* The signed-in address is the only name this page has, and it never invents one. Without a
   name the invitation takes the top slot instead, so the page never opens on a smaller
   heading than it would otherwise have had. */
function chHello() {
  /* The FIRST word of the name Google has, because a greeting uses a first name: "Hello,
     Vineeth", not "Hello, Vineeth Thummala", which reads like a letter from a bank. Falls back
     to the local part of the address only when the profile carries no display name at all. */
  var n = String(S.name || "").trim().split(/\s+/)[0];
  if (!n) n = String(S.email || "").split("@")[0].replace(/[._-]+/g, " ").trim().split(/\s+/)[0];
  return n ? "Hello, " + n.charAt(0).toUpperCase() + n.slice(1) : "";
}

function chAsk(q) {
  q = String(q || "").trim();
  if (!q) return;
  CH_DRAFT = "";
  var m = chAnswer(q);        // oldest first: the conversation grows DOWN into the composer
  /* The composed reply is kept whatever happens next. It is the fallback if the call fails, and
     it is also part of the prompt, so the model rephrases figures rather than recounting them. */
  m.composed = m.lead;
  m.shape = chShape(q, m.kind, chEntities(q));
  /* Layout follows the MODE, not how the call turns out. Reading it off `via` after the fact meant
     the composed answer's tiles rendered first and then vanished when the reply landed. */
  m.smartTurn = chSmart();
  m.pending = m.smartTurn;
  CH_LOG.push(m);
  render();
  var s = $("#scroll"); if (s) s.scrollTop = s.scrollHeight;
  var box = $("#chIn"); if (box) box.focus();

  /* The cards and figures are on screen already; only the wording is waiting. A failure costs the
     reader nothing but the phrasing, so it is reported as a footnote rather than as an error. */
  if (m.pending) {
    chCallModel(m, function (out, err) {
      m.pending = false;
      if (out) {
        m.lead = chProse(out.text); m.via = "model"; m.usage = out;
        m.followUps = out.followUps || [];
      }
      else { m.via = "local"; m.viaErr = err; }
      render();
      var s2 = $("#scroll"); if (s2) s2.scrollTop = s2.scrollHeight;
    });
  }
}

/* Provenance, kept but got out of the way. Which of the two wrote a sentence and what it cost are
   things the reader must be able to check — especially on a tab whose whole promise is that it
   cannot tell you anything you do not already hold. They are not things anyone wants printed under
   every paragraph, though, so they live behind one quiet word in the bottom right: hover on a
   pointer, tap on a touch screen.

   It appears on EVERY reply, including the free ones, where it says so and shows nothing spent.
   A usage readout that only appears when something was spent teaches you to read its absence, and
   absence is the one thing that is easy to miss. */
/* Put the popover where it will actually be seen.
   It opens upward by default, which is right when there is room. The chat scroll area and #shell
   are both overflow:hidden, so a popover positioned above the container's top edge is clipped out
   of existence rather than merely cropped -- the reported "nothing happens when I tap Usage".
   Measured at open time, so it stays correct when the keyboard shrinks the viewport. */
function chPlacePop(wrap, pop) {
  pop.classList.remove("down");
  var sc = $("#scroll");
  var limit = sc ? sc.getBoundingClientRect().top : 0;
  var need = pop.getBoundingClientRect().height + 9;   // laid out even while hidden
  if (wrap.getBoundingClientRect().top - need < limit) pop.classList.add("down");
}

function chUsage(m) {
  var foot = el("div", "chfoot");
  var wrap = el("div", "chuse");
  var btn = el("button", "chusebtn", "Usage");
  btn.setAttribute("aria-expanded", "false");
  var pop = el("div", "chusepop");

  var row = function (k, v) {
    var r = el("div", "chur");
    r.appendChild(el("span", null, k));
    r.appendChild(el("b", null, String(v)));
    pop.appendChild(r);
  };
  var n = function (x) { return (Number(x) || 0).toLocaleString("en-IN"); };

  if (m.via === "model" && m.usage) {
    pop.appendChild(el("div", "chuh", "This reply"));
    row("Model", CH_MODEL);
    row("Input", n(m.usage.inTok) + " tokens");
    row("Output", n(m.usage.outTok) + " tokens");
    if (m.usage.thoughtTok) row("Thinking", n(m.usage.thoughtTok) + " tokens");
    if (m.usage.totalTok) row("Total", n(m.usage.totalTok) + " tokens");
    row("Grounded on", chPl(chIndex().docs.length, "story", "stories"));
    row("Search grounding", "off — free tier");
  } else if (m.viaErr) {
    pop.appendChild(el("div", "chuh", "This reply"));
    row("Answered by", "the app");
    row("Model", "not reached");
    row("Reason", m.viaErr);
    row("Spent", "nothing");
  } else {
    pop.appendChild(el("div", "chuh", "This reply"));
    row("Answered by", "the app");
    row("Read", chPl(chIndex().docs.length, "story", "stories"));
    row("Spent", "nothing");
  }

  /* Click works on both. Hover alone would strand touch users; click alone would make a pointer
     user press something to read a footnote. */
  btn.onclick = function (e) {
    e.stopPropagation();
    var open = wrap.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) chPlacePop(wrap, pop);
  };
  /* The desktop hover-open path needs placing too: it is rarer up there, but a reply at the top of
     a short window clips the same way. */
  wrap.addEventListener("mouseenter", function () { chPlacePop(wrap, pop); });
  wrap.appendChild(btn);
  wrap.appendChild(pop);
  foot.appendChild(wrap);
  return foot;
}

function chRenderTurn(m) {
  var turn = el("div", "chturn");

  var row = el("div", "chmerow");
  row.appendChild(el("div", "chme", m.q));
  turn.appendChild(row);

  var bot = el("div", "chbot");
  var who = el("div", "chwho");
  var mk = el("span", "m"); mk.innerHTML = MARK;   // the same mark as the rail and the phone
  who.appendChild(mk);
  who.appendChild(el("span", null, "Echo"));
  bot.appendChild(who);

  /* A div, not a p: a structured reply carries headings and lists, and a <p> cannot legally hold
     either. Prose replies look identical — .chlead styles the box, not the tag. */
  var lead = el("div", "chlead");
  if (m.pending) {
    /* Three dots rather than a spinner: the answer is already below, so this says "still
       wording it", not "still working out whether there is an answer". */
    lead.className = "chlead thinking";
    lead.innerHTML = '<span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>';
  } else {
    lead.innerHTML = m.lead;    // assembled from escaped parts, or escaped model text
  }
  bot.appendChild(lead);

  /* THE TILES BELONG TO THE COMPOSED ANSWER, NOT TO EVERY ANSWER. Matches / Newest / Published is
     what chAnsFind computes to support ITS sentence. Rendering them under a model reply put the
     same three-column skeleton beneath every question whatever had been asked, which is what made
     the bot look like it was filling in a form. Smart mode shows what the model actually said. */
  if (!m.smartTurn && m.stats && m.stats.length) {
    var stats = el("div", "chstat");
    m.stats.forEach(function (s) {
      var c = el("div", "chsc");
      c.appendChild(el("div", "chsk", s[0]));
      c.appendChild(el("div", "chsv", s[1]));
      if (s[2]) c.appendChild(el("div", "chss", s[2]));
      stats.appendChild(c);
    });
    bot.appendChild(stats);
  }

  /* The same card the rest of the app draws, one surface down. An answer and a story should never
     look like two different products, and every claim above stays a link away from what it was
     read from.

     In Smart mode they go behind a disclosure. Six cards under every reply was the app insisting on
     showing its work whether the answer needed it or not, and it made a two-line answer look like a
     page. Evidence is one click away, which is the right distance for something you check rather
     than read. */
  if (m.items && m.items.length) {
    if (m.smartTurn) {
      var det = el("details", "chsrcd");
      det.appendChild(el("summary", null, chPl(m.items.length, "story", "stories") + " behind this"));
      var folded = el("div", "chsrc");
      m.items.forEach(function (doc) { folded.appendChild(articleCard(doc.raw, {})); });
      det.appendChild(folded);
      bot.appendChild(det);
    } else {
      var src = el("div", "chsrc");
      m.items.forEach(function (doc) { src.appendChild(articleCard(doc.raw, {})); });
      bot.appendChild(src);
    }
  }

  /* Where the conversation goes next, offered rather than guessed at. They ASK on click: a chip
     that only filled the box would be a suggestion you then have to confirm, which is a step for
     nothing when the chip already is the question. */
  if (m.followUps && m.followUps.length) {
    var fu = el("div", "chfu");
    m.followUps.forEach(function (fq) {
      var b = el("button", "chfub", fq);
      b.onclick = function () { chAsk(fq); };
      fu.appendChild(b);
    });
    bot.appendChild(fu);
  }

  /* The ranking footnote explains how the COMPOSED answer ordered its stories. Under a model
     reply it describes work the reader is not looking at. */
  if (!m.smartTurn && m.why) bot.appendChild(el("div", "chwhy", m.why));
  if (m.note) bot.appendChild(el("div", "chnote", m.note));
  bot.appendChild(chUsage(m));

  turn.appendChild(bot);
  return turn;
}

function renderAsk(app) {
  var ix = chIndex(), d = S.data || {};
  var pane = el("div", "chpane");
  var flow = el("div", "chflow" + (CH_LOG.length ? "" : " start"));

  if (!CH_LOG.length) {
    var name = chHello();
    /* The invitation is always its own element now. It used to be a bare text node when there
       was no name to greet, which left the gradient with nothing to paint through on exactly
       the screen most people see. */
    var hi = el("div", "chhi");
    if (name) hi.appendChild(el("span", "chnm", name));
    hi.appendChild(el("span", "chask", "What do you want to know?"));
    flow.appendChild(hi);

    var intro = el("p", "chintro");
    intro.innerHTML =
      "Ask about a competitor, a market, a theme, what you have spent, or what is moving. " +
      "I read only what your phone has fetched — <b>" + chPl(ix.docs.length, "story", "stories") +
      "</b>, plus your <b>" + chPl(ix.comps.length, "competitor", "competitors") + "</b> and <b>" +
      chPl(ix.lands.length, "market", "markets") + "</b>. There is no model behind me and no key in " +
      (chSmart()
        ? "this page. Wording comes from " + CH_MODEL + " using your own key, over those stories and " +
          "nothing else — so I still cannot tell you anything that is not already here."
        : "this page, so asking costs nothing — and I cannot tell you anything that is not already here.");
    flow.appendChild(intro);

    var grid = el("div", "chsug");
    chSuggestions().forEach(function (s) {
      var b = el("button", "chsg");
      b.appendChild(el("span", "k", s[0]));
      b.appendChild(el("span", "t", s[1]));
      b.onclick = function () { chAsk(s[1]); };
      grid.appendChild(b);
    });
    flow.appendChild(grid);
  } else {
    CH_LOG.forEach(function (m) { flow.appendChild(chRenderTurn(m)); });
  }
  pane.appendChild(flow);

  /* ---- the dock ---- */
  var dock = el("div", "chdock");

  var ctx = el("div", "chctx");

  /* Basic / Smart, in the same segmented control the analytics window uses. It leads the context
     line rather than taking a row of its own — the dock is already the densest part of this
     screen and a mode switch is a small thing to say. */
  var mode = chMode(), seg = el("div", "chseg");
  [["basic", "Basic"], ["smart", "Smart"]].forEach(function (o) {
    /* The label is a span so it can sit ABOVE the shimmer. The sheen and the sparkles are
       pseudo-elements on the button, which paint over its background; without a positioned child
       to raise, they would wash across the word as well as behind it. */
    var b = el("button", (mode === o[0] ? "on" : "") + (o[0] === "smart" ? " smartseg" : ""));
    b.appendChild(el("span", "chsegl", o[1]));
    b.title = o[0] === "basic"
      ? "Answers composed here from your own stories. Free, instant, works offline."
      : "Same stories, phrased by " + CH_MODEL + " with your own key.";
    /* The burst fires on SWITCHING TO Smart, not on every render. render() rebuilds this button,
       so the class cannot simply be added here and left — the flag survives the rebuild and is
       spent by the builder on the far side of it. */
    b.onclick = function () {
      var was = chMode();
      chSetMode(o[0]);
      CH_SPARK = (o[0] === "smart" && was !== "smart");
      render();
    };
    if (o[0] === "smart" && mode === "smart" && CH_SPARK) {
      CH_SPARK = false;
      b.classList.add("spark");
      (function (btn) { setTimeout(function () { btn.classList.remove("spark"); }, 950); })(b);
      smartWash();
    }
    seg.appendChild(b);
  });
  ctx.appendChild(seg);

  ctx.appendChild(document.createTextNode("Reading "));
  ctx.appendChild(el("b", null, chPl(ix.docs.length, "story", "stories")));
  var srcMode = newsSourceOf(d);
  if (srcMode) {
    ctx.appendChild(document.createTextNode(" · phone is on "));
    ctx.appendChild(el("b", null, srcMode === "rss" ? "free RSS" : srcMode));
  }
  if (CH_LOG.length) {
    ctx.appendChild(document.createTextNode(" · "));
    var clr = el("button", null, "Clear");
    clr.onclick = function () { CH_LOG = []; render(); };
    ctx.appendChild(clr);
  }
  dock.appendChild(ctx);

  /* Smart with no key asks for one HERE, rather than sending you to Settings to find a field you
     have never seen. Same input and buttons as the Settings row, so it is one control in two
     places rather than two controls. */
  var wantsKey = mode === "smart" && !chKey();
  if (wantsKey) {
    var kn = el("div", "chkey");
    kn.appendChild(el("p", "chkn",
      "Smart mode needs a Google AI Studio key. It is stored in this browser only — never in the " +
      "page, never in your Drive backup. Calls carry no search grounding, so they run on the free tier."));
    var krow = el("div", "keyrow");
    var kin = el("input", "keyin");
    kin.type = "password"; kin.autocomplete = "off"; kin.spellcheck = false;
    kin.placeholder = "Paste your Gemini API key";
    var ksave = el("button", "btn sm", "Save");
    var commit = function () {
      var v = kin.value.trim();
      if (!v) { toast("Paste a key first"); return; }
      chSetKey(v); render(); toast("Smart mode is on");
    };
    ksave.onclick = commit;
    kin.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); commit(); } };
    var glink = el("a", "chkl", "Get a free key");
    glink.href = "https://aistudio.google.com/apikey";
    glink.target = "_blank"; glink.rel = "noopener noreferrer";
    krow.appendChild(kin); krow.appendChild(ksave); krow.appendChild(glink);
    kn.appendChild(krow);
    dock.appendChild(kn);
  }

  var box = el("div", "chbox" + (chSmart() ? " smart" : ""));
  var input = el("input", "chin");
  input.id = "chIn";
  input.type = "text";
  input.placeholder = "Ask about your news, competitors, markets or spend";
  input.autocomplete = "off";
  input.setAttribute("enterkeyhint", "send");
  input.value = CH_DRAFT;

  var go = el("button", "chgo");
  go.innerHTML = ICON_SEND;
  go.title = "Ask"; go.setAttribute("aria-label", "Ask");
  /* The stroke animates while the box is BEING USED — focused, or holding a draft. Running it
     whenever Smart is merely selected would put a rotating gradient on the screen for as long as
     the tab is open, which is a very different thing from a box that responds to you. */
  var sync = function () {
    go.classList.toggle("on", !!input.value.trim());
    box.classList.toggle("live",
      chSmart() && (document.activeElement === input || !!input.value.trim()));
  };
  input.onfocus = sync;
  input.onblur = sync;
  input.oninput = function () { CH_DRAFT = input.value; sync(); };
  input.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); chAsk(input.value); } };
  go.onclick = function () { chAsk(input.value); };
  sync();

  box.appendChild(input);
  box.appendChild(go);
  dock.appendChild(box);
  pane.appendChild(dock);
  app.appendChild(pane);

  /* Land on the newest turn. After layout, or scrollHeight is still the old one. On a phone
     the keyboard is not opened for you — that would cover the conversation you just asked for. */
  if (railIsPermanent()) input.focus();
  if (CH_LOG.length) {
    requestAnimationFrame(function () {
      var s = $("#scroll");
      if (s && S.tab === "ask") s.scrollTop = s.scrollHeight;
    });
  }
}

/* Ask is in here so the tab uses the whole monitor rather than sitting in an 820px column
   pinned to the left with the other half of a wide screen empty. The conversation itself is
   capped and centred inside it by .chpane: filling 1680px with a chat line would trade one
   bad layout for another, since a 1600px line of body text is unreadable however much room
   there is. Capped and centred is what the reference does too. */
var WIDE_TABS = ["dashboard", "alerts", "saved", "published", "liked", "disliked",
                 "database", "restorepoints", "ask", "reports"];

/* ============================================================
   SKELETONS
   ------------------------------------------------------------
   Every screen gets the shape of its own content. The tab is known before the data is, because
   S.tab is restored from localStorage, so the page can hold the right shape open while Drive
   answers rather than showing a generic block and rearranging itself afterwards.
   ============================================================ */
var SK_N = 0;
/* Blocks pulse on a short stagger, so a card reads as one object settling rather than as
   eight rectangles blinking in lockstep. */
function sk(w, h, r) {
  var n = el("div", "ldb");
  n.style.width = typeof w === "number" ? w + "px" : w;
  n.style.height = (h || 12) + "px";
  if (r) n.style.borderRadius = r + "px";
  n.style.animationDelay = ((SK_N++ % 7) * 90) + "ms";
  return n;
}
function skGap(h) { var n = el("div"); n.style.height = h + "px"; n.style.flex = "0 0 auto"; return n; }
function skRow(a, b) {
  var r = el("div", "ldrow"); r.appendChild(a); r.appendChild(b); return r;
}

function skeletonFor(tab) {
  SK_N = 0;
  if (tab === "dashboard") return skDashboard();
  if (tab === "ask") return skAsk();
  if (tab === "reports") return skList(skReportCard, 3);
  if (tab === "database") return skDatabase();
  if (tab === "restorepoints") { var f = document.createDocumentFragment();
    f.appendChild(skLabel()); f.appendChild(skList(skSlimCard, 5)); return f; }
  return skList(skNewsCard, 4);   // every feed list draws the same card
}

/* Measured, not assumed: scrollbar width is a platform and setting-dependent number, and it
   is zero where the scrollbar overlays the content. Re-measured on resize because moving a window
   between displays can change it. */
function measureScrollbar() {
  var sc = $("#scroll");
  if (!sc) return;
  var w = sc.offsetWidth - sc.clientWidth;
  document.documentElement.style.setProperty("--sbw", (w > 0 ? w : 0) + "px");
}
window.addEventListener("resize", measureScrollbar);

function render() {
  renderDrawerNav(); renderSyncRow(); renderDrawerSettings(); renderTitle();
  /* Wide is for pages whose content is a grid and genuinely gets better with room. Reports
     and the assistant are prose, and prose has a measure past which it stops being readable,
     so they keep the narrow wrap no matter how large the screen is. */
  $("#shell").classList.toggle("wide", WIDE_TABS.indexOf(S.tab) >= 0);
  /* Turns the scroll column into a flex column so the composer can dock at the
     bottom of the viewport instead of trailing the last message. */
  $("#shell").classList.toggle("chat", S.tab === "ask");
  /* Same trick as the chat tab: the scroll column becomes a flex column so the preview pane
     can fill the height instead of collapsing to its content. */
  $("#shell").classList.toggle("split", S.tab === "reports");
  var app = $("#app"); app.innerHTML = "";
  var d = S.data, i;

  if (S.loading) {
    app.appendChild(skeletonFor(S.tab));
    refreshReportBar(); return;
  }
  if (!d) { app.appendChild(emptyState("Nothing loaded yet.")); refreshReportBar(); return; }

  if (S.tab === "dashboard") {
    renderDashboard(app, d);
  }
  else if (S.tab === "ask") {
    renderAsk(app);
  }
  else if (S.tab === "alerts") {
    /* The glance strip, moved here from Analytics. Same tiles, same horizontal scroll, same
       drag-to-push: it is the overview OF this feed, so it belongs above it. */
    var wg = d.widgets || {};
    if (Object.keys(wg).length) app.appendChild(renderWidgetStrip(wg));
    newsWall(app, alerts(), { verifiable: true, placeholder: "Search alerts",
      empty: "No alerts. Everything here has been published, or your phone has not backed up yet." });
  }
  else if (S.tab === "saved") {
    newsWall(app, arr(d.savedNews), { placeholder: "Search saved stories",
      empty: "Nothing saved." });
  }
  else if (S.tab === "published") {
    newsWall(app, published(), { publishedPill: true, placeholder: "Search published stories",
      empty: "Nothing published yet. Verify some alerts, then generate a report." });
  }
  else if (S.tab === "reports") {
    renderReports(app);
  }
  else if (S.tab === "liked" || S.tab === "disliked") {
    var titles = arr(S.tab === "liked" ? d.likedTitles : d.dislikedTitles).map(key);
    var pool = arr(d.newsArticles).concat(arr(d.alerts), arr(d.publishedNews), arr(d.savedNews));
    var seen = new Set(), out = [];
    titles.forEach(function (t) {
      if (seen.has(t)) return;
      seen.add(t);
      var hit = pool.filter(function (a) { return key(a.title) === t; })[0];
      out.push(hit || { title: t, category: "", summary: "", source: "" });
    });
    newsWall(app, out, {
      placeholder: S.tab === "liked" ? "Search liked stories" : "Search disliked stories",
      empty: S.tab === "liked" ? "Nothing liked yet." : "Nothing disliked yet." });
  }
  else if (S.tab === "restorepoints") {
    var rps = arr(d.restorePoints).slice().sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
    if (!rps.length) app.appendChild(emptyState("No restore points."));
    rps.forEach(function (rp) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", rp.name));
      card.appendChild(el("p", "sum", rp.timestamp ? new Date(rp.timestamp).toLocaleString("en-GB") : ""));
      app.appendChild(card);
    });
    if (rps.length) {
      var note = el("div", "info");
      note.appendChild(el("div", "i", "i"));
      var nc = el("div");
      nc.appendChild(el("b", null, "Listed, not stored here"));
      nc.appendChild(document.createTextNode(
        "Each snapshot holds a full copy of every table. Sending those would turn one backup into " +
        "several copies of the whole database, so only the name and date travel. Restoring one is " +
        "done on the phone."));
      note.appendChild(nc);
      app.appendChild(note);
    }
  }
  else if (S.tab === "database") {
    var comps = arr(d.competitors), prods = arr(d.competitorProducts);
    app.appendChild(el("div", "lbl", "Competitors"));
    if (!comps.length) app.appendChild(emptyState("No competitors onboarded."));
    comps.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", c.name));
      if (c.websiteUrl) card.appendChild(linkRow(c.websiteUrl, c.websiteUrl.replace(/^https?:\/\//, "") + " ↗"));
      if (c.keyProduct) card.appendChild(kv("Key product", c.keyProduct));
      if (c.markets) card.appendChild(kv("Markets", c.markets));
      var mine = prods.filter(function (p) { return key(p.competitorName) === key(c.name); });
      if (mine.length) card.appendChild(kv("Products", mine.map(function (p) { return p.name; }).join(", ")));
      if (c.insights) card.appendChild(el("p", "sum", c.insights));
      app.appendChild(card);
    });

    app.appendChild(el("div", "lbl", "Markets"));
    var nations = arr(d.countries);
    if (!nations.length) app.appendChild(emptyState("No markets onboarded."));
    nations.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("p", "ttl", c.name));
      if (c.constructionGdp) card.appendChild(kv("Construction GDP", c.constructionGdp));
      if (c.cagr) card.appendChild(kv("CAGR", c.cagr));
      app.appendChild(card);
    });

    app.appendChild(el("div", "lbl", "Norms and codes"));
    var norms = arr(d.normCodes);
    if (!norms.length) app.appendChild(emptyState("No norms or codes onboarded."));
    norms.forEach(function (n) {
      var card = el("div", "card");
      var top = el("div", "crow");
      top.appendChild(el("span", "cat", n.type || "Norm"));
      top.appendChild(el("span", "meta", n.timeValue || ""));
      card.appendChild(top);
      card.appendChild(el("p", "ttl", n.name));
      card.appendChild(kv("Applies to", (n.countryName || "All") + " · " + (n.competitorName || "All")));
      if (n.linkUrl) card.appendChild(linkRow(n.linkUrl, "Open ↗"));
      app.appendChild(card);
    });
  }

  /* The explanatory note lives at the foot of Alerts only — it explains this tab. */
  if (S.tab === "alerts" && alerts().length) {
    var box = el("div", "info");
    box.appendChild(el("div", "i", "i"));
    var c2 = el("div");
    c2.appendChild(el("b", null, "What happens when you publish"));
    c2.appendChild(document.createTextNode(
      "Verified stories become a report and move to Published, exactly as on the phone. " +
      "This page writes only its own file in your Drive, so it can never overwrite news your phone fetched."));
    box.appendChild(c2);
    app.appendChild(box);
  }
  refreshReportBar();
  measureScrollbar();
}

function refreshReportBar() {
  var n = verifiedArticles().length;
  $("#vcount").textContent = String(n);
  $("#repbar").classList.toggle("on", n > 0 && S.tab === "alerts");
}
function toggleVerify(title) {
  var k = key(title);
  var cur = S.actions.verifiedTitles.map(key);
  var i = cur.indexOf(k);
  if (i >= 0) S.actions.verifiedTitles.splice(i, 1); else S.actions.verifiedTitles.push(k);
  save(); render();
  /* Already saved locally, so a failed upload is not data loss — say so rather than
     throwing an unhandled rejection into the console. */
  pushActions().catch(function (e) {
    setStatus("Verified here, but not saved to Drive yet: " + e.message, true);
  });
}

/* ============================================================
   REPORTS
   ============================================================ */
function reportHtml(title, dateLabel, articles) {
  return "<h1>" + esc(title) + "</h1><p class='r-sub'>" + esc(dateLabel) + " · " +
    articles.length + " article(s)</p>" +
    articles.map(function (a) {
      return "<div class='r-art'>" +
        "<div class='r-meta'>" + esc(a.category || "News") +
          (a.date ? " · " + esc(a.date) : "") +
          (a.source ? " · " + esc(a.source) : "") + "</div>" +
        "<h2>" + esc(a.title) + "</h2>" +
        (a.summary ? "<p class='r-sum'>" + esc(a.summary) + "</p>" : "") +
      "</div>";
    }).join("");
}
/* PDF via the browser's own print dialogue ("Save as PDF"). No library, no CDN, and
   the output matches what you see rather than a re-implementation of it. */
function printReport(title, dateLabel, articles) {
  $("#report").innerHTML = reportHtml(title, dateLabel, articles);
  var prev = document.title;
  document.title = title + " — " + dateLabel;
  window.print();
  setTimeout(function () { document.title = prev; }, 500);
}
/* Word: an HTML document served with Word's MIME type. Word and Google Docs both
   open it as a normal editable document, and it needs no zip library. */
function downloadWord(title, dateLabel, articles) {
  var doc =
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' +
    'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}' +
    'h1{font-size:18pt;margin:0 0 4pt}.r-sub{color:#555;font-size:9pt;margin:0 0 18pt}' +
    'h2{font-size:12pt;margin:0 0 4pt}.r-meta{font-size:8.5pt;color:#666;margin:0 0 4pt}' +
    '.r-sum{font-size:10pt;line-height:1.5;margin:0}' +
    '.r-art{margin:0 0 14pt;padding:0 0 10pt;border-bottom:1pt solid #ddd}' +
    '</style></head><body>' + reportHtml(title, dateLabel, articles) + '</body></html>';
  var blob = new Blob(["﻿", doc], { type: "application/msword" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = String(title).replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") + "-" +
    String(dateLabel).replace(/\s+/g, "-") + ".doc";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* ============================================================
   REPORTS
   ------------------------------------------------------------
   The phone draws both documents and uploads them beside the backup. This page fetches those
   bytes and shows them; it does not render a report of its own, because a second renderer is a
   second format, and the two would drift the first time either changed.

   Three files per edition, named for the edition id:
     echo-report-<id>.pdf        the PDF, as the phone drew it
     echo-report-<id>-word.pdf   the same content at docx fidelity, for previewing Word
     echo-report-<id>.docx       the Word file itself
   ============================================================ */
var R_SEL = null;          // which edition is open
var R_FMT = {};            // id -> "pdf" | "word", per card, as asked
var R_URL = {};            // "<name>" -> object URL, so a re-select does not re-download
var R_MISS = {};           // "<name>" -> true when Drive does not have it

function reportFile(id, kind) {
  return kind === "docx" ? "echo-report-" + id + ".docx"
       : kind === "word" ? "echo-report-" + id + "-word.pdf"
       : "echo-report-" + id + ".pdf";
}
/* Fetch once, keep the object URL. Returns null when the phone has not uploaded it yet, which
   is a normal state rather than an error: the files appear on the next backup. */
async function reportBlobUrl(name) {
  if (R_URL[name]) return R_URL[name];
  if (R_MISS[name]) return null;
  var f = await findFile(name);
  if (!f) { R_MISS[name] = true; return null; }
  var r = await dFetch("https://www.googleapis.com/drive/v3/files/" + f.id + "?alt=media");
  if (!r.ok) { R_MISS[name] = true; return null; }
  R_URL[name] = URL.createObjectURL(await r.blob());
  return R_URL[name];
}

function reportPreviewMsg(host, text) {
  host.innerHTML = "";
  var m = el("div", "rpmsg");
  m.appendChild(el("span", null, text));
  host.appendChild(m);
}

/* Load whichever document the selected card is set to. PDF for both states: the Word one is the
   phone's docx-fidelity render, which is what the phone shows for the same button. */
async function loadReportPreview() {
  var host = $("#rpBody");
  if (!host) return;
  if (R_SEL == null) { reportPreviewMsg(host, "Choose a report on the left to read it here."); return; }
  var fmt = R_FMT[R_SEL] || "pdf";
  var name = reportFile(R_SEL, fmt);
  reportPreviewMsg(host, "Opening\u2026");
  try {
    var url = await reportBlobUrl(name);
    if (R_SEL == null) return;
    if (!url) {
      reportPreviewMsg(host,
        "Your phone has not uploaded this one yet. It writes both documents when it backs up, so " +
        "open Settings, then Storage, and press Back up. Nothing is rebuilt here \u2014 this page " +
        "shows the file the phone made, which is what keeps the two identical.");
      return;
    }
    host.innerHTML = "";
    var f = el("iframe");
    f.src = url + "#toolbar=0&navpanes=0";
    f.title = "Report preview";
    host.appendChild(f);
  } catch (e) {
    reportPreviewMsg(host, "Could not open it: " + (e.message || e));
  }
}

function renderReports(app) {
  var eds = editions();          // already newest first, by createdAtMillis
  if (!eds.length) { app.appendChild(emptyState("No reports yet.")); return; }
  if (R_SEL == null || !eds.some(function (e) { return e.id === R_SEL; })) R_SEL = eds[0].id;

  var split = el("div", "rsplit");
  var list = el("div", "rlist");

  eds.forEach(function (e) {
    var fmt = R_FMT[e.id] || "pdf";
    var card = el("div", "rcard" + (e.id === R_SEL ? " on" : ""));
    card.onclick = function () { R_SEL = e.id; render(); loadReportPreview(); };

    var top = el("div", "rctop");
    top.appendChild(el("span", "rcwk", e.weekLabel || "Report"));
    top.appendChild(el("span", "rcdate", e.dateLabel || ""));
    card.appendChild(top);
    card.appendChild(el("p", "rcttl", e.title || "Market report"));
    card.appendChild(el("p", "rcsub", chPl(arr(e.articles).length, "article", "articles") + " \u00b7 " +
      (e.competitorsCount || 0) + " competitors \u00b7 " + (e.countriesCount || 0) + " markets"));

    var foot = el("div", "rcfoot");
    var seg = el("div", "rcseg");
    [["pdf", "PDF"], ["word", "Word"]].forEach(function (o) {
      var b = el("button", fmt === o[0] ? "on" : null, o[1]);
      b.onclick = function (ev) {
        ev.stopPropagation();          // choosing a format is not choosing a different report
        R_FMT[e.id] = o[0];
        R_SEL = e.id;
        render(); loadReportPreview();
      };
      seg.appendChild(b);
    });
    foot.appendChild(seg);

    /* The label follows the switch, so the button never promises a format you did not pick. */
    var dl = el("button", "btn sm rcdl", fmt === "word" ? "Download Word" : "Download PDF");
    dl.onclick = async function (ev) {
      ev.stopPropagation();
      var kind = fmt === "word" ? "docx" : "pdf";
      var name = reportFile(e.id, kind);
      dl.disabled = true;
      var was = dl.textContent; dl.textContent = "Fetching\u2026";
      try {
        var url = await reportBlobUrl(name);
        if (!url) { toast("Your phone has not uploaded this one yet. Press Back up on the phone."); return; }
        var a = document.createElement("a");
        a.href = url;
        a.download = (e.title || "Market report").replace(/[^\w\s-]/g, "").trim()
          .replace(/\s+/g, "-") + "-" + String(e.dateLabel || "").replace(/\s+/g, "-") +
          (kind === "docx" ? ".docx" : ".pdf");
        document.body.appendChild(a); a.click(); a.remove();
      } finally { dl.disabled = false; dl.textContent = was; }
    };
    foot.appendChild(dl);
    card.appendChild(foot);
    list.appendChild(card);
  });

  var prev = el("div", "rprev");
  var head = el("div", "rphead");
  var sel = eds.filter(function (e) { return e.id === R_SEL; })[0];
  var selFmt = R_FMT[R_SEL] || "pdf";
  head.appendChild(el("b", null, (sel && sel.title) || "Report"));
  head.appendChild(el("span", null, (sel && sel.dateLabel) || ""));
  var badge = el("span", null, selFmt === "word" ? "Word preview" : "PDF");
  badge.style.marginLeft = "auto";
  head.appendChild(badge);
  prev.appendChild(head);
  var body = el("div", "rpbody"); body.id = "rpBody";
  prev.appendChild(body);

  split.appendChild(list);
  split.appendChild(prev);
  app.appendChild(split);
  loadReportPreview();
}

/* Publishing. Verified stories become an edition, move to Published, and leave
   Alerts. Everything here is ADDITIVE — we append to our own file and never touch
   the phone's, so nothing the phone holds can be lost. */
async function publishVerified(kind) {
  var list = verifiedArticles();
  if (!list.length) return;
  var ok = await askConfirm({
    title: "Publish " + list.length + " article(s)?",
    body: "They move out of Alerts and into Published, and become a report you can download again later. Your phone picks this up on its next sync.",
    ok: "Publish"
  });
  if (!ok) return;

  var now = Date.now();
  var dateLabel = new Date(now).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  var title = "Window Market Report";
  if (kind === "pdf") printReport(title, dateLabel, list); else downloadWord(title, dateLabel, list);

  var jan1 = new Date(new Date(now).getFullYear(), 0, 1).getTime();
  var wk = Math.ceil((((now - jan1) / 86400000) + 1) / 7);
  S.actions.reportEditions.push({
    id: now, title: title, dateLabel: dateLabel, weekLabel: "Week " + wk, createdAtMillis: now,
    articles: list,
    verifiedTitles: list.map(function (a) { return key(a.title); }),
    competitorsCount: arr(S.data && S.data.competitors).length,
    countriesCount: arr(S.data && S.data.countries).length
  });
  list.forEach(function (a) {
    S.actions.publishedNews.push(a);
    S.actions.publishedTitles.push(key(a.title));
  });
  var gone = new Set(list.map(function (a) { return key(a.title); }));
  S.actions.verifiedTitles = S.actions.verifiedTitles.filter(function (t) { return !gone.has(key(t)); });
  save(); render();
  setStatus("Saving to Drive…");
  try {
    await pushActions(true);
    setStatus("");
    toast(list.length + " article(s) published");
  } catch (e) {
    setStatus("Published here, but saving to Drive failed: " + e.message, true);
  }
}

/* ============================================================
   LOAD
   ============================================================ */
async function loadEverything() {
  S.loading = true; render();
  setStatus("Loading from Drive…");
  var data = null;
  try { data = await readJson(DATA_FILE); }
  finally { S.loading = false; }

  if (!data) {
    S.data = { alerts: [] };
    setStatus("Nothing in Drive yet. On your phone open Settings, then Storage, and press Back up.", true);
    render(); return;
  }
  S.data = data;

  /* Merge whatever this browser previously wrote, so a fresh device sees it too. */
  var remote = await readJson(ACTIONS_FILE).catch(function () { return null; });
  if (remote) {
    var merge = function (a, b, byKey) {
      var out = arr(a).slice(), seen = new Set(out.map(byKey));
      arr(b).forEach(function (x) {
        var k = byKey(x);
        if (!seen.has(k)) { seen.add(k); out.push(x); }
      });
      return out;
    };
    S.actions.verifiedTitles  = merge(S.actions.verifiedTitles,  remote.verifiedTitles,  key);
    S.actions.publishedTitles = merge(S.actions.publishedTitles, remote.publishedTitles, key);
    S.actions.publishedNews   = merge(S.actions.publishedNews,   remote.publishedNews,
      function (a) { return key(a && a.title); });
    S.actions.reportEditions  = merge(S.actions.reportEditions,  remote.reportEditions,
      function (e) { return e && e.id; });
    save();
  }
  /* The backup time lives in the rail now, where it is one line on every page instead of a
     full-width row under every title. This slot goes back to being the error channel only,
     which is what it is used for everywhere else. */
  setStatus("");
  render();
}

async function start() {
  // Signed in: the sidebar mark's gradient sweep keys off this. See body.in in the stylesheet.
  document.body.classList.add("in");
  $("#gate").style.display = "none";
  $("#shell").hidden = false;
  applyTheme();
  /* !S.name as well as !S.email, so somebody who signed in before this shipped picks the
     name up on their next open rather than staying on the address forever. */
  if (!S.email || !S.name) {
    var who = await accountIdentity();
    if (who) { S.email = who.email || S.email; S.name = who.name || S.name; save(); }
  }
  try { await loadEverything(); }
  catch (e) { S.loading = false; setStatus(e.message, true); render(); }
}

/* ============================================================
   SETTINGS
   ============================================================ */
async function openSettings() {
  var out = await askShell(function (box, done) {
    box.appendChild(el("h2", "askttl", "Settings"));
    box.appendChild(el("p", "askbody", "Signed in as " + (S.email || "this account") + "."));
    box.appendChild(el("p", "askbody",
      "This page never fetches news — only your phone does. It reads your Drive backup and " +
      "writes back only what you verify or publish here."));
    box.appendChild(el("p", "askbody",
      "Signing out forgets the connection in this browser only. Nothing in your Drive is deleted, " +
      "and signing back in will not ask again."));
    var row = el("div", "askrow");
    var close = el("button", "btn sm ghost", "Close");
    close.onclick = function () { done(false); };
    var so = el("button", "btn sm", "Sign out");
    so.onclick = function () { done(true); };
    row.appendChild(close); row.appendChild(so);
    box.appendChild(row);
  });
  if (out) signOut();
}

function openSettingsPanel() {
  renderDrawerSettings();
  renderSyncRow();
  $("#settingsPanel").hidden = false;
  $("#btnSettingsClose").focus();
}
function closeSettingsPanel() { $("#settingsPanel").hidden = true; }

/* ============================================================
   WIRING
   ============================================================ */
/* Phone height is not one number: on a first launch the browser still reports the
   chrome it is about to retract, so the app lays out taller than the screen and the
   report bar ends up below the fold. visualViewport is the value that settles. */
function sizeShell() {
  var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty("--apph", h + "px");
}
window.addEventListener("resize", sizeShell);
if (window.visualViewport) window.visualViewport.addEventListener("resize", sizeShell);
sizeShell();

$("#gateMark").innerHTML = MARK;
$("#btnMenu").innerHTML = ICON_MENU;
$("#btnClose").innerHTML = ICON_X;
/* No innerHTML for the rail mark: it wears the glyph as a CSS mask so the gradient
   underneath can move. An <svg> child would sit on top of it and hide the sweep. */
$("#btnMenu").onclick = openDrawer;
$("#btnClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
// Escape closes the drawer, matching the ask dialog.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (!$("#settingsPanel").hidden) { e.preventDefault(); closeSettingsPanel(); return; }
  if (drawerOpen()) { e.preventDefault(); closeDrawer(); }
});

$("#signin").onclick = async function () {
  setGateStatus("Opening Google sign-in…");
  try { await signIn(); setGateStatus(""); await start(); }
  catch (e) { setGateStatus(e.message, true); }
};
document.querySelectorAll(".themebtn").forEach(function (b) { b.onclick = toggleTheme; });
/* One listener for every Usage popover there will ever be, rather than one per turn: the log
   grows without bound and per-turn listeners would grow with it. */
document.addEventListener("click", function () {
  var open = document.querySelectorAll(".chuse.open");
  for (var i = 0; i < open.length; i++) {
    open[i].classList.remove("open");
    var b = open[i].querySelector(".chusebtn");
    if (b) b.setAttribute("aria-expanded", "false");
  }
});

$("#btnProfile").onclick  = openSettingsPanel;   // the one way in, from the rail
$("#btnSettingsClose").onclick = closeSettingsPanel;
$("#settingsPanel").onclick = function (e) {
  // Backdrop only: a click that started inside the pane must not dismiss it.
  if (e.target === this) closeSettingsPanel();
};
$("#genPdf").onclick  = function () { publishVerified("pdf"); };
$("#genWord").onclick = function () { publishVerified("word"); };
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

/* Offline + update. A new version is downloaded quietly and applied only when the
   user taps — never swapped under someone mid-read. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      /* A worker that finished installing on a PREVIOUS visit is already waiting now, and fires no
         updatefound event for this page to hear. Without this check the banner never appeared and
         the reader stayed on the old version through reload after reload — the only escape was
         closing every tab. Observed in the wild: a fix was live on the server, the browser had
         downloaded it, and the page kept running the previous build. */
      if (reg.waiting && navigator.serviceWorker.controller) $("#upd").classList.add("on");
      /* And keep checking, so a long-lived tab still learns about a deploy. */
      setInterval(function () { reg.update().catch(function () {}); }, 300000);
      reg.addEventListener("updatefound", function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", function () {
          if (w.state === "installed" && navigator.serviceWorker.controller) $("#upd").classList.add("on");
        });
      });
      $("#updGo").onclick = function () {
        if (reg.waiting) reg.waiting.postMessage("applyUpdate");
        location.reload();
      };
    }).catch(function () {});
  });
}

load();
applyTheme();
if (tokenAlive()) start();
else if (S.email) setGateStatus("Signed in before as " + S.email + ". Press the button to continue — it should not ask again.");
</script>
