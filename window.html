<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo</title>
<meta name="description" content="Read the market intelligence your phone gathered, verify what holds up, and publish it as a report.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<!--
  Echo — the web mirror of the Echo Android app.

  WHAT THIS IS
  A single static page. There is no server and no database. Your data lives in
  YOUR Google Drive, written there by the phone app, and this page reads it back.

  WHAT IT DELIBERATELY DOES NOT DO
  It never fetches news. Fetching costs money and only the phone does it. This
  page reads what the phone already gathered, lets you verify stories, and turns
  the verified ones into a report.

  THE SAFETY RULE — TWO FILES, ONE WRITER EACH
    echo-data.json          the phone writes it, this page only READS it
    echo-web-actions.json   this page writes it, the phone only READS it
  Because no field is written by both sides, neither can overwrite the other and
  no version is ever silently lost. This page can never destroy a news fetch the
  phone made while you were here.

  ON SECRETS
  Nothing secret is in this file. The OAuth *client ID* below is public by design —
  every web OAuth app ships one, and it is useless without a matching authorised
  origin. There is no client secret (the browser token flow does not use one), no
  API key, and no Gemini key: this page makes no AI calls at all. Your Google
  access token lives only in your own browser.
-->

<style>
/* ============================================================
   ECHO
   The phone app's language on the web: one accent that only ever
   means "interactive", layered near-black surfaces, sentence case,
   and a large iOS-style title over a segmented control.
   ============================================================ */

:root{
  --paper:#F5F5F7;      /* page */
  --surface:#FFFFFF;    /* cards, sheets */
  --surface-2:#F7F7F9;  /* inset panels, quiet chips */
  --track:#EAEAEF;      /* segmented-control track */
  --track-on:#FFFFFF;   /* selected segment */
  --ink:#1D1D1F;
  --ink-2:#3F4048;
  --ink-3:#5D5E66;
  --line:#E3E3E6;
  --line-2:#EFEFF1;     /* hairline INSIDE a card, softer than the card's own edge */
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --accent:#1F57F5;     /* Signal Blue — the single accent, matched to the phone */
  --accent-soft:rgba(31,87,245,.13);
  --free:#34C759;       /* the free feed */
  --paid:#E5A33B;       /* anything that spends */
  --danger:#F0616D;
  --sh-2:0 2px 6px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.09);
  --r-card:18px;       /* Sightline's radius — the softer corner is most of its calm */
  --r-box:10px;
  --r-pill:999px;
  /* TWO FACES FROM ONE FAMILY, SPLIT BY ROLE, NOT BY SIZE.
     --fs is Arial Nova Light: body, captions, every secondary row. It is the default on <body>
     and the reason the page reads as calm as it does.
     --fs-title is Arial Nova: headings, card titles, key labels, and every large figure. Light
     is lovely in a paragraph and goes soft the moment it has to hold the top of a hierarchy,
     which is exactly what a card title does. */
  --fs:'Arial Nova Light','Arial Nova','Segoe UI Light','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --fs-title:'Arial Nova','Arial Nova Light','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --apph:100dvh;
  --bento-gap:14px;
  /* The widget set's status ramp, from the widget mockups. Deliberately NOT the accent:
     --accent means "interactive", and a widget is not. These four mean what they say. */
  --good:#0F9D63; --good-wash:rgba(15,157,99,.12);
  --warn:#B45309; --warn-wash:rgba(180,83,9,.12);
  --crit:#DC2626; --crit-wash:rgba(220,38,38,.12);
  --info:#0E7490; --info-wash:rgba(14,116,144,.12);
  --track:rgba(60,60,67,.12);
  --widget-shadow:0 1px 2px rgba(20,20,28,.06), 0 12px 28px -8px rgba(20,20,28,.20);
  /* One easing curve for the whole interface, and the three durations that use it. */
  --ease:cubic-bezier(.2,.7,.3,1);
  --t-hover:200ms;
  --t-sheet:280ms;
  --t-reveal:420ms;
  /* Activity-heatmap ramp, light. Five steps, matching the phone's Heatmap(). */
  --heat-0:#EBEDF0; --heat-1:#9BE9A8; --heat-2:#40C463; --heat-3:#30A14E; --heat-4:#216E39;
}
/* THE DARK PALETTE, AND THE ONE RULE ABOUT IT.
   Dark has to be declared twice -- once for viewers whose system is dark and who have chosen
   nothing, once for viewers who picked dark explicitly -- because a media query and an attribute
   selector cannot be merged into one rule. THE TWO LISTS MUST STAY IDENTICAL, token for token.

   They were not, and it showed: --line-2 and --sh-1 were only in the explicit block. On a first
   visit with a dark system and no saved choice, every card fell back to the LIGHT border
   (#EFEFF1) and drew a thick white outline. Toggling to light and back set data-theme="dark",
   the second block took over, and the outline vanished -- which made it look like a rendering
   glitch rather than a missing token.

   So: never add a token to one of these blocks without adding it to the other. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E0E0E; --surface:#161618; --surface-2:#1F1F22;
    --track:#232329; --track-on:#43434E;
    --ink:#F5F5F7; --ink-2:#C9CAD3; --ink-3:#9A9CAB;
    --line:#2A2A2F;
    --line-2:#242427;
    --accent-soft:rgba(31,87,245,.20);
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
    --heat-0:#20222A; --heat-1:#0E4429; --heat-2:#006D32; --heat-3:#26A641; --heat-4:#39D353;
    --good:#10B981; --good-wash:rgba(16,185,129,.16);
    --warn:#F59E0B; --warn-wash:rgba(245,158,11,.16);
    --crit:#EF4444; --crit-wash:rgba(239,68,68,.16);
    --info:#06B6D4; --info-wash:rgba(6,182,212,.16);
    --track:rgba(235,235,245,.14);
    --widget-shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -10px rgba(0,0,0,.7);
  }
}
/* An explicit choice wins over the system, in both directions. Same list as above. */
:root[data-theme="dark"]{
  --paper:#0E0E0E; --surface:#161618; --surface-2:#1F1F22;
  --track:#232329; --track-on:#43434E;
  --ink:#F5F5F7; --ink-2:#C9CAD3; --ink-3:#9A9CAB;
  --line:#2A2A2F;
  --line-2:#242427;
  --accent-soft:rgba(31,87,245,.20);
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
  --heat-0:#20222A; --heat-1:#0E4429; --heat-2:#006D32; --heat-3:#26A641; --heat-4:#39D353;
  --good:#10B981; --good-wash:rgba(16,185,129,.16);
  --warn:#F59E0B; --warn-wash:rgba(245,158,11,.16);
  --crit:#EF4444; --crit-wash:rgba(239,68,68,.16);
  --info:#06B6D4; --info-wash:rgba(6,182,212,.16);
  --track:rgba(235,235,245,.14);
  --widget-shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -10px rgba(0,0,0,.7);
}

*{box-sizing:border-box;min-width:0}
/* An app shell, not a scrolling document: the header and tabs hold still and only
   the list moves. dvh tracks the browser chrome as it retracts; --apph is written
   from visualViewport because on a first launch dvh resolves against a viewport
   that has not settled yet, which leaves the bottom of the app below the fold. */
html,body{height:100%}
html,body{height:100dvh}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--fs);font-size:15px;line-height:1.55;font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  /* Kills the double-tap zoom on a mis-tapped control, and the 300ms delay
     browsers otherwise hold every tap for while they wait for a second one. */
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
/* The `hidden` ATTRIBUTE must win over any display we set here. The browser's own
   rule is `[hidden]{display:none}` at the lowest specificity, so an ID selector like
   `#ask{display:grid}` silently beats it — which left the full-screen dialog scrim
   permanently over the page, eating every click on the app underneath. */
[hidden]{display:none !important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:4px solid transparent;background-clip:content-box}

/* ---------- shell ---------- */
#shell{height:var(--apph);display:flex;flex-direction:column;overflow:hidden}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 20px}
/* The dashboard is the one view that WANTS the whole screen. Article lists keep the 880px
   measure because long headlines are read left-to-right and a 1600px line is punishing; a bento
   grid is scanned, not read, so starving it of width just makes the tiles small and the page
   look empty. #shell gets the wide class so the header and the grid stay aligned. */
#shell.wide .wrap{max-width:1680px}
#top{flex:0 0 auto;padding-top:max(14px,env(safe-area-inset-top))}
#scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding-bottom:40px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.mark{width:26px;height:26px;flex:0 0 26px;color:var(--ink)}
.bar .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--ink-3)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- title row ---------- */
.titlerow{display:flex;align-items:flex-start;gap:14px;padding:8px 0 2px}
.titlerow .tt{flex:1}
h1{font-size:34px;line-height:1.1;letter-spacing:-.5px;font-weight:700;margin:0}
.sub{color:var(--ink-3);font-size:15px;margin:4px 0 0}

/* Source chip — squarish, neutral, colour only in the dot. Mirrors the phone. */
/* Uses --track, the segmented-control colour, not --surface-2: in light mode surface-2 sits two
   steps from the page and the chip reads as no chip at all. */
.srcchip{display:inline-flex;align-items:center;gap:7px;background:var(--track);
  border-radius:var(--r-box);padding:7px 11px;margin-top:6px;font-size:13px;flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.srcchip .cv{color:var(--ink-3);font-size:12px}

/* ---------- drawer ---------- */
/* Slides over the page rather than pushing it, so the article you were reading does
   not reflow while you navigate. The scrim is a sibling, never a parent, so closing
   it can never leave an invisible layer over the app. */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;
  transition:opacity var(--t-hover) var(--ease);
  /* pointer-events, not just opacity. A transparent element still absorbs clicks, so
     while the scrim fades out it would block the app for the length of the animation —
     and if the tidy-up timer were ever missed, forever. This makes that impossible. */
  pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;z-index:50;width:min(310px,84vw);
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(-100%);transition:transform var(--t-sheet) var(--ease);
  padding:max(18px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom))}
#drawer.on{transform:translateX(0)}

/* ---------- wide screens: the rail stays put ---------- */
/* Sightline's shape. Above 1000px the drawer stops being a drawer: it is simply there, the
   hamburger disappears, and the main column is pushed across to sit beside it. Nothing about the
   markup changes — the same element is a permanent rail on a desktop and an overlay on a phone. */
@media (min-width:1000px){
  #drawer{
    width:290px;
    transform:none;                 /* never slid away */
    transition:none;
    background:var(--surface);
  }
  #shell{margin-left:290px}
  #gate{margin-left:290px}
  #btnMenu{display:none}
  #scrim{display:none !important}
  /* The reading column stops widening past a comfortable measure; the rest becomes margin.
     A 1600px-wide line of body text is unreadable however much room there is. */
  .wrap{max-width:820px;margin-left:0}
  #shell.wide .wrap{max-width:1680px;margin-left:0}
}
/* The rail is the navigation on a wide screen, so the drawer's own close button is noise there. */
@media (min-width:1000px){ #btnClose{display:none} }

/* ---------- sync status in the rail ---------- */
.syncrow{display:flex;align-items:center;gap:10px;padding:12px 18px 4px;font-size:12.5px;color:var(--ink-3)}
.syncdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--ink-3)}
.syncdot.ok{background:var(--free)}
.syncdot.behind{background:var(--paid)}
@media (prefers-reduced-motion:reduce){
  /* All of it, not just the drawer: a viewer who asked for less motion meant the whole page. */
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;
    animation-iteration-count:1 !important;scroll-behavior:auto !important}
  #drawer,#scrim{transition:none}
}
.dhead{display:flex;align-items:center;gap:11px;padding:0 18px 18px}
.dhead .mark{width:24px;height:24px;flex:0 0 24px}
.dhead .nm{font-family:var(--fs-title);font-size:16px;font-weight:600;letter-spacing:-.2px;flex:1}
.dsec{font-family:var(--fs-title);font-size:12px;font-weight:600;color:var(--ink-3);
  padding:16px 18px 7px}
.drow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 18px;font-size:14.5px;color:var(--ink-2);border-left:2.5px solid transparent}
.drow:hover{background:var(--surface-2);color:var(--ink)}
.drow.on{color:var(--accent);font-weight:600;border-left-color:var(--accent);
  background:var(--accent-soft)}
.drow .dn{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:400}
.drow.on .dn{color:var(--accent);opacity:.8}
/* Read-only settings rows: the phone owns these values, so they are stated, not offered. */
.srow{display:flex;align-items:baseline;gap:12px;padding:8px 18px;font-size:13.5px}
.srow .sk{color:var(--ink-3);flex:1}
.srow .sv{color:var(--ink);text-align:right;font-weight:500}
.srow .sv.dim{color:var(--ink-3);font-weight:400}
.dnote{font-size:11.5px;color:var(--ink-3);line-height:1.6;padding:10px 18px 0}
.dsep{height:1px;background:var(--line);margin:14px 18px 0}
/* The rail is a column: nav scrolls, footer is pinned. */
#drawer{display:flex;flex-direction:column}
#drawerNav{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#drawerFoot{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px;margin-top:8px}
.profrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
  border:0;cursor:pointer;padding:9px 8px;border-radius:10px;color:var(--ink-2);font:inherit}
.profrow:hover{background:var(--surface-2);color:var(--ink)}
.avatar{position:relative;width:26px;height:26px;flex:0 0 26px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;color:var(--ink-2)}
/* The sync signal rides ON the avatar rather than taking a row of its own — it is a status,
   not a menu item, and the footer is meant to be one line. */
.avatar .syncdot{position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;flex:0 0 8px;
  border:1.5px solid var(--surface);box-sizing:content-box}
.profname{flex:1;font-size:14px;font-weight:500}
.profchev{color:var(--ink-3);font-size:17px;line-height:1}
/* Settings panel */
#settingsPanel{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;justify-content:center}
.spane{background:var(--surface);width:min(520px,100%);max-height:82vh;display:flex;
  flex-direction:column;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}
.shead{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.stitle{flex:1;font-size:16px;font-weight:600;letter-spacing:-.2px}
.sbody{overflow-y:auto;padding:6px 0 22px}
@media (min-width:1000px){
  #settingsPanel{align-items:center}
  .spane{border-radius:18px;border-bottom:1px solid var(--line);max-height:78vh}
}

/* ---------- section label ---------- */
.lbl{font-family:var(--fs-title);font-size:13px;font-weight:600;color:var(--ink-3);margin:22px 0 10px}

/* ---------- cards ---------- */
.list{padding-top:12px}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat{font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--accent)}
.meta{font-size:12px;color:var(--ink-3)}
.ttl{font-family:var(--fs-title);font-size:15.5px;font-weight:600;line-height:1.4;margin:8px 0 0}
.sum{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:8px 0 0}
.adv{font-size:13px;color:var(--ink-2);line-height:1.6;margin:10px 0 0;
  padding-left:12px;border-left:2px solid var(--accent)}
.acts{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.kv{display:flex;padding:5px 0;font-size:13.5px}
.kv .k{color:var(--ink-3);width:130px;flex:0 0 130px}
.kv .v{color:var(--ink-2);flex:1}

/* ---------- buttons ---------- */
.btn{background:var(--accent);color:#fff;border-radius:var(--r-pill);
  padding:11px 20px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 15px;font-size:13px}
/* Google sign-in. Google's brand rules require the G mark to sit on white, so on our
   accent pill it gets its own white disc rather than being dropped straight on the blue. */
.btn.google{display:inline-flex;align-items:center;gap:11px;padding:5px 22px 5px 5px}
.btn.google .glogo{
  width:30px;height:30px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center
}
.btn.google .glogo svg{width:17px;height:17px;display:block}
.link{color:var(--accent);font-weight:600;font-size:13.5px;padding:7px 9px;border-radius:8px}
.link:hover{background:var(--accent-soft);text-decoration:none}

/* Verify control — a real checkbox, so it is keyboard reachable and reads correctly
   to a screen reader instead of being a div that happens to look checkable. */
.vf{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);
  cursor:pointer;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--line)}
.vf input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.vf.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--ink-3)}
.pill.ok{background:rgba(52,199,89,.15);color:var(--free)}

/* ---------- info box ---------- */
.info{display:flex;gap:12px;background:var(--surface);border-radius:var(--r-box);
  padding:14px;margin:16px 0 4px;font-size:13px;color:var(--ink-2);line-height:1.6}
.info .i{flex:0 0 20px;height:20px;border-radius:50%;background:var(--surface-2);
  color:var(--ink-3);display:grid;place-items:center;font-size:12px;font-weight:700;font-style:italic}
.info b{color:var(--ink);font-weight:600;display:block;margin-bottom:4px}

/* ---------- report bar ---------- */
#repbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 0 max(12px,env(safe-area-inset-bottom));display:none}
#repbar.on{display:block}
#repbar .inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#repbar .cnt{flex:1;font-size:14px;min-width:150px}

/* ---------- states ---------- */
.empty{text-align:center;color:var(--ink-3);padding:56px 20px;font-size:14px;line-height:1.7}
.status{font-size:13px;color:var(--ink-3);padding:10px 0}
.status.err{color:var(--danger)}
/* ============================================================
   DASHBOARD — bento
   ------------------------------------------------------------
   Two zones, and the split is the whole idea: a horizontal strip of the eight
   home-screen widgets for a glance, then a bento grid underneath for the detail.
   The strip answers "anything I should look at?", the grid answers "what is it?".

   The grid is 4 columns at desktop, 2 at tablet, 1 on a phone — so on mobile the
   cards land one under another, matching the app. Tiles claim width by MEANING
   (a calendar wants room; a single number does not), never by decoration.
   ============================================================ */
.dash{padding:2px 0 30px}
.dsub{font-size:12.5px;color:var(--ink-3);margin:0 0 14px;font-weight:300}

/* ============================================================
   THE GLANCE STRIP — the phone's home-screen widgets, as they were designed
   ------------------------------------------------------------
   Lifted from the widget mockups, not reinterpreted. Authored in dp: 1u = 1dp of a real 2x2
   Android widget (155x155dp), rendered at 1.55x so type stays legible on a desktop screen.
   Keeping the dp arithmetic means a widget that fits on the phone fits here, and the two can
   never quietly drift into being two different designs.

   The status ramp is the widget set's own, and deliberately NOT the accent: --accent means
   "interactive", and none of this is. Green, amber, red and teal mean what they say.
   ============================================================ */
.wstrip{
  display:flex;gap:18px;overflow-x:auto;padding:6px 2px 20px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.wstrip::-webkit-scrollbar{display:none}

.widget{
  --u:1.55px;
  flex:0 0 auto;scroll-snap-align:start;
  width:calc(155 * var(--u));
  height:calc(155 * var(--u));
  border-radius:calc(28 * var(--u));
  background:var(--surface);
  box-shadow:var(--widget-shadow);
  padding:calc(14 * var(--u));
  display:flex;flex-direction:column;
  font-size:calc(13 * var(--u));
  overflow:hidden;position:relative;
}
.widget p{margin:0}
.w-top{display:flex;align-items:center;gap:calc(5 * var(--u));margin-bottom:calc(9 * var(--u))}
.w-mark{width:calc(11 * var(--u));height:calc(11 * var(--u));color:var(--accent);flex:none;display:block}
.w-label{font-family:var(--fs-title);font-size:calc(9 * var(--u));font-weight:600;
  letter-spacing:.055em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-stamp{margin-left:auto;font-size:calc(9 * var(--u));font-weight:500;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex:none}
.w-hero{display:flex;align-items:center;gap:calc(5 * var(--u));margin-bottom:calc(3 * var(--u))}
/* Every hero figure in Arial Nova Light: one numeric voice across all eight. A light face at
   display size needs looser tracking than a bold one would. */
.w-num{font-family:var(--fs);font-size:calc(34 * var(--u));font-weight:300;
  letter-spacing:-.018em;line-height:1;font-variant-numeric:tabular-nums}
.w-num.sm{font-size:calc(27 * var(--u))}
.w-unit{font-size:calc(10.5 * var(--u));font-weight:500;color:var(--ink-2);line-height:1.15}
.w-line{font-size:calc(11.5 * var(--u));line-height:1.28;font-weight:500;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  max-height:calc(29.5 * var(--u))}
.w-sub{font-size:calc(10 * var(--u));color:var(--ink-2);line-height:1.35}
.w-foot{margin-top:auto;padding-top:calc(8 * var(--u))}
.w-foot.ruled{border-top:1px solid var(--line-2)}
/* The one hero WORD, set in the same light face as the hero figures. */
.w-topic{font-family:var(--fs);font-weight:300;font-size:calc(19 * var(--u));
  letter-spacing:-.012em;line-height:1.08;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Status pill: state encoded as form, not only as colour. */
.wpill{display:inline-flex;align-items:center;gap:calc(4 * var(--u));
  font-family:var(--fs-title);font-size:calc(9.5 * var(--u));font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:calc(2.5 * var(--u)) calc(7 * var(--u));border-radius:999px}
.wpill.crit{background:var(--crit-wash);color:var(--crit)}
.wpill.warn{background:var(--warn-wash);color:var(--warn)}
.wpill.good{background:var(--good-wash);color:var(--good)}
.wpill.info{background:var(--info-wash);color:var(--info)}
.wpill .d{width:calc(5 * var(--u));height:calc(5 * var(--u));border-radius:50%;
  background:currentColor;flex:none}

/* Composition bar: the channels behind one figure. */
.wsplit{display:flex;gap:calc(2 * var(--u));height:calc(5 * var(--u));margin-bottom:calc(7 * var(--u))}
.wsplit span{border-radius:999px;display:block}
.wlegend{display:flex;gap:calc(9 * var(--u));font-size:calc(9.5 * var(--u));color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.wlegend i{display:inline-block;width:calc(5 * var(--u));height:calc(5 * var(--u));
  border-radius:50%;margin-right:calc(4 * var(--u));vertical-align:calc(-0.5 * var(--u))}

/* Two figures compared. */
.wcmp{display:grid;grid-template-columns:auto 1fr auto;gap:calc(4 * var(--u)) calc(7 * var(--u));
  align-items:center;font-size:calc(9.5 * var(--u));color:var(--ink-2)}
.wcmp b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.wbar{height:calc(4 * var(--u));border-radius:999px;background:var(--track);overflow:hidden}
.wbar span{display:block;height:100%;border-radius:999px}

/* A column per day or per week. Filled is live, faint is spent. */
.wticks{display:flex;gap:calc(2.5 * var(--u));align-items:flex-end;height:calc(16 * var(--u))}
.wticks i{flex:1;border-radius:calc(1.5 * var(--u));background:var(--accent);display:block;height:100%}
.wticks i.spent{background:var(--track);height:60%}

/* The widget sparkline is its own thing: a fixed 100x34 box that never stretches, because the
   widget is a fixed square. No non-scaling tricks needed here. */
.wspark{width:100%;height:calc(24 * var(--u));display:block}

/* ---- the bento ---- */
/* Columns, filled shortest-first by layoutBento(). One --bento-gap in both directions is the
   whole point: the space under a card must match the space beside it. */
.bento{display:flex;align-items:flex-start;gap:var(--bento-gap)}
.bcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--bento-gap)}
/* A two-value row (metal prices). Everything else in the bento is a bar, a band or a cell. */
.bxrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.bxrow:last-child{border-bottom:0}
.bxrow .n{color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.bxrow .v{font-weight:500;color:var(--ink)}

/* Bars: proportion shown as width, no axis, no gridlines. */
.barrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.barrow .bn{flex:0 0 40%;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.barfill{height:100%;border-radius:3px;background:var(--accent)}
.barrow .bv{flex:0 0 auto;color:var(--ink-3);font-size:12px;min-width:22px;text-align:right}

.dempty{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
  padding:26px 22px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.6}

@media (max-width:620px){ .wtile{flex-basis:136px} }

/* ============================================================
   ANALYTICS — the phone's Settings -> Analytics, card for card
   ------------------------------------------------------------
   Same cards, same order, same palette as AnalyticsPane.kt. The phone stacks them in one
   column because it is 400px wide; here they sit in the bento so the width earns its keep,
   but a card never changes what it says just because it has more room.
   ============================================================ */
.anhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin:26px 0 12px;flex-wrap:wrap}
.anhead h2{font-family:var(--fs-title);font-size:20px;font-weight:400;letter-spacing:-.3px}
.anhead .sub{font-size:12.5px;color:var(--ink-3)}
/* Window selector: the phone's 1M / 3M / 6M segmented control. */
.anseg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.anseg button{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:12.5px;
  padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease)}
.anseg button:active{transform:scale(.97)}
.anseg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);font-weight:500}

.ancard{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
  box-shadow:var(--sh-1);padding:18px 20px;display:flex;flex-direction:column}
.anttl{font-family:var(--fs-title);font-size:15.5px;font-weight:500;letter-spacing:-.1px}
.ansub{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.anbody{margin-top:14px;display:flex;flex-direction:column;flex:1}
.anempty{font-size:13px;color:var(--ink-3);padding:8px 0}
.anfoot{margin-top:auto;padding-top:12px;font-size:12px;color:var(--ink-3)}

/* Stat pair: the phone's two headline cards, Top mover and Emerging topic. */
.anstat{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
  box-shadow:var(--sh-1);padding:16px 18px;display:flex;flex-direction:column}
.anstat .k{font-family:var(--fs-title);font-size:12.5px;font-weight:600;color:var(--ink-3)}
.anstat .v{font-family:var(--fs-title);font-size:21px;font-weight:500;letter-spacing:-.3px;
  margin-top:9px;line-height:1.25}
.anstat .c{font-size:12px;color:var(--ink-3);margin-top:auto;padding-top:8px;line-height:1.45}


/* News volume: stacked bars, one column per week, one colour per channel. */
/* Channel blocks sit apart rather than fusing into one column, the way the phone draws them --
   a ten-deep stack of adjacent colours reads as a gradient, not as a count. */
.stack{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:6px}
.stackcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.stackbar{width:100%;max-width:46px;margin:0 auto;display:flex;flex-direction:column-reverse;
  gap:2px;min-height:2px}
.stackseg{width:100%;min-height:5px;border-radius:3px}
.stackx{font-size:10px;color:var(--ink-3);text-align:center;margin-top:8px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.lgd{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
/* The phone ColorKey: two columns of dot + label, and an optional trailing figure. */
.ankey{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;margin-top:16px}
.keyi{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);min-width:0}
.keyn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keyv{margin-left:auto;flex:0 0 auto;color:var(--ink-2)}

/* The headline number a card leads with. */
.anbig{display:flex;align-items:baseline;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.anbign{font-family:var(--fs-title);font-size:32px;font-weight:400;letter-spacing:-1.2px;line-height:1}
.anbigl{font-size:12.5px;color:var(--ink-3)}
/* Three figures across, the way News overview leads on the phone. */
.trio{display:flex;gap:16px;margin-bottom:18px}
.triocol{flex:1;min-width:0}
.triov{font-family:var(--fs-title);font-size:29px;font-weight:400;letter-spacing:-1.1px;line-height:1}
.triok{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* Conversion flow: node columns joined by ribbons whose thickness is the count. */
.sankey{width:100%;height:190px;display:block}
.skrib{opacity:.26;transition:opacity var(--t-hover) var(--ease)}
.skrib:hover{opacity:.55}
/* Labels sit under the chart: the bars are too thin to hold text, and text inside a
   preserveAspectRatio="none" viewBox comes out stretched. */
.sklegend{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.skgroup{min-width:0}
.skrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);padding:3px 0}
.skn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skv{margin-left:auto;flex:0 0 auto;color:var(--ink-2)}

/* Share of voice: a treemap. Cells are placed in percentages by squarify(), so the block
   resizes with the card and never needs measuring. */
.tmap{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r-box);overflow:hidden}
.tcell{position:absolute;padding:8px 9px;display:flex;flex-direction:column;gap:1px;
  overflow:hidden;border:1.5px solid var(--surface);border-radius:5px}
.tcell .tn{font-family:var(--fs-title);font-size:12px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tcell .tv{font-size:11px;color:rgba(255,255,255,.82);line-height:1.2}

/* Momentum: name, sparkline, delta. */
.momrow{display:flex;align-items:center;gap:14px;padding:9px 0}
.momn{flex:0 0 32%;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.momspark{flex:1;height:30px;min-width:0;overflow:visible}
.momspark path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.momspark path.sparkfill{stroke:none}
.momspark path.sparkdot{stroke-width:5.5;stroke-linecap:round}
.momd{flex:0 0 auto;font-size:12.5px;font-weight:500;min-width:42px;text-align:right}

/* Narrative ownership: who leads named on the row, the whole split on the bar below it. */
.narblk{margin-bottom:14px}
.narhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;font-size:13px}
.narn{font-family:var(--fs-title);color:var(--ink);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.narlead{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--ink-3)}
.narbar{height:14px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface-2)}
.trendbar{flex:0 0 16px;height:16px;overflow:hidden;display:flex;gap:2px;margin-top:10px}
.trendbar .narseg{border-radius:3px}
.narseg{height:100%;min-width:2px}

/* Heatmap: competitor x category. Opacity carries volume, one hue, no colour scale to decode. */
.heatwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.heat{display:grid;gap:3px;min-width:340px}
.heathc{font-size:10px;color:var(--ink-3);text-align:center;line-height:1.2;padding-bottom:4px;
  overflow:hidden}
.heathr{font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;align-self:center;padding-right:8px}
.heatc{height:22px;border-radius:5px}
.heatlg{display:flex;align-items:center;gap:5px;margin-top:14px;font-size:11px;color:var(--ink-3)}
.heatsw{width:13px;height:13px;border-radius:4px;flex:0 0 auto}

/* Section labels inside Industry trends: By category, Rising, Cooling. */
.rck{font-family:var(--fs-title);font-size:12.5px;font-weight:600;color:var(--ink-3);
  margin-bottom:2px}

/* Cost card: three figures across, the phone's Today / This month / Daily cap. */
.costrow{display:flex;gap:18px;flex-wrap:wrap}
.costcol{flex:1;min-width:96px}
.costk{font-size:11.5px;color:var(--ink-3)}
.costv{font-family:var(--fs-title);font-size:20px;font-weight:500;letter-spacing:-.4px;margin-top:3px}
.costc{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:2px}

@media (max-width:620px){
  .ankey{grid-template-columns:1fr}
  .sklegend{grid-template-columns:1fr;gap:10px}
  .trio{gap:10px}
  .triov{font-size:24px}
}

.skel{background:var(--surface);border-radius:var(--r-card);height:104px;margin-bottom:10px;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}

/* ---------- gate ---------- */
#gate{height:var(--apph);display:grid;place-items:center;padding:0 24px;text-align:center;position:relative}
#btnThemeGate{position:absolute;top:max(16px,env(safe-area-inset-top));right:18px}
#gate .in{max-width:430px}
#gate .mark{width:56px;height:56px;margin:0 auto 22px;color:var(--ink)}
#gate h1{font-size:30px;letter-spacing:-.4px}
#gate p{color:var(--ink-3);font-size:14.5px;line-height:1.7;margin:12px 0 26px}

/* ---------- ask (replaces confirm/prompt) ---------- */
#ask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  display:grid;place-items:center;padding:24px}
.askbox{background:var(--surface);border-radius:18px;box-shadow:var(--sh-2);
  padding:22px;width:100%;max-width:380px}
.askttl{font-size:17px;font-weight:600;margin:0 0 8px}
.askbody{font-size:14px;color:var(--ink-2);line-height:1.6;margin:0 0 12px}
.askrow{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--r-pill);
  font-size:13.5px;font-weight:500;box-shadow:var(--sh-2);opacity:0;pointer-events:none;
  transition:opacity var(--t-hover) var(--ease),transform var(--t-hover) var(--ease);max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- update bar ---------- */
#upd{flex:0 0 auto;background:var(--accent);color:#fff;display:none;padding:11px 0;font-size:13.5px}
#upd.on{display:block}
#upd .inner{display:flex;align-items:center;gap:12px}
#upd button{color:#fff;font-weight:700;text-decoration:underline;flex:0 0 auto}

/* ---------- responsive ---------- */
@media (max-width:560px){
  h1{font-size:30px}
  .wrap{padding:0 16px}
  .titlerow{flex-direction:column;gap:2px}
  .srcchip{margin-top:10px}
  .kv{flex-direction:column;gap:1px}
  .kv .k{width:auto;flex:none}
}

/* ---------- print: only the report prints ---------- */
#report{display:none}
@media print{
  body{background:#fff;color:#000;overflow:visible}
  #shell,#gate,#toast,#ask,#upd{display:none !important}
  #report{display:block}
  #report .r-art{page-break-inside:avoid;margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid #ddd}
  #report h1{font-size:22px;margin:0 0 4px}
  #report .r-sub{color:#555;font-size:12px;margin:0 0 22px}
  #report h2{font-size:14px;margin:0 0 6px;line-height:1.35}
  #report .r-meta{font-size:11px;color:#666;margin:0 0 6px}
  #report .r-sum{font-size:12px;line-height:1.6;margin:0}
  #report .r-adv{font-size:11.5px;line-height:1.6;margin:6px 0 0;padding-left:9px;
    border-left:2px solid #1F57F5;color:#333}
  a{color:#000;text-decoration:none}
}

/* ============================================================
   ASK — Layer 0. Retrieval over what the phone already sent:
   no model, no key, no network. The page stays a viewer.

   Laid out as a chat room: the composer is docked at the bottom and the
   conversation grows down into it. That is the one arrangement nobody has
   to be taught.

   The accent stays interactive-only here, as everywhere else in this file.
   So your own message is a RAISED SURFACE, not a filled blue bubble — a blue
   bubble would be the only thing on the page wearing the accent without
   being clickable, and the rule is worth more than the convention.
   ============================================================ */

/* The scroll column becomes a flex column on this tab ONLY, which is what lets the
   dock sit at the bottom of the VIEWPORT rather than at the bottom of the content.
   #scroll is a flex item with a resolved height, so the percentage below resolves. */
#shell.chat #scroll{padding-bottom:0}
#shell.chat #scroll > .wrap{min-height:100%;display:flex;flex-direction:column}
#shell.chat #app{flex:1 1 auto;display:flex;flex-direction:column;padding-top:0}

.chpane{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
/* Few messages sit ON the composer rather than stranded at the top of an empty page. */
.chflow{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:10px 0 4px}
.chflow.start{justify-content:flex-start;padding-top:16px}

/* ---- the dock ---- */
.chdock{position:sticky;bottom:0;z-index:4;background:var(--paper);
  padding:8px 0 max(10px,env(safe-area-inset-bottom))}
/* Without this the conversation appears to be sliced off by a hard edge as it
   scrolls under the dock. */
.chdock::before{content:"";position:absolute;left:0;right:0;top:-26px;height:26px;
  background:linear-gradient(to top,var(--paper),transparent);pointer-events:none}
.chctx{display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  padding:0 8px 7px;font-size:12.5px;color:var(--ink-3)}
.chctx b{font-weight:500;color:var(--ink-2)}
.chctx button{background:none;border:0;padding:0;font-size:12.5px;color:var(--accent);cursor:pointer}
.chctx button:hover{text-decoration:underline}
.chbox{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 5px 5px 18px;
  transition:border-color var(--t-hover) var(--ease),box-shadow var(--t-hover) var(--ease)}
.chbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chin{flex:1;min-width:0;height:40px;border:0;background:transparent;outline:none;
  color:var(--ink);font-size:15px;font-weight:300}
.chgo{flex:none;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);
  transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease)}
/* Lit only when there is something to send — the accent means "this will do something". */
.chgo.on{background:var(--accent);color:#fff}

/* ---- the opening ---- */
.chhi{margin:0 0 8px;font-size:34px;line-height:1.16;font-weight:500;
  letter-spacing:-.02em;color:var(--ink)}
.chhi span{display:block;color:var(--ink-3)}
.chintro{margin:0 0 22px;max-width:58ch;font-size:15px;line-height:1.62;color:var(--ink-2)}
.chintro b{font-weight:500;color:var(--ink)}
.chsug{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chsg{text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color var(--t-hover) var(--ease)}
.chsg:hover{border-color:var(--accent)}
.chsg .k{display:block;margin-bottom:5px;font-size:12.5px;color:var(--accent)}
.chsg .t{display:block;font-size:14.5px;line-height:1.45;color:var(--ink)}

/* ---- one turn ---- */

<body>

       to live here too — otherwise it is unreachable for anyone who cannot get past it. -->

  <div class="in">

        <svg viewBox="0 0 48 48" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================
   The client ID is PUBLIC by design. Google identifies the app by it and then
   checks the request came from an authorised origin, so publishing it grants
   nobody anything. There is no client secret in the browser token flow, and this
   page holds no API key of any kind. */
var CLIENT_ID    = "653924371691-687hjiimvicq77nbk4l6osqoaio3nl4b.apps.googleusercontent.com";
var SCOPE        = "https://www.googleapis.com/auth/drive.file";
var DATA_FILE    = "echo-data.json";
var ACTIONS_FILE = "echo-web-actions.json";
var K = "echo.web.v1";

/* ============================================================
   TINY HELPERS
   ============================================================ */
var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, x) {
  var n = document.createElement(t);
  if (c) n.className = c;
  if (x != null) n.textContent = x;
  return n;
};
var arr = function (v) { return Array.isArray(v) ? v : []; };
var key = function (s) { return String(s || "").trim().toLowerCase(); };
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
  });
};

function toast(msg) {
  var t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("on"); }, 2200);
}
function setStatus(msg, isErr) {
  var e = $("#status"); e.textContent = msg || ""; e.className = "status" + (isErr ? " err" : "");
}
function setGateStatus(msg, isErr) {
  var e = $("#gateStatus"); e.textContent = msg || ""; e.className = "status" + (isErr ? " err" : "");
}

/* The Echo mark, inline so it takes currentColor and needs no network.
   Same 1024 grid as favicon.svg and EchoLogo() in the Android app, so the
   web, the launcher icon and the phone's top bar can never drift apart. */
var MARK = '<svg viewBox="0 0 1024 1024" width="100%" height="100%" role="img" aria-label="Echo">' +
  '<path fill="currentColor" d="M112 110 H912 V336 H112 Z' +
  ' M112 398 H338 A226 226 0 0 1 112 624 Z' +
  ' M400 398 H912 V624 H626 A226 226 0 0 1 400 398 Z' +
  ' M112 686 A226 226 0 0 1 338 912 H112 Z' +
  ' M400 912 A226 226 0 0 1 626 686 H912 V912 Z"/></svg>';
var ICON_SUN = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>';
var ICON_MOON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';
/* A real cog, not a circle with spokes — spokes sit right next to the sun/moon
   toggle and read as a second sun. */
var ICON_MENU = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
var ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* ============================================================
   STORE
   ============================================================
   `data` is the phone's snapshot, read-only to us. `actions` is the ONLY thing
   this page ever writes, and it only ever grows. */
var S = {
  token: "", tokenExp: 0, email: "", theme: "",
  data: null,
  actions: {
    schema: 1, updatedAtMillis: 0,
    verifiedTitles: [], publishedTitles: [], publishedNews: [], reportEditions: []
  },
  // Dashboard is the landing page: the glance strip answers "anything to look at?" before
  // the feed asks you to read anything.
  tab: "dashboard", loading: false
};

function save() {
  try {
    localStorage.setItem(K, JSON.stringify({
      token: S.token, tokenExp: S.tokenExp, email: S.email,
      theme: S.theme, actions: S.actions, tab: S.tab
    }));
  } catch (e) { /* private mode: still works, it just forgets on reload */ }
}
function load() {
  try {
    var o = JSON.parse(localStorage.getItem(K) || "{}");
    if (o.token && o.tokenExp > Date.now()) { S.token = o.token; S.tokenExp = o.tokenExp; }
    if (o.email) S.email = o.email;
    if (o.theme) S.theme = o.theme;
    if (o.actions) S.actions = Object.assign(S.actions, o.actions);
    if (o.tab) S.tab = o.tab;
  } catch (e) {}
}

/* ---------- derived views ---------- */
function verifiedSet() { return new Set(S.actions.verifiedTitles.map(key)); }
function publishedSet() {
  var s = new Set(S.actions.publishedTitles.map(key));
  arr(S.data && S.data.publishedTitles).forEach(function (t) { s.add(key(t)); });
  return s;
}
/* Alerts = what the phone shows, minus anything published on either side.
   Publishing HIDES a story from Alerts; it never deletes it. */
function alerts() {
  var pub = publishedSet();
  return arr(S.data && S.data.alerts).filter(function (a) { return !pub.has(key(a.title)); });
}
function published() {
  var seen = new Set(), out = [];
  arr(S.actions.publishedNews).concat(arr(S.data && S.data.publishedNews)).forEach(function (a) {
    var k = key(a && a.title);
    if (a && a.title && !seen.has(k)) { seen.add(k); out.push(a); }
  });
  return out;
}
function editions() {
  var seen = new Set(), out = [];
  arr(S.actions.reportEditions).concat(arr(S.data && S.data.reportEditions)).forEach(function (e) {
    if (e && !seen.has(e.id)) { seen.add(e.id); out.push(e); }
  });
  return out.sort(function (a, b) { return (b.createdAtMillis || 0) - (a.createdAtMillis || 0); });
}
function verifiedArticles() {
  var v = verifiedSet();
  return alerts().filter(function (a) { return v.has(key(a.title)); });
}

/* ============================================================
   THEME
   ============================================================
   Three states: "" follows the system, "light"/"dark" override it. The attribute
   on <html> is what the CSS blocks key on. */
function systemDark() { return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function isDark() { return S.theme ? S.theme === "dark" : systemDark(); }
function applyTheme() {
  var r = document.documentElement;
  if (S.theme) r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme");
  // Every theme button, not just the one in the shell — the gate has one too.
  var lbl = isDark() ? "Switch to light" : "Switch to dark";
  document.querySelectorAll(".themebtn").forEach(function (b) {
    b.innerHTML = isDark() ? ICON_SUN : ICON_MOON;
    b.title = lbl;
  });
}
function toggleTheme() { S.theme = isDark() ? "light" : "dark"; save(); applyTheme(); }

/* ============================================================
   GOOGLE SIGN-IN
   ============================================================
   We ask for a SCOPE, not an identity — "may I touch this one file?", not
   "who are you?". Google hands back a short-lived access token.

   prompt:"" is what makes it feel instant. It shows the consent screen the FIRST
   time and returns silently every time after, because Google remembers the grant.
   prompt:"consent" would re-ask forever, which reads as a login wall on every
   visit. Never use it here. */
var tokenClient = null;

function loadGIS() {
  return new Promise(function (res, rej) {
    if (window.google && google.accounts && google.accounts.oauth2) return res(true);
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = function () { res(true); };
    s.onerror = function () {
      rej(new Error("Could not reach Google sign-in. Check your connection, or an extension may be blocking it."));
    };
    document.head.appendChild(s);
  });
}

/* Google checks the page's ORIGIN against the list registered for this client. A page
   opened straight off disk (file://) has origin "null", so there is nothing to check
   and Google rejects it with a bare "Required parameter is missing: response_type".
   That error names the wrong cause, so catch the condition and say what to actually do. */
function originUsable() {
  return location.protocol === "https:" ||
    (location.protocol === "http:" && /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
}

function signIn() {
  if (!originUsable()) {
    return Promise.reject(new Error(
      "Google sign-in needs this page served over https (or from localhost). Opened as a file it has " +
      "no web address for Google to check, so sign-in is refused. Publish it and open it from there."));
  }
  return loadGIS().then(function () {
    return new Promise(function (res, rej) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        hint: S.email || undefined,
        callback: function (r) {
          if (r && r.access_token) {
            S.token = r.access_token;
            S.tokenExp = Date.now() + ((r.expires_in || 3600) * 1000);
            save(); res(S.token);
          } else rej(new Error("Google did not return access."));
        },
        error_callback: function (e) {
          var t = (e && e.type) || "";
          if (t === "popup_closed") return rej(new Error("Sign-in was closed before it finished."));
          if (t === "popup_failed_to_open") return rej(new Error("The sign-in window was blocked. Allow pop-ups for this site and try again."));
          rej(new Error("Google refused the sign-in."));
        }
      });
      tokenClient.requestAccessToken({ prompt: "" });
    });
  });
}

/* Sign out is LOCAL ONLY — we forget the token, we do not revoke it. Revoking would
   delete the grant, so the next sign-in would show the consent screen again. Nothing
   in the user's Drive is touched. */
function signOut() {
  S.token = ""; S.tokenExp = 0; S.data = null;
  save();
  $("#shell").hidden = true;
  $("#gate").style.display = "";
  setGateStatus("Signed out here. Nothing was deleted from Drive.");
}
function tokenAlive() { return S.token && S.tokenExp > Date.now() + 30000; }
function ensureToken() { return tokenAlive() ? Promise.resolve(S.token) : signIn(); }

/* ============================================================
   DRIVE
   ============================================================ */
var FILES  = "https://www.googleapis.com/drive/v3/files";
var UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";

async function dFetch(url, opts) {
  var t = await ensureToken();
  var o = Object.assign({}, opts || {});
  o.headers = Object.assign({}, o.headers || {}, { Authorization: "Bearer " + t });
  var r = await fetch(url, o);
  if (r.status === 401) {          // token died mid-flight — renew once, silently
    S.token = ""; S.tokenExp = 0;
    o.headers.Authorization = "Bearer " + (await ensureToken());
    r = await fetch(url, o);
  }
  return r;
}
async function findFile(name) {
  var q = encodeURIComponent("name = '" + name + "' and trashed = false");
  var r = await dFetch(FILES + "?q=" + q + "&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10");
  if (!r.ok) throw new Error("Drive list failed (" + r.status + ").");
  var j = await r.json();
  return (j.files && j.files[0]) || null;
}
/* Falls back to the pre-rename filename.

   The product was called "Elemental" until 2026-08-27. The PHONE renames its Drive file to the
   echo-* name on its next backup, not the moment this page updates — so for the window between
   this page going live and that push happening, the only file in Drive still carries the old name.
   Without the fallback the page would find nothing and correctly report an empty backup, while the
   real data sat beside it under a name nobody was asking for.

   Read-only: this never RENAMES anything. The phone owns that file and does the rename itself, so
   two writers can never race over it. Once the phone has pushed once, the fallback stops matching
   and can be deleted. */
var LEGACY_NAME = { "echo-data.json": "elemental-data.json",
                    "echo-web-actions.json": "elemental-web-actions.json" };

async function readJson(name) {
  var f = await findFile(name);
  if (!f && LEGACY_NAME[name]) f = await findFile(LEGACY_NAME[name]);
  if (!f) return null;
  var r = await dFetch(FILES + "/" + f.id + "?alt=media");
  if (!r.ok) throw new Error("Could not read " + name + " (" + r.status + ").");
  return r.json();
}
/* Create-then-write, deliberately not multipart: simpler, and the same shape the
   phone uses, so both sides behave identically. */
async function writeJson(name, obj) {
  var f = await findFile(name);
  /* Adopt the pre-rename file rather than creating a second one beside it.

     This page OWNS the actions file, so renaming it here is safe — there is no other writer to
     race with. Skipping this would be the one way the rename could actually lose data: writeJson
     would create an empty echo-web-actions.json, the phone's migration would then see the new name
     already present and leave the old file alone, and everything the user had verified on the web
     would be stranded in a file neither side reads. */
  if (!f && LEGACY_NAME[name]) {
    var old = await findFile(LEGACY_NAME[name]);
    if (old) {
      var mv = await dFetch(FILES + "/" + old.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({ name: name })
      });
      if (mv.ok) f = old;
    }
  }
  if (!f) {
    var c = await dFetch(FILES + "?fields=id", {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ name: name })
    });
    if (!c.ok) throw new Error("Could not create " + name + " (" + c.status + ").");
    f = await c.json();
  }
  var r = await dFetch(UPLOAD + "/" + f.id + "?uploadType=media&fields=id", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj)
  });
  if (!r.ok) throw new Error("Could not save " + name + " (" + r.status + ").");
  return true;
}
/* The account email, from the same drive.file permission — no extra scope asked. */
async function accountEmail() {
  try {
    var r = await dFetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)");
    if (!r.ok) return "";
    var j = await r.json();
    return (j.user && j.user.emailAddress) || "";
  } catch (e) { return ""; }
}

var pushTimer = null;
/* Debounced: ticking several checkboxes should not mean several uploads. */
function pushActions(immediate) {
  clearTimeout(pushTimer);
  return new Promise(function (res, rej) {
    pushTimer = setTimeout(async function () {
      try {
        S.actions.updatedAtMillis = Date.now();
        await writeJson(ACTIONS_FILE, S.actions);
        res(true);
      } catch (e) { rej(e); }
    }, immediate ? 0 : 1200);
  });
}

/* ============================================================
   ASK — replaces confirm() and prompt()
   ============================================================
   The native ones print the origin across the top, so a prompt here read
   "attano26.github.io says". A page cannot change that line and should not be able
   to: a site dressing its dialog as the browser's own is the attack the rule
   prevents. The only way to control the wording is not to use them. */
function askShell(build) {
  return new Promise(function (resolve) {
    var a = $("#ask");
    a.hidden = false; a.innerHTML = "";
    var box = el("div", "askbox");
    a.appendChild(box);
    var done = function (v) {
      a.hidden = true; a.innerHTML = "";
      document.removeEventListener("keydown", a._key); a._key = null;
      resolve(v);
    };
    build(box, done);
    a.onclick = function (e) { if (e.target === a) done(null); };
    a._key = function (e) { if (e.key === "Escape") { e.preventDefault(); done(null); } };
    document.addEventListener("keydown", a._key);
  });
}
function askConfirm(opts) {
  return askShell(function (box, done) {
    box.appendChild(el("h2", "askttl", opts.title));
    if (opts.body) box.appendChild(el("p", "askbody", opts.body));
    var row = el("div", "askrow");
    var no = el("button", "btn sm ghost", opts.cancel || "Cancel");
    no.onclick = function () { done(false); };
    var yes = el("button", "btn sm", opts.ok || "Continue");
    yes.onclick = function () { done(true); };
    row.appendChild(no); row.appendChild(yes);
    box.appendChild(row);
    yes.focus();
  });
}

/* ============================================================
   RENDER
   ============================================================ */
var TABS = [
  ["dashboard", "Dashboard", function () { return ""; }],
  ["ask",       "Ask",       function () { return ""; }],
  ["alerts",    "Alerts",    function () { return alerts().length; }],
  ["saved",     "Saved",     function () { return arr(S.data && S.data.savedNews).length; }],
  ["published", "Published", function () { return published().length; }],
  ["reports",   "Reports",   function () { return editions().length; }],
  ["liked",     "Liked",     function () { return arr(S.data && S.data.likedTitles).length; }],

/* ---------- drawer ---------- */
/* Above 1000px the rail is permanent, so open/close are no-ops there. Guarding here rather than
   at each call site means a stray tap can never leave an invisible scrim over a desktop layout. */
function railIsPermanent() { return window.matchMedia("(min-width:1000px)").matches; }
function openDrawer() {
  if (railIsPermanent()) return;
  $("#scrim").hidden = false;
  // Next frame, so the browser has a non-hidden starting state to transition FROM.
  requestAnimationFrame(function () {
    $("#scrim").classList.add("on");
    $("#drawer").classList.add("on");
  });
  $("#btnMenu").setAttribute("aria-expanded", "true");
  $("#btnClose").focus();
}
function closeDrawer() {
  if (railIsPermanent()) return;
  $("#scrim").classList.remove("on");
  $("#drawer").classList.remove("on");
  $("#btnMenu").setAttribute("aria-expanded", "false");
  // Hide only after the fade, or the scrim would vanish instantly and the drawer
  // would appear to slide out over nothing.
  setTimeout(function () { if (!$("#drawer").classList.contains("on")) $("#scrim").hidden = true; }, 240);
}
function drawerOpen() { return $("#drawer").classList.contains("on"); }

/* Describe the RECURRENCE, not a single next firing — "9:00 AM on weekdays" tells you what
   the rule is, where a lone timestamp reads as broken once it has passed. Mirrors the phone. */
function alertScheduleText(g) {
  var s = S.data && S.data.alertSchedule;
  if (!s || !s.enabled) return g.alertInterval || "Off";
  var h = s.hour == null ? 9 : s.hour, m = s.minute == null ? 0 : s.minute;
  var ampm = h < 12 ? "AM" : "PM";
  var h12 = (h % 12) === 0 ? 12 : (h % 12);
  var time = h12 + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
  // Calendar.DAY_OF_WEEK: 1 = Sunday … 7 = Saturday.
  var names = ["", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var days = arr(s.days).slice().sort(function (a, b) { return a - b; });
  var when;
  if (days.length === 7) when = "every day";
  else if (days.length === 5 && days.join() === "2,3,4,5,6") when = "Mon–Fri";
  else if (days.length === 2 && days.join() === "1,7") when = "weekends";
  else if (!days.length) when = "no days set";
  else when = days.map(function (d) { return names[d] || d; }).join(", ");
  return time + " · " + when;
}

/* ============================================================
   ANALYTICS — the phone's Settings → Analytics, card for card
   ------------------------------------------------------------
   Every figure comes from `data.analytics`, which is computeAnalytics() serialised on the phone
   for all three windows. The phone calculates; this file draws. Re-deriving share-of-voice or the
   conversion cross-tab in JavaScript would be a second implementation of the same maths, and two
   implementations drift until the phone and the web disagree in front of someone who trusts both.

   Card order, titles, subtitles and colours follow AnalyticsPane.kt.
   ============================================================ */

/* The phone's analytics palette, verbatim. AnodizedGreen is an old name for the one accent
   (Signal Blue), so palette[0] is blue on both screens. `AN_SEGMENTS` is the ten-colour set the
   channel stack needs; `AN_GREY` is what "Other" and "Market-wide" get — they are not a rival. */
var AN_PALETTE = ["#1F57F5", "#06B6D4", "#F59E0B", "#EF4444", "#8B5CF6", "#10B981"];
var AN_SEGMENTS = ["#1F57F5", "#06B6D4", "#F59E0B", "#EF4444", "#8B5CF6",
                   "#10B981", "#EC4899", "#3B82F6", "#84CC16", "#F97316"];
var AN_GREY = "#9A9CAB";
/* The heatmap's own five-step ramp lives in the theme tokens (--heat-0..4), not here, so a
   theme switch recolours it without re-rendering the card. */
var AN_HEAT = ["var(--heat-0)", "var(--heat-1)", "var(--heat-2)", "var(--heat-3)", "var(--heat-4)"];
var AN_WIN = "1M";

/* Window-aware copy, so every subtitle tracks the active filter exactly as on the phone. */
function anPhrase(w) { return w === "1M" ? "last month" : (w === "3M" ? "last 3 months" : "last 6 months"); }
function anUnit(w) { return w === "1M" ? "Weekly" : "Monthly"; }
function anPeriod(w) { return w === "1M" ? "week" : "month"; }
function anDelta(w) { return w === "1M" ? "week-over-week" : "month-over-month"; }
/* The phone trims a competitor to what fits: drop the bracketed parent, drop anything after a
   comma, cap at 14 characters. Same rule here so the same rival reads the same on both. */
function shortName(n) {
  return String(n || "").split("(")[0].split(",")[0].trim().slice(0, 14);
}
function shortLabel(c) { return String(c || "").replace(/&/g, "").trim().slice(0, 4); }
function anCard(title, sub) {

}
function svgNode(name, attrs) {

  for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
  return e;
}
function anNote(host, text) { host.appendChild(el("div", "anempty", text)); }

/* A monotone-ish curve through the points, so a sparkline reads as a trend rather than a
   zig-zag. The phone draws these smoothed; straight segments looked visibly different. */
function sparkPath(vals, w, h, pad) {
  var n = vals.length;
  if (n < 2) return "";
  var mx = Math.max.apply(null, vals) || 1;
  var pts = vals.map(function (v, i) {
    return [(i / (n - 1)) * w, h - pad - (v / mx) * (h - pad * 2)];
  });
  var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (var i = 0; i < n - 1; i++) {
    var p0 = pts[i], p1 = pts[i + 1], cx = (p0[0] + p1[0]) / 2;
    d += " C" + cx.toFixed(1) + " " + p0[1].toFixed(1) +
         " " + cx.toFixed(1) + " " + p1[1].toFixed(1) +
         " " + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
  }
  return { d: d, end: pts[n - 1] };
}

/* Each sparkline needs its own gradient, and an SVG gradient is addressed by id, so they have
   to be unique across the page. A counter is enough and never collides. */
var SPARK_SEQ = 0;

/* Name · sparkline · signed delta. Shared by Momentum and the rising/cooling lists.
   The line carries the shape; the wash under it carries the weight, which is what stops a
   one-pixel stroke reading as a stray mark on a large card. It fades out before the axis so it
   reads as shading rather than as a second, filled chart. */
function anTrendRow(host, name, vals, delta, colour) {
  var row = el("div", "momrow");
  row.appendChild(el("div", "momn", name));
  var svg = svgNode("svg", { "class": "momspark", viewBox: "0 0 100 28", preserveAspectRatio: "none" });
  var p = sparkPath(arr(vals), 100, 28, 4);
  if (p) {
    var gid = "spk" + (++SPARK_SEQ);
    var defs = svgNode("defs");
    var grad = svgNode("linearGradient", { id: gid, x1: "0", y1: "0", x2: "0", y2: "1" });
    var s0 = svgNode("stop", { offset: "0", "stop-opacity": "0.30" });
    var s1 = svgNode("stop", { offset: "1", "stop-opacity": "0" });
    s0.style.stopColor = colour; s1.style.stopColor = colour;
    grad.appendChild(s0); grad.appendChild(s1);
    defs.appendChild(grad);
    svg.appendChild(defs);

    // Same curve, closed down to the axis and back.
    var area = svgNode("path", { d: p.d + " L100 28 L0 28 Z", "class": "sparkfill" });
    area.style.fill = "url(#" + gid + ")";
    svg.appendChild(area);

    var path = svgNode("path", { d: p.d, "vector-effect": "non-scaling-stroke" });
    path.style.stroke = colour;
    svg.appendChild(path);

    // A zero-length stroke with a round cap: a disc of exactly stroke-width across, in screen
    // pixels, so it stays round however far the curve is stretched.
    var ex = p.end[0].toFixed(2), ey = p.end[1].toFixed(2);
    var dot = svgNode("path", { d: "M" + ex + " " + ey + "L" + ex + " " + ey,
                                "class": "sparkdot", "vector-effect": "non-scaling-stroke" });
    dot.style.stroke = colour;
    svg.appendChild(dot);
  }
  row.appendChild(svg);
  var d = delta || 0;
  var lab = el("div", "momd", d > 0 ? "▲ +" + d : (d < 0 ? "▼ " + d : "—"));
  lab.style.color = d > 0 ? "#10B981" : (d < 0 ? "#EF4444" : "var(--ink-3)");
  row.appendChild(lab);
  host.appendChild(row);
}
