  layoutBento(document.querySelector(".bento"), false);
});

/* ============================================================
   THE GLANCE STRIP
   ------------------------------------------------------------
   The phone's eight home-screen widgets, built to the widget mockups' own spec rather than
   restyled into web cards. Same 155dp square, same three-part anatomy (label row, hero,
   footer), same status ramp. A widget that reads one way on the launcher must read the same
   way here, or they stop being the same product.

   Every figure comes from `data.widgets`, the snapshot the phone computes for the launcher, so
   a number here and the same number on the home screen cannot disagree.
   ============================================================ */
/* "AUG", the way the phone's own widget stamps it: monthAbbrev uppercased. Backups written
   before monthAbbrev existed fall back to the first three letters of the full name, so the
   stamp is never the whole word on a 240px tile. */
function monthStamp(w) {
  var a = String((w && (w.monthAbbrev || w.monthLabel)) || "").trim();
  return a ? a.slice(0, 3).toUpperCase() : null;
}
function wTop(label, stamp) {
  var top = el("div", "w-top");
  var m = el("span", "w-mark");
  m.innerHTML = MARK;
  top.appendChild(m);
  top.appendChild(el("span", "w-label", label));
  if (stamp) top.appendChild(el("span", "w-stamp", stamp));
  return top;
}
/* Wrap whatever the headline is in the fixed two-line band, so a figure and a word occupy
   the same vertical space and everything below them lines up across the strip. */
function wHead(node) {
  var band = el("div", "w-head");
  band.appendChild(node);
  return band;
}
function wSay(text) { return el("p", "w-say", text); }

function wHero(value, unitHtml, colour, small) {
  var hero = el("div", "w-hero");
  var n = el("span", "w-num" + (small ? " sm" : ""), String(value));
  if (colour) n.style.color = colour;
  hero.appendChild(n);
  if (unitHtml) {
    var u = el("span", "w-unit");
    u.innerHTML = unitHtml;   // only ever our own literals, never data
    hero.appendChild(u);
  }
  return hero;
}
function wPill(kind, text) {
  var p = el("span", "wpill " + kind);
  p.appendChild(el("span", "d"));
  p.appendChild(el("span", null, text));
  return p;
}
function wFoot() { return el("div", "w-foot"); }

/* A widget-sized sparkline. The widget is a fixed square, so this one can keep its aspect
   ratio and needs none of the non-scaling treatment the dashboard's stretched rows do. */
var WSPARK_SEQ = 0;

/* The top-mover chart.
   Two gradients, not one. The VERTICAL gradient fills under the line and fades to nothing
   before the bottom, which is what stops a filled area reading as a solid block. The
   HORIZONTAL one is a mask on both the fill and the line, so the whole chart dissolves into
   the card at the left and right edges instead of ending in two hard stops. */
function wSpark(series, colour) {
  var svg = svgNode("svg", { "class": "wspark", viewBox: "0 0 100 34",
                             preserveAspectRatio: "none" });
  if (series.length < 2) return svg;
  var mx = Math.max.apply(null, series) || 1, pts = [];
  // Lifted: the peak sits near the top of the box and the trough well clear of the bottom.
  series.forEach(function (v, i) {
    pts.push([(i / (series.length - 1)) * 100, 24 - (v / mx) * 21]);
  });
  // Smooth, not a polyline. Control points on the vertical midline between each pair keeps the
  // curve from overshooting the way a Catmull-Rom spline does on a spiky series.
  var line = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (var i = 0; i < pts.length - 1; i++) {
    var a = pts[i], b = pts[i + 1], cx = (a[0] + b[0]) / 2;
    line += " C" + cx.toFixed(1) + " " + a[1].toFixed(1) +
            " " + cx.toFixed(1) + " " + b[1].toFixed(1) +
            " " + b[0].toFixed(1) + " " + b[1].toFixed(1);
  }
  var id = ++WSPARK_SEQ;
  var defs = svgNode("defs");

  var grad = svgNode("linearGradient", { id: "wsg" + id, x1: "0", y1: "0", x2: "0", y2: "1" });
  [["0", ".42"], [".55", ".14"], ["1", "0"]].forEach(function (st) {
    var stop = svgNode("stop", { offset: st[0], "stop-opacity": st[1] });
    stop.style.stopColor = colour;
    grad.appendChild(stop);
  });
  defs.appendChild(grad);

  // objectBoundingBox units, so the mask tracks the box at any width.
  var mgrad = svgNode("linearGradient", { id: "wsm" + id, x1: "0", y1: "0", x2: "1", y2: "0" });
  [["0", "0"], [".14", "1"], [".86", "1"], ["1", "0"]].forEach(function (st) {
    var stop = svgNode("stop", { offset: st[0], "stop-color": "#fff", "stop-opacity": st[1] });
    mgrad.appendChild(stop);
  });
  defs.appendChild(mgrad);
  var mask = svgNode("mask", { id: "wsk" + id, maskUnits: "userSpaceOnUse",
                               x: "0", y: "0", width: "100", height: "34" });
  mask.appendChild(svgNode("rect", { x: "0", y: "0", width: "100", height: "34",
                                     fill: "url(#wsm" + id + ")" }));
  defs.appendChild(mask);
  svg.appendChild(defs);

  var g = svgNode("g", { mask: "url(#wsk" + id + ")" });
  var area = svgNode("path", { d: line + " L100 34 L0 34 Z",
                               fill: "url(#wsg" + id + ")" });
  g.appendChild(area);
  var stroke = svgNode("path", { d: line, fill: "none", "stroke-width": "2",
                                 "stroke-linecap": "round", "stroke-linejoin": "round",
                                 "vector-effect": "non-scaling-stroke" });
  stroke.style.stroke = colour;
  g.appendChild(stroke);
  svg.appendChild(g);
  return svg;
}

/* A day's step on the ramp.
   The month's own QUARTILES, not a share of the busiest day: one bulk fetch (45 stories against
   a normal 0-6) would otherwise flatten every other day to the dimmest tint. Straight from the
   phone's heat(); `breaks` is monthBreaks, which the phone computes and ships. */
function calStep(count, breaks) {
  if (count <= 0) return 0;
  if (!breaks || breaks.length < 3) return 4;
  if (count <= breaks[0]) return 1;
  if (count <= breaks[1]) return 2;
  if (count <= breaks[2]) return 3;
  return 4;
}

/* The month as a heat calendar, matching the phone's Coverage widget cell for cell. */
function calendarWidget(w) {
  var g = el("div", "widget");
  var abbrev = (w.monthAbbrev || w.monthLabel || "").toUpperCase();
  g.appendChild(wTop("Coverage", abbrev ? abbrev + " · " + (w.monthTotal || 0) : null));

  var grid = arr(w.monthGrid), dows = arr(w.monthWeekdays), breaks = arr(w.monthBreaks);
  if (grid.length < 42 || dows.length < 7) {
    var band = el("div", "w-head");
    band.appendChild(el("p", "w-topic", "No calendar yet"));
    g.appendChild(band);
    g.appendChild(wSay("The phone has not filed a day-by-day breakdown this month."));
    g.appendChild(wFoot());
    return g;
  }

  var cal = el("div", "calgrid");
  var head = el("div", "calrow");
  dows.forEach(function (d) { head.appendChild(el("div", "caldow", d)); });
  cal.appendChild(head);

  /* Which day-of-month each cell is: the grid is padded at the front by however many blanks
     the month's first weekday needs, so counting real cells gives the date. */
  var day = 0;
  for (var week = 0; week < 6; week++) {
    var row = el("div", "calrow");
    for (var i = 0; i < 7; i++) {
      var c = el("div", "calcell");
      var n = grid[week * 7 + i];
      if (typeof n === "number" && n >= 0) {
        day++;
        var dot = el("span", "caldot");
        dot.style.background = "var(--cal-" + calStep(n, breaks) + ")";
        dot.title = (w.monthLabel || "") + " " + day + ": " +
                    n + (n === 1 ? " story" : " stories");
        c.appendChild(dot);
      }
      row.appendChild(c);
    }
    cal.appendChild(row);
  }
  g.appendChild(cal);

  var key = el("div", "calkey");
  key.appendChild(el("span", null, "Less"));
  for (var k = 0; k < 5; k++) {
    var sw = el("i");
    sw.style.background = "var(--cal-" + k + ")";
    key.appendChild(sw);
  }
  key.appendChild(el("span", null, "More"));
  g.appendChild(key);
  return g;
}

function renderWidgetStrip(w) {
  var strip = el("div", "wstrip");
  var add = function (node) { strip.appendChild(node); };
  var names = function (list) {
    return arr(list).slice(0, 2).map(function (r) { return r.n; }).join(", ");
  };
  /* The phone's shortTheme(), ported verbatim. The page had its own rule
     (`r.n.toLowerCase().split(" ")[0]`) which lower-cased the label AND collided whenever two
     themes shared a first word — "Materials & finishes" and "Manufacturing & digital" both
     rendered as one word. Two shortening rules for one set of names is how the labels drifted. */
  var shortTheme = function (g) {
    g = String(g || "");
    if (g.indexOf("Advanced") === 0) return "Glazing";
    if (g.indexOf("Regulation") === 0) return "Regulation";
    return g.split(" &")[0].split(" ")[0].trim();
  };

  /* 1. Ready to publish. The only widget that nags: verified stories go stale quietly. */
  (function () {
    var g = el("div", "widget");
    /* This page's own list, like the Unverified tile: verified AND still in Alerts. The report
       bar at the bottom of Alerts counts exactly this, and a tile that disagreed with the bar
       two clicks away is worse than one that lags the phone by a backup. */
    var ready = readyArticles().length;
    /* readyOldestDays is -1 when the stored dates cannot give an age. That is a sentinel, not
       a duration, and the phone's own widget guards on >= 1 before printing it. Do the same
       here rather than rendering "waited -1 days", which is what an unguarded read produces. */
    var oldest = w.readyOldestDays;
    var haveAge = typeof oldest === "number" && oldest >= 1;
    g.appendChild(wTop("Ready to publish", (ready && haveAge) ? oldest + "d" : null));
    g.appendChild(wHead(wHero(ready, "verified,<br>unsent", ready ? null : "var(--ink-3)")));
    g.appendChild(wSay(!ready
      ? "Nothing is waiting on you."
      : haveAge
        ? "Oldest has waited " + oldest + (oldest === 1 ? " day" : " days") + " for a report."
        : "Enough for an edition whenever you want one."));
    var f = wFoot();
    var ticks = el("div", "wticks");
    // Twelve slots: filled for what is waiting, faint for the headroom left in an edition.
    for (var i = 0; i < 12; i++) ticks.appendChild(el("i", i < ready ? null : "spent"));
    f.appendChild(ticks);
    g.appendChild(f);
    add(g);
  })();

  /* 2. Coverage. A month of days, each day as tall as it was busy. */
  (function () {
    var g = el("div", "widget");
    var grid = arr(w.monthGrid), mx = w.monthMax || 1;
    /* No month in the stamp: the figure underneath already says "articles dated August", and
       naming the same month twice in one 155dp square is the tile arguing with itself. */
    g.appendChild(wTop("Coverage"));
    g.appendChild(wHead(wHero(w.monthTotal || 0, "articles<br>dated " + (w.monthLabel || "this month"))));
    /* monthGrid is a 42-cell CALENDAR: -1 outside the month, and days 1..N sitting at an
       offset that depends on the weekday the month starts on. Taking the last 16 CELLS gave
       trailing padding, not recent days.

       So: keep only real days, then drop the ones that have not happened yet. The backup's own
       timestamp is what "today" means for this data — using the browser's clock would silently
       disagree whenever the backup is a day or more old. */
    var realDays = grid.filter(function (c) { return c >= 0; });
    var asOf = new Date((S.data && S.data.updatedAtMillis) || Date.now());
    var elapsed = realDays.slice(0, Math.max(1, asOf.getDate()));
    /* Time runs left to right: the oldest of the sixteen days is the first bar, today is the
       last one. */
    var recent = elapsed.slice(-16);
    var live = recent.filter(function (c) { return c > 0; }).length;
    g.appendChild(wSay(recent.length
      ? live + " of the last " + recent.length + " days carried news."
      : "No daily breakdown recorded yet."));
    var f = wFoot();
    if (recent.length) {
      var ticks = el("div", "wticks cov");
      // recent[last] is today, so the day number counts UP as the bars go right.
      var firstDay = asOf.getDate() - recent.length + 1;
      recent.forEach(function (c, i) {
        var t = el("i", c > 0 ? null : "spent");
        t.title = (w.monthLabel || "") + " " + (firstDay + i) + ": " +
                  c + (c === 1 ? " story" : " stories");
        ticks.appendChild(t);
      });
      f.appendChild(ticks);
    }
    g.appendChild(f);
    add(g);
  })();

  /* 3. The same month as a calendar. The bars above answer "how recently"; this answers
     "how it was spread". */
  add(calendarWidget(w));

  /* 4. Spend. Free RSS is a green state; anything that bills is amber. */
  (function () {
    var g = el("div", "widget");
    var mode = String(w.sourceMode || "");
    var free = /free/i.test(mode);
    /* Stamp is the SOURCE MODE, as on the phone (Eyebrow("Monthly spend", stamp = sourceMode)).
       It used to stamp the month, which the calendar tile two along already says. */
    g.appendChild(wTop("Spend", mode || null));
    // Full size, like every other hero on the strip. It was the small variant so a string like
    // 1234.56 would fit; with the phone's rounding rule that string cannot occur.
    //
    // No unit beside the figure. The stamp above already names the month, and saying it twice
    // on a 240px tile cost the number the room it was widened to have.
    g.appendChild(wHead(wHero(rupee(w.monthRupees), null, free ? "var(--good-ink)" : null)));
    g.appendChild(wSay(free
      ? "The free feed costs nothing to run."
      : "Grounded search is billed for every query."));
    var f = wFoot();
    /* The phone puts the next briefing here. The page put a source pill, which now duplicates the
       stamp above, and left nextBriefing unrendered anywhere on the strip. An "unknown" pill for a
       missing mode is also gone: the phone simply drops the stamp. */
    f.appendChild(el("span", null, String(w.nextBriefing || "").trim()
      ? "Next briefing " + String(w.nextBriefing) : "No briefing scheduled"));
    g.appendChild(f);
    add(g);
  })();

  /* 4. Industry trends. The mix, not just the leader. */
  (function () {
    var g = el("div", "widget");
    var top = arr(w.trendTop);
    /* "30d · 13", matching the phone's stamp (EchoWidgets: "${trendWindowDays}d · ${trendTotal}").
       The web showed only the window, so the two stamps read differently side by side. */
    g.appendChild(wTop("Industry trends", (w.trendWindowDays || 30) + "d" +
      (w.trendTotal ? " \u00b7 " + w.trendTotal : "")));
    g.appendChild(wHead(el("p", "w-topic", top.length ? top[0].n : "Nothing yet")));
    g.appendChild(wSay(top.length
      ? top[0].c + " of the " + (w.trendTotal || 0) + " stories in this window are on this theme."
      : "No tracked theme has been mentioned in this window."));
    var f = wFoot();
    if (top.length) {
      var split = el("div", "wsplit");
      var cols = ["var(--accent)", "var(--info)", "var(--warn)"];
      top.slice(0, 3).forEach(function (r, i) {
        var sp = el("span");
        sp.style.flex = String(r.c);
        sp.style.background = cols[i];
        split.appendChild(sp);
      });
      if (w.trendOthers) {
        var rest = el("span");
        rest.style.flex = String(w.trendOthers);
        rest.style.background = "var(--track)";
        split.appendChild(rest);
      }
      f.appendChild(split);
      /* The runners-up, not the leader: the headline above already names the leader, and a
         legend that repeats it spends the only two slots there are on something you have
         just read. Colours match the segments in the bar. */
      var lg = el("div", "wlegend");
      top.slice(1, 3).forEach(function (r, i) {
        var it = el("span");
        var d = el("i");
        d.style.background = cols[i + 1];
        it.appendChild(d);
        it.appendChild(document.createTextNode(r.c + " " + shortTheme(r.n)));
        lg.appendChild(it);
      });
      if (lg.children.length) f.appendChild(lg);
    }
    g.appendChild(f);
    add(g);
  })();

  /* 5 and 6. Heating up and cooling down: the same measure, two directions. */
  [["Heating up", w.risingTrend, w.risingRunners, "good", "rising"],
   ["Cooling down", w.coolingTrend, w.coolingRunners, "crit", "cooling"]
  ].forEach(function (side) {
    var g = el("div", "widget");
    g.appendChild(wTop(side[0], (w.trendWindowDays || 30) + "d"));
    g.appendChild(wHead(el("p", "w-topic", side[1] || "Nothing yet")));
    var runners = names(side[2]);
    g.appendChild(wSay(runners
      ? "Then " + runners + "."
      : "Nothing else is moving in this direction."));
    var f = wFoot();
    f.appendChild(wPill(side[3], side[4]));
    g.appendChild(f);
    add(g);
  });

  /* 7. Top mover. Share of voice, with the weeks behind it running the full width. */
  (function () {
    var g = el("div", "widget");
    var d = w.moverDelta || 0;
    var up = d >= 0;
    /* The window is on the face. The phone computes this over the Analytics card's 3M view, so
       saying "7d" here was simply a different claim from the one the number answers. */
    g.appendChild(wTop("Top mover", "3M"));
    g.appendChild(wHead(el("p", "w-topic", w.moverName || "No mover")));
    // Two lines is the whole budget here. The long form ran to three and the third was
    // clamped away, so the sentence ended mid-thought.
    g.appendChild(wSay((up ? "Up " : "Down ") + Math.abs(d) + " pts on its own average. " +
                       (w.moverSharePct || 0) + "% of coverage."));
    var f = wFoot();
    var series = arr(w.moverSeries);
    if (series.length > 1) {
      f.appendChild(wSpark(series, up ? "var(--good)" : "var(--crit)"));
    }
    g.appendChild(f);
    add(g);
  })();

  /* 8. Unverified. What is sitting in Alerts with no decision on it.
     No rule under this one: the bars ARE the footer, and a line above them would read as a
     divider between two things when there is only one. */
  (function () {
    var g = el("div", "widget");
    /* THIS PAGE'S OWN NUMBERS, not the phone's snapshot. The snapshot is the phone's feed
       as of its last backup; this page hides anything published here since, and counts
       anything verified here. Showing the phone's figure beside this page's alert list made
       one screen disagree with itself: "86 of 112" over a sidebar reading 94. */
    var open = alerts();
    var vset = verifiedSet();
    var tot = open.length;
    var un = open.filter(function (a) { return !vset.has(key(a.title)); }).length;
    var pct = tot ? Math.round((un / tot) * 100) : 0;
    g.appendChild(wTop("Unverified"));
    g.appendChild(wHead(wHero(un, "of " + tot + "<br>in alerts",
                              pct > 60 ? "var(--warn-ink)" : null)));
    g.appendChild(wSay(pct + "% of the feed is still undecided."));
    var f = wFoot();
    var cmp = el("div", "wcmp");
    [["Checked", tot - un, "var(--good)"], ["Waiting", un, "var(--warn)"]].forEach(function (r) {
      cmp.appendChild(el("span", null, r[0]));
      var bar = el("div", "wbar");
      var fill = el("span");
      fill.style.width = (tot ? (r[1] / tot) * 100 : 0) + "%";
      fill.style.background = r[2];
      bar.appendChild(fill);
      cmp.appendChild(bar);
      cmp.appendChild(el("b", null, String(r[1])));
    });
    f.appendChild(cmp);
    g.appendChild(f);
    add(g);
  })();

  dragScroll(strip);
  return strip;
}

/* Push the row of tiles sideways with the mouse, the way you would with a thumb on the phone.
   MOUSE AND PEN ONLY: touch already scrolls this natively, with momentum, and taking it over
   would replace a good gesture with a worse one.

   The pointer is captured only after it has actually travelled a few pixels, so a plain click
   still reaches whatever is underneath; and a drag that happens to end over a tile is stopped
   from also reading as a click on it. Nothing in the strip is clickable today, but the strip
   mirrors the phone's home-screen widgets and that is exactly the kind of thing that becomes
   clickable later. */
function dragScroll(strip) {
  var down = false, startX = 0, startLeft = 0, moved = 0, id = null;

  strip.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch" || e.button !== 0) return;
    down = true; moved = 0; id = e.pointerId;
    startX = e.clientX; startLeft = strip.scrollLeft;
    strip.classList.add("dragging");
  });

  strip.addEventListener("pointermove", function (e) {
    if (!down || e.pointerId !== id) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > moved) moved = Math.abs(dx);
    if (moved > 3) {
      /* Capture keeps the drag alive when the pointer leaves the strip. It throws if the
         browser no longer considers this pointer active, and an exception here would abandon
         the drag mid-gesture, so the scroll below must not depend on it succeeding. */
      try { if (!strip.hasPointerCapture(id)) strip.setPointerCapture(id); } catch (err) {}
      e.preventDefault();
    }
    strip.scrollLeft = startLeft - dx;
  });

  var end = function () {
    if (!down) return;
    down = false;
    try { if (id !== null && strip.hasPointerCapture(id)) strip.releasePointerCapture(id); }
    catch (err) {}
    id = null;
    strip.classList.remove("dragging");
  };
  strip.addEventListener("pointerup", end);
  strip.addEventListener("pointercancel", end);
  strip.addEventListener("lostpointercapture", end);

  strip.addEventListener("click", function (e) {
    if (moved > 3) { e.stopPropagation(); e.preventDefault(); }
  }, true);
  /* Without this the browser's own image drag starts instead, and the strip stops following. */
  strip.addEventListener("dragstart", function (e) { e.preventDefault(); });
}

/* The phone's formatRupees, ported exactly: no decimals above a thousand, one decimal above a
   hundred, two below. Ported rather than rewritten — a second implementation of a format is how
   the two screens start disagreeing about the same number, which has happened three times
   already on figures that were each individually correct. */
function rupee(v) {
  var n = Number(v) || 0;
  if (n >= 1000) return "₹" + Math.round(n).toLocaleString("en-US");
  return "₹" + n.toFixed(n >= 100 ? 1 : 2);
}

function renderDashboard(app, d) {
  var wrap = el("div", "dash");
  var w = d.widgets || {};
  var an = d.analytics || null;

  /* ---------- the glance strip: the eight home-screen widgets ---------- */
  /* The glance strip lives on News alerts now. This tab is the analytics wall and nothing
     else: a strip of eight summary tiles above it was answering a different question from
     the one the page is for. */

  /* If the phone has not shipped its analytics yet, say so plainly rather than compute a
     lookalike here — a lookalike is exactly how the two screens would start disagreeing. */
  if (!an || !an[AN_WIN]) {
    wrap.appendChild(el("div", "dempty",
      "Your phone has not sent its analytics yet. Open Settings, then Storage, and press Back " +
      "up. These figures are computed there, so this page waits for them rather than working " +
      "them out a second way."));
    app.appendChild(wrap);
    return;
  }

  var a = an[AN_WIN];
  var cv = a.conversion || {};
  var sov = arr(a.sov);
  var sovNames = sov.map(function (r) { return r.n; });
  var compColour = function (name) {
    if (name === "Other" || name === "Market-wide") return AN_GREY;
    var i = sovNames.indexOf(name);
    return i >= 0 ? AN_PALETTE[i % AN_PALETTE.length] : AN_GREY;
  };

  /* ---------- section header with the phone's 1M / 3M / 6M selector ---------- */
  var head = el("div", "anhead");
  var left = el("div");
  /* COUNT WHAT THE CARDS BELOW ACTUALLY PLOT.
     totalCount is `news.size` on the phone — the WHOLE feed, never filtered by the window — so
     labelling it "· last month" was wrong, and it read the same at 1M, 3M and 6M because it
     never varied. volPerWeek is the windowed volume the bars are drawn from, so its sum is the
     number this heading is claiming. */
  var inWindow = arr(a.volPerWeek).reduce(function (t, wk) {
    return t + arr(wk).reduce(function (x, y) { return x + y; }, 0);
  }, 0);
  /* The heading carries the COUNT, not the word "Analytics". The page title above it already
     says Analytics, and a section header repeating the name of the page it is on tells you
     nothing you did not know two lines ago. */
  left.appendChild(el("h2", null,
    inWindow + (inWindow === 1 ? " story " : " stories ") + anPhrase(AN_WIN) + ", " +
    (a.totalCount || 0) + " in the feed"));
  head.appendChild(left);
  var seg = el("div", "anseg");
  ["1M", "3M", "6M"].forEach(function (k) {
    if (!an[k]) return;
    var b = el("button", AN_WIN === k ? "on" : null, k);
    b.onclick = function () { AN_WIN = k; render(); };
    seg.appendChild(b);
  });
  head.appendChild(seg);
  wrap.appendChild(head);

  if (!a.totalCount) {
    wrap.appendChild(el("div", "dempty",
      "No news in this window. Try a longer range, or refresh on the phone."));
    app.appendChild(wrap);
    return;
  }

  /* Cards are collected first and placed afterwards. The packer measures each one to decide
     which column it goes in, and a card cannot be measured until the bento is in the document,
     so building the list and filling the wall are two separate steps. */
  var g = el("div", "bento");
  var cards = [];
  var add = function (card) { cards.push(card); };
  var c;

  /* API cost, and the metal prices beside it — the two "what is this costing / what is it
     worth" figures, together at the top where the phone puts cost. */
  c = anCard("API cost (estimate)", "What this app is spending on your key");
  anCost(c.body, d.settings || {});
  add(c);

  var np = arr(d.nalcoPrices);
  if (np.length) {
    c = anCard("Metal · NALCO circular", "Ingot and billet, ex-works");
    anMetal(c.body, np);
    add(c);
  }

  /* The phone's two headline stat cards. */
  function statCard(k, v, caption, colour) {
    var s = el("div", "anstat");
    s.appendChild(el("div", "k", k));
    var val = el("div", "v", v || "—");
    val.style.color = colour;
    s.appendChild(val);
    s.appendChild(el("div", "c", caption));
    return s;
  }
  add(statCard("Top mover", a.topMover,
    "Biggest " + anDelta(AN_WIN) + " gain in share of voice", AN_PALETTE[0]));
  add(statCard("Emerging topic", a.emergingTopic,
    "Channel rising fastest this " + anPeriod(AN_WIN), AN_PALETTE[2]));

  c = anCard("News volume", "Stories by channel over time");
  anVolume(c.body, a);
  add(c);

  c = anCard("News overview", "Of news fetched in the " + anPhrase(AN_WIN) + ", what you did with it");
  anOverview(c.body, cv, arr(d.alerts).length);
  add(c);

  c = anCard("Conversion flow", "Where every story ended up, from the feed to a decision");
  anFlow(c.body, a.sankey);
  add(c);

  c = anCard("Share of voice", "By competitor · " + anPhrase(AN_WIN));
  anSov(c.body, sov);
  add(c);

  c = anCard("Momentum", anUnit(AN_WIN) + " coverage trend by competitor");
  anMomentum(c.body, arr(a.momentum), compColour);
  add(c);

  c = anCard("Narrative ownership", "Who owns each topic's coverage");
  anNarrative(c.body, arr(a.narrative), compColour);
  add(c);

  c = anCard("Source diversity", "Where your intel comes from");
  anSources(c.body, a);
  add(c);

  c = anCard("Activity heatmap", "Competitor × category");
  anHeat(c.body, a);
  add(c);

  c = anCard("Industry trends", "Which tracked fenestration trends are heating up");
  anTrends(c.body, a);
  add(c);

  g._cards = cards;
  wrap.appendChild(g);
  /* The briefing now sits in the title row on every page, so repeating it under the
     analytics wall would state one fact twice on the same screen. */
  app.appendChild(wrap);
  /* In the document now, so it has a width to divide and cards that can report a height. */
  layoutBento(g, true);
}

/* ============================================================
   ASK — Layer 0
   ------------------------------------------------------------
   A chatbot with no model in it.

   Everything below is retrieval and templates over the snapshot the phone
   already sent. That is deliberate, and it is what makes this tab free: no
   API key, no server, no network call, nothing to meter. It also makes one
   guarantee no hosted model can make — it cannot state a fact that is not
   already in your data, because it never writes a sentence about a story it
   did not retrieve. When nothing scores above the floor it says so rather
   than reaching.

   Three moving parts:
     chIndex()    BM25-lite over title, summary and category
     chRoute()    which of five question shapes this is
     chAnswer()   returns a plain model; chRenderTurn() draws it

   Note on relevance: BM25 needs no blocklist. A word that appears in most of
   the feed ("aluminium", "window") earns a near-zero IDF on its own, so it
   stops discriminating without anyone maintaining a list of it. That is the
   opposite of the RSS query path, which has to be told what to ignore.
   ============================================================ */

/* Rebuilt only when the phone's snapshot changes, so typing is never O(corpus). */
var CH_IX = null;
var CH_LOG = [];      // [{q, kind, lead, stats, items, why, note}] — newest first
var CH_DRAFT = "";    // survives the render() that answering triggers

/* English function words only. Domain words are handled by IDF, not by a list. */
var CH_STOP = (function () {
  var o = {}, w = ("the a an and or but if of to in on for with without from by at as is are was were " +
    "be been being it its this that these those there here what which who whom how why when where " +
    "do does did done have has had having will would shall should can could may might must not no " +
    "about into over under after before than then them they their our your my me i you we us he she " +
    "his her him any all some more most much many few new news get got give any tell show me please " +
    "any anything something latest recent recently give").split(" ");
  for (var i = 0; i < w.length; i++) o[w[i]] = 1;
  return o;
})();

/* Words that pick the ROUTE rather than name a subject. "how many stories do I have" is a
   question about the whole app, not a search for the word "story" — so these must not count
   as content when deciding whether the question named anything to look for. */
var CH_ROUTE_WORDS = (function () {
  var o = {}, w = ("status summary overview count total number many much stand story article " +
    "item items feed everything hold").split(" ");
  for (var i = 0; i < w.length; i++) o[chStem(w[i])] = 1;
  return o;
})();

/* Crude but symmetric: applied to the query and the corpus alike, so it can only ever
   fold two forms of the same word together, never invent a match. */
function chStem(w) {
  if (w.length > 5 && /ies$/.test(w)) return w.slice(0, -3) + "y";
  if (w.length > 5 && /(sses|shes|ches|xes)$/.test(w)) return w.slice(0, -2);
  if (w.length > 5 && /ings?$/.test(w)) return w.replace(/ings?$/, "");
  if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
  return w;
}
function chTokens(s) {
  var raw = String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9À-ɏ]+/g, " ").split(" ");
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var w = raw[i];
    if (w.length > 2 && !CH_STOP[w]) out.push(chStem(w));
  }
  return out;
}

/* The phone's brand fold, ported verbatim from CompetitorRegistry.fold in GeminiService.kt.
   Schueco / Schüco / Schuco all reach the feed and all must collapse to one company, or a
   question about one spelling misses the stories filed under the other two. */
function chFold(s) {
  return String(s == null ? "" : s).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/ue/g, "u").replace(/oe/g, "o").replace(/ae/g, "a");
}
/* GENERIC_FIRST_WORDS, also from the phone: a competitor called "Window Magic" must not
   contribute the token "window", which would match essentially the whole feed. */
var CH_GENERIC = (function () {
  var o = {}, w = ("window windows aluminium aluminum glass glazing door doors india indian building " +
    "buildings system systems group steel metal profile profiles facade green smart solar energy").split(" ");
  for (var i = 0; i < w.length; i++) o[w[i]] = 1;
  return o;
})();
/* First word of the name, plus any parenthesised parent brand — not the full name.
   "Schueco India pvt Ltd" never appears verbatim in an article; "Schueco" does. */
function chBrandTerms(name) {
  var terms = [];
  var paren = /\(([^)]*)\)/.exec(String(name || ""));
  var primary = String(name || "").split("(")[0].trim();
  var words = primary.split(/\s+/).filter(function (x) { return x; });
  var first = words[0] || "";
  var base = (first.length >= 4 && !CH_GENERIC[first.toLowerCase()]) ? first
           : (words.length >= 2 ? words.slice(0, 2).join(" ") : primary);
  if (base.length >= 4) terms.push(base);
  if (paren && paren[1] && paren[1].trim().length >= 4) terms.push(paren[1].trim());
  return terms;
}

/* ---------- dates ----------
   `date` is the PUBLICATION date: formatDisplayDate() writes it as "August 27, 2026", and the
   phone works hard to keep it off fetch-time (the old "date = today" bug). SavedNews also carries
   a `timestamp`, but that is when YOU saved the story — reading it first would re-date every
   saved article to the day you filed it, so it is only a fallback. "Recent" stays honestly
   unknown rather than becoming today. */
function chMs(a) {
  var s = String((a && a.date) || "").trim();
  var dmy = /^(\d{1,2})-(\d{1,2})-(\d{4})/.exec(s);
  if (dmy) return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]).getTime();
  var t = s ? Date.parse(s) : NaN;
  if (!isNaN(t)) return t;
  return (a && a.timestamp > 1e12) ? a.timestamp : 0;
}
function chWhen(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}
function chPl(n, one, many) { return n + " " + (n === 1 ? one : many); }
function chList(a) {
  if (!a.length) return "";
  if (a.length === 1) return a[0];
  return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}

/* ---------- voice ----------
   The replies are assembled, not generated — there is no model behind this tab and no key in the
   page. So "sounds like a person" has to come from composition: answer first, in the register a
   colleague would use, with the shape of the answer driving the sentence rather than one template
   filling its slots.

   VARIANTS ARE CHOSEN BY HASH OF THE QUESTION, NOT AT RANDOM. Asking the same thing twice has to
   give the same words back: a tool that rephrases its own answer reads as though it is making the
   answer up, which is the one impression this tab cannot afford. Different questions land on
   different variants, so a conversation still varies. */
function chSeed(str) {
  var h = 5381, t = String(str || "");
  for (var i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h;
}
function chPick(seedStr, variants) { return variants[chSeed(seedStr) % variants.length]; }
function chCap(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : str; }

/* Small numbers as words, the way anyone writes them. "Three stories", not "3 stories". */
var CH_WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
function chNum(n) { return n >= 0 && n <= 10 ? CH_WORDS[n] : String(n); }

/* Relative time, because "14 August 2026" is how a record speaks and "last week" is how a person
   does. The exact date is still one tap away on the card, so nothing is lost by being vague here. */
function chAgo(ms) {
  if (!ms) return "";
  var days = Math.floor((Date.now() - ms) / 86400000);
  if (days < 0) return "dated ahead of today";
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 7) return days + " days ago";
  if (days < 14) return "last week";
  if (days < 31) return Math.round(days / 7) + " weeks ago";
  if (days < 365) return "back in " + new Date(ms).toLocaleDateString("en-GB", { month: "long" });
  return "back in " + new Date(ms).getFullYear();
}

/* "Glass Bulletin, yesterday" — whichever halves exist. */
function chCite(doc) {
  var from = doc && doc.source ? esc(doc.source) : "";
  var when = chAgo(doc && doc.ms);
  return from && when ? from + ", " + when : (from || when || "");
}
function chQuote(doc) { return "“" + esc(doc.title) + "”"; }


/* What the question is ABOUT, for quoting back. "how many articles mention thermal break"
   should read as "thermal break" in the answer, not as the whole sentence. Display only —
   retrieval always sees the full query. */
function chSubject(q) {
  var s = String(q || "").trim().replace(/\?+$/, "");
  s = s.replace(/^(how many|how much|count of|number of|total)\s+/i, "")
       .replace(/^(stories|story|articles|article|items|item|news)\s+/i, "")
       .replace(/^(about|on|mentioning|mention|regarding|for|with)\s+/i, "")
       .trim();
  return s || String(q || "").trim();
}

/* ---------- corpus ----------
   Every state the phone ships, deduped by title. `newsArticles` is the raw stored truth and
   is included for recall: a story can have left the live feed and still be the best answer. */
function chCorpus() {
  var d = S.data || {};
  var liked = new Set(arr(d.likedTitles).map(key));
  var disliked = new Set(arr(d.dislikedTitles).map(key));
  var pub = publishedSet();
  var ver = verifiedSet();
  var byKey = {}, out = [];

  function add(a, bucket) {
    if (!a || !a.title) return;
    var k = key(a.title);
    var rec = byKey[k];
    if (rec) { if (rec.buckets.indexOf(bucket) < 0) rec.buckets.push(bucket); return; }
    rec = {
      k: k, raw: a,
      title: a.title,
      summary: a.summary || "",
      category: a.category || "",
      source: a.source || "",
      company: a.company || "",
      region: a.region || "",
      ms: chMs(a),
      buckets: [bucket],
      liked: liked.has(k), disliked: disliked.has(k),
      published: pub.has(k), verified: ver.has(k)
    };
    byKey[k] = rec; out.push(rec);
  }

  arr(d.alerts).forEach(function (a) { add(a, "alerts"); });
  arr(d.savedNews).forEach(function (a) { add(a, "saved"); });
  published().forEach(function (a) { add(a, "published"); });
  arr(d.intel).forEach(function (a) { add(a, "intel"); });
  arr(d.newsArticles).forEach(function (a) { add(a, "stored"); });
  editions().forEach(function (e) { arr(e.articles).forEach(function (a) { add(a, "published"); }); });
  return out;
}

/* ---------- index ---------- */
function chIndex() {
  var stamp = String((S.data && S.data.updatedAtMillis) || 0);
  if (CH_IX && CH_IX.stamp === stamp) return CH_IX;

  var docs = chCorpus(), df = {}, vocab = {}, i, j;
  /* Field weights: a term in the headline says more about the story than the same term
     buried in a summary. The retired advisory field is not among them, so every ranking can
     be accounted for by text the reader can actually see. */
  var FIELDS = [["title", 3], ["category", 2], ["summary", 1], ["source", 1], ["company", 2], ["region", 1]];

  for (i = 0; i < docs.length; i++) {
    var tf = {}, len = 0;
    for (j = 0; j < FIELDS.length; j++) {
      var toks = chTokens(docs[i][FIELDS[j][0]]), wgt = FIELDS[j][1];
      for (var t = 0; t < toks.length; t++) { tf[toks[t]] = (tf[toks[t]] || 0) + wgt; len += wgt; }
    }
    docs[i].tf = tf; docs[i].len = len || 1;
    for (var term in tf) { df[term] = (df[term] || 0) + 1; vocab[term] = 1; }
  }

  var N = docs.length || 1, avg = 0;
  for (i = 0; i < docs.length; i++) avg += docs[i].len;
  avg = (avg / N) || 1;

  var idf = {};
  for (var w in df) idf[w] = Math.log(1 + (N - df[w] + 0.5) / (df[w] + 0.5));

  /* Entities come from what you onboarded, so the bot's vocabulary of companies and
     markets is exactly the phone's — it can never name a competitor you do not track. */
  var d = S.data || {};
  var comps = arr(d.competitors).filter(function (c) { return c && c.name; }).map(function (c) {
    return { name: c.name, terms: chBrandTerms(c.name).map(chFold), row: c };
  });
  var lands = arr(d.countries).filter(function (c) { return c && c.name; }).map(function (c) {
    return { name: c.name, terms: [chFold(c.name)], row: c };
  });
  var norms = arr(d.normCodes).filter(function (n) { return n && n.name; }).map(function (n) {
    return { name: n.name, terms: [chFold(n.name)], row: n };
  });

  CH_IX = { stamp: stamp, docs: docs, idf: idf, N: N, avg: avg, vocab: vocab,
            comps: comps, lands: lands, norms: norms };
  return CH_IX;
}

/* ---------- retrieval ---------- */
function chSearch(q, filter) {
  var ix = chIndex(), qt = chTokens(q), i, j;
  if (!qt.length) return [];
  var k1 = 1.2, b = 0.6, hits = [];
  var phrase = key(q).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  var now = Date.now();

  for (i = 0; i < ix.docs.length; i++) {
    var doc = ix.docs[i];
    if (filter && !filter(doc)) continue;
    var s = 0;
    for (j = 0; j < qt.length; j++) {
      var f = doc.tf[qt[j]];
      if (!f) continue;
      s += (ix.idf[qt[j]] || 0) * (f * (k1 + 1)) / (f + k1 * (1 - b + b * doc.len / ix.avg));
    }
    if (s <= 0) continue;
    /* A headline containing the question as typed is worth more than the sum of its words. */
    if (phrase.length > 6 && key(doc.title).indexOf(phrase) >= 0) s *= 1.6;
    /* Mild recency, so "latest" behaves without being a special case. */
    if (doc.ms) {
      var days = (now - doc.ms) / 86400000;
      s *= days < 7 ? 1.25 : days < 30 ? 1.12 : days < 120 ? 1 : 0.92;
    }
    /* Your own verdicts are ranking signals. Disliked is pushed down, never hidden —
       hiding it would make the bot disagree with the Disliked tab sitting next to it. */
    if (doc.disliked) s *= 0.45;
    if (doc.liked) s *= 1.15;
    if (doc.published) s *= 1.05;
    hits.push({ doc: doc, score: s });
  }
  hits.sort(function (x, y) { return y.score - x.score; });
  return hits;
}

/* The floor. Below this the honest answer is "I don't have that", and saying so is the
   single most important behaviour in the tab. */
function chAbove(hits) {
  if (!hits.length) return [];
  var top = hits[0].score;
  return hits.filter(function (h) { return h.score >= Math.max(0.9, top * 0.28); });
}

/* Words in the corpus that share a stem prefix with something the user typed — turns a
   dead end into a next move instead of a shrug. */
function chNear(q) {
  var ix = chIndex(), qt = chTokens(q), out = [], seen = {};
  for (var i = 0; i < qt.length; i++) {
    var p = qt[i].slice(0, 4);
    if (p.length < 4) continue;
    for (var v in ix.vocab) {
      if (v !== qt[i] && v.indexOf(p) === 0 && !seen[v]) { seen[v] = 1; out.push(v); }
      if (out.length >= 6) return out;
    }
  }
  return out;
}

/* ---------- entities ---------- */
function chEntities(q) {
  var ix = chIndex(), hay = chFold(q);
  var pick = function (list) {
    return list.filter(function (e) {
      return e.terms.some(function (t) { return t.length >= 4 && hay.indexOf(t) >= 0; });
    });
  };
  return { comps: pick(ix.comps), lands: pick(ix.lands), norms: pick(ix.norms) };
}

/* ---------- router ----------
   Rules, not a model. Five shapes cover what anyone actually asks this app, and a rule you
   can read is a rule you can fix when it misfires. */
function chRoute(q) {
  var t = " " + key(q).replace(/[^a-z0-9₹ ]+/g, " ") + " ";
  if (/\b(help|what can you do|what do you do|how does this work|who are you|what are you)\b/.test(t)) return "help";
  if (/(₹|\brupee|\bspend|\bspent|\bcost|\bcosts|\bbudget|\bcap\b|\btoken|\bbilling|\bbill\b|\bcheap|\bexpensive)/.test(t)) return "metric";
  if (/\b(trend|trends|trending|heating|cooling|momentum|share of voice|sov|top mover|mover|rising|falling|hot|quiet)\b/.test(t)) return "trend";
  if (/\b(how many|how much|count|total|number of|status|summary|overview|where do i stand)\b/.test(t)) return "count";
  return "find";
}

/* ============================================================
   ANSWERS — each returns a model, never DOM. render() draws it.
   ============================================================ */
function chAnswer(q) {
  var d = S.data || {}, ix = chIndex();
  var kind = chRoute(q);
  var ents = chEntities(q);

  /* Before anything else. A greeting or a "thanks" is neither a data question nor an off-beat
     one, and it used to fall through retrieval to "Nothing on that, I am afraid" — the worst
     possible answer to the most likely opening message. */
  if (chSocial(q)) return chAnsSocial(q, ix, d);

  /* Then: a question that is not about this beat gets a straight answer with a voice, rather than
     being run through retrieval so it can come back with a shrug. */
  if (chOffbeat(q)) return chAnsOffbeat(q, ix, d);

  /* Then: "how many saved", "how many competitors". These are questions about the app's own
     collections and are answered by COUNTING them. Retrieval used to take them, search story text
     for the word "saved", and report however many stories happened to contain it. */
  var buckets = chBucket(q);
  if (buckets) return chAnsBucket(q, d, ix, buckets);

  /* Then: the reader asking about themselves. Their name is in the app from the Google sign-in,
     so answering "nothing on Vineeth in your data" to Vineeth was never the right reply. */
  var me = chAsksAboutMe(q);
  if (me) return chAnsMe(q, ix, d, me);

  /* Then: a subject the corpus has never seen. "I like KTM" used to match the word "like" in 22
     stories and answer about Indian trade, never once mentioning KTM. */
  var subject = chUnknownSubject(q);
  if (subject) return chAnsOffCorpus(q, ix, d, subject);

  if (kind === "help") return chAnsHelp(q, ix);
  if (kind === "metric") return chAnsMetric(q, d, ix);
  if (kind === "trend") return chAnsTrend(q, d);

  /* A count question that NAMES something is a count over retrieval; one that names nothing —
     "what is the status", "how many stories do I have" — is the global figure. */
  var named = ents.comps.length || ents.lands.length || ents.norms.length;
  var body = chTokens(q).filter(function (t) { return !CH_ROUTE_WORDS[t]; });
  if (kind === "count" && !named && !body.length) return chAnsMetric(q, d, ix);

  return chAnsFind(q, d, ix, ents, kind === "count");
}

/* ---------- who is signed in ----------
   FIRST NAME ONLY is ever put in a prompt. The email is not needed to address someone and there
   is no reason to hand an account address to a model. */
function chMe() {
  var n = String((S && S.name) || "").trim();
  if (!n) return null;
  var first = n.split(/\s+/)[0];
  return { full: n, first: first };
}

/* Did the reader name themselves? Guards on length so a two-letter name cannot match half the
   vocabulary. */
function chAsksAboutMe(q) {
  var me = chMe();
  if (!me) return null;
  var t = " " + key(q).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ") + " ";
  var names = [me.full.toLowerCase(), me.first.toLowerCase()];
  var hit = names.some(function (n) { return n.length >= 3 && t.indexOf(" " + n + " ") >= 0; });
  return hit ? me : null;
}

function chAnsMe(q, ix, d, me) {
  var n = ix.docs.length, comps = arr(ix.comps).length;
  return {
    q: q, kind: "none",
    lead: "That is you — you are signed in as <b>" + esc(me.full) + "</b>.",
    stats: [], items: [], why: "",
    social: "me",
    subject: me.first,
    note: n ? "I read your data, not you: " + chPl(n, "story", "stories") +
              (comps ? " across " + chPl(comps, "competitor", "competitors") : "") + "."
            : ""
  };
}

/* ---------- a subject the corpus has never heard of ----------
   Returns the words the vocabulary does not know, or null when it knows them all. Those words are
   what the reader is actually talking about; retrieval will otherwise answer from whatever common
   word happened to come along with them. */
function chUnknownSubject(q) {
  var ix = chIndex();
  var toks = chTokens(q);
  if (!toks.length) return null;
  var unknown = toks.filter(function (t) { return ix.vocab[t] === undefined; });
  if (!unknown.length) return null;
  /* The reader's own name is not an unknown subject -- it is the reader. */
  if (chAsksAboutMe(q)) return null;
  /* Mentions the beat, or names something onboarded -> a real question, however it is worded. */
  var t = " " + key(q).replace(/[^a-z0-9 ]+/g, " ") + " ";
  if (CH_ONBEAT.test(t)) return null;
  var e = chEntities(q);
  if (e.comps.length || e.lands.length || e.norms.length) return null;
  /* The raw words, not the stems, so the model is handed "KTM" rather than "ktm". */
  var raw = String(q).split(/[^A-Za-z0-9À-ɏ]+/).filter(function (w) {
    if (w.length < 3) return false;
    var st = chStem(w.toLowerCase());
    return unknown.indexOf(st) >= 0;
  });
  return raw.length ? raw : unknown;
}

function chAnsOffCorpus(q, ix, d, subject) {
  var n = ix.docs.length, comps = arr(ix.comps).length;
  var w = (d && d.widgets) || {};
  var hot = String(w.risingTrend || "").trim();
  var invite = hot ? "Ask what is driving <b>" + esc(hot) + "</b>."
                   : (comps ? "Ask who has been loudest this month." : "Ask what is in here.");
  /* Basic says the plain, true thing: it has no world knowledge to comment with. Smart rewrites
     this and DOES comment -- see the offtopic branch in chPrompt. */
  return {
    q: q, kind: "none",
    lead: "Nothing on " + esc(subject.join(" ")) + " in your data.",
    stats: [], items: [], why: "",
    social: "offtopic",
    subject: subject.join(" "),
    note: n ? "Held here: " + chPl(n, "story", "stories") +
              (comps ? " across " + chPl(comps, "competitor", "competitors") : "") + ". " + invite
            : ""
  };
}

/* ---------- the app's own collections ----------
   Each entry is a thing the reader can point at in the UI, the words they might call it, and how
   to count it. Counting these by searching story text does not work: "saved" is not a word in the
   stories, it is a word about what the reader did with them. */
var CH_BUCKETS = [
  { k: "saved",     re: /\b(saved|bookmark(ed|s)?|kept)\b/,                     n: function (d) { return arr(d.savedNews).length; },      one: "saved story",     many: "saved stories",     where: "the Saved tab" },
  { k: "published", re: /\b(published|publish|shipped|sent out)\b/,             n: function ()  { return published().length; },           one: "published story", many: "published stories", where: "the Published tab" },
  { k: "alerts",    re: /\b(alert|alerts|feed|inbox|unread|incoming)\b/,        n: function ()  { return alerts().length; },              one: "story in alerts", many: "stories in alerts", where: "News alerts" },
  { k: "liked",     re: /\b(liked|likes|thumbs up|favourite[sd]?|favorite[sd]?)\b/, n: function (d) { return arr(d.likedTitles).length; }, one: "liked story",     many: "liked stories",     where: "the Liked tab" },
  { k: "disliked",  re: /\b(disliked|dislikes|thumbs down|hidden|rejected)\b/,  n: function (d) { return arr(d.dislikedTitles).length; }, one: "disliked story",  many: "disliked stories",  where: "the Disliked tab" },
  { k: "reports",   re: /\b(report|reports|edition|editions|dossier)\b/,        n: function ()  { return editions().length; },            one: "report",          many: "reports",           where: "the Reports tab" },
  { k: "comps",     re: /\b(competitor|competitors|compan(y|ies)|brand|brands|rival|rivals)\b/, n: function (d) { return arr(d.competitors).length; }, one: "competitor", many: "competitors", where: "the Database tab" },
  { k: "lands",     re: /\b(market|markets|countr(y|ies)|region|regions|geograph\w*)\b/, n: function (d) { return arr(d.countries).length; }, one: "market",     many: "markets",           where: "the Database tab" },
  { k: "norms",     re: /\b(norm|norms|standard|standards|code|codes|regulation[s]?)\b/, n: function (d) { return arr(d.normCodes).length; }, one: "norm or code", many: "norms and codes",  where: "the Database tab" },
  { k: "restore",   re: /\b(restore point[s]?|backup[s]?|snapshot[s]?)\b/,      n: function (d) { return arr(d.restorePoints).length; },  one: "restore point",   many: "restore points",    where: "Restore points" }
];

/* Is this a question ABOUT a collection rather than about what is in the stories? */
var CH_ASKS_COUNT = /\b(how many|how much|count|counts|number of|total|totals|do i have|have i got|are there|is there|show me|list|what is in|whats in|give me)\b/;

function chBucket(q) {
  var t = " " + key(q).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim() + " ";
  if (!CH_ASKS_COUNT.test(t)) return null;
  var hits = CH_BUCKETS.filter(function (b) { return b.re.test(t); });
  return hits.length ? hits : null;
}

/* Answer from the collection, and hand the figures over as stats so the Smart call cannot
   recompute them into something else. */
function chAnsBucket(q, d, ix, hits) {
  var stats = hits.map(function (b) {
    var n = b.n(d) || 0;
    return [chCap(b.many), String(n), b.where];
  });
  var lead;
  if (hits.length === 1) {
    var b = hits[0], n = b.n(d) || 0;
    lead = n
      ? "You have <b>" + n + "</b> " + (n === 1 ? b.one : b.many) + ", in " + b.where + "."
      : "Nothing in " + b.where + " yet.";
  } else {
    lead = "You have " + chList(hits.map(function (x) {
      var n = x.n(d) || 0;
      return "<b>" + n + "</b> " + (n === 1 ? x.one : x.many);
    })) + ".";
  }
  return {
    q: q, kind: "count", lead: lead, stats: stats, items: [], why: "",
    /* Compact prompt: answering "how many saved" cost 10,384 input tokens because the whole
       inventory went along for the ride. The figure is already in stats; the corpus adds nothing
       a count can use. */
    compact: true,
    /* Counted from the collections themselves, not from a search over story text -- which is what
       reported 5 saved stories when there were 191. */
    note: "Counted from the lists themselves, so these match what the tabs show."
  };
}

/* ---------- social ----------
   Anchored to the WHOLE message on purpose: "hey" is a greeting, "hey what is heating up" is a
   question, and only the first one belongs here. */
var CH_SOCIAL = [
  { k: "hello",  re: /^(hey+|hi+|hello+|yo|hiya|howdy|sup|namaste|greetings|good (morning|afternoon|evening|day))$/ },
  { k: "thanks", re: /^(thanks|thank you|thanks a lot|thx|ty|cheers|nice|cool|great|awesome|perfect|brilliant|lovely|good stuff|appreciate it)$/ },
  { k: "bye",    re: /^(bye|goodbye|good ?bye|see ya|see you|later|good ?night|cya)$/ },
  { k: "nudge",  re: /^(ok|okay|k|sure|yes|yeah|yep|no|nope|got it|right|hmm+|uh+|test|testing)$/ }
];

function chSocial(q) {
  var t = key(q).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  if (!t) return null;
  for (var i = 0; i < CH_SOCIAL.length; i++) if (CH_SOCIAL[i].re.test(t)) return CH_SOCIAL[i].k;
  return null;
}

/* PLAIN ON PURPOSE. This is the Basic path: local, free, and terse by design. It says what is
   held and what to ask next, and nothing more. The character belongs to Smart, where CH_VOICE
   carries it -- and where fixed wording here would be rewritten by the model anyway.
   The figures are counted from the corpus already in memory; nothing is invented. */
function chAnsSocial(q, ix, d) {
  var kind = chSocial(q);
  var n = ix.docs.length, comps = arr(ix.comps).length;
  var w = (d && d.widgets) || {};
  var hot = String(w.risingTrend || "").trim();

  /* One concrete question, preferring a real one built from live data. */
  var invite = hot
    ? "Ask what is driving <b>" + esc(hot) + "</b>."
    : (comps ? "Ask who has been loudest this month." : "Ask what is in here.");

  var lead;
  if (kind === "hello") {
    lead = n
      ? "Reading " + chPl(n, "story", "stories") +
        (comps ? " across " + chPl(comps, "competitor", "competitors") : "") + ". " + invite
      : "Nothing has arrived yet. Open Settings, then Storage on the phone and press Back up.";
  } else if (kind === "thanks") {
    lead = "Any time.";
  } else if (kind === "bye") {
    lead = "Goodbye.";
  } else {
    lead = n ? "Ready when you are. " + invite
             : "Nothing to read until the phone backs up.";
  }

  return {
    q: q, kind: "none", lead: lead, stats: [], items: [], why: "",
    /* Marks this as a NON-DATA turn. chPrompt uses it to send the compact prompt instead of the
       whole inventory — see the note there on what a greeting used to cost. */
    social: kind,
    note: (kind === "hello" && n)
      ? "Answers come only from what your phone has fetched. Every figure has a story behind it you can open."
      : ""
  };
}

/* ---------- out of scope ----------
   Questions that are not about this beat at all. Deliberately NARROW: it must be cheaper to miss
   one than to hijack a fair question about windows. Every pattern here is a subject this app has
   no business answering, and the domain guard below means a question that also mentions the beat
   ("write a report on Fenesta") never lands here. */
var CH_OFFBEAT = [
  /* "story" and "essay" are deliberately NOT here: "story" is this app's own word for a news
     item ("197 stories"), so including it would classify a core question as creative writing the
     moment it did not also mention windows. */
  { k: "make",    re: /\b(poem|poetry|haiku|song|lyrics|joke|novel|screenplay|limerick)\b/ },
  { k: "predict", re: /\b(world cup|ballon d\u2019?or|election|who will win|lottery|horoscope|zodiac|astrology|stock tip|crypto|bitcoin)\b/ },
  { k: "trivia",  re: /\b(capital of|who is the (president|prime minister|king|queen)|how tall|how old is|weather|temperature outside|football|cricket score|movie|netflix)\b/ },
  { k: "self",    re: /\b(are you (conscious|alive|real|human|sentient)|do you (love|like|hate)|meaning of life|are you chatgpt|what model are you|do you dream)\b/ },
  { k: "advice",  re: /\b(recipe|cook|medical|diagnos|symptom|prescri|legal advice|sue|divorce|tax return|write code|python|javascript)\b/ }
];

/* The beat. If any of this shows up, it is a real question and the normal path handles it. */
var CH_ONBEAT = /\b(window|windows|glaz|glass|alumini?um|facade|fa\u00e7ade|fenestrat|extrus|profile|mullion|casement|awning|thermal|u-value|competitor|market|norm|code|report|alert|saved|publish|spend|cost|trend|price|ingot|billet|nalco|schuco|sch\u00fcco)\b/;

/* Never a feature of this app, whatever else the sentence mentions. "Write a poem about
   aluminium extrusion" is still a poem, and the domain guard below would otherwise rescue it into
   retrieval and answer with a shrug. "report" and "summary" are deliberately NOT here: those ARE
   the product working, and must never be hijacked just by being named. */
var CH_NEVER = /\b(poem|poetry|haiku|song|lyrics|joke|limerick|horoscope|zodiac|recipe)\b/;

function chOffbeat(q) {
  var t = " " + key(q).replace(/[^a-z0-9\u2019 ]+/g, " ") + " ";
  if (CH_NEVER.test(t)) {
    for (var j = 0; j < CH_OFFBEAT.length; j++) if (CH_OFFBEAT[j].re.test(t)) return CH_OFFBEAT[j].k;
    return "make";
  }
  if (CH_ONBEAT.test(t)) return null;          // mentions the beat -> not off-beat
  for (var i = 0; i < CH_OFFBEAT.length; i++) {
    if (CH_OFFBEAT[i].re.test(t)) return CH_OFFBEAT[i].k;
  }
  return null;
}

/* Decline with a straight face, then spend the sentence on something real.
   The pivot is built from the reader's OWN figures, so the charm never costs a fact. */
function chAnsOffbeat(q, ix, d) {
  var n = ix.docs.length;
  var comps = arr(ix.comps).length, lands = arr(ix.lands).length;
  /* Plain, like the rest of Basic. Smart restates this with a voice; see CH_VOICE. */
  var lead = {
    make:    ["Not something this app does. It reads your market news."],
    predict: ["No forecasts. This answers from stories already published, each with a date."],
    trivia:  ["Outside what this app covers. It reads only the fenestration news your phone fetched."],
    self:    ["A reading tool for your market news. It answers from your data and nothing else."],
    advice:  ["Not something this app should answer. It only reads window-industry news."]
  }[chOffbeat(q) || "trivia"];

  /* The pivot names real holdings and a real question worth asking of them. Nothing invented:
     every number here is counted from the corpus already in memory. */
  var pivot = n
    ? "Held here: " + chPl(n, "story", "stories") +
      (comps ? " across " + chPl(comps, "competitor", "competitors") : "") +
      (lands ? " in " + chPl(lands, "market", "markets") : "") +
      ". Ask who has been loudest this month, what is heating up, or what a competitor has been saying."
    : "Once the phone backs up, ask who has been loudest this month.";

  return {
    q: q, kind: "none",
    lead: chPick(q, lead),
    stats: [], items: [], why: "",
    social: "offbeat",          // non-data turn: compact prompt, see chPrompt
    note: pivot
  };
}

function chAnsHelp(q, ix) {
  return {
    q: q, kind: "help",
    lead: "I answer from what your phone has already fetched — nothing else. I can find stories " +
          "by company, market, theme or wording; count what you hold; report your spend and " +
          "tokens; and tell you what is heating up or cooling down.",
    stats: [
      ["Stories I can read", String(ix.docs.length), "across alerts, saved, published and stored"],
      ["Companies tracked", String(ix.comps.length), "as onboarded on the phone"],
      ["Markets tracked", String(ix.lands.length), ""]
    ],
    items: [],
    why: "",
    note: "I have no model and no key behind me. If a story is not in your data I will say so " +
          "rather than write one — and I never reach outside the app."
  };
}

function chAnsMetric(q, d, ix) {
  var st = d.settings || {}, w = d.widgets || {};
  var t = key(q);
  var stats = [], lead;

  var spendToday = Number(st.spendToday) || 0, spendMonth = Number(st.spendMonth) || 0;
  var cap = Number(st.dailyCostCap) || 0;

  if (/(₹|rupee|spend|spent|cost|budget|cap|bill|token|cheap|expensive)/.test(t)) {
    stats = [
      ["Today", "≈ ₹" + spendToday.toFixed(2),
       (st.searchesToday || 0) + " searches · " + chPl(st.callsToday || 0, "call", "calls")],
      ["This month", "≈ ₹" + spendMonth.toFixed(2),
       (st.searchesMonth || 0) + " searches · " + (Number(st.tokensMonth) || 0).toLocaleString("en-IN") + " tokens"],
      ["Daily cap", "₹" + Math.round(cap), "the phone stops here"]
    ];
    lead = "You have spent about <b>₹" + spendMonth.toFixed(2) + "</b> this month, and <b>₹" +
           spendToday.toFixed(2) + "</b> today" +
           (cap ? " against a ₹" + Math.round(cap) + " daily cap" : "") + ". " +
           (st.newsSource === "rss"
              ? "Your phone is on the free RSS feed, so most of this month is history rather than new spend."
              : "Your phone is on " + (st.newsSource === "hybrid" ? "hybrid" : "grounded") + " fetching.");
    return { q: q, kind: "metric", lead: lead, stats: stats, items: [], why: "",
             note: "Estimate only. It assumes every search is billed, so the real bill is usually a " +
                   "little lower. Same figures as Analytics on the phone; I do not recompute them." };
  }

  /* A bare "how many / status" question: what you hold, not what it cost. */
  stats = [
    ["Stories held", String(ix.docs.length), "everything the phone has sent"],
    ["In alerts", String(alerts().length), (function () {
      // Same rule as the Unverified tile: this page's list, this page's verified set.
      var vs = verifiedSet();
      return alerts().filter(function (a) { return !vs.has(key(a.title)); }).length + " unverified";
    })()],
    ["Published", String(published().length), chPl(editions().length, "edition", "editions")],
    ["Ready to publish", String(readyArticles().length),
     w.readyOldestDays ? "oldest waiting " + w.readyOldestDays + "d" : "verified, not yet in a report"]
  ];
  lead = "You are holding <b>" + chPl(ix.docs.length, "story", "stories") + "</b> in total: " +
         chPl(alerts().length, "story", "stories") + " in alerts, " + published().length +
         " published, and " + chPl(arr(d.savedNews).length, "saved story", "saved stories") + ".";
  return { q: q, kind: "metric", lead: lead, stats: stats, items: [], why: "", note: "" };
}

function chAnsTrend(q, d) {
  var an = d.analytics || null, w = d.widgets || {};
  var a = an && an[AN_WIN];
  if (!a) {
    return { q: q, kind: "trend",
      lead: "Your phone has not sent its analytics yet.",
      stats: [], items: [], why: "",
      note: "Open Settings, then Storage, on the phone and press Back up. These figures are " +
            "computed there, and I wait for them rather than working them out a second way." };
  }
  var kw = arr(a.keywords);
  var rising = kw.filter(function (k) { return k.d > 0; }).sort(function (x, y) { return y.d - x.d; }).slice(0, 3);
  var cooling = kw.filter(function (k) { return k.d < 0; }).sort(function (x, y) { return x.d - y.d; }).slice(0, 3);
  var sov = arr(a.sov), lead = [];

  if (rising.length) lead.push("Heating up: <b>" + chList(rising.map(function (k) { return esc(k.n); })) + "</b>.");
  if (cooling.length) lead.push("Cooling down: <b>" + chList(cooling.map(function (k) { return esc(k.n); })) + "</b>.");
  if (w.moverName) {
    lead.push("Your top mover is <b>" + esc(w.moverName) + "</b>, " +
      (w.moverDelta > 0 ? "+" : "") + (w.moverDelta || 0) + " pts at " +
      (w.moverSharePct || 0) + "% share of voice.");
  } else if (sov.length) {
    lead.push("<b>" + esc(sov[0].n) + "</b> leads share of voice with " + chPl(sov[0].c, "story", "stories") + ".");
  }
  if (!lead.length) lead.push("Nothing has moved enough to call a trend over " + anPhrase(AN_WIN) + ".");

  var stats = [];
  arr(a.trendGroups).slice(0, 4).forEach(function (r) {
    stats.push([r.n, String(r.c), "stories"]);
  });

  /* Show the stories behind the claim, so a trend is never just a number. */
  var seed = rising.concat(cooling).map(function (k) { return k.n; }).join(" ") + " " + (w.moverName || "");
  var items = chAbove(chSearch(seed)).slice(0, 4).map(function (h) { return h.doc; });

  return { q: q, kind: "trend", lead: lead.join(" "), stats: stats, items: items,
           why: items.length ? "The stories behind those movements." : "",
           note: "Computed on the phone over " + anPhrase(AN_WIN) + " — switch the window on the Dashboard." };
}

function chAnsFind(q, d, ix, ents, wantCount) {
  var filter = null, scopeBits = [];

  /* An onboarded name is an exact fact about the story, not a fuzzy one — so when the question
     names a company or a market, that becomes a hard filter and retrieval only ranks within it. */
  if (ents.comps.length) {
    var terms = [];
    ents.comps.forEach(function (c) { terms = terms.concat(c.terms); });
    scopeBits.push(chList(ents.comps.map(function (c) { return esc(c.name); })));
    filter = function (doc) {
      var hay = chFold(doc.title + " " + doc.summary + " " + doc.company);
      return terms.some(function (t) { return hay.indexOf(t) >= 0; });
    };
  }
  if (ents.lands.length) {
    var lt = ents.lands.map(function (c) { return chFold(c.name); });
    var prev = filter;
    scopeBits.push(chList(ents.lands.map(function (c) { return esc(c.name); })));
    filter = function (doc) {
      if (prev && !prev(doc)) return false;
      var hay = chFold(doc.title + " " + doc.summary + " " + doc.region);
      return lt.some(function (t) { return hay.indexOf(t) >= 0; });
    };
  }

  var hits = chAbove(chSearch(q, filter));

  /* Naming a tracked company with no other useful words is still a valid question:
     fall back to everything that mentions it, newest first. */
  if (!hits.length && filter) {
    hits = ix.docs.filter(filter).sort(function (a, b) { return b.ms - a.ms; })
      .map(function (doc) { return { doc: doc, score: 1 }; });
  }

  if (!hits.length) {
    var near = chNear(q);
    var norm = ents.norms[0];
    if (norm) {
      return { q: q, kind: "norm",
        lead: "<b>" + esc(norm.name) + "</b> is one of your onboarded norms" +
              (norm.row.type ? " (" + esc(norm.row.type) + ")" : "") + ", applying to " +
              esc(norm.row.countryName || "all markets") + " · " + esc(norm.row.competitorName || "all competitors") +
              ". No story in your data mentions it yet.",
        stats: [], items: [], why: "",
        note: norm.row.linkUrl ? "The reference link is on the Data tab." : "" };
    }
    return { q: q, kind: "none",
      lead: chPick(q, [
        "Nothing on that, I am afraid.",
        "I have nothing on that in your data.",
        "That one draws a blank."
      ]),
      stats: [], items: [], why: "",
      note: "I read only what your phone has fetched — " + chPl(ix.docs.length, "story", "stories") +
            ", plus your competitors, markets and norms. I will not answer from outside the app." +
            (near.length ? " Words I do have that look close: " + near.slice(0, 5).join(", ") + "." : "") };
  }

  var docs = hits.map(function (h) { return h.doc; });
  var top = docs[0];
  var inAlerts = docs.filter(function (x) { return x.buckets.indexOf("alerts") >= 0; }).length;
  var pubbed = docs.filter(function (x) { return x.published; }).length;
  var dis = docs.filter(function (x) { return x.disliked; }).length;

  /* Most common category, for a sentence that says something about the shape of the answer. */
  var cats = {}, best = "", bestN = 0;
  docs.forEach(function (x) {
    if (!x.category) return;
    cats[x.category] = (cats[x.category] || 0) + 1;
    if (cats[x.category] > bestN) { bestN = cats[x.category]; best = x.category; }
  });

  var scope = scopeBits.length ? "<b>" + chList(scopeBits) + "</b>" : "“" + esc(chSubject(q)) + "”";
  var n = docs.length, cite = chCite(top), quoted = chQuote(top);
  var tail = cite ? " — " + cite + "." : ".";
  var lead;

  /* The SHAPE of the answer picks the sentence. One hit and forty hits are different pieces of
     news about your own data, and a person says them differently; a single template with the
     count dropped into it says them identically, which is what made this read like a receipt. */
  if (wantCount) {
    /* chNum(0) is "no", which only reads as English in some positions ("no published" is fine,
       "no still in alerts" is not), so the zero cases are spelled out rather than substituted. */
    var inAl = inAlerts ? chNum(inAlerts) : "none";
    var pub = pubbed ? chNum(pubbed) : "none";
    lead = chPick(q, [
      chCap(chNum(n)) + " on " + scope + ": " + inAl + " still in alerts, " + pub + " published.",
      "You have " + chNum(n) + " on " + scope + " — " + inAl + " in alerts, " + pub + " already published.",
      chCap(chNum(n)) + " altogether on " + scope + ". " +
        (inAlerts ? chCap(inAl) + (inAlerts === 1 ? " is" : " are") + " still in alerts" : "None are still in alerts") + "; " +
        (pubbed ? pub + (pubbed === 1 ? " made it" : " made it") + " into a report." : "none have made it into a report.")
    ]);
  } else if (n === 1) {
    lead = chPick(q, [
      "Just the one on " + scope + ": " + quoted + tail,
      "One story on " + scope + " — " + quoted + tail,
      "There is a single story on " + scope + ": " + quoted + tail
    ]);
  } else if (n <= 5) {
    lead = chPick(q, [
      chCap(chNum(n)) + " on " + scope + ". The closest is " + quoted + tail,
      "Not many — " + chNum(n) + " on " + scope + ", the nearest being " + quoted + tail,
      chCap(chNum(n)) + " match " + scope + "; the best fit is " + quoted + tail
    ]);
  } else {
    lead = chPick(q, [
      chCap(chNum(n)) + " on " + scope + ", led by " + quoted + tail,
      "Plenty — " + n + " on " + scope + ". " + quoted + " sits at the top" + (cite ? " (" + cite + ")." : "."),
      "There are " + n + " on " + scope + ". The closest is " + quoted + tail
    ]);
  }

  /* Only worth saying when the cluster is real. "Three of forty are filed under X" is noise, and
     every variant here has to stay true at the threshold that lets it through. */
  if (bestN > 1 && n > 2 && bestN / n >= 0.4) {
    lead += " " + chPick(q + "|cat", [
      chCap(chNum(bestN)) + " of the " + chNum(n) + " are filed under " + esc(best) + ".",
      esc(best) + " accounts for " + chNum(bestN) + " of them.",
      "They lean toward " + esc(best) + " — " + chNum(bestN) + " of " + chNum(n) + "."
    ]);
  }

  var stats = [];
  if (docs.length > 2) {
    var newest = docs.slice().sort(function (a, b) { return b.ms - a.ms; })[0];
    stats = [
      ["Matches", String(docs.length), scopeBits.length ? "within your scope" : "above the relevance floor"],
      ["Newest", newest.ms ? chWhen(newest.ms) : "undated", newest.source || ""],
      ["Published already", String(pubbed), pubbed ? "in a report" : "none yet"]
    ];
  }

  var why = "I ranked these on wording first, then how recent they are, then what you have liked." +
            (dis ? " " + chPl(dis, "story", "stories") + " you disliked got pushed down rather than hidden." : "");

  /* Six cards is the right number to READ. The model gets more than that, because a summary
     drawn from six of forty matches is a summary of the wrong thing — so the extras ride along
     for grounding and are not drawn. */
  return { q: q, kind: "find", lead: lead, stats: stats,
           items: docs.slice(0, 6), context: docs.slice(0, 24), why: why, note: "" };
}


/* ============================================================
   THE MODEL, WHEN YOU SUPPLY ONE
   ------------------------------------------------------------
   RETRIEVAL STAYS LOCAL AND FREE. Everything above this line picks WHICH of your stories answer
   the question and composes a reply from them at zero cost. The model is only ever asked to
   PHRASE that answer over the handful of stories already retrieved — which is why the prompt is
   small, why the reply cannot drift onto material you do not hold, and why the source cards under
   it remain the evidence rather than decoration.

   NO GROUNDING, EVER. The `tools` field is deliberately absent. Google Search grounding is the
   part of the phone's bill that actually costs money — it is billed per QUERY — and it is also
   what makes a grounded 3.x call 429 on a project without billing. A plain generateContent call is
   the free-tier-eligible kind, and every fact it needs is already in the prompt.

   THE KEY LIVES IN THIS BROWSER AND NOWHERE ELSE. Not in the HTML, which is served publicly from
   GitHub Pages and readable by anyone; and not in the Drive backup, which is private but is a SYNC
   file: loaded into every browser that opens this page, copied into restore points, and one click
   from being shared. The phone made the same call — its payload ships `hasApiKey` as a boolean,
   with "no keys, no request bodies" written beside it.

   WHEN THE FREE QUOTA RUNS OUT the call 429s and the turn falls back to the composed answer, which
   costs nothing and is always there. Running out degrades the wording, never the answer. */
var CH_KEY_LS = "echo.gemini.key";
var CH_MODE_LS = "echo.ask.mode";
var CH_SPARK = false;   // one burst, consumed by the next render

/* MODE IS A CHOICE, NOT A CONSEQUENCE. Before this, holding a key silently meant every question
   went to the model. Now Basic and Smart are picked explicitly and remembered, so a key can sit
   saved while you deliberately stay on the free path — and Smart with no key asks for one rather
   than quietly behaving like Basic. */
/* One pass of the brand ramp over the page, then the element is taken away again. Reused rather
   than recreated, and the class is removed on animationend so a second switch re-runs it — an
   animation that only plays once per page load reads as broken the second time. */
function smartWash() {
  var el0 = document.getElementById("smartwash");
  if (!el0) {
    el0 = document.createElement("div");
    el0.id = "smartwash";
    el0.setAttribute("aria-hidden", "true");
    /* Into #shell, never the body: the drawer sits outside #shell, so this is what keeps the wash
       off the sidebar. Falls back to the body only if the shell is somehow absent. */
    ($("#shell") || document.body).appendChild(el0);
  }
  el0.classList.remove("go");
  void el0.offsetWidth;            // reflow, so the animation restarts rather than being ignored
  el0.classList.add("go");
  el0.addEventListener("animationend", function once() {
    el0.classList.remove("go");
    el0.removeEventListener("animationend", once);
  });
}

function chMode() {
  try { return localStorage.getItem(CH_MODE_LS) === "smart" ? "smart" : "basic"; } catch (e) { return "basic"; }
}
function chSetMode(v) {
  try { localStorage.setItem(CH_MODE_LS, v === "smart" ? "smart" : "basic"); } catch (e) {}
}
/* The only test that matters at the call site: Smart chosen AND a key to call with. */
function chSmart() { return chMode() === "smart" && !!chKey(); }
var CH_MODEL = "gemini-3.5-flash-lite";   // the phone's pinned model; keep the two in step
var CH_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/" + CH_MODEL + ":generateContent";

/* NO FORMAT CHECK ON THE KEY, EVER. AIza... and AQ... are both valid and the shapes keep changing;
   the only honest test of a key is a live call, and a prefix guard would reject a working one. */
function chKey() { try { return localStorage.getItem(CH_KEY_LS) || ""; } catch (e) { return ""; } }
function chSetKey(v) {
  try { v ? localStorage.setItem(CH_KEY_LS, v) : localStorage.removeItem(CH_KEY_LS); } catch (e) {}
}

var CH_RULES = [
  "You are Echo, the assistant inside a personal market-intelligence app for the outward-opening",
  "aluminium window and facade industry. The reader is a product manager at Schüco.",
  "",
  "GROUNDING. Two blocks follow. INVENTORY is the COMPLETE list of stories the reader holds; if a",
  "company, market, product or event is not in it, they do not have it, and the honest answer is to",
  "say so. DETAIL carries the full text of the stories that best match this question, and is where",
  "substance should come from. Never state a fact that is not traceable to one of those lines.",
  "Never invent a company, figure, headline, date or source, and never answer from your own",
  "knowledge of the industry — the reader is asking what THEIR data says, not what is true in",
  "general. If the material is thin, say it is thin."
].join("\n");

/* The register, which does not change with the question. The SHAPE says what the parts are; this
   says how they sound. */
var CH_VOICE = [
  "",
  "THE READER HAS A NAME and you are told it. Use it the way a colleague would — occasionally, at",
  "a natural moment, never in every message and never in the same place twice. You know it because",
  "they are signed in; you know nothing else about them, so do not imply that you do.",
  "",
  "ANSWER THE QUESTION THAT WAS ASKED, IN ITS OWN SHAPE. A yes/no question — \"do you know X\",",
  "\"is X in here\", \"have you got anything on X\" — is answered yes or no in the first few words,",
  "and only then with what you hold. Launching into a report the reader did not ask for reads as",
  "not having listened. Put any heading on its own line, never mid-sentence.",
  "",
