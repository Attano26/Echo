<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental — layout options</title>
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!--
  Elemental — layout options.

  A THROWAWAY page for choosing a direction, not shipping code. It is deliberately
  separate from elemental.html so nothing here can affect the live app, and it is not
  in the service worker's asset list so it will never be cached as part of the app.

  Three layouts, same real data shape, same design tokens as the phone. Switch between
  them, resize the window, open it on a phone. Then we build the winner properly.
-->

<style>
:root{
  --paper:#F5F5F7; --surface:#FFFFFF; --surface-2:#F7F7F9;
  --track:#EAEAEF; --track-on:#FFFFFF;
  --ink:#1D1D1F; --ink-2:#3F4048; --ink-3:#5D5E66;
  --line:#E3E3E6;
  --accent:#6366F1; --accent-soft:rgba(99,102,241,.12);
  --free:#34C759; --paid:#E5A33B;
  --r-card:14px; --r-box:10px; --r-pill:999px;
  --fs:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E0E0E; --surface:#1A1A1F; --surface-2:#1F1F22;
    --track:#232329; --track-on:#43434E;
    --ink:#F5F5F7; --ink-2:#C9CAD3; --ink-3:#9A9CAB; --line:#2A2A2F;
    --accent-soft:rgba(99,102,241,.16);
  }
}
:root[data-theme="dark"]{
  --paper:#0E0E0E; --surface:#1A1A1F; --surface-2:#1F1F22;
  --track:#232329; --track-on:#43434E;
  --ink:#F5F5F7; --ink-2:#C9CAD3; --ink-3:#9A9CAB; --line:#2A2A2F;
  --accent-soft:rgba(99,102,241,.16);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}

/* ---------- chooser bar (mockup only — would not ship) ---------- */
#chooser{position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--line);padding:10px 16px}
#chooser .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#chooser .lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;gap:2px;background:var(--track);border-radius:var(--r-box);padding:3px}
.seg button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.seg button.on{background:var(--track-on);color:var(--ink);font-weight:600}
#chooser .sp{flex:1}
.mini{font-size:12px;color:var(--ink-3)}

/* ---------- shared pieces ---------- */
.mark{width:26px;height:26px;flex:0 0 26px;color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
h1.big{font-size:34px;line-height:1.1;letter-spacing:-.5px;font-weight:700;margin:0}
.sub{color:var(--ink-3);font-size:15px;margin:4px 0 0}
.lblsec{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--ink-3);
  text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:10px}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
.meta{font-size:12px;color:var(--ink-3)}
.ttl{font-size:15.5px;font-weight:600;line-height:1.4;margin:8px 0 0}
.sum{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:8px 0 0}
.adv{font-size:13px;color:var(--ink-2);line-height:1.6;margin:10px 0 0;
  padding-left:12px;border-left:2px solid var(--accent)}
.acts{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.vf{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);
  padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--line)}
.btn{background:var(--accent);color:#fff;border-radius:var(--r-pill);padding:10px 18px;
  font-size:14px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 15px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.srcchip{display:inline-flex;align-items:center;gap:7px;background:var(--track);
  border-radius:var(--r-box);padding:7px 11px;font-size:13px}

/* ---------- A: drawer + feed (what is live today) ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0}
.topbar .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--ink-3)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.titlerow{display:flex;align-items:flex-start;gap:14px;padding:8px 0 2px}
.titlerow .tt{flex:1}
.fakedrawer{position:absolute;left:0;top:0;bottom:0;width:250px;background:var(--surface);
  border-right:1px solid var(--line);padding:16px 0}
.drow{display:flex;align-items:center;gap:11px;width:100%;padding:10px 18px;font-size:14.5px;
  color:var(--ink-2);border-left:2.5px solid transparent}
.drow.on{color:var(--accent);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft)}
.drow .dn{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:400}

/* ---------- B: persistent rail on wide, drawer on narrow ---------- */
.blayout{display:grid;grid-template-columns:250px 1fr;min-height:70vh}
.brail{background:var(--surface);border-right:1px solid var(--line);padding:18px 0}
.bmain{padding:0 24px}
@media (max-width:820px){
  .blayout{grid-template-columns:1fr}
  .brail{display:none}
}

/* ---------- C: split list + reading pane ---------- */
.clayout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;min-height:70vh}
.clist{overflow-y:auto;max-height:78vh;padding-right:4px}
.cread{background:var(--surface);border-radius:var(--r-card);padding:24px;align-self:start;position:sticky;top:78px}
.cread h2{font-size:21px;line-height:1.3;margin:10px 0 0;letter-spacing:-.2px}
.cread .body{font-size:14.5px;color:var(--ink-2);line-height:1.75;margin:14px 0 0}
.crowcard{background:var(--surface);border-radius:var(--r-box);padding:13px;margin-bottom:8px;cursor:pointer}
.crowcard.on{outline:2px solid var(--accent);outline-offset:-2px}
.crowcard .t{font-size:14px;font-weight:600;line-height:1.4;margin:6px 0 0}
@media (max-width:900px){
  .clayout{grid-template-columns:1fr}
  .cread{position:static;max-height:none}
  .clist{max-height:none;overflow:visible}
}

/* ---------- how it opened ---------- */
#how{background:var(--surface);border-radius:var(--r-card);padding:18px;margin:20px 0}
#how h3{margin:0 0 4px;font-size:15px}
#how .note{font-size:12.5px;color:var(--ink-3);line-height:1.65;margin:0 0 14px}
.kv{display:flex;gap:12px;padding:7px 0;font-size:13.5px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--ink-3);flex:1}
.kv .v{color:var(--ink);font-weight:600;text-align:right}
.kv .v.no{color:var(--ink-3);font-weight:400}
#installRow{margin-top:14px}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.65;background:var(--surface-2);
  border-radius:var(--r-box);padding:12px;margin-top:12px}
</style>
</head>
<body>

<div id="chooser">
  <div class="in">
    <span class="lbl">Layout</span>
    <div class="seg" id="pick">
      <button data-v="a" class="on">A · Drawer</button>
      <button data-v="b">B · Rail</button>
      <button data-v="c">C · Split</button>
    </div>
    <span class="sp"></span>
    <span class="mini" id="wsize"></span>
    <button class="btn sm ghost" id="themeBtn">Theme</button>
  </div>
</div>

<div class="wrap" id="stage"></div>

<div class="wrap">
  <div id="how">
    <h3>How this page opened</h3>
    <p class="note">Read live from your browser. This is the same detection the real app would use.</p>
    <div id="howRows"></div>
    <div id="installRow"></div>
  </div>
  <p class="mini" style="padding-bottom:40px">
    Mockup only — separate from the live app, and never cached by it.
  </p>
</div>

<script>
"use strict";
var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

var MARK = '<svg viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true">' +
  '<path fill="currentColor" d="M112 110 H912 V336 H112 Z M112 398 H338 A226 226 0 0 1 112 624 Z' +
  ' M400 398 H912 V624 H626 A226 226 0 0 1 400 398 Z M112 686 A226 226 0 0 1 338 912 H112 Z' +
  ' M400 912 A226 226 0 0 1 626 686 H912 V912 Z"/></svg>';

/* Realistic content — your actual stories, so the layouts are judged on real text lengths
   rather than lorem ipsum, which always flatters a design. */
var NEWS = [
  { cat:"Material prices", date:"26 Aug 2026", src:"Mint",
    t:"Hindustan Zinc vs Hindalco: Jefferies picks one metal stock for 31% upside",
    s:"Jefferies initiated coverage across Indian base-metal producers, favouring one on smelter cost position and captive power.",
    a:"Watch input costs feeding through to extrusion pricing next quarter." },
  { cat:"Tenders & project opportunities", date:"26 Aug 2026", src:"ET Realty",
    t:"Reliance explores aluminium entry as Adani lines up $11.5 billion bet",
    s:"Two conglomerates circling primary aluminium capacity would reshape domestic billet supply within three years.",
    a:"A domestic supply shift changes who your fabricators buy from, not just what it costs." },
  { cat:"Project wins", date:"26 Aug 2026", src:"Construction Week",
    t:"Fenesta strengthens Karnataka presence with 11th showroom in Bengaluru, 23rd in the state",
    s:"Retail-led expansion continues to pull mid-segment specification toward finished-window brands.",
    a:"Direct competitor, tracked market. This is the story the old per-query cap was throwing away." },
  { cat:"Regulations & codes", date:"24 Aug 2026", src:"Construction Week",
    t:"BIS revises wind-load code for tall facades",
    s:"Revised draft raises test pressures for buildings above 45 m, with implications for curtain-wall specification." }
];
var SECTIONS = [["Alerts",92],["Saved",97],["Published",91],["Reports",1],["Liked",24],["Disliked",6],["Database",10],["Restore points",6]];

function markEl(cls){ var d = el("div", cls || "mark"); d.innerHTML = MARK; return d; }
function iconBtn(svg){ var b = el("button","iconbtn"); b.innerHTML = svg; return b; }
var I_MENU = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
var I_GEAR = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>';

function srcChip(){
  var c = el("span","srcchip");
  var d = el("span","dot"); d.style.background = "var(--free)";
  c.appendChild(d); c.appendChild(el("span",null,"Free RSS"));
  return c;
}
function newsCard(n, opts){
  opts = opts || {};
  var c = el("div","card" + (opts.sel ? " sel" : ""));
  var top = el("div","crow");
  top.appendChild(el("span","cat",n.cat));
  top.appendChild(el("span","meta",n.date));
  c.appendChild(top);
  c.appendChild(el("p","ttl",n.t));
  if(n.s) c.appendChild(el("p","sum",n.s));
  if(n.a && !opts.tight) c.appendChild(el("p","adv",n.a));
  var acts = el("div","acts");
  var a = el("a","meta",n.src + " ↗"); a.href = "#";
  acts.appendChild(a);
  var v = el("label","vf");
  v.appendChild(el("span",null,"Mark verified"));
  acts.appendChild(v);
  c.appendChild(acts);
  return c;
}
function railList(activeIdx){
  var f = document.createDocumentFragment();
  SECTIONS.forEach(function(s, i){
    var r = el("div","drow" + (i === activeIdx ? " on" : ""));
    r.appendChild(el("span",null,s[0]));
    r.appendChild(el("span","dn",String(s[1])));
    f.appendChild(r);
  });
  return f;
}
function header(withMenu){
  var bar = el("div","topbar");
  if(withMenu) bar.appendChild(iconBtn(I_MENU));
  bar.appendChild(markEl());
  bar.appendChild(el("div","sp"));
  bar.appendChild(iconBtn(I_GEAR));
  return bar;
}
function titleRow(){
  var r = el("div","titlerow");
  var tt = el("div","tt");
  tt.appendChild(el("h1","big","News"));
  tt.appendChild(el("p","sub","Window market intelligence"));
  r.appendChild(tt);
  r.appendChild(srcChip());
  return r;
}

/* ---------- the three layouts ---------- */
function layoutA(stage){
  stage.appendChild(header(true));
  stage.appendChild(titleRow());
  stage.appendChild(el("div","lblsec","Subscribed alerts"));
  NEWS.forEach(function(n){ stage.appendChild(newsCard(n)); });
}
function layoutB(stage){
  stage.appendChild(header(true));
  var g = el("div","blayout");
  var rail = el("div","brail");
  rail.appendChild(railList(0));
  g.appendChild(rail);
  var main = el("div","bmain");
  main.appendChild(titleRow());
  main.appendChild(el("div","lblsec","Subscribed alerts"));
  NEWS.forEach(function(n){ main.appendChild(newsCard(n)); });
  g.appendChild(main);
  stage.appendChild(g);
}
function layoutC(stage){
  stage.appendChild(header(true));
  stage.appendChild(titleRow());
  var g = el("div","clayout");
  g.style.marginTop = "16px";
  var list = el("div","clist");
  var read = el("div","cread");
  function paint(i){
    read.innerHTML = "";
    var n = NEWS[i];
    read.appendChild(el("span","cat",n.cat));
    read.appendChild(el("h2",null,n.t));
    read.appendChild(el("p","meta",n.date + " · " + n.src));
    read.appendChild(el("p","body", n.s + " " + (n.a || "")));
    var acts = el("div","acts");
    var b1 = el("button","btn sm","Mark verified");
    var b2 = el("button","btn sm ghost","Open source ↗");
    acts.appendChild(b1); acts.appendChild(b2);
    read.appendChild(acts);
    Array.prototype.forEach.call(list.children, function(ch, j){
      ch.classList.toggle("on", j === i);
    });
  }
  NEWS.forEach(function(n, i){
    var r = el("div","crowcard" + (i === 0 ? " on" : ""));
    var top = el("div","crow");
    top.appendChild(el("span","cat",n.cat));
    top.appendChild(el("span","meta",n.date));
    r.appendChild(top);
    r.appendChild(el("p","t",n.t));
    r.onclick = function(){ paint(i); };
    list.appendChild(r);
  });
  g.appendChild(list); g.appendChild(read);
  stage.appendChild(g);
  paint(0);
}

var LAYOUTS = { a: layoutA, b: layoutB, c: layoutC };
function render(v){
  var stage = $("#stage");
  stage.innerHTML = "";
  (LAYOUTS[v] || layoutA)(stage);
  Array.prototype.forEach.call($("#pick").children, function(b){
    b.classList.toggle("on", b.dataset.v === v);
  });
  try { localStorage.setItem("elemental.mock.layout", v); } catch(e){}
}
$("#pick").onclick = function(e){
  var b = e.target.closest("button"); if(b) render(b.dataset.v);
};
$("#themeBtn").onclick = function(){
  var r = document.documentElement;
  var dark = r.getAttribute("data-theme") === "dark" ||
    (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", dark ? "light" : "dark");
};

/* ============================================================
   HOW IT OPENED — display mode, device, and installability
   ============================================================
   Three states worth telling apart:
     browser tab   — normal visit
     installed app — launched from the home screen (display-mode: standalone)
     installable   — a browser tab that COULD be installed right now
   Chrome/Edge fire `beforeinstallprompt` and let us show our own button. iOS Safari
   never fires it and has no API, so the only honest thing there is to describe the
   Share-sheet steps rather than show a button that cannot work. */
var deferredPrompt = null;

function displayMode(){
  if (window.matchMedia("(display-mode: standalone)").matches) return "Installed app";
  if (window.navigator.standalone === true) return "Installed app (iOS)";
  if (window.matchMedia("(display-mode: minimal-ui)").matches) return "Installed app (minimal UI)";
  return "Browser tab";
}
function deviceKind(){
  var w = Math.min(screen.width, screen.height);
  var coarse = window.matchMedia("(pointer: coarse)").matches;
  if (coarse && w < 600) return "Phone";
  if (coarse) return "Tablet";
  return "Desktop";
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function paintHow(){
  var rows = $("#howRows"); rows.innerHTML = "";
  var installed = displayMode().indexOf("Installed") === 0;
  [
    ["Opened as", displayMode()],
    ["Device", deviceKind()],
    ["Viewport", window.innerWidth + " × " + window.innerHeight],
    ["Theme", matchMedia("(prefers-color-scheme: dark)").matches ? "Dark (system)" : "Light (system)"],
    ["Can install now", installed ? "Already installed" : (deferredPrompt ? "Yes" : (isIOS() ? "Yes, via Share sheet" : "Not offered by this browser"))]
  ].forEach(function(r){
    var d = el("div","kv");
    d.appendChild(el("span","k",r[0]));
    var v = el("span","v",r[1]);
    if(r[1] === "Not offered by this browser" || r[1] === "Already installed") v.className = "v no";
    d.appendChild(v);
    rows.appendChild(d);
  });

  var box = $("#installRow"); box.innerHTML = "";
  if (installed) return;
  if (deferredPrompt) {
    var b = el("button","btn","Install Elemental");
    b.onclick = async function(){
      b.disabled = true;
      deferredPrompt.prompt();
      var res = await deferredPrompt.userChoice;
      deferredPrompt = null;
      b.textContent = res.outcome === "accepted" ? "Installing…" : "Not installed";
      setTimeout(paintHow, 1200);
    };
    box.appendChild(b);
  } else if (isIOS()) {
    box.appendChild(el("div","hint",
      "On iPhone and iPad there is no install button — Apple does not provide one. " +
      "Tap the Share icon in Safari, then “Add to Home Screen”. It then opens " +
      "full screen with no browser chrome, exactly like the installed version."));
  } else {
    box.appendChild(el("div","hint",
      "This browser has not offered an install. That usually means it is already installed, " +
      "the page is not served over https, or the browser does not support it — Firefox on " +
      "desktop does not. Chrome, Edge and Android browsers will offer it."));
  }
}

window.addEventListener("beforeinstallprompt", function(e){
  // Stop the browser's own mini-infobar so the offer appears where we choose.
  e.preventDefault();
  deferredPrompt = e;
  paintHow();
});
window.addEventListener("appinstalled", function(){ deferredPrompt = null; paintHow(); });

function paintSize(){ $("#wsize").textContent = window.innerWidth + "px wide"; }
window.addEventListener("resize", function(){ paintSize(); paintHow(); });

var saved = "a";
try { saved = localStorage.getItem("elemental.mock.layout") || "a"; } catch(e){}
render(saved);
paintSize();
paintHow();
</script>
</body>
</html>
