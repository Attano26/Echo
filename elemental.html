<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental</title>
<meta name="description" content="Read your Elemental market intelligence, verify stories, and publish reports.">
<meta name="theme-color" content="#0F0F12">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!--
  ─────────────────────────────────────────────────────────────────────────────
   Elemental — the web mirror of the Elemental Android app.
  ─────────────────────────────────────────────────────────────────────────────

   WHAT THIS IS
   A single static page. There is no server and no database. Your data lives in
   YOUR Google Drive, written there by the phone app, and this page reads it back.

   WHAT IT DELIBERATELY DOES NOT DO
   It never fetches news. Fetching costs money and only the phone does it. This
   page reads what the phone has already gathered, lets you verify stories, and
   turns the verified ones into a report.

   THE SAFETY RULE — TWO FILES, ONE WRITER EACH
     elemental-data.json          the phone writes it, this page only READS it
     elemental-web-actions.json   this page writes it, the phone only READS it
   Because no field is written by both sides, neither can overwrite the other and
   no version is ever silently lost. This page can never destroy a news fetch the
   phone made while you were here.

   ON SECRETS
   Nothing secret is in this file. The OAuth *client ID* below is public by design —
   every web OAuth app ships one, and it is useless without a matching authorised
   origin. There is no client secret (the browser token flow does not use one), no
   API key, and no Gemini key: this page makes no AI calls at all. Your Google
   access token lives only in your own browser.
-->

<style>
  /* Palette lifted from the phone app so the two read as one product.
     Accent #6366F1 (Electric Indigo), canvas #0F0F12, card #1A1A22. */
  :root{
    --accent:#6366F1; --accent-soft:rgba(99,102,241,.13);
    --bg:#0F0F12; --card:#1A1A22; --raised:#232331;
    --text:#FFFFFF; --text2:#C9CAD3; --muted:#9A9CAB; --line:rgba(154,156,171,.15);
    --danger:#F0616D; --ok:#10B981;
    --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#FFFFFF; --card:#EFF0F3; --raised:#E4E5EA;
      --text:#16161A; --text2:#3F4048; --muted:#5D5E66; --line:rgba(93,94,102,.18);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  a{color:var(--accent)}

  /* ---- top bar ---- */
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:12px;padding:14px 0}
  .brand{font-size:17px;font-weight:600;letter-spacing:-.2px;flex:1}
  .brand span{color:var(--muted);font-weight:400}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
  .who b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}

  /* ---- buttons ---- */
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .btn{background:var(--accent);color:#fff;border-radius:24px;padding:11px 20px;font-size:14px;font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
  .btn.sm{padding:8px 14px;font-size:13px}
  .link{color:var(--accent);font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px}
  .link:hover{background:var(--accent-soft)}

  /* ---- tabs ---- */
  nav.tabs{display:flex;gap:2px;background:var(--card);border-radius:12px;padding:3px;margin:16px 0 8px;overflow-x:auto}
  nav.tabs button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
  nav.tabs button.on{background:var(--raised);color:var(--text);font-weight:600}
  nav.tabs .n{opacity:.65;font-weight:400;margin-left:5px}

  /* ---- section label ---- */
  .lbl{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin:22px 0 10px}

  /* ---- article card ---- */
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px}
  .cat{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
  .meta{font-size:12px;color:var(--muted)}
  .ttl{font-size:15.5px;font-weight:600;line-height:1.4;margin:8px 0 0}
  .sum{font-size:13.5px;color:var(--text2);line-height:1.6;margin:8px 0 0}
  .adv{font-size:13px;color:var(--text2);line-height:1.6;margin:10px 0 0;padding-left:12px;border-left:2px solid var(--accent)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row.top{justify-content:space-between}
  .acts{display:flex;align-items:center;gap:6px;margin-top:12px}

  /* verify control — a real checkbox so it is keyboard reachable and screen-reader sane */
  .vf{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;
      padding:7px 12px;border-radius:20px;border:1px solid var(--line)}
  .vf input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
  .vf.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}

  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--raised);color:var(--muted)}
  .pill.ok{background:rgba(16,185,129,.15);color:var(--ok)}

  /* ---- info box (mirrors the phone's notice style) ---- */
  .info{display:flex;gap:12px;background:var(--card);border-radius:8px;padding:14px;margin:16px 0;font-size:13px;color:var(--text2);line-height:1.6}
  .info .i{flex:0 0 20px;height:20px;border-radius:50%;background:var(--raised);color:var(--muted);
           display:grid;place-items:center;font-size:12px;font-weight:700;font-style:italic}
  .info b{color:var(--text);font-weight:600;display:block;margin-bottom:4px}

  /* ---- report bar: appears once something is verified ---- */
  .repbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
          padding:12px 20px;display:none}
  .repbar.on{display:block}
  .repbar .inner{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .repbar .cnt{flex:1;font-size:14px;min-width:150px}
  .repbar .cnt b{font-weight:600}

  /* ---- empty / status ---- */
  .empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px;line-height:1.7}
  .status{font-size:13px;color:var(--muted);padding:10px 0}
  .err{color:var(--danger)}

  /* ---- gate (signed out) ---- */
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 20px}
  .gate h1{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:0 0 10px}
  .gate p{color:var(--muted);font-size:14.5px;line-height:1.7;margin:0 0 24px}

  /* ---- simple data tables (Database tab) ---- */
  .kv{display:flex;padding:5px 0;font-size:13.5px}
  .kv span:first-child{color:var(--muted);width:120px;flex:0 0 120px}
  .kv span:last-child{color:var(--text2);flex:1}

  /* ---- print: the PDF route. Only the report prints. ---- */
  #report{display:none}
  @media print{
    body{background:#fff;color:#000;padding:0}
    header,nav.tabs,.repbar,#app{display:none !important}
    #report{display:block;padding:0}
    #report .r-art{page-break-inside:avoid;margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid #ddd}
    #report h1{font-size:22px;margin:0 0 4px}
    #report .r-sub{color:#555;font-size:12px;margin:0 0 22px}
    #report h2{font-size:14px;margin:0 0 6px;line-height:1.35}
    #report .r-meta{font-size:11px;color:#666;margin:0 0 6px}
    #report .r-sum{font-size:12px;line-height:1.6;margin:0}
    #report .r-adv{font-size:11.5px;line-height:1.6;margin:6px 0 0;padding-left:9px;border-left:2px solid #6366F1;color:#333}
    a{color:#000;text-decoration:none}
  }
</style>
</head>
<body>

<!-- Signed-out gate -->
<div id="gate" class="gate">
  <h1>Elemental</h1>
  <p>Read the market intelligence your phone has gathered, verify what holds up, and turn it into a report.</p>
  <button class="btn" id="signin">Sign in with Google</button>
  <div class="status" id="gate-status"></div>
</div>

<!-- Signed-in shell -->
<div id="shell" hidden>
  <header>
    <div class="wrap bar">
      <div class="brand">Elemental <span>· market intelligence</span></div>
      <div class="who"><b id="acct"></b><button class="link" id="signout">Sign out</button></div>
    </div>
  </header>

  <div class="wrap">
    <nav class="tabs" id="tabs"></nav>
    <div class="status" id="status"></div>
    <div id="app"></div>
  </div>
</div>

<!-- Report bar -->
<div class="repbar" id="repbar">
  <div class="inner">
    <div class="cnt"><b id="vcount">0</b> verified and ready to publish</div>
    <button class="btn sm ghost" id="gen-word">Word</button>
    <button class="btn sm" id="gen-pdf">Generate PDF</button>
  </div>
</div>

<!-- Print-only report body, filled just before printing -->
<div id="report"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   Configuration
   ═══════════════════════════════════════════════════════════════════════════
   The client ID is PUBLIC by design. Google identifies the app by it and then
   checks the request came from an authorised origin, so publishing it grants
   nobody anything. There is no client secret in the browser token flow, and this
   page holds no API key of any kind. */
const CLIENT_ID = "653924371691-687hjiimvicq77nbk4l6osqoaio3nl4b.apps.googleusercontent.com";
const SCOPE     = "https://www.googleapis.com/auth/drive.file";
const DATA_FILE    = "elemental-data.json";        // phone writes, we read
const ACTIONS_FILE = "elemental-web-actions.json"; // we write, phone reads

const LS = "elemental.web.v1";

/* Local state. `data` is the phone's snapshot (read-only to us). `actions` is
   the only thing we ever write, and it only ever grows. */
const S = {
  token: "", tokenExp: 0, email: "",
  data: null,
  actions: { schema: 1, updatedAtMillis: 0, verifiedTitles: [], publishedTitles: [], publishedNews: [], reportEditions: [] },
  tab: "alerts", busy: false
};

const $  = id => document.getElementById(id);
const key = s => String(s || "").trim().toLowerCase();
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ── persistence ───────────────────────────────────────────────────────────
   The token is kept so a page refresh does not send you back to a sign-in
   screen. It expires in about an hour and is scoped to one file in your Drive. */
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      token:S.token, tokenExp:S.tokenExp, email:S.email, actions:S.actions, tab:S.tab
    }));
  }catch(e){ /* private mode — the app still works, it just forgets on reload */ }
}
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(LS) || "{}");
    if(o.token && o.tokenExp > Date.now()){ S.token = o.token; S.tokenExp = o.tokenExp; }
    if(o.email) S.email = o.email;
    if(o.actions) S.actions = Object.assign(S.actions, o.actions);
    if(o.tab) S.tab = o.tab;
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════════════════
   Google sign-in
   ═══════════════════════════════════════════════════════════════════════════
   We ask for a SCOPE, not an identity — "may I touch this one file?", not
   "who are you?". Google hands back a short-lived access token.

   prompt:"" is what makes it feel instant. It shows the consent screen the FIRST
   time and returns silently every time after, because Google remembers the grant.
   prompt:"consent" would re-ask forever, which reads as a login wall on every
   visit. Never use it here. */
let tokenClient = null;

function loadGIS(){
  return new Promise((res, rej) => {
    if(window.google && google.accounts && google.accounts.oauth2) return res(true);
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = () => res(true);
    s.onerror = () => rej(new Error("Could not reach Google sign-in. Check your connection, or an extension may be blocking it."));
    document.head.appendChild(s);
  });
}

/* Google checks the page's ORIGIN against the list registered for this client. A page
   opened straight off disk (file://) or from a preview pane has origin "null", so there
   is nothing to check and Google rejects the request with a bare
   "Required parameter is missing: response_type". That error names the wrong cause, so
   catch the condition here and say what actually needs doing. */
function originUsable(){
  return location.protocol === "https:" ||
         (location.protocol === "http:" && /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
}

async function signIn(){
  if(!originUsable()){
    throw new Error(
      "Google sign-in needs this page to be served over https (or from localhost). " +
      "Opened straight from a file it has no web address for Google to check, so sign-in is refused. " +
      "Publish it to GitHub Pages and open it from there."
    );
  }
  await loadGIS();
  return new Promise((res, rej) => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      // Pre-selects the account you used last, so a chooser (if one appears) is one tap.
      hint: S.email || undefined,
      callback: r => {
        if(r && r.access_token){
          S.token = r.access_token;
          S.tokenExp = Date.now() + ((r.expires_in || 3600) * 1000);
          save(); res(S.token);
        } else rej(new Error("Google did not return access."));
      },
      error_callback: e => {
        const t = (e && e.type) || "";
        if(t === "popup_closed") return rej(new Error("Sign-in was closed before it finished."));
        if(t === "popup_failed_to_open") return rej(new Error("The sign-in window was blocked. Allow pop-ups for this site and try again."));
        rej(new Error("Google refused the sign-in."));
      }
    });
    tokenClient.requestAccessToken({ prompt: "" });
  });
}

/* Sign out is LOCAL ONLY — we forget the token, we do not revoke it.
   Revoking would delete the grant, so the next sign-in would show the consent
   screen again. Nothing in your Drive is touched. */
function signOut(){
  S.token = ""; S.tokenExp = 0; S.data = null;
  save();
  $("shell").hidden = true;
  $("gate").style.display = "";
  $("repbar").classList.remove("on");
  setGateStatus("Signed out here. Nothing was deleted from Drive.");
}

function tokenAlive(){ return S.token && S.tokenExp > Date.now() + 30000; }

async function ensureToken(){
  if(tokenAlive()) return S.token;
  return signIn();   // silent when the grant already exists
}

/* ═══════════════════════════════════════════════════════════════════════════
   Drive
   ═══════════════════════════════════════════════════════════════════════════ */
const FILES  = "https://www.googleapis.com/drive/v3/files";
const UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";

async function dFetch(url, opts){
  const t = await ensureToken();
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({}, o.headers || {}, { Authorization: "Bearer " + t });
  let r = await fetch(url, o);
  if(r.status === 401){                       // token died mid-flight — renew once
    S.token = ""; S.tokenExp = 0;
    const t2 = await ensureToken();
    o.headers.Authorization = "Bearer " + t2;
    r = await fetch(url, o);
  }
  return r;
}

async function findFile(name){
  const q = encodeURIComponent("name = '" + name + "' and trashed = false");
  const r = await dFetch(FILES + "?q=" + q + "&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10");
  if(!r.ok) throw new Error("Drive list failed (" + r.status + ").");
  const j = await r.json();
  return (j.files && j.files[0]) || null;
}

async function readJson(name){
  const f = await findFile(name);
  if(!f) return null;
  const r = await dFetch(FILES + "/" + f.id + "?alt=media");
  if(!r.ok) throw new Error("Could not read " + name + " (" + r.status + ").");
  return await r.json();
}

/* Create-then-write, deliberately not multipart: it is simpler and it is the
   same shape the phone uses, so both sides behave identically. */
async function writeJson(name, obj){
  let f = await findFile(name);
  if(!f){
    const c = await dFetch(FILES + "?fields=id", {
      method:"POST",
      headers:{ "Content-Type":"application/json; charset=utf-8" },
      body: JSON.stringify({ name })
    });
    if(!c.ok) throw new Error("Could not create " + name + " (" + c.status + ").");
    f = await c.json();
  }
  const r = await dFetch(UPLOAD + "/" + f.id + "?uploadType=media&fields=id", {
    method:"PATCH",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(obj)
  });
  if(!r.ok) throw new Error("Could not save " + name + " (" + r.status + ").");
  return true;
}

/* The account email, from the same drive.file permission — no extra scope. */
async function accountEmail(){
  try{
    const r = await dFetch(FILES.replace("/files","/about") + "?fields=user(emailAddress)");
    if(!r.ok) return "";
    const j = await r.json();
    return (j.user && j.user.emailAddress) || "";
  }catch(e){ return ""; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   Data helpers
   ═══════════════════════════════════════════════════════════════════════════ */
const arr = v => Array.isArray(v) ? v : [];

function verifiedSet(){ return new Set(S.actions.verifiedTitles.map(key)); }
function publishedSet(){
  const s = new Set(S.actions.publishedTitles.map(key));
  arr(S.data && S.data.publishedTitles).forEach(t => s.add(key(t)));
  return s;
}

/* Alerts = what the phone shows, minus anything published (here or there).
   Publishing HIDES a story from Alerts; it never deletes it. */
function alerts(){
  const pub = publishedSet();
  return arr(S.data && S.data.alerts).filter(a => !pub.has(key(a.title)));
}
function published(){
  const seen = new Set(); const out = [];
  arr(S.actions.publishedNews).concat(arr(S.data && S.data.publishedNews)).forEach(a => {
    const k = key(a.title);
    if(a.title && !seen.has(k)){ seen.add(k); out.push(a); }
  });
  return out;
}
function editions(){
  const seen = new Set(); const out = [];
  arr(S.actions.reportEditions).concat(arr(S.data && S.data.reportEditions)).forEach(e => {
    if(e && !seen.has(e.id)){ seen.add(e.id); out.push(e); }
  });
  return out.sort((a,b) => (b.createdAtMillis||0) - (a.createdAtMillis||0));
}
function verifiedArticles(){
  const v = verifiedSet();
  return alerts().filter(a => v.has(key(a.title)));
}

/* ═══════════════════════════════════════════════════════════════════════════
   Rendering
   ═══════════════════════════════════════════════════════════════════════════ */
const TABS = [
  ["alerts",      "Alerts",      () => alerts().length],
  ["saved",       "Saved",       () => arr(S.data && S.data.savedNews).length],
  ["published",   "Published",   () => published().length],
  ["reports",     "Reports",     () => editions().length],
  ["liked",       "Liked",       () => arr(S.data && S.data.likedTitles).length],
  ["disliked",    "Disliked",    () => arr(S.data && S.data.dislikedTitles).length],
  ["database",    "Database",    () => arr(S.data && S.data.competitors).length]
];

function renderTabs(){
  $("tabs").innerHTML = TABS.map(([id,label,count]) =>
    `<button data-tab="${id}" class="${S.tab===id?"on":""}">${label}<span class="n">${count()}</span></button>`
  ).join("");
  $("tabs").querySelectorAll("button").forEach(b => {
    b.onclick = () => { S.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); };
  });
}

function articleCard(a, opts){
  opts = opts || {};
  const k = key(a.title);
  const on = opts.verifiable && verifiedSet().has(k);
  return `<div class="card">
    <div class="row top">
      <span class="cat">${esc(a.category || "News")}</span>
      <span class="meta">${esc(a.date || "")}</span>
    </div>
    <p class="ttl">${esc(a.title)}</p>
    ${a.summary ? `<p class="sum">${esc(a.summary)}</p>` : ""}
    ${a.pmAdvisory ? `<p class="adv">${esc(a.pmAdvisory)}</p>` : ""}
    <div class="acts">
      ${a.sourceUrl ? `<a class="link" href="${esc(a.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(a.source || "Source")} ↗</a>`
                    : `<span class="meta">${esc(a.source || "")}</span>`}
      ${opts.verifiable ? `<label class="vf ${on?"on":""}">
          <input type="checkbox" data-verify="${esc(a.title)}" ${on?"checked":""}>
          ${on ? "Verified" : "Mark verified"}
        </label>` : ""}
      ${opts.publishedPill ? `<span class="pill ok">Published</span>` : ""}
    </div>
  </div>`;
}

function listOr(html, emptyMsg){
  return html || `<div class="empty">${emptyMsg}</div>`;
}

function render(){
  renderTabs();
  const app = $("app");
  const d = S.data;
  if(!d){ app.innerHTML = `<div class="empty">Nothing loaded yet.</div>`; return; }

  if(S.tab === "alerts"){
    const list = alerts();
    app.innerHTML = listOr(
      list.map(a => articleCard(a, {verifiable:true})).join(""),
      "No alerts. Everything here has been published, or your phone has not backed up yet."
    );
  }

  else if(S.tab === "saved"){
    app.innerHTML = listOr(
      arr(d.savedNews).map(a => articleCard(a, {})).join(""),
      "Nothing saved."
    );
  }

  else if(S.tab === "published"){
    app.innerHTML = listOr(
      published().map(a => articleCard(a, {publishedPill:true})).join(""),
      "Nothing published yet. Verify some alerts, then generate a report."
    );
  }

  else if(S.tab === "reports"){
    const eds = editions();
    app.innerHTML = listOr(eds.map(e => `<div class="card">
        <div class="row top">
          <span class="cat">${esc(e.weekLabel || "Report")}</span>
          <span class="meta">${esc(e.dateLabel || "")}</span>
        </div>
        <p class="ttl">${esc(e.title || "Market report")}</p>
        <p class="sum">${arr(e.articles).length} article(s) · ${e.competitorsCount||0} competitor(s) · ${e.countriesCount||0} market(s)</p>
        <div class="acts">
          <button class="btn sm ghost" data-ed-word="${esc(String(e.id))}">Word</button>
          <button class="btn sm" data-ed-pdf="${esc(String(e.id))}">PDF</button>
        </div>
      </div>`).join(""),
      "No reports yet."
    );
    app.querySelectorAll("[data-ed-pdf]").forEach(b => b.onclick = () => {
      const e = eds.find(x => String(x.id) === b.dataset.edPdf);
      if(e) printReport(e.title || "Market report", e.dateLabel || "", arr(e.articles));
    });
    app.querySelectorAll("[data-ed-word]").forEach(b => b.onclick = () => {
      const e = eds.find(x => String(x.id) === b.dataset.edWord);
      if(e) downloadWord(e.title || "Market report", e.dateLabel || "", arr(e.articles));
    });
  }

  else if(S.tab === "liked" || S.tab === "disliked"){
    const titles = arr(S.tab === "liked" ? d.likedTitles : d.dislikedTitles).map(key);
    const pool = arr(d.newsArticles).concat(arr(d.alerts), arr(d.publishedNews));
    const seen = new Set(); const out = [];
    titles.forEach(t => {
      const hit = pool.find(a => key(a.title) === t);
      if(hit && !seen.has(t)){ seen.add(t); out.push(hit); }
      else if(!hit && !seen.has(t)){ seen.add(t); out.push({ title:t, category:"", summary:"", source:"" }); }
    });
    app.innerHTML = listOr(out.map(a => articleCard(a, {})).join(""),
      S.tab === "liked" ? "Nothing liked yet." : "Nothing disliked yet.");
  }

  else if(S.tab === "database"){
    const comps = arr(d.competitors), prods = arr(d.competitorProducts);
    const countries = arr(d.countries), norms = arr(d.normCodes);
    let h = `<div class="lbl">Competitors</div>`;
    h += listOr(comps.map(c => {
      const mine = prods.filter(p => key(p.competitorName) === key(c.name));
      return `<div class="card">
        <p class="ttl">${esc(c.name)}</p>
        ${c.websiteUrl ? `<div class="acts"><a class="link" href="${esc(c.websiteUrl)}" target="_blank" rel="noopener noreferrer">${esc(c.websiteUrl.replace(/^https?:\/\//,""))} ↗</a></div>` : ""}
        ${c.keyProduct ? `<div class="kv"><span>Key product</span><span>${esc(c.keyProduct)}</span></div>` : ""}
        ${c.markets ? `<div class="kv"><span>Markets</span><span>${esc(c.markets)}</span></div>` : ""}
        ${mine.length ? `<div class="kv"><span>Products</span><span>${mine.map(p => esc(p.name)).join(", ")}</span></div>` : ""}
        ${c.insights ? `<p class="sum">${esc(c.insights)}</p>` : ""}
      </div>`;
    }).join(""), "No competitors onboarded.");

    h += `<div class="lbl">Markets</div>`;
    h += listOr(countries.map(c => `<div class="card">
        <p class="ttl">${esc(c.name)}</p>
        ${c.constructionGdp ? `<div class="kv"><span>Construction GDP</span><span>${esc(c.constructionGdp)}</span></div>` : ""}
        ${c.cagr ? `<div class="kv"><span>CAGR</span><span>${esc(c.cagr)}</span></div>` : ""}
      </div>`).join(""), "No markets onboarded.");

    h += `<div class="lbl">Norms &amp; codes</div>`;
    h += listOr(norms.map(n => `<div class="card">
        <div class="row top"><span class="cat">${esc(n.type || "Norm")}</span><span class="meta">${esc(n.timeValue || "")}</span></div>
        <p class="ttl">${esc(n.name)}</p>
        <div class="kv"><span>Applies to</span><span>${esc(n.countryName || "All")} · ${esc(n.competitorName || "All")}</span></div>
        ${n.linkUrl ? `<div class="acts"><a class="link" href="${esc(n.linkUrl)}" target="_blank" rel="noopener noreferrer">Open ↗</a></div>` : ""}
      </div>`).join(""), "No norms or codes onboarded.");

    app.innerHTML = h;
  }

  // Verify checkboxes (Alerts only)
  app.querySelectorAll("[data-verify]").forEach(cb => {
    cb.onchange = () => { toggleVerify(cb.dataset.verify); };
  });

  refreshReportBar();
}

function refreshReportBar(){
  const n = verifiedArticles().length;
  $("vcount").textContent = n;
  $("repbar").classList.toggle("on", n > 0 && S.tab === "alerts");
}

function toggleVerify(title){
  const k = key(title);
  const cur = S.actions.verifiedTitles.map(key);
  const i = cur.indexOf(k);
  if(i >= 0) S.actions.verifiedTitles.splice(i, 1);
  else S.actions.verifiedTitles.push(k);
  save();
  render();
  // Saved locally already, so a failed upload is not data loss — say so rather than
  // throwing an unhandled rejection into the console.
  pushActions().catch(e => setStatus("Verified here, but not saved to Drive yet: " + e.message, true));
}

/* ═══════════════════════════════════════════════════════════════════════════
   Report generation
   ═══════════════════════════════════════════════════════════════════════════ */
function reportHtml(title, dateLabel, articles){
  return `<h1>${esc(title)}</h1><p class="r-sub">${esc(dateLabel)} · ${articles.length} article(s)</p>` +
    articles.map(a => `<div class="r-art">
      <div class="r-meta">${esc(a.category || "News")}${a.date ? " · " + esc(a.date) : ""}${a.source ? " · " + esc(a.source) : ""}</div>
      <h2>${esc(a.title)}</h2>
      ${a.summary ? `<p class="r-sum">${esc(a.summary)}</p>` : ""}
      ${a.pmAdvisory ? `<p class="r-adv">${esc(a.pmAdvisory)}</p>` : ""}
    </div>`).join("");
}

/* PDF via the browser's own print dialogue ("Save as PDF"). No library, no CDN,
   and the output matches what you see rather than a re-implementation of it. */
function printReport(title, dateLabel, articles){
  $("report").innerHTML = reportHtml(title, dateLabel, articles);
  const prev = document.title;
  document.title = title + " — " + dateLabel;
  window.print();
  setTimeout(() => { document.title = prev; }, 500);
}

/* Word: an HTML document served with Word's MIME type. Word and Google Docs both
   open it as a normal editable document, and it needs no zip library. */
function downloadWord(title, dateLabel, articles){
  const doc =
`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(title)}</title>
<style>
body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}
h1{font-size:18pt;margin:0 0 4pt}
.r-sub{color:#555;font-size:9pt;margin:0 0 18pt}
h2{font-size:12pt;margin:0 0 4pt}
.r-meta{font-size:8.5pt;color:#666;margin:0 0 4pt}
.r-sum{font-size:10pt;line-height:1.5;margin:0}
.r-adv{font-size:9.5pt;line-height:1.5;margin:5pt 0 0;padding-left:8pt;border-left:2pt solid #6366F1;color:#333}
.r-art{margin:0 0 14pt;padding:0 0 10pt;border-bottom:1pt solid #ddd}
</style></head><body>${reportHtml(title, dateLabel, articles)}</body></html>`;
  const blob = new Blob(["﻿", doc], { type: "application/msword" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = title.replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") + "-" + (dateLabel || "").replace(/\s+/g,"-") + ".doc";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Publishing. Verified stories become a report edition, move to Published, and
   leave Alerts. Everything here is ADDITIVE — we append to our own file and never
   touch the phone's, so nothing the phone holds can be lost. */
async function publishVerified(kind){
  const list = verifiedArticles();
  if(!list.length) return;
  const now = Date.now();
  const dateLabel = new Date(now).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  const title = "Window Market Report";

  if(kind === "pdf") printReport(title, dateLabel, list);
  else downloadWord(title, dateLabel, list);

  const wk = Math.ceil((((new Date(now) - new Date(new Date(now).getFullYear(),0,1)) / 86400000) + 1) / 7);
  S.actions.reportEditions.push({
    id: now, title, dateLabel, weekLabel: "Week " + wk, createdAtMillis: now,
    articles: list, verifiedTitles: list.map(a => key(a.title)),
    competitorsCount: arr(S.data && S.data.competitors).length,
    countriesCount: arr(S.data && S.data.countries).length
  });
  list.forEach(a => {
    S.actions.publishedNews.push(a);
    S.actions.publishedTitles.push(key(a.title));
  });
  // Those stories are published now, so they are no longer "awaiting verification".
  const goneKeys = new Set(list.map(a => key(a.title)));
  S.actions.verifiedTitles = S.actions.verifiedTitles.filter(t => !goneKeys.has(key(t)));
  save();
  render();
  setStatus("Saving to Drive…");
  try{
    await pushActions(true);
    setStatus(list.length + " article(s) published. Your phone will pick this up on its next sync.");
  }catch(e){
    setStatus("Published here, but saving to Drive failed: " + e.message, true);
  }
}

let pushTimer = null;
function pushActions(immediate){
  // Debounced: ticking several checkboxes should not mean several uploads.
  clearTimeout(pushTimer);
  return new Promise((res, rej) => {
    pushTimer = setTimeout(async () => {
      try{
        S.actions.updatedAtMillis = Date.now();
        await writeJson(ACTIONS_FILE, S.actions);
        res(true);
      }catch(e){ rej(e); }
    }, immediate ? 0 : 1200);
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   Boot
   ═══════════════════════════════════════════════════════════════════════════ */
function setStatus(msg, isErr){
  const el = $("status");
  el.textContent = msg || "";
  el.className = "status" + (isErr ? " err" : "");
}
function setGateStatus(msg, isErr){
  const el = $("gate-status");
  el.textContent = msg || "";
  el.className = "status" + (isErr ? " err" : "");
}

async function loadEverything(){
  setStatus("Loading from Drive…");
  const data = await readJson(DATA_FILE);
  if(!data){
    setStatus("Nothing in Drive yet. Open Elemental on your phone, go to Settings → Storage, and tap Back up.", true);
    S.data = { alerts: [] };
    render();
    return;
  }
  S.data = data;

  // Merge whatever this browser previously wrote, so a fresh device sees it too.
  const remote = await readJson(ACTIONS_FILE).catch(() => null);
  if(remote){
    const merge = (a, b, byKey) => {
      const out = arr(a).slice(); const seen = new Set(out.map(byKey));
      arr(b).forEach(x => { const k = byKey(x); if(!seen.has(k)){ seen.add(k); out.push(x); } });
      return out;
    };
    S.actions.verifiedTitles  = merge(S.actions.verifiedTitles,  remote.verifiedTitles,  key);
    S.actions.publishedTitles = merge(S.actions.publishedTitles, remote.publishedTitles, key);
    S.actions.publishedNews   = merge(S.actions.publishedNews,   remote.publishedNews,   a => key(a && a.title));
    S.actions.reportEditions  = merge(S.actions.reportEditions,  remote.reportEditions,  e => e && e.id);
    save();
  }

  const stamp = data.updatedAtMillis ? new Date(data.updatedAtMillis).toLocaleString("en-GB") : "";
  setStatus(stamp ? "Your phone last backed up " + stamp + "." : "");
  render();
}

async function start(){
  $("gate").style.display = "none";
  $("shell").hidden = false;
  if(!S.email){ S.email = await accountEmail(); save(); }
  $("acct").textContent = S.email || "Connected";
  try{ await loadEverything(); }
  catch(e){ setStatus(e.message, true); }
}

$("signin").onclick = async () => {
  setGateStatus("Opening Google sign-in…");
  try{ await signIn(); setGateStatus(""); await start(); }
  catch(e){ setGateStatus(e.message, true); }
};
$("signout").onclick = signOut;
$("gen-pdf").onclick  = () => publishVerified("pdf");
$("gen-word").onclick = () => publishVerified("word");

load();
if(tokenAlive()) start();
else if(S.email) setGateStatus("Signed in before as " + S.email + ". Press the button to continue — it should not ask again.");
</script>
